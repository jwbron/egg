apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: egg-system
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: egg
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
  ports:
    - name: api
      port: 9848 # noqa: EGG002
      targetPort: 9848 # noqa: EGG002
      protocol: TCP
    - name: proxy
      port: 3129 # noqa: EGG002
      targetPort: 3129 # noqa: EGG002
      protocol: TCP
    - name: health
      port: 9851
      targetPort: 9851
      protocol: TCP
