apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: egg-system
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: egg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: egg
    spec:
      # Disable legacy service-link env vars (GATEWAY_PORT, PROXY_PORT, etc.) —
      # they collide with the entrypoint's own config env var names.
      enableServiceLinks: false
      securityContext:
        # Container starts as root so the entrypoint can chown squid dirs,
        # /home/egg, worktrees, etc. before gosu-dropping to HOST_UID:HOST_GID
        # for the gateway Python process. This matches the Compose flow.
        fsGroup: 1000
      containers:
        - name: gateway
          image: egg-gateway:latest
          imagePullPolicy: IfNotPresent
          # Container starts as root; entrypoint.sh chowns paths then
          # gosu-drops to HOST_UID:HOST_GID before exec'ing Python.
          ports:
            - name: api
              containerPort: 9848 # noqa: EGG002
              protocol: TCP
            - name: proxy
              containerPort: 3129 # noqa: EGG002
              protocol: TCP
            - name: health
              containerPort: 9851
              protocol: TCP
          env:
            # Gateway reads launcher-secret from /secrets/launcher-secret (file),
            # secrets.env from /secrets/secrets.env, and github-app.pem from
            # /secrets/github-app.pem. See gateway/entrypoint.sh and
            # gateway/anthropic_credentials.py.
            #
            # Credential keys discovered in secrets.env (no new mount needed):
            #   ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN   — gateway/anthropic_credentials.py
            #   GITHUB_TOKEN / GITHUB_READONLY_TOKEN / GITHUB_USER_TOKEN — gateway/git_client.py
            #   ATLASSIAN_BASE_URL / ATLASSIAN_USERNAME / ATLASSIAN_API_TOKEN
            #     — recommended primary triple for both Jira and Confluence (issue #1931).
            #     The shared Atlassian bot account covers both services; legacy
            #     JIRA_* / CONFLUENCE_* triples remain as per-key back-compat fallbacks.
            #   JIRA_BASE_URL / JIRA_USERNAME / JIRA_API_TOKEN — gateway/jira_credentials.py
            #     (issue #1556 — fallback when ATLASSIAN_* is unset for that key).
            #   CONFLUENCE_BASE_URL / CONFLUENCE_USERNAME / CONFLUENCE_API_TOKEN
            #     — gateway/confluence_credentials.py (issue #1931 — fallback when
            #     ATLASSIAN_* is unset for that key; CONFLUENCE_BASE_URL must include
            #     the /wiki suffix while ATLASSIAN_BASE_URL has /wiki appended
            #     automatically).
            # The Jira project allowlist lives alongside the gateway config
            # at config/context-filters.yaml (jira.projects); the Confluence
            # space allowlist lives at config/context-filters.yaml
            # (confluence.spaces).
            - name: EGG_CONFIG_DIR
              value: "/secrets"
            - name: EGG_SECRETS_PATH
              value: "/secrets/secrets.env"
            - name: EGG_REPO_CONFIG
              value: "/secrets/repositories.yaml"
            - name: GATEWAY_PORT
              value: "9848" # noqa: EGG002
            - name: PROXY_PORT
              value: "3129" # noqa: EGG002
            - name: HEALTH_PORT
              value: "9851"
            # HOST_UID/HOST_GID tell the entrypoint to chown paths then
            # gosu-drop to this UID before running the Python gateway.
            - name: HOST_UID
              value: "1000"
            - name: HOST_GID
              value: "1000"
            - name: HOST_HOME
              value: "/home/egg"
            # Gateway proxies contract reads/writes to the orchestrator
            # (see gateway/contract_api.py). The module-level default
            # "http://egg-orchestrator:9849" is a docker-compose hostname
            # that doesn't resolve under k3s kube-dns; here we point at
            # the cluster Service FQDN. Missing this var in k8s is caught
            # by the fail-fast check in gateway.main() (#1803).
            - name: EGG_ORCHESTRATOR_URL
              value: "http://orchestrator.egg-system.svc.cluster.local:9849"
            # Gateway-to-orchestrator bearer token used by the
            # commit-authorship registry client (#1882). The commit
            # observer in gateway/commit_observer.py POSTs each new
            # SHA to /api/v1/commit-authorship/{register,lookup} on
            # the orchestrator; those endpoints are guarded by
            # ``require_lifecycle_secret`` so without this env var
            # every call 401s and the whole push-filter path silently
            # degrades to fail-closed "own-authored".  Same secret the
            # orchestrator pod already consumes — see
            # k8s/base/orchestrator-deployment.yaml:86-90.
            - name: EGG_LIFECYCLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: lifecycle-secret
            # Thread count for the gateway WSGI server. Default is 32
            # (see gateway/gateway.py DEFAULT_THREADS). Surfaced here so
            # operators can tune via kustomize overlay without reading source.
            - name: GATEWAY_THREADS
              value: "32"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: shared-certs
              mountPath: /shared/certs
            - name: home
              mountPath: /home/egg
            - name: egg-state
              mountPath: /home/egg/.egg-state
      volumes:
        - name: secrets
          secret:
            secretName: gateway-secrets
        - name: shared-certs
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: egg-state
          emptyDir: {}
