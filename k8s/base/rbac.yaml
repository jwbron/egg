apiVersion: v1
kind: ServiceAccount
metadata:
  name: egg-orchestrator
  namespace: egg-system
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: egg
---
# Namespace-scoped Role for managing agent jobs and pods in egg-agents.
# No ClusterRole is needed — the orchestrator only operates in egg-agents.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egg-agent-manager
  namespace: egg-agents
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egg-agent-manager
  namespace: egg-agents
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egg-agent-manager
subjects:
  - kind: ServiceAccount
    name: egg-orchestrator
    namespace: egg-system
---
# egg-system: read-only access to the orchestrator's own Deployments and
# Pod logs. The `get_service_logs` MCP tool (#1853) resolves the gateway
# or orchestrator Deployment by name, lists its pods, and reads their
# logs. Without this Role the tool returned HTTP 500 on every call
# because the default SA had no egg-system RBAC (#1870).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egg-service-log-reader
  namespace: egg-system
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
rules:
  # `list` is required by `_collect_egg_image_tags` in
  # orchestrator/routes/deployment.py (#2648); without it the wrapper
  # 403s and `get_deployment_context` reports `images_unavailable`.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egg-service-log-reader
  namespace: egg-system
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egg-service-log-reader
subjects:
  - kind: ServiceAccount
    name: egg-orchestrator
    namespace: egg-system
---
# Cluster-scope reads for cluster topology probes used by
# `get_deployment_context` and `validate_network_isolation`:
# `_detect_k3s` lists nodes cluster-wide, `_detect_cni` / `_detect_k3s`
# list kube-system DaemonSets. Without this binding the heuristics
# always returned null/false, masking real k3s + CNI state (#2646).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: egg-cluster-topology-reader
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: egg-cluster-topology-reader
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: egg-cluster-topology-reader
subjects:
  - kind: ServiceAccount
    name: egg-orchestrator
    namespace: egg-system
