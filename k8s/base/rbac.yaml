apiVersion: v1
kind: ServiceAccount
metadata:
  name: egg-orchestrator
  namespace: egg-system
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: egg
---
# Namespace-scoped Role for managing agent jobs and pods in egg-agents.
# No ClusterRole is needed — the orchestrator only operates in egg-agents.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egg-agent-manager
  namespace: egg-agents
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egg-agent-manager
  namespace: egg-agents
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egg-agent-manager
subjects:
  - kind: ServiceAccount
    name: egg-orchestrator
    namespace: egg-system
