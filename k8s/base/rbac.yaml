apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: egg-system
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-agent-manager
  namespace: egg-agents
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-agent-manager
  namespace: egg-agents
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: egg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orchestrator-agent-manager
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: egg-system
