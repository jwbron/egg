apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: egg-system
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: litellm
    app.kubernetes.io/part-of: egg
spec:
  # Single replica is sufficient — only the gateway pod is allowed to call
  # this Service (no agent pods talk to it directly), so request volume is
  # bounded by gateway concurrency. Issue #2769 cq-1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/component: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: litellm
        app.kubernetes.io/part-of: egg
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: litellm
          # egg-litellm: stock LiteLLM (pinned v1.86.2) + egg's prompt-cache
          # patches and cost/cache logger, built locally from
          # config/litellm/Dockerfile and imported into k3s by `make
          # k3s-import`. The base version is pinned in that Dockerfile's
          # FROM — LiteLLM's Anthropic-translation interface is the contract
          # the gateway depends on, so bumps are deliberate (cq-1). Built and
          # tag-rewritten alongside the other egg images (the deploy target
          # rewrites :latest -> :$(EGG_IMAGE_TAG)).
          image: egg-litellm:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/config.yaml
            - --port
            - "4000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: api
              containerPort: 4000
              protocol: TCP
          env:
            # readOnlyRootFilesystem is true and only /tmp is writable.
            # Point HOME at the writable tmpfs so any home-relative path
            # LiteLLM touches at startup (cache / config dirs, and the
            # XDG_* defaults that derive from $HOME) lands somewhere
            # writable instead of failing against the read-only root.
            - name: HOME
              value: /tmp
            # NOTE: the cost/cache logger registered under
            # ``litellm_settings.callbacks`` is resolved by LiteLLM as a file
            # next to ``--config`` (``/app/cost_callback.py``), baked into the
            # egg-litellm image — not via PYTHONPATH. See the image Dockerfile.
            # LiteLLM master key — clients (the gateway) inject this as
            # ``x-api-key`` on every request. Issue #2769 cq-7. Operators
            # populate the matching value in
            # ``~/.config/egg/secrets.env`` as ``LITELLM_MASTER_KEY``.
            # Sourced here from the existing gateway-secrets Secret so
            # both sides of the wire share one value of truth.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: litellm-master-key
                  optional: true
            # OpenRouter API key — referenced by ``openrouter/*`` model
            # entries in ``litellm-configmap.yaml`` (see issue #2799).
            # Operators populate ``OPENROUTER_API_KEY`` in
            # ``~/.config/egg/secrets.env``; ``make k3s-secrets``
            # extracts it onto the ``gateway-secrets`` Secret as the
            # ``openrouter-api-key`` literal key. ``optional: true`` so
            # deployments without an OpenRouter backend still start.
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: openrouter-api-key
                  optional: true
            # Escape hatches for the egg-litellm build-time patches (see
            # ``config/litellm/patch_litellm_cache.py`` and
            # ``docs/guides/per-agent-models.md``). All optional; the defaults
            # are what the patches were measured with. Uncomment to revert an
            # individual patch at runtime without rebuilding the image.
            #
            # Patch 7 — live OpenRouter capability lookup. ``0`` restores the
            # bundled model-cost map as the only source of truth, which
            # silently drops reasoning knobs on any slug the map has not caught
            # up to. ``_TTL`` seconds between refreshes (default 3600; 0 means
            # re-fetch every lookup — a debugging setting). ``_TIMEOUT``
            # per-phase HTTP timeout in seconds (default 5).
            # - name: LITELLM_OPENROUTER_CAPABILITY_FETCH
            #   value: "0"
            # - name: LITELLM_OPENROUTER_CAPABILITY_TTL
            #   value: "3600"
            # - name: LITELLM_OPENROUTER_CAPABILITY_TIMEOUT
            #   value: "5"
            #
            # Patch 11 — live OpenRouter pricing, read off the same roster
            # fetch as patch 7. ``0`` disables only the pricing half, leaving
            # the capability lookup running: LiteLLM's bundled map becomes the
            # sole authority on cost, and since it carries none of the slugs
            # egg routes, ``cost_estimated`` goes back to null on every call.
            # The provider-billed ``cost`` (patch 10) is unaffected by this.
            # - name: LITELLM_OPENROUTER_PRICING
            #   value: "0"
            #
            # Patch 9 — thinking -> reasoning_effort synthesis, off by
            # default. ``1`` restores stock LiteLLM: the Anthropic adapter
            # derives a bucketed ``reasoning_effort`` from each request's
            # thinking budget on /v1/messages. Measured on kimi-k3 that bucket
            # is a CAP BELOW the model default (3130 reasoning tokens with no
            # param vs 340 with "high"), so only turn this on for a model
            # measured to need an explicit ask.
            # - name: LITELLM_ANTHROPIC_THINKING_TO_REASONING_EFFORT
            #   value: "1"
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: tmp
          emptyDir: {}
