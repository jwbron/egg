apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-job-template
  namespace: egg-system
  labels:
    app.kubernetes.io/name: agent-job-template
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: egg
data:
  job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: "egg-agent-${PIPELINE_ID}-${AGENT_ROLE}"
      namespace: egg-agents
      labels:
        app.kubernetes.io/name: egg-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: egg
        egg.orchestrator: "true"
        egg.pipeline.id: "${PIPELINE_ID}"
        egg.agent.role: "${AGENT_ROLE}"
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: egg-agent
            app.kubernetes.io/component: agent
            app.kubernetes.io/part-of: egg
            egg.orchestrator: "true"
            egg.pipeline.id: "${PIPELINE_ID}"
            egg.agent.role: "${AGENT_ROLE}"
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: git-shadow-mount
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  # Create a tmpfs overlay for .git paths so agents cannot
                  # tamper with the actual git metadata on the host volume.
                  mkdir -p /workspace/.git-shadow
                  cp -a /worktree/.git /workspace/.git-shadow/ 2>/dev/null || true
                  echo "Git shadow mount prepared"
              volumeMounts:
                - name: worktree
                  mountPath: /worktree
                  readOnly: true
                - name: git-shadow
                  mountPath: /workspace
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
          containers:
            - name: agent
              image: "egg:latest"
              imagePullPolicy: IfNotPresent
              env:
                - name: GATEWAY_URL
                  value: "http://gateway.egg-system.svc.cluster.local:9848" # noqa: EGG002
                - name: EGG_ORCHESTRATOR_URL
                  value: "http://orchestrator.egg-system.svc.cluster.local:9849"
                - name: EGG_SESSION_TOKEN
                  value: "${SESSION_TOKEN}"
                - name: EGG_PIPELINE_ID
                  value: "${PIPELINE_ID}"
                - name: EGG_AGENT_ROLE
                  value: "${AGENT_ROLE}"
                - name: EGG_ISSUE_NUMBER
                  value: "${ISSUE_NUMBER}"
                - name: EGG_REPO_PATH
                  value: "/home/egg/repos/${REPO_NAME}"
                - name: EGG_BRANCH
                  value: "${BRANCH}"
                - name: HTTP_PROXY
                  value: "http://gateway.egg-system.svc.cluster.local:3129" # noqa: EGG002
                - name: HTTPS_PROXY
                  value: "http://gateway.egg-system.svc.cluster.local:3129" # noqa: EGG002
                - name: NO_PROXY
                  value: "gateway.egg-system.svc.cluster.local,orchestrator.egg-system.svc.cluster.local"
              volumeMounts:
                - name: worktree
                  mountPath: "/home/egg/repos/${REPO_NAME}"
                - name: git-shadow
                  mountPath: "/home/egg/repos/${REPO_NAME}/.git"
                  subPath: .git-shadow/.git
                - name: gateway-certs
                  mountPath: /etc/egg-gateway/certs
                  readOnly: true
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: worktree
              hostPath:
                path: "${HOST_WORKTREE_PATH}"
                type: Directory
            - name: git-shadow
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
            - name: gateway-certs
              secret:
                secretName: gateway-tls
                optional: true
