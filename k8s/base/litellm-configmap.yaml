apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: egg-system
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: litellm
    app.kubernetes.io/part-of: egg
data:
  config.yaml: |
    # LiteLLM Proxy configuration (issue #2769).
    #
    # This ConfigMap ships with an EMPTY ``model_list`` so the Deployment
    # comes up healthy but serves NO models by default. Operators register
    # backends via a host-side overlay at
    # ``~/.config/egg/litellm-models.yaml`` — ``make litellm-config``
    # (also invoked by ``make deploy``/``make redeploy``) merges it onto
    # this ConfigMap and rolls the LiteLLM Deployment. The committed
    # default keeps per-operator backend choices out of the repo. See
    # ``config/litellm-models.template.yaml`` for the file layout and
    # ``docs/guides/per-agent-models.md`` for the end-to-end flow.
    #
    # Without any backend entries, no agent request can route to LiteLLM
    # (the gateway only forwards when a session's ``upstream`` is
    # explicitly set to ``"litellm"``).
    #
    # Operators add backends per LiteLLM's documented format. Each
    # non-Claude entry SHOULD ship paired (bare, ``[1m]``-suffixed)
    # ``model_name`` rows that point at the same ``litellm_params``
    # (#2832): Claude Code strips the ``[1m]`` suffix from the model
    # field before send, but a handful of startup probes leak the
    # suffix onto the wire — without the alias LiteLLM 400s those
    # probes with ``Invalid model name``. The two-row shape eats that
    # noise without needing a gateway-side body rewrite. E.g. for the
    # OpenRouter pilot backend (cq-6):
    #
    #   model_list:
    #     - model_name: qwen3-max
    #       litellm_params:
    #         model: openrouter/qwen/qwen3-max
    #         api_key: os.environ/OPENROUTER_API_KEY
    #     - model_name: qwen3-max[1m]
    #       litellm_params:
    #         model: openrouter/qwen/qwen3-max
    #         api_key: os.environ/OPENROUTER_API_KEY
    #
    # Provider-side API keys referenced by overlay entries are read by
    # LiteLLM from its container env at startup. ``OPENROUTER_API_KEY``
    # is wired end-to-end out of the box (issue #2799): operators set
    # it in ``~/.config/egg/secrets.env``; ``make k3s-secrets`` extracts
    # it onto ``gateway-secrets`` as a literal key; the LiteLLM
    # Deployment binds it via ``secretKeyRef`` with ``optional: true``.
    # Adding any other provider key (e.g. ``TOGETHER_API_KEY``) is NOT
    # automatic — it additionally requires editing the ``k3s-secrets``
    # Makefile target to extract the new key and editing
    # ``k8s/base/litellm-deployment.yaml`` to bind it as a
    # ``secretKeyRef`` env entry. Without those edits,
    # ``os.environ/<NEW_KEY>`` in this configmap resolves to empty at
    # request time and the provider returns silent 401s.
    model_list: []

    # Custom logger: surfaces real upstream cost + prompt-cache stats for
    # non-Claude routes into the pod log stream. Baked into the egg-litellm
    # image at /app/cost_callback.py — LiteLLM resolves a config-registered
    # callback as a file next to ``--config`` (here /app/config.yaml), so the
    # name MUST match. Harmless with an empty model_list (no calls fire).
    #
    # NOTE: the host-side overlay (``~/.config/egg/litellm-models.yaml``)
    # replaces this whole ``config.yaml`` string, so an operator's overlay
    # MUST repeat this ``litellm_settings`` block (the template carries it).
    # Drop it and you lose all cost/cache visibility for routed agents.
    litellm_settings:
      callbacks: cost_callback.cost_logger

    # Health-check config — used by the kubelet readiness/liveness
    # probes on the Deployment. The Deployment probes /health/readiness
    # and /health/liveliness; both pass with an empty model_list because
    # LiteLLM treats "no models registered" as a healthy idle state.
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
