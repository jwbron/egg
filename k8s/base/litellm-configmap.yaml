apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: egg-system
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: litellm
    app.kubernetes.io/part-of: egg
data:
  config.yaml: |
    # LiteLLM Proxy configuration (issue #2769).
    #
    # This ConfigMap ships with an EMPTY ``model_list`` so the Deployment
    # comes up healthy but serves NO models until an operator populates
    # entries here and overrides this ConfigMap via a kustomize overlay or
    # ``kubectl apply``.  Without entries, no agent request can route to
    # LiteLLM (the gateway only forwards when a session's ``upstream`` is
    # explicitly set to ``"litellm"``).
    #
    # Operators add backends per LiteLLM's documented format. Each
    # non-Claude entry SHOULD ship paired (bare, ``[1m]``-suffixed)
    # ``model_name`` rows that point at the same ``litellm_params``
    # (#2832): Claude Code strips the ``[1m]`` suffix from the model
    # field before send, but a handful of startup probes leak the
    # suffix onto the wire — without the alias LiteLLM 400s those
    # probes with ``Invalid model name``. The two-row shape eats that
    # noise without needing a gateway-side body rewrite. E.g. for a
    # hosted Qwen provider (cq-6):
    #
    #   model_list:
    #     - model_name: qwen3-coder-30b
    #       litellm_params:
    #         model: together_ai/Qwen/Qwen2.5-Coder-32B-Instruct
    #         api_key: os.environ/TOGETHER_API_KEY
    #     - model_name: qwen3-coder-30b[1m]
    #       litellm_params:
    #         model: together_ai/Qwen/Qwen2.5-Coder-32B-Instruct
    #         api_key: os.environ/TOGETHER_API_KEY
    #
    # The matching provider-side API key (e.g. ``TOGETHER_API_KEY``,
    # ``OPENROUTER_API_KEY``) is read by LiteLLM from its container env
    # at startup. Per issue #2799, provider keys flow through the same
    # path as the master key: operators set them in
    # ``~/.config/egg/secrets.env``; ``make k3s-secrets`` extracts each
    # onto ``gateway-secrets`` as a literal key; the LiteLLM Deployment
    # binds them via ``secretKeyRef`` (``optional: true`` so deployments
    # without that backend still start). The original cq-7 wording
    # asserted that only the master key crossed this boundary — that
    # asymmetry was retired with #2799 in favor of a single uniform
    # extraction path for every LiteLLM-bound secret.
    model_list: []

    # Health-check config — used by the kubelet readiness/liveness
    # probes on the Deployment. The Deployment probes /health/readiness
    # and /health/liveliness; both pass with an empty model_list because
    # LiteLLM treats "no models registered" as a healthy idle state.
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
