apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: egg-system
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: egg
spec:
  replicas: 1
  # Recreate (not RollingUpdate) because the overlay can bind a hostPort
  # (for MCP access from the host); hostPort is singleton per node, so a
  # rolling update gets stuck Pending waiting for the port to free up.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
        app.kubernetes.io/component: orchestrator
        app.kubernetes.io/part-of: egg
    spec:
      serviceAccountName: egg-orchestrator
      # Disable legacy service-link env vars (ORCHESTRATOR_PORT, etc.) —
      # they collide with the entrypoint's own config env var names.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: orchestrator
          image: egg-orchestrator:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: api
              containerPort: 9849
              protocol: TCP
            - name: mcp
              containerPort: 9850
              protocol: TCP
          env:
            # Explicit runtime selector — the orchestrator code falls
            # back to auto-detection via KUBERNETES_SERVICE_HOST when
            # this is unset, but setting it explicitly prevents silent
            # docker-defaulting if the auto-detection is ever bypassed
            # (#1850).
            - name: EGG_RUNTIME
              value: "kubernetes"
            - name: EGG_ORCHESTRATOR_URL
              value: "http://orchestrator.egg-system.svc.cluster.local:9849"
            - name: GATEWAY_URL
              value: "http://gateway.egg-system.svc.cluster.local:9848" # noqa: EGG002
            # gateway_client.py reads GATEWAY_HOST/GATEWAY_PORT directly
            # (not GATEWAY_URL). In k8s the Service is named "gateway"; the
            # Compose default "egg-gateway" doesn't resolve here.
            - name: GATEWAY_HOST
              value: "gateway.egg-system.svc.cluster.local"
            - name: GATEWAY_PORT
              value: "9848" # noqa: EGG002
            # Orchestrator authenticates to the gateway using the shared
            # launcher secret. Sourced from the same Secret that the gateway
            # mounts at /secrets/launcher-secret.
            - name: EGG_LAUNCHER_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: launcher-secret
            # Lifecycle-control endpoints (HITL resolve/cancel, pipeline
            # CRUD, phase overrides, container spawn/stop) require this
            # bearer token. MCP (in-process) and host-side CLIs read the
            # same value. Agent pods must never receive this env var
            # (#1769).
            - name: EGG_LIFECYCLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: lifecycle-secret
            # Sandbox image name used by kubernetes_spawner. The code's
            # default "egg:latest" doesn't match what `make build` produces
            # (`egg-sandbox:latest`), and nothing exists at docker.io/egg.
            - name: EGG_SANDBOX_IMAGE
              value: "egg-sandbox:latest"
          # Probes target the cheap, cache-backed endpoints introduced
          # in #2191. ``/api/v1/live`` is a pure JSON return — restart
          # signal only. ``/api/v1/ready`` reads the background
          # state-store probe cache (see orchestrator/state_store_probe.py)
          # — traffic-routing signal that flips when the cache is stale
          # or unhealthy. Neither endpoint runs ``git`` or holds locks,
          # so probe latency is decoupled from waitress thread-pool
          # pressure under burst load. The rich operator payload moved
          # to ``/api/v1/health`` (also cache-backed).
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup probe gives the orchestrator up to 60s to come
          # online — cold-boot reconciliation in cmd_serve runs before
          # waitress.serve() and can push first-listen past the
          # readinessProbe's tighter window. The BG state-store probe
          # also needs one EGG_ORCH_STATE_STORE_PROBE_INTERVAL cycle
          # (default 15s) to populate the cache, during which /ready
          # returns 503; /live (probed here) is cache-independent.
          startupProbe:
            httpGet:
              path: /api/v1/live
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            # emptyDir at /home/egg makes $HOME writable (needed for
            # .gitconfig, .egg-worktrees, sharing/notifications, etc.)
            # while keeping the rest of the rootfs read-only.
            - name: home
              mountPath: /home/egg
            - name: egg-state
              mountPath: /home/egg/.egg-state
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: home
          emptyDir: {}
        - name: egg-state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
