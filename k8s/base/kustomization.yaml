apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - rbac.yaml
  - orchestrator-deployment.yaml
  - orchestrator-service.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  # LiteLLM proxy (issue #2769) — no-op until operators populate the
  # ConfigMap's ``model_list``; only the gateway pod calls into it.
  - litellm-configmap.yaml
  - litellm-deployment.yaml
  - litellm-service.yaml
  # Redis Streams message-store backend (issue #2662) — only the
  # orchestrator talks to it (EGG_MESSAGE_STORE_BACKEND=redis).
  - redis-deployment.yaml
  - redis-service.yaml
  - network-policies.yaml
