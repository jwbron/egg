# Default deny all ingress in egg-agents namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: egg-agents
  labels:
    app.kubernetes.io/part-of: egg
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default deny all egress in egg-agents namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: egg-agents
  labels:
    app.kubernetes.io/part-of: egg
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Allow egress from agent pods to gateway service in egg-system
# on ports 9848 (API), 3129 (proxy), 9851 (health)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agents-to-gateway
  namespace: egg-agents
  labels:
    app.kubernetes.io/part-of: egg
spec:
  podSelector:
    matchLabels:
      egg.orchestrator: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 9848
        - protocol: TCP
          port: 3129
        - protocol: TCP
          port: 9851
---
# Allow ingress from orchestrator in egg-system to agent pods
# (for health checks and log retrieval)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestrator-to-agents
  namespace: egg-agents
  labels:
    app.kubernetes.io/part-of: egg
spec:
  podSelector:
    matchLabels:
      egg.orchestrator: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: orchestrator
---
# Allow agent pods to reach orchestrator API for heartbeats and signals
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-to-orchestrator
  namespace: egg-agents
  labels:
    app.kubernetes.io/part-of: egg
spec:
  podSelector:
    matchLabels:
      egg.orchestrator: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: orchestrator
      ports:
        - protocol: TCP
          port: 9849
---
# Allow DNS egress for service name resolution
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: egg-agents
  labels:
    app.kubernetes.io/part-of: egg
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
