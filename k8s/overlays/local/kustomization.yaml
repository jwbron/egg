apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patches/gateway-volumes.yaml
    target:
      kind: Deployment
      name: gateway
      namespace: egg-system

# Local development overrides
patchesStrategicMerge: []

# Use local images without a registry prefix
images:
  - name: egg-orchestrator
    newName: egg-orchestrator
    newTag: latest
  - name: egg-gateway
    newName: egg-gateway
    newTag: latest
  - name: egg
    newName: egg
    newTag: latest
