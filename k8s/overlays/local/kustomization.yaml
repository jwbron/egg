apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Strategic merge patches — append host-mounted repos/worktrees for local dev.
patches:
  - path: patches/gateway-volumes.yaml
  - path: patches/orchestrator-volumes.yaml

# Use local images without a registry prefix.
# NOTE: The deploy target rewrites these tags at apply time via sed.
# See Makefile `deploy` target. These "latest" entries are baselines,
# not what actually gets deployed.
images:
  - name: egg-orchestrator
    newName: egg-orchestrator
    newTag: latest
  - name: egg-gateway
    newName: egg-gateway
    newTag: latest
  - name: egg-litellm
    newName: egg-litellm
    newTag: latest
