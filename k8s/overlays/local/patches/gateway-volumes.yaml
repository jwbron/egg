# Strategic merge patch: add local-dev-only host mounts for repos and
# worktrees. These append to the base's volumes/volumeMounts by name
# (no conflicts, so strategic merge does the right thing here).
#
# Paths are hardcoded to /home/jwies/ because kustomize has no native
# env var substitution. For a different host user, edit these paths or
# use envsubst before `kubectl apply`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: egg-system
spec:
  template:
    spec:
      containers:
        - name: gateway
          volumeMounts:
            # repos mount is read-write because the gateway runs
            # `git worktree prune` and other worktree admin on startup.
            - name: repos
              mountPath: /home/egg/repos
            - name: worktrees
              mountPath: /home/egg/.egg-worktrees
      volumes:
        - name: repos
          hostPath:
            path: /home/jwies/repos
            type: Directory
        - name: worktrees
          hostPath:
            path: /home/jwies/.egg-worktrees
            type: DirectoryOrCreate
