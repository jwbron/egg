# Strategic merge patch: add local-dev-only host mounts for the orchestrator.
# Appends to base volumes/volumeMounts by name.
#
# ``${EGG_HOST_HOME}`` and ``${EGG_HOST_REPO_MAP}`` are expanded by
# ``envsubst`` in the Makefile's ``deploy`` target:
#   - ``EGG_HOST_HOME`` defaults to ``$HOME``.
#   - ``EGG_HOST_REPO_MAP`` is a JSON map ``owner/repo → host_path``
#     auto-derived by ``scripts/build-host-repo-map.py`` from
#     ``~/.config/egg/repositories.yaml`` (``local_repos.paths`` with
#     the ``origin`` remote URL parsed to recover ``owner/repo``).
# Override either at deploy time:
#   make deploy EGG_HOST_HOME=/data/egg
#   EGG_HOST_REPO_MAP='{"owner/repo":"/path"}' make deploy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: egg-system
spec:
  template:
    spec:
      containers:
        - name: orchestrator
          # Bind the MCP port directly to localhost on the k3s node so
          # Claude Code's MCP config (http://localhost:9850/mcp) works
          # without kubectl port-forward. Local-dev only; production
          # k8s should use a Service/Ingress.
          #
          # The orchestrator API (9849) gets the same treatment so the
          # SDLC skill's wait-status launcher
          # (skills/sdlc/bin/wait-status) can default
          # EGG_ORCHESTRATOR_URL=http://localhost:9849 — keep both in
          # sync.
          ports:
            - name: mcp
              containerPort: 9850
              hostPort: 9850
              protocol: TCP
            - name: api
              containerPort: 9849
              hostPort: 9849
              protocol: TCP
          env:
            - name: EGG_REPO_PATH
              value: "/home/egg/repos"
            # Map owner/repo → host path for spawned agent pods. The
            # orchestrator uses these paths to construct hostPath volume
            # mounts when spawning sandbox Jobs. Local-dev only; production
            # k8s would use a PV-backed repo store instead.
            - name: EGG_HOST_REPO_MAP
              value: '${EGG_HOST_REPO_MAP}'
          volumeMounts:
            # repos mount is read-write because the orchestrator creates
            # per-pipeline worktrees inside each repo's .git/worktrees/.
            - name: repos
              mountPath: /home/egg/repos
            - name: worktrees
              mountPath: /home/egg/.egg-worktrees
            # Pipeline-state store (orchestrator/state_store.py keeps the
            # ``egg/pipeline-state`` worktrees under
            # /home/egg/.egg-state/pipeline-worktree*). MUST be host-backed
            # because repos above are: the state branch's *commits* live in
            # each repo's .git (host-persistent), but the worktree holds any
            # state saved between commits. With an emptyDir here, a pod
            # recreation rebuilds the worktree from the last committed branch
            # tip and silently drops everything newer — in #3070 that erased
            # every in-flight prompt-driven pipeline (get_status 404) because
            # their records had never been committed. Same host dir the
            # gateway mounts for its session store; the two use disjoint
            # subpaths (sessions/ vs pipeline-worktree*/), so they don't
            # collide. Cross-pod ownership note: the gateway's entrypoint
            # chowns ``/home/egg/.egg-state`` to ``HOST_UID:HOST_GID`` on
            # startup, which is what lets the orchestrator (``runAsUser:
            # 1000``) write to the shared dir — local-dev convention is
            # ``HOST_UID=1000``, so this aligns; a host deploying with
            # ``HOST_UID != 1000`` would hit EACCES here. Cloud overlays
            # moving to PVCs (the future intent rule 7 / rule 6 already
            # accommodate) sidestep the chown coupling entirely.
            - name: egg-state
              mountPath: /home/egg/.egg-state
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: repos
          hostPath:
            path: ${EGG_HOST_HOME}/repos
            type: Directory
        - name: worktrees
          hostPath:
            path: ${EGG_HOST_HOME}/.egg-worktrees
            type: DirectoryOrCreate
        - name: egg-state
          hostPath:
            path: ${EGG_HOST_HOME}/.egg-state
            type: DirectoryOrCreate
        - name: secrets
          secret:
            secretName: gateway-secrets
