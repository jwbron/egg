# Strategic merge patch: add local-dev-only host mounts for the orchestrator.
# Appends to base volumes/volumeMounts by name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: egg-system
spec:
  template:
    spec:
      containers:
        - name: orchestrator
          env:
            - name: EGG_REPO_PATH
              value: "/home/egg/repos"
          volumeMounts:
            - name: repos
              mountPath: /home/egg/repos
              readOnly: true
            - name: worktrees
              mountPath: /home/egg/.egg-worktrees
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: repos
          hostPath:
            path: /home/jwies/repos
            type: Directory
        - name: worktrees
          hostPath:
            path: /home/jwies/.egg-worktrees
            type: DirectoryOrCreate
        - name: secrets
          secret:
            secretName: gateway-secrets
