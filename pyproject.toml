[project]
name = "egg"
version = "0.1.0"
description = "Sandboxed LLM code execution environment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0.0,<4.0.0",
    "waitress>=3.0.0,<4.0.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.31.0,<3.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "cryptography>=41.0.0,<44.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.12,<0.16",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "yamllint>=1.32.0",
    "pre-commit>=3.6.0",
    "pytest-timeout>=2.2.0",
    "hypothesis>=6.100.0",
    "kubernetes>=31.0.0,<33.0.0",
    # MCP SDK for orchestrator MCP server tests
    "mcp[cli]>=1.27.0,<2.0.0",
    # Type stubs
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "types-waitress>=3.0",
    "fakeredis>=2.21.0",
    "starlette>=0.36.0,<1.0.0",
    # Reverse-import-graph builder for changeset-aware test selection
    # (scripts/select_tests/). v3.14 introduced a Rust-backed graph
    # builder that is meaningfully faster on this monorepo (~770 source
    # files); do NOT loosen the floor below 3.14 without benchmarking.
    "grimp>=3.14,<4.0",
]

[project.scripts]
# Interactive mode + the top-level ``egg`` CLI were removed in #1762.
# Hosts (Claude Code or any MCP client) now drive the orchestrator
# directly; one-off role work happens through the ``run_agent_task``
# MCP tool and GHA dispatches through ``sandbox/egg_lib/gha_exec.py``.
# The existing ``bin/egg-deploy``, ``bin/egg-sdlc``, ``bin/egg-status``
# scripts remain in place for operators.

[tool.uv]
# Use system Python by default (consistent with egg)
python-preference = "system"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
# E402: module level import not at top - intentional in entry points for timing
# E501: line too long - some error messages need to be readable
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
# F403: star import is intentional for CLI backward compatibility
"sandbox/egg" = ["F403"]
# UP038: isinstance style is fine as-is in tests
"tests/*" = ["UP038"]
"integration_tests/*" = ["UP038"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["integration_tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["gateway.tests.*"]
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["orchestrator.tests.*"]
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["egg_contracts.tests.*"]
disallow_untyped_defs = false
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["egg_anchor.tests.*"]
disallow_untyped_defs = false
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["waitress", "waitress.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["egg_logging", "egg_logging.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["egg_contracts", "egg_contracts.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["claude_agent_sdk", "claude_agent_sdk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "markdownify"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# grimp ships no type stubs; it's a dev-time dependency for the
# changeset-aware test selector (scripts/select_tests/).
module = ["grimp", "grimp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "repo_config",
    "repo_config.*",
    "token_refresher",
    "config_validator",
    "anthropic_credentials",
    "error_messages",
    "repo_visibility",
    "proxy_monitor",
    "fork_policy",
    "private_repo_policy",
    "config.host_config",
    "statusbar",
]
ignore_missing_imports = true

[tool.bandit]
# B102: exec - used for dynamically loading test fixtures
# B104: bind all interfaces - intentional for gateway inside container
# B108: hardcoded /tmp - intentional for ephemeral session data and test fixtures
# B201: flask debug=True - only enabled with explicit --debug flag
# B310: urllib.urlopen - used with hardcoded/controlled URLs for health checks and API calls
# B602: subprocess shell=True - used for user-provided commands in setup/discovery scripts
skips = ["B102", "B104", "B108", "B201", "B310", "B602"]

[tool.coverage.run]
omit = [
    # CLI entry points — thin wrappers that require full system integration
    "sandbox/egg_lib/orch_cli.py",
    "sandbox/egg_lib/sdlc_cli.py",
    "sandbox/egg_lib/checkpoint_cli.py",
    "shared/egg_contracts/usage_cli.py",
    "shared/egg_contracts/checkpoint_cli.py",
    # Scripts that run outside the test harness
    "gateway/parse-git-mounts.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests", "gateway/tests", "orchestrator/tests", "shared/tests"]
# consider_namespace_packages lets pytest discover shared/tests,
# gateway/tests, and orchestrator/tests as namespace subpackages
# without ImportPathMismatchError when conftest.py exists in both
# tests/ and a sibling namespace test root. We deliberately do NOT
# enable --import-mode=importlib: scripts/select_tests/ monorepo
# tests build a real grimp graph that requires the default prepend
# mode (importlib mode triggers grimp.NotATopLevelModule for the
# gateway.tests / orchestrator.tests subpackages).
consider_namespace_packages = true
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
# Per-test timeout cap. Any test that blocks on a condition variable,
# event, or polling loop without a notify partner (or with a frozen
# time mock) will be killed by pytest-timeout instead of spinning
# until CI times out or the developer's machine seizes up.
# Individual tests can override with @pytest.mark.timeout(N).
# See issue #1928 for the incident that motivated this default.
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: marks tests as integration tests (require Docker, may be slow)",
    "functional: marks tests as functional tests (require Docker, faster than integration)",
    "e2e: marks tests as end-to-end tests (require real API keys)",
    "security: marks tests as security/pentesting tests",
    "agent_flaky: marks tests with non-deterministic agent behavior (non-blocking in CI)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "shared/egg_config", "shared/egg_container", "shared/egg_contracts", "shared/egg_logging", "shared/egg_git", "shared/egg_restrictions", "sandbox/egg_lib"]

[tool.hatch.build.targets.sdist]
include = [
    "gateway",
    "shared",
    "sandbox",
    "scripts",
    "config",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]
