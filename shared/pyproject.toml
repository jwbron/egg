[project]
name = "egg-shared"
version = "0.1.0"
description = "Shared modules for egg (enrichment, logging, notifications, etc.)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "anthropic>=0.50,<1.0", "httpx>=0.25.0", "markdownify>=0.13.1", "egg-contracts"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beads*", "egg_agent*", "egg_anchor*", "egg_config*", "egg_container*", "egg_git*", "egg_harness*", "egg_harness_integration*", "egg_health*", "egg_logging*", "egg_orchestrator*", "egg_overseer*", "egg_restrictions*", "enrichment*", "git_utils*", "notifications*", "text_utils*"]
