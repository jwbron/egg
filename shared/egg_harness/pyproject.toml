[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "egg-harness"
version = "0.1.0"
description = "Custom coding harness with multi-provider LLM support"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.50,<1.0",
    "httpx>=0.25.0",
    "markdownify>=0.13.1",
]

[tool.setuptools.packages.find]
include = ["egg_harness*"]
