# Check fixer configuration
#
# Maps CI workflow jobs to their non-LLM fix commands, max retries, model,
# and timeout settings. Used by build-check-fixer-prompt.sh and
# reusable-check-fixer.yml.
#
# Repos can override by placing .egg/check-fixers.yml in their repository.

version: "1"

defaults:
  model: "sonnet"
  timeout: "15"
  max_retries: 10

workflows:
  Lint:
    Python:
      non_llm_fix: |
        pip install -q uv 2>/dev/null || true
        uv sync --extra dev 2>/dev/null || true
        .venv/bin/ruff check --fix --unsafe-fixes .
        .venv/bin/ruff format .
      max_retries: 10
    Shell:
      non_llm_fix: |
        if command -v shfmt >/dev/null 2>&1; then
          find . -name "*.sh" -not -path "./.venv/*" -not -path "./.git/*" | xargs shfmt -w -i 2 -ci -bn
        fi
      max_retries: 10
    YAML:
      non_llm_fix: |
        find . \( -name "*.yaml" -o -name "*.yml" \) -not -path "./.venv/*" -not -path "./.git/*" | while read -r f; do
          sed -i 's/[[:space:]]*$//' "$f"
          [ -n "$(tail -c1 "$f")" ] && echo "" >> "$f"
        done
      max_retries: 10
    Docker:
      max_retries: 10
    Actions:
      max_retries: 10
    "Custom Checks":
      max_retries: 10
  Test:
    "Unit Tests":
      model: "opus"
      timeout: "15"
      max_retries: 10
    "Security Scan":
      max_retries: 10
    # On PR CI, integration tests run as a nested job of the `Test` workflow
    # via `uses: ./.github/workflows/test-integration.yml`. The GH jobs API
    # reports the failure under the composite name `<caller-job>/<inner-job>`,
    # so the key here must match that exact shape — not just "Integration Tests".
    "Integration Tests / Integration Tests":
      model: "opus"
      timeout: "30"
      max_retries: 10
