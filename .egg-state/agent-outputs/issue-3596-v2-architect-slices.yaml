# Slices for issue #3596 architect proposal (v2 — addresses NACK from reviewer_plan)
# Task-1 split into 9 sub-tasks by data source per R3.
# Task-5 (consumption breaker) deferred per R6 (no cost counter store exists).
# All 27 detection-plane detectors are starved — snapshot builder populates
# only 5 of 13 top-level fields and 3 of 7 RunningAgent fields.

slices:
  - id: slice-1
    task_ids: [task-1a, task-1b, task-1c, task-1d, task-1e, task-1f, task-1g]
    title: "Wire detection plane into runtime tick + enrich snapshot builder"
    parallelizable: false
    description: |
      Foundation slice: wire the detection plane into _run_runtime_tick_checks (1a),
      then enrich snapshot_from_health_context with all data sources the 27
      starved detectors need:
      - 1b: container_transitions from kubernetes_monitor
      - 1c: git_state from worktree git operations
      - 1d: decision_state from contract + decision queue
      - 1e: RunningAgent liveness fields + fix role=str(cid) defect
      - 1f: phase_state.expected_duration_s + raw.runtime from driver_heartbeat
      - 1g: Correct health_checks/README.md:88 (docs claim plane is wired)

  - id: slice-2
    task_ids: [task-2]
    title: "Add forward-progress detector (commit count + worktree activity rate)"
    parallelizable: false
    description: |
      New deterministic detector detect_forward_progress_stall that fires when
      an agent has been running >N seconds with zero commits, zero progress
      events, and zero file modifications. Depends on 1a (plane wired),
      1c (git_state), 1e (RunningAgent liveness).

  - id: slice-3
    task_ids: [task-3]
    title: "Fix peer-progress gate to be dependency-aware"
    parallelizable: false
    description: |
      Issue #3595 root cause 1: _has_recent_peer_progress defers on ANY peer's
      heartbeat, including the overseer's own. Fix: scope to only defer on
      peers the agent actually depends on (from BRC review_edges).
      HealthMonitor IS still active in production — this fix is NOT wasted.

  - id: slice-4
    task_ids: [task-4]
    title: "Enrich get_status with forward-progress signals and active alerts"
    parallelizable: false
    description: |
      Add progress sub-object to concurrent.agents entries with commit_count,
      last_commit_at, last_heartbeat_age_s, last_progress_age_s, progress_event_count.
      Add alerts array to top-level status response. Add phase timing fields.
      Depends on 1e for liveness fields (HealthMonitor, ProgressStore, git).

  - id: slice-5
    task_ids: [task-5]
    title: "Record sampling params in cost_callback (DEFERRED)"
    parallelizable: false
    description: |
      Issue #3595 root cause 5: sampling config is unset and unrecorded.
      Extend cost_callback.py to log optional_params. Pin temperature/top_p per model.
      Fully independent and deferred — can be done in parallel or as a follow-up.

# Dependency graph:
# slice-1 (1a) -> 1b, 1c, 1d, 1e, 1f, 1g (all depend on plane being wired)
# slice-1 (1c) -> slice-2 (forward-progress detector needs git_state)
# slice-1 (1e) -> slice-2 (needs RunningAgent liveness fields)
# slice-1 (1e) -> slice-4 (status enrichment needs liveness fields)
# slice-3, slice-5 are independent of the detection plane

# Execution order: slice-1 first (foundation), then slices 2-4 in parallel,
# slice-5 anytime (deferred)
