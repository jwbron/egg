# Recommended slice DAG for issue #3312 — decompose 19 oversize files.
# Architect RECOMMENDS; task_planner owns the final DAG / ordering / PR packaging.
# All 19 slices are FILE-DISJOINT at the source level (each touches only its own
# foo.py -> foo/ tree). dependencies are therefore NONE. The "wave" annotation is a
# scheduling/priority HINT (front-load independent wins per the issue + #2817/#3111
# history), not a hard DAG edge. Cross-slice contention is MECHANICAL and spans FIVE
# shared write targets (resolved by the section-(e) rebase recipe, not serialization):
#   (1) scripts/file-size-allowlist.yaml — each slice drops its entry;
#   (2) the CLAUDE.md seam tables — each slice adds its row;
#   (3) orchestrator/Dockerfile — the 5 top-level orchestrator slices add a COPY line;
#   (4) gateway/Dockerfile — the 3 gateway slices add a COPY line;
#   (5) sandbox/Dockerfile — the entrypoint.py slice adjusts its single-file COPY/shim.
#
# DOCKERFILE PACKAGING (binding, risk_analyst R3): orchestrator/Dockerfile:44 and
# gateway/Dockerfile:67 ship top-level modules via a NON-recursive `COPY *.py ./` glob.
# Converting a top-level module to a sub-package dir means it is NO LONGER copied ->
# ModuleNotFoundError in the running image, while make lint/make test-all stay GREEN
# against the source tree (a broken image is a behavior change). So each AFFECTED slice
# MUST, in the same slice, add the explicit `COPY orchestrator/<name>/ ./<name>/` (or
# gateway equivalent) line and VERIFY via image build / in-container import. Affected:
# slices 3,10,13,14,16 (orchestrator top-level), 11,12,18 (gateway), 9 (entrypoint shim).
# Verify-not-assume: slices 1 & 17 (egg_lib packaging) and slice 8 (overseer/ shipping).
#
# Every slice (unless noted) follows the canonical pattern:
#   step-0 git mv foo.py -> foo/__init__.py (own bisectable commit, test-all green)
#   -> carve clusters into underscore-prefixed submodules
#   -> __init__.py barrel does explicit per-symbol re-exports (stable API; preserves
#      patch("module._sym") targets — run the section-(d) importer audit per cluster)
#   -> drop the file's scripts/file-size-allowlist.yaml entry
#   -> add/refresh the relevant CLAUDE.md seam-table row
#   -> make lint + make test-all green. Pure refactor, no behavior change. Branch egg/.
