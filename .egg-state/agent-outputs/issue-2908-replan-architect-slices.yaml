slices:
  - id: 1
    name: |-
      WS0 de-risking spike + per-event cost instrumentation
    goal: |-
      Throwaway prototype proving the deterministic event-pump reaches BRC
      consensus without restart churn on the #2906 repro (issue-2270 on
      qwen3.7-max). Instrument per-event token spend (Anthropic via
      AgentResult.cost_usd, Qwen via config/litellm/cost_callback.py
      stdout captured by `kubectl logs deployment/egg-litellm` — NOT
      `~/.local/state/clm/cost-*.json` which is host-developer-only)
      and per-event wall-clock across a realistic worst-case BRC idle
      (reviewer parked ~7-8 min while producer addresses a NACK).
      HARD MEASUREMENT CONSTRAINT (risk_analyst BC-1): the
      cache_read_input_tokens / cache_creation numbers MUST come from
      actual `python3 -m egg_agent` invocations under the new
      event-pump prototype with the production BRC preamble (assembled
      via orchestrator/routes/pipelines.py::_build_brc_preamble) and
      all agent-facing MCP tool schemas in the cached prefix (38
      @tool registrations across sandbox/egg_agent_tools/tools/*).
      Raw `claude --output-format json` measurements from the WS7
      issue-body comments are NOT sufficient because the egg prefix
      layers are larger and structurally different — they must be
      re-measured under the real harness before any later slice
      (especially slice-8 prompt collapse) is gated on the numbers.
      Deliverable: measurement report under .egg-state/agent-outputs/
      that gates the rest of the work per operator feedback Q1
      (instrument only, no auto-fail). No production code change
      beyond a small hook in cost_callback.py if/only if needed to
      surface per-event attribution.
    # root slice — omit dependencies
  - id: 2
    name: |-
      Net-new CLI commands the event-pump depends on
    goal: |-
      Per cq-1 mandate (split MCP→CLI collapse to a follow-up but
      guarantee CLI coverage for the new control flow), add purely
      additive CLI shims around existing handlers. cq-1's example
      list explicitly names `brc get-state`, `brc list-blocking`,
      `phase get-context`. Scope for THIS slice:
      (a) `egg-orch brc get-state` (handler `brc_get_state` at
      sandbox/egg_agent_tools/handlers/brc.py:679+; surfaces the
      same data as `egg-orch consensus status --json` but at a
      stable canonical name cq-1 names);
      (b) `egg-orch brc list-blocking` (handler `brc_list_blocking`
      at sandbox/egg_agent_tools/handlers/brc.py:726-740; backs onto
      the orchestrator status endpoint whose `blocking_agents` list
      is computed inline in PeerConsensusTracker.get_state at
      orchestrator/peer_consensus.py:1594-1626);
      (c) `egg-orch phase get-context` (handler at
      sandbox/egg_agent_tools/handlers/phase.py:139);
      (d) `egg-orch phase get-assigned-tasks` (handler at
      sandbox/egg_agent_tools/handlers/phase.py);
      (e) Extension to `egg-orch consensus status` (handler
      `brc_get_state` at sandbox/egg_agent_tools/handlers/brc.py:679+
      backs onto orchestrator-side `/api/v1/pipelines/<pid>/status`)
      to carry the durable orchestrator-side Pipeline fields the
      wrapper needs after host restart: `no_progress_budget`
      (per-role counter map from Pipeline.no_progress_budget) +
      `parked_decisions` (the `pipeline parked` HITL decision
      shape from Pipeline.decisions when present). Additive,
      backwards-compatible response fields on the existing
      `/api/v1/pipelines/<pid>/status` endpoint at
      orchestrator/routes/pipelines.py:3911 + assembled at
      :4531-4557. CLI shim adds optional `--field <dotted.path>`
      projection. This replaces the v2 d-13 choice of
      `egg-contract show --field`, which would have hit the
      gateway-side SDLC Contract model (shared/egg_contracts/
      models.py:777 `class Contract`) — wrong substrate. The
      orchestrator Pipeline (orchestrator/models.py:1053) is a
      different model in a different store reached via the
      orchestrator HTTP API, not the gateway's
      `/api/v1/contract/<id>` (which is what `cmd_show` /
      `handlers/sdlc.show_contract` at
      sandbox/egg_agent_tools/handlers/sdlc.py:301-354 reads via
      `gateway_request("/api/v1/contract/{id}")` at :336);
      (f) IN-SCOPE for this issue: `egg-orch consensus
      resolve-obligation` shim (handler exists —
      `brc_resolve_obligation` at handlers/brc.py:743). Useful for
      cross-producer obligation flows the event-pump may invoke.
      OUT OF SCOPE per cq-1's split: `egg-orch brc
      read-peer-artifact` (decision-8 explicitly keeps this MCP-only;
      the event-pump does not consume peer brc-history through it);
      `egg-orch task mark-gap` (decision-4 keeps it MCP-only).
      No existing MCP tools are removed. Tests in tests/tools/ extend
      the MCP↔CLI parity harness at tests/tools/test_mcp_cli_drift.py.
    dependencies: slice-1
  - id: 3
    name: |-
      Server-side consensus next-action endpoint + CLI
    goal: |-
      Add `GET /api/v1/pipelines/<pid>/consensus/next-action?role=R[&slice=S]`
      returning `{action, target_producer?, version?, blocking_reason?,
      parked?, reason}` derived from PeerConsensusTracker.get_state
      (orchestrator/peer_consensus.py:1594-1626 plus the version
      tracking at :114-124) + latest bus tip (CONSENSUS_PROPOSE /
      CONSENSUS_RE_REVIEW for the role) + pending HITL decisions
      from Pipeline.decisions. Add the matching `egg-orch consensus
      next-action --role R [--slice S] --json` CLI shim. EXPLICIT
      DUAL-ROLE ORDERING (risk_analyst R-6 + v2 symmetric-case
      ask): encode TWO transitions as explicit unit tests in
      orchestrator/tests/test_consensus_next_action.py:
      (i) dual-role agent with producer-phase=WORKING AND
      proposal_version=0 AND a peer's CONSENSUS_PROPOSE pending
      review → return `action: propose` (producer-first ordering;
      own first propose precedes reviewer obligations);
      (ii) dual-role agent with producer-phase past first-propose
      (proposal_version>=1) AND a peer's CONSENSUS_PROPOSE pending
      review → return `action: review` (reviewer obligation now
      binds). The unit-test surface MUST cover both transitions.
      Tracker-reconstructing variant: `{action: wait, reason:
      tracker_reconstructing}` with a small TTL so a post-host-
      restart probe doesn't spin. This endpoint is the brain the
      new event-pump (slice 5) queries each cycle (decision d-3).
    dependencies: slice-2
  - id: 4
    name: |-
      Durable no-progress safety budget + HITL park decision
    goal: |-
      Add `Pipeline.no_progress_budget` (per-role counter) persisted
      via the existing git-backed StateStore so it survives host /
      orchestrator restart (cq-3 hard requirement). Increment rule:
      same next-action verdict twice with no intervening tracker
      state change. Reset on any state advance for that role. On
      exhaustion: fire OVERSEER_ALERT via the existing
      `_emit_producer_death_alert` callable
      (orchestrator/routes/pipelines.py:15310-15390) AND register a
      HITL decision `pipeline parked — no progress for N events.
      Resume or abort?`. Wire `resume` (clears counter) and `abort`
      (transitions to FAILED) into the existing decision-handler
      pattern at orchestrator/routes/decisions.py:77-200. Tests must
      cover host-death recoverability — kill the orchestrator
      mid-cycle, restart, verify counter + parked decision survive.
      DURABILITY PARTIAL-FAILURE SEMANTICS (risk_analyst BC-3): the
      sync-flush variant of StateStore.save_pipeline (or a new
      `_save_pipeline_durable`) must specify BOTH the success path
      (returns only after `git push` succeeds) AND the
      partial-failure path. On `git push` failure: raise a typed
      exception (e.g. `DurableSaveFailed`) — the safety-budget
      consumer (the wrapper / next-action endpoint) handles this by
      emitting an OVERSEER_ALERT and falling back to an in-memory
      budget snapshot, continuing the wait-loop. Do NOT exit the
      wrapper on partial failure. Bounded retry policy documented in
      the function's docstring. Unit tests in
      orchestrator/tests/test_state_store.py must cover both paths
      (push-succeeds and mock push-failure).
    dependencies: slice-3
  - id: 5
    name: |-
      Event-pump online (additive + caller rewires; no deletion)
    goal: |-
      The additive half of the swap (reviewer_plan §11 subdivision
      of original slice-5 → 5a). Bring the new event-pump online
      without deleting any legacy code yet — old wrapper paths stay
      present but become unreachable as the new template replaces
      `_CONSENSUS_WRAPPER_TEMPLATE` wholesale. Pieces:
      (a) Add `--memory-file PATH` and `--event-json STRING` flags
      to `python3 -m egg_agent` via shared/egg_agent/command.py
      (~:34-46 argv shape); behaviour-with-neither-flag MUST remain
      identical to today (regression guard test).
      (b) Rewrite orchestrator/consensus_wrapper.py's
      `_CONSENSUS_WRAPPER_TEMPLATE` (currently :116-713) as the
      deterministic event-pump bash that invokes
      `egg-orch message wait-loop`, `egg-orch consensus next-action`
      (slice 3), and one-shot `python3 -m egg_agent --memory-file
      ... --event-json ...` per actionable event. ACCEPTANCE
      (risk_analyst v2 non-blocking, promoted): the diff for
      consensus_wrapper.py MUST replace the OLD template at the
      same line range — i.e. no two templates coexist in the file
      even transiently. Belt-and-suspenders against a contributor
      leaving the old template as a comment block.
      (c) SHELL-PROSE CORRUPTION GUARD (risk_analyst BC-2, #2741):
      the per-event prompt + event-json + memory snapshot are all
      LLM-authored prose (NACK reasons, files_reviewed lists,
      reviewer reasoning); the new event-pump template MUST pass
      them to `python3 -m egg_agent` either via shlex.quote-applied
      argv (mirroring the existing
      consensus_wrapper.py:759-760 `shlex.quote(prompt_text)`
      pattern) OR via stdin / a tempfile path. A regression test in
      orchestrator/tests/test_consensus_wrapper_event_pump.py must
      inject a prompt + event payload containing $, backtick,
      single-quote, double-quote, newline and assert the agent
      receives the payload byte-identical.
      (d) Rewire `concurrent_executor._spawn_agent` at
      orchestrator/concurrent_executor.py:445-524 and any
      routes/pipelines.py restart-path callers to the new template
      signature.
      (e) Wire the safety-budget consumer against the slice-4
      durable Pipeline.no_progress_budget, including the BC-3
      partial-failure handling (DurableSaveFailed → OVERSEER_ALERT
      + continue loop, NOT exit).
      End-state: new event-pump is the only spawn path. cq-4 is
      preserved — there is no flag path back to the old wrapper
      because the rewrite replaces the template wholesale; old code
      paths in consensus_wrapper.py are simply unreachable until
      slice-6 deletes them.
    dependencies: slice-4
  - id: 6
    name: |-
      Heartbeat migration + legacy deletion sweep + test/docs grep
    goal: |-
      The deletion half of the swap (reviewer_plan §11 subdivision
      of original slice-5 → 5b). Co-locates the heartbeat ownership
      migration with the legacy code removal so the tree stays
      green:
      (a) Migrate heartbeat ownership: wrapper invokes `egg-orch
      message heartbeat` at the 60s cadence (preserves the
      _WAIT_LOOP_HEARTBEAT_INTERVAL_SECS=60 invariant at
      sandbox/egg_agent_tools/handlers/message.py:47). Delete the
      agent-side daemon-thread auto-start in
      _start_wait_loop_heartbeat (:234-264) and the
      _default_emit_wait_loop_heartbeat helper (:175-231).
      (b) Delete per cq-4: MAX_CONSENSUS_RESTARTS at
      consensus_wrapper.py:38, _RECOVERY_SYSTEM_PROMPT at :64-99,
      _RECOVERY_USER_PROMPT at :102-105, check_confirmed_and_wait
      and its SSE consumer at :397-548 (the curl SSE machinery
      :405-501 specifically), the restart loop at :555-695, the
      recovery-prompt re-templating at :614-633, the terminal
      exit-1 at :697-712.
      (c) Delete sandbox/egg_agent_tools/handlers/message.py
      message_wait_loop body at :267-432 (the wrapper-side wait is
      the only wait now). The lower-level message_wait at :81-172
      STAYS — it backs the wait CLI the wrapper invokes.
      (d) Rewire the 3-restart trigger arm in
      orchestrator/routes/pipelines.py:18100-18159 so the
      `_emit_producer_death_alert` call site is gated on
      safety-budget exhaustion rather than restart-count
      exhaustion. _emit_producer_death_alert function itself at
      :15310-15390 STAYS — just the trigger condition changes.
      (e) Test pivot across the 7 named files:
      orchestrator/tests/test_consensus_wrapper.py,
      test_consensus_polling.py, test_consensus_race_on_exit.py,
      test_consensus_timeout_recheck.py, test_brc_nack_iteration.py,
      test_producer_death_alert.py, test_agent_exits_recorded.py.
      Each gets restart-semantics tests deleted and event-pump-
      semantics tests added (or moved into a new
      test_consensus_wrapper_event_pump.py introduced in slice-5).
      (f) DOCS GREP AC (reviewer_plan non-blocking on slice-7,
      promoted here so docs co-land with code deletions): after
      deletion, `git grep` for MAX_CONSENSUS_RESTARTS,
      _RECOVERY_SYSTEM_PROMPT, _RECOVERY_USER_PROMPT,
      check_confirmed_and_wait, "STAY-ALIVE" (in agent-authored
      context — the prose-only foot-gun that goes obsolete with
      the wrapper-driven loop), "wait-loop" (in agent-authored
      context) across sandbox/agent-config/rules/,
      docs/architecture/orchestrator.md,
      docs/guides/concurrent-execution.md,
      docs/reference/orchestrator-cli.md,
      docs/reference/agent-wait-patterns.md must return zero
      structural hits. Specifically:
      sandbox/agent-config/rules/mission.md references at
      ~lines 137-192 must be rewritten or deleted.
    dependencies: slice-5
  - id: 7
    name: |-
      brc-memory artifact + delta-scoped re-analysis plumbing
    goal: |-
      Add the per-role memory file at
      .egg-state/agent-outputs/<role>/brc-memory.md (writable by
      every role today per verified shared/egg_restrictions/patterns.py
      registry). Action-scaffolded write: brc_ack and brc_nack
      handlers (sandbox/egg_agent_tools/handlers/brc.py) append a
      structured entry on each reviewer action; brc_propose and
      brc_confirm append on each producer action. Read on agent boot
      via the new --memory-file flag from slice-5. Plumb the
      orchestrator's existing changed_artifacts/version delta
      (peer_consensus.py:898-947 handle_re_propose) into the
      per-event invocation as a `--changed-artifacts` payload so the
      agent evaluates the delta rather than re-reading everything
      from scratch (decision d-5). Memory file remains EPHEMERAL per
      operator Q2 — cleaned with the pod; recovery backstop is
      `reconstruct_tracker_from_messages` at
      orchestrator/peer_consensus.py:1955+. Writes MUST use atomic
      tempfile-rename to avoid surfacing torn writes during a
      rapid-event sequence (risk_analyst R-4 non-blocking).
    dependencies: slice-6
  - id: 8
    name: |-
      Prompt collapse (lean event-handler contract)
    goal: |-
      Replace STAY-ALIVE / wait-loop mechanics / cursor-threading /
      pre-confirm-wait foot-gun guidance in _build_brc_preamble
      (orchestrator/routes/pipelines.py:12348-12700 approx) and the
      per-role prompt fragments with a lean event-handler contract
      that describes the per-event invocation model. The agent's
      contract becomes: read memory, act on the one event, update
      memory, exit cleanly. SYSTEM_PROMPT_NUDGE at
      sandbox/egg_agent_tools/server.py:61 STAYS UNCHANGED because
      cq-1 forbids MCP-surface changes in this issue. No production
      code beyond the prompt templates and the MISSION-style
      preamble; tests verify the rendered prompt fits the new model
      on at least one producer role + one reviewer role + one
      dual-role agent.
    dependencies: slice-7
  - id: 9
    name: |-
      Integration validation on #2906 repro path + docs revision
    goal: |-
      End-to-end run of the new event-pump on the #2906 Qwen-route
      repro (issue-2270 reproducer). Verify zero `Agent exited
      without BRC consensus` restart-churn alerts, memory file
      populated + consulted, per-role permissions enforced
      unchanged, cache_read_input_tokens instrumented across
      consecutive per-event invocations and an injected long idle.
      Capture final per-event cost numbers vs the WS0 baseline
      (slice-1). New integration test lives under integration_tests/
      (parent dir; the integration_tests/local_pipeline/ subdir was
      deleted in commit f7803637d1 — DO NOT inherit that stale
      path). Consumes the existing `egg_stack` session-scoped
      fixture at integration_tests/conftest.py:340 (yields an
      EggStack dataclass at :78-79 exposing `gateway_url` and
      `orchestrator_url`). Update docs/reference/agent-wait-patterns.md
      (the wait-loop reference) and docs/guides/concurrent-execution.md
      (the concurrent-BRC guide) to describe the new control flow.
    dependencies: slice-8
