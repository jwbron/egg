# Recommended slice DAG for issue #3665 — supervision layer second pass.
# Architect RECOMMENDS; task_planner owns the final DAG, ordering, and PR packaging.
#
# CONTEXT: This pipeline implements supervision-layer improvements in a SINGLE-repo
# (egg) pipeline. Standard #3046 FILE-LEVEL overlap rules apply.
#
# CRITICAL FINDING: Commit 6ffe97c8e on branch issue-3665-supervision-gaps already
# implements priorities 1-3 (livelock detection, timeout visibility, convergence-stall
# suppression + snapshot enrichment). The current working tree does NOT include this
# commit. The plan proposes INTEGRATION, not reimplementation.
#
# Slice 1 integrates the fix commit (17 files, 1072 insertions, 13 deletions).
# Slice 2 implements the remaining gap (alert evidence bundling, priority 4).
