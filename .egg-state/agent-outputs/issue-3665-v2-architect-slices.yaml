slices:
  - id: 1
    name: |-
      Integrate fix commit 6ffe97c8e (priorities 1-3: livelock detection, timeout visibility, convergence-stall suppression)
    goal: |-
      MERGE commit 6ffe97c8e from branch issue-3665-supervision-gaps into the current
      work branch. This commit already implements:

      1. Agent livelock / repetition-loop detection:
         - CREATE orchestrator/health_checks/tier1/loop_detection.py (317 lines)
           with detect_agent_livelock() function and AgentLivelockCheck class.
           Parses Claude Code tool-call lines from agent_log_store transcripts.
           Fires when unique tool-input ratio drops below 10% with >=10 total calls.
           requires_adjudication=False (deterministic, no LLM needed).
         - MODIFY orchestrator/health_checks/detection_plane.py: register
           detect_agent_livelock in _register_coverage_gap_detectors.
         - MODIFY orchestrator/health_checks/tier1/__init__.py: export
           detect_agent_livelock and AgentLivelockCheck.
         - MODIFY orchestrator/cli.py: register AgentLivelockCheck in health
           check runner.

      2. Two-hour timeout visibility:
         - MODIFY orchestrator/models/_config.py: add agent_timeout_seconds
           field (default 7200, ge=60).
         - MODIFY orchestrator/concurrent_executor.py: pass EGG_AGENT_TIMEOUT_SECONDS
           env to the sandbox.
         - MODIFY orchestrator/kubernetes_spawner/_spawn.py: pass
           active_deadline_seconds from EGG_AGENT_TIMEOUT_SECONDS to K8s Job.
         - MODIFY orchestrator/kubernetes_spawner/_models.py: add
           _failed_with_timeout_sigterm method; classify exit 143 as
           JOB_OUTCOME_LEGITIMATE (not ABNORMAL).
         - MODIFY orchestrator/kubernetes_monitor.py: treat exit 143 as clean
           during RUNNING phase (not just phase transitions).

      3. False convergence-stall suppression + snapshot enrichment:
         - MODIFY orchestrator/health_monitor.py: add get_agent_activity_ages()
           returning per-agent heartbeat/progress/activity ages.
         - MODIFY orchestrator/event_loop/_loop.py: add _has_recent_agent_activity()
           to convergence-stall check; consult alive-signal gates before firing.
         - MODIFY orchestrator/health_checks/detection_plane.py: enrich
           snapshot_from_health_context to populate last_tool_call_age_s and
           last_heartbeat_age_s on RunningAgent entries; register
           detect_heartbeat_stall in _register_coverage_gap_detectors.

      4. Tests (included in fix commit):
         - CREATE orchestrator/tests/test_loop_detection.py (210 lines)
         - CREATE orchestrator/tests/test_agent_timeout_config.py (36 lines)
         - CREATE orchestrator/tests/test_convergence_stall_suppression.py (127 lines)
         - CREATE orchestrator/tests/test_timeout_sigterm.py (148 lines)

      5. Sandbox config (included in fix commit):
         - MODIFY sandbox/llm/claude/config.py: read timeout from env var.

      Acceptance: Merge commit 6ffe97c8e applies cleanly; all 4 test files pass;
      livelock detector fires on known-bad fixtures and returns None on normal;
      exit 143 classified as LEGITIMATE not ABNORMAL; convergence-stall consults
      alive-signal gates; snapshot builder populates age fields; detect_heartbeat_stall
      registered and fires in live path.
    dependencies: none

  - id: 2
    name: |-
      Alert evidence bundling (priority 4 — NOT in fix commit)
    goal: |-
      MODIFY orchestrator/concurrent_executor.py:
      - Enrich _emit_supervision_alert (line 1064) to include structured
        evidence in the OVERSEER_ALERT metadata:
        - latest_heartbeat_age_s: seconds since the agent's last heartbeat
        - latest_tool_call_age_s: seconds since the agent's last tool call
        - last_progress_event: the agent's last progress event data
        - blocking_agents: current BRC blocking set
        - consensus_state: the BRC consensus status dict
        - container_logs_tail: last N lines of container logs (already fetched
          by _query_container_logs in the overseer, but not included in the alert)
      - The enrichment is additive — new metadata fields. Existing consumers
        that read only the existing fields continue to work.

      Acceptance: OVERSEER_ALERT payloads carry structured evidence; unit tests
      verify the metadata enrichment; existing consumers unaffected.
    dependencies:
      - 1

  - id: 3
    name: |-
      Verify integrated tests + add corpus rows
    goal: |-
      VERIFY: All 4 test files from the fix commit pass:
      - test_loop_detection.py: livelock detector unit tests
      - test_agent_timeout_config.py: config field tests
      - test_convergence_stall_suppression.py: suppression tests
      - test_timeout_sigterm.py: SIGTERM classification tests

      ADD: Corpus rows to orchestrator/tests/overseer_calibration/fixtures.json
      for the agent_livelock detector (both polarities: livelock detected +
