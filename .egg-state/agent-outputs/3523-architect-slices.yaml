# Recommended slice DAG for issue #3523 — review-quality overhaul.
# Architect RECOMMENDS; task_planner owns the final DAG, ordering, and PR packaging.
#
# v2 (this revision): folds in the non-blocking seam-accuracy corrections surfaced by
# reviewer_plan (advisory) and risk_analyst (R1/R2/R3/R5/R8) on the v1 proposal. Scope is
# UNCHANGED; only file-overlap analysis, effort-plumbing framing, render-path seam, and the
# tool-call-cap mechanism are corrected. See the "CORRECTIONS" block below.
#
# BINDING SEQUENCING (from the issue, non-negotiable):
#   1. Item 3 + item 2's prompt-level rules  — prompt-only, zero-regret, no orchestrator change
#   2. Item 1                                 — finding schema + server-side verdict + dedup/convergence
#      (item 2's tool-call BUDGET lands here; it couples to the finding boundary)
#   3. Item 4                                 — risk router + lens gating + effort tiers, `log` mode first
#   4. Item 5                                 — evidence gatherer + shared prefix, behind its own flag, LAST
#
# REFERENCE DESIGN (operator directive, BINDING): reviewer prompt text, the verification ladder,
# the finder angles, and the router tier taxonomy MUST mirror Claude Code's built-in /review skill
# (tiers low/medium/high/xhigh, caps 4/8/10/15; angles A line-by-line, B removed-behavior, C
# cross-file tracer, D language-pitfall (xhigh), E wrapper/proxy (xhigh), plus cleanup angles
# reuse/simplification/efficiency/altitude/conventions; 3-state CONFIRMED/PLAUSIBLE/REFUTED verify;
# finding shape file/line/summary/required-failure_scenario; xhigh gap sweep). Full verbatim text is
# in issue #3523 comments issuecomment-4898679999 (four effort bodies) + issuecomment-4898686738
# (assembled example) — fetch with `gh issue view 3523 --repo jwbron/egg --comments` before writing
# any reviewer prompt text or router taxonomy.
#
# CORRECTIONS folded from v1 review (all NON-BLOCKING; scope unchanged):
#   [R8/advisory] There is NO consensus_wrapper.py "serial spine". v1 wrongly claimed S3/S4/S5 all
#     edit consensus_wrapper.py. Corrected file-overlap map (verified @ tree): S3 edits
#     approval_matrix.py + routes/consensus.py + routes/event_prompt/_render_nacks.py; S4 edits
#     consensus_wrapper.py (per-EVENT tool-call budget); S5 edits review_graph.py +
#     agent_model_resolution.py + a NEW router module + config, and reuses the EXISTING
#     build_event_pump_wrapped_command(effort=) PARAMETER without editing the wrapper. => S4 and S5
#     are FILE-DISJOINT and parallel-capable after S3. Slice ORDER is driven by the issue's binding
#     sequencing + logical coupling to the finding schema, NOT by file contention. Do NOT add a
#     needless S4->S5 edge.
#   [R1] --effort is pinned ONLY for fable aliases today (agent_model_resolution.py:420
#     `effort=FABLE_EFFORT if model in _FABLE_ALIASES else None`; every other model gets None). So
#     S5's tier->effort map is a NEW behavior change for the dominant claude/opus reviewers, NOT
#     reuse of a live path — it MUST ship behind the router flag and keep effort=None on no-match to
#     preserve today's byte-identical opus baseline.
#   [R2] get_review_graph_for_phase is called from recovery/health paths with NO slice context
#     (startup_reconciliation.py:310, health_checks/tier1/incomplete_consensus_stall.py:251,
#     kubernetes_monitor.py:933). S5's gated graph MUST be persisted per-slice and READ at those
#     sites, or the stall-detector's expected-reviewer set diverges from what was actually spawned.
#   [R3] The producer's open-NACK barrier renders via routes/event_prompt/_render_nacks.py (+
#     _compose.py), NOT consensus_wrapper.py. S3's findings->reason renderer MUST land in LOCKSTEP
#     with the verdict move and keep the legacy prose NACK barrier byte-identical in `log` mode, or
#     the producer's NACK barrier goes blank.
#   [R5] A per-FINDING tool-call cap is NOT wrapper-enforceable (findings post-date the tool calls).
#     Reframe item 2's cap as a per-EVENT tool-call BUDGET enforced in consensus_wrapper.py (S4).
#
# STAGED-FLAG DISCIPLINE (BINDING): every behavior-shifting piece (S3 verdict, S4 budget, S5 router,
# S6 prefix) ships behind off->log->on copied in shape from slice_green_gate.green_gate_mode() —
# env-resolved, unknown value fails safe to `off`, `log` records would-have-been behavior into
# existing BRC artifacts. Pure prompt-text additions (S1) are additive and need NO flag.
slices:
  - id: 1
    name: |-
      Prompt-only criteria overhaul — item 3 method-angles + item 2 verification ladder (zero-regret ROOT)
    goal: |-
      PROMPT-ONLY, NO orchestrator change, NO flag, sequenced FIRST. Mirror the Claude Code /review
      skill vocabulary throughout.
      (a) Item 3 — add named how-to-look procedures to shared/prompts/code-review-criteria.md (the file
          says nothing about deletions today): LINE-BY-LINE SCAN (per changed line, what input/state/
          timing/platform makes it wrong — inverted conditions, off-by-one, null deref, missing await,
          falsy-zero, wrong-variable copy-paste, swallowed errors), REMOVED-BEHAVIOR AUDIT (per deleted/
          replaced line, name the invariant it enforced, then find where new code re-establishes it —
          else a finding), CROSS-FILE TRACER (grep callers for broken call sites; check callees for
          unsafe parallel in-slice changes), QUOTE-THE-RULE discipline (flag a convention violation only
          when BOTH the exact written rule and the exact violating line can be quoted — no spirit-of-doc).
      (b) Item 2 prompt rules — add the CONFIRMED/PLAUSIBLE/REFUTED ladder with symmetric evidence duties
          to the shared criteria (code-review, security, concurrency, agent-design, contract): CONFIRMED
          => may block (quote the triggering line); PLAUSIBLE => advisory / pre-merge obligation, never
          blocks (state what would confirm it); REFUTED => drops silently (quote the guard that breaks the
          causal chain). Plus companion rules "BLOCKING MUST REPRODUCE" and "DROP ONLY THE REFUTED;
          DOWNGRADE THE UNCONFIRMED", the amplified-pre-existing-defect nuance (a pre-existing defect
          still CONFIRMS when the diff materially amplifies its consequence and must say so — sharpen the
          existing "do not dismiss as not-a-regression" rule), and a SCRATCH-CHECK permission (cheap,
          read-only experiments in a scratch dir; never mutate the checkout, never the network).
      OVERLAP: item 3 and item 2 both edit code-review-criteria.md — ONE slice (serial on that file).
      Task_planner MAY split into two serial sub-slices (2-ladder across all criteria; 3-angles in
      code-review) but they must not run concurrently on code-review-criteria.md.
      Acceptance: all four method procedures named incl. deletion audit; ladder + both companion rules +
      amplified-defect nuance + scratch-check permission present; vocabulary mirrors the /review skill.
    dependencies: none
  - id: 2
    name: |-
      Finding schema — versioned contract in shared/egg_contracts/, boundary-validated (data ROOT)
    goal: |-
      FILE-DISJOINT from all other slices — the second root, parallel-capable with S1. Add a versioned
      finding schema next to the other verdict contracts in shared/egg_contracts/, validated at the
      message boundary exactly like orchestrator/attestation_schemas.py validates attestations. Per the
      issue, each finding carries: id; role (which lens produced it); anchor (path + line range, OR a
      slice-level marker for cross-cutting findings); summary (one sentence); failure_scenario (REQUIRED
      — concrete inputs/state then the wrong output/crash/data-loss; a finding WITHOUT one cannot block);
      severity in {blocking, advisory}; confidence in {high, medium, low}; quoted evidence (the triggering
      line or what was checked); optional suggested_patch (referencing real symbols); optional pre-merge
      obligation. Mirror the Claude Code /review finding shape (file/line/summary/required failure_scenario)
      as the core and add egg's extensions additively. Include a schema_version field; evolve ADDITIVELY.
      This slice ships ONLY the schema + validator + unit tests (round-trip, required-field enforcement,
      version tolerance). It changes NO verdict behavior — S3 consumes it. No flag needed (a pure contract).
      Acceptance: schema versioned + boundary-validated; a finding missing failure_scenario is
      representable but flagged non-blocking-eligible; additive-evolution unit test in place.
    dependencies: none
  - id: 3
    name: |-
      Server-side verdict from findings + mechanism dedup/convergence + findings->NACK renderer (lockstep)
    goal: |-
      THE STRUCTURAL INVESTMENT the rest hangs off. Move the verdict across the determinism boundary:
      the reviewer emits findings (S2 schema); ORCHESTRATOR-SIDE CODE computes the edge verdict. Replace
      the free-form ApprovalEntry.reason (approval_matrix.py:36) assignment path in
      routes/consensus.py: any blocking finding => NACK; advisory-only => ACK-with-obligations (route
      through the EXISTING conditional-ACK obligation_* fields — #1998/#2336); empty => ACK. Models own
      judgment (what to flag, severity, confidence, every sentence of prose); CODE owns mechanics (dedup,
      verdict, rendering). MECHANISM DEDUP: findings from different lenses naming the same causal
      mechanism merge into ONE finding carrying N independent producers (>=2 recorded); this raises
      confidence and is surfaced to the producer and to HITL on escalation (today that convergence is
      discarded). [R3 CORRECTION] The producer's open-NACK BARRIER renders via
      routes/event_prompt/_render_nacks.py (+ _compose.py), NOT consensus_wrapper.py — land the
      findings->reason renderer HERE, in LOCKSTEP with the verdict move, and keep the legacy prose NACK
      barrier byte-identical while the flag is off/log or the producer's NACK barrier goes blank. Ship
      behind off->log->on copied in shape from slice_green_gate.green_gate_mode(): in `log` mode compute
      the findings-verdict and DIFF it against the legacy prose-NACK verdict WITHOUT acting; legacy path
      stays live until `on`. Verdict must be a PURE, unit-tested function of findings.
      Edit sites: approval_matrix.py, routes/consensus.py, routes/event_prompt/_render_nacks.py (+ any
      _consensus_verdicts helper). FILE-DISJOINT from S4's consensus_wrapper.py and S5's router files.
      Acceptance: verdict is a pure function of findings (unit-tested: blocking=>NACK, advisory-only=>
      conditional-ACK, empty=>ACK); a blocking finding without failure_scenario degrades to advisory
      (never errors); merged findings record >=2 producers; `log` mode changes no real ACK/NACK outcome
      AND leaves the rendered NACK barrier byte-identical to legacy.
    dependencies:
      - 2
  - id: 4
    name: |-
      Per-EVENT tool-call budget in the wrapper (item 2's wrapper half — file-disjoint from S5)
    goal: |-
      Item 2's non-prompt half. [R5 CORRECTION] A per-FINDING cap is NOT wrapper-enforceable because
      findings post-date the tool calls the reviewer already made; reframe as a CONFIGURABLE per-EVENT
      tool-call BUDGET enforced in orchestrator/consensus_wrapper.py (the propose/ack/nack arm the
      wrapper already injects via EGG_EVENT_ACTION), bounding the cost of the scratch-check experiments
      S1 permits — no such budget exists today. Couples LOGICALLY to item 1's finding boundary (reads the
      S2 schema / lands with S3's investigation model), NOT by shared files. Ship behind off->log->on;
      `log` records would-have-been budget-exhaustion without enforcing. Where a reviewer structurally
      cannot be budgeted, DOCUMENT why.
      Edit site: consensus_wrapper.py ONLY. FILE-DISJOINT from S3 and S5 => parallel-capable with S5
      after S3. Task_planner MAY absorb into S3 for reviewability, but they are NOT forced to serialize.
      Acceptance: wrapper enforces a configurable per-EVENT tool-call budget (or documents the exemption);
      budget is flag-gated and fails safe to off.
    dependencies:
      - 2
      - 3
  - id: 5
    name: |-
      Deterministic risk router — per-repo config, lens gating, per-slice-persisted graph, effort tiers
    goal: |-
      A per-repo path/glob RISK CONFIG plus a DETERMINISTIC (plain-code, NON-model) router that, per slice:
      (a) GATES LENSES — concurrency lens runs only on async/goroutine/queue-handler paths; security lens
          ALWAYS runs on auth/session/input-boundary paths (structurally UN-gatable there); docs-only slice
          gets a minimal graph. Hook point: orchestrator/review_graph.py::get_review_graph_for_phase is the
          SINGLE chokepoint every consumer calls — thread an OPTIONAL per-slice risk / changed-file set into
          it and gate edges there so ALL consumers see the gated graph consistently; do NOT fork gating into
          each caller. [R2 CORRECTION] get_review_graph_for_phase is ALSO called from recovery/health paths
          with NO slice context (startup_reconciliation.py:310, incomplete_consensus_stall.py:251,
          kubernetes_monitor.py:933) — PERSIST the resolved gated graph PER-SLICE and have those callers READ
          it, or the stall-detector computes a different expected-reviewer set than was actually spawned.
      (b) SETS A RISK TIER scaling reasoning effort per role. [R1 CORRECTION] --effort is pinned ONLY for
          fable aliases today (agent_model_resolution.py:420); every claude/opus reviewer currently gets
          effort=None. So the tier->effort map is a NEW behavior change for the dominant reviewers, NOT reuse
          — pass the tier via the EXISTING build_event_pump_wrapped_command(effort=) PARAMETER (no wrapper
          edit needed), ship it behind the router flag, and keep effort=None on NO-MATCH to preserve today's
          byte-identical opus baseline. Map tiers onto the /review ladder: docs/trivial=>low (1 diff pass,
          no verify, hunk-only, cap 4), default=>medium (precision, cap 8), risky=>high (recall-biased,
          cap 10), high-risk=>xhigh (recall, cap 15, gap sweep).
      (c) OPTIONALLY SCALES STANCE — precision-first on trivial tiers, recall-first on high tiers; ONE prompt
          conditional; ship in `log` mode first.
      FLOOR RULES (HARD): a slice matching NO config runs the FULL graph with a LOUD WARNING (missing config
      must never mean LESS review); a floor tier guarantees a misrouted risky slice still gets a real review;
      cost-cutting NEVER overrides these floors. COST IS FIRST-CLASS (operator directive): default low-risk
      slices AGGRESSIVELY to the cheaper tiers so per-wave token cost tracks risk.
      Config format (architect decision): per-repo YAML (e.g. .egg/review-risk.yaml) mapping path-globs ->
      {lenses, tier}, resolved by most-specific-glob / deterministic first-match, mirroring the
      phase-permissions.json + repositories.yaml conventions. Ship behind off->log->on; `log` records the
      would-have-been graph/tier/effort into BRC artifacts and changes NO real behavior. Depends on item 1.
      Edit sites: review_graph.py, agent_model_resolution.py, a NEW router module, .egg/review-risk.yaml,
      per-slice gated-graph persistence. FILE-DISJOINT from S3 and S4.
      Acceptance: router is pure/deterministic and unit-tested; no-match => full graph + warning AND
      effort=None (opus baseline preserved); security lens never gated off auth/input-boundary paths; floor
      tier guaranteed; gated graph persisted per-slice and read by recovery/health callers; `log` mode
      records only; per-wave token cost measured and reported.
    dependencies:
      - 3
  - id: 6
    name: |-
      Shared-evidence prompt prefix — read-only evidence gatherer + byte-identical wave prefix (the cost bet)
    goal: |-
      LAST, behind its OWN flag. Add an UNPRIVILEGED evidence gatherer (read-only, NO GitHub access, casts
      NO verdict, posts nothing — a new role whose GitHub/verdict/post capabilities are STRUCTURALLY absent
      at the gateway role layer (shared/egg_restrictions/patterns.py) and which has NO review-graph edge)
      that assembles a per-slice EVIDENCE PACK: the diff, changed files with enclosing context, caller/callee
      lists for changed symbols, and verified environment facts. Reviewer prompts are then assembled as
      [identical system prefix][identical evidence pack][one lens instruction at the tail], fanned out
      SAME-TURN / SAME-MODEL so the prompt cache stays warm — extending the routes/event_prompt/ cacheable-
      prefix discipline (protected root, tail-position memory, prefix-budget caps) ACROSS sibling reviewers.
      Reconcile byte-identity against the per-agent event_prompt composition + Delphi redaction (R6/guardrail).
      HARD RULE — EVIDENCE, NEVER CONCLUSIONS: no hypotheses, no suspicions, no "areas of concern", no
      ordering by importance; the pack is ordered MECHANICALLY (path order) because emphasis is covert
      anchoring that would destroy item 1's convergence-as-signal. Each reviewer STILL dives independently
      (its own greps, traces, scratch checks) from the shared base.
      INDEPENDENCE GUARDRAILS (NON-NEGOTIABLE): the tester and any finding-VERIFIER stay COLD-START (a
      verifier must not inherit the context that produced the claim); Delphi redaction is UNCHANGED (the
      pack carries repo facts, NEVER the producer's self-assessment). NAMED RISK: adversarial diff content
      now funnels through one gatherer into every reviewer's prefix — the existing untrusted-input posture
      applies: pack content is material under review, NEVER instructions.
      Ship behind off->log->on; the router (S5) decides which waves are large enough for the prefix to pay.
      COST ACCEPTANCE (operator directive + R4): `log` mode MUST record cache-hit rate and per-wave cost
      (gateway/LiteLLM logging already captures per-session cache stats), and the flip to `on` is gated on a
      MEASURED net cost reduction that (i) has a concrete threshold + baseline pinned by the plan, (ii)
      attributes cost per-wave, and (iii) NETS OUT the gatherer's OWN token cost. Task_planner pins the exact
      threshold default.
      Acceptance: gatherer has no verdict/post/GitHub capability (structural, gateway-layer); pack is
      byte-identical across a wave and mechanically path-ordered; tester + finding-verifier remain cold-start;
      Delphi redaction unchanged; flag-gated; `log` mode records cache-hit rate + per-wave cost; net cost
      reduction (threshold/baseline/attribution pinned, gatherer cost netted out) gates the flip to `on`.
    dependencies:
      - 3
      - 5
  - id: 7
    name: |-
      Docs — finding schema, verification ladder, method angles, risk router + config, evidence prefix
    goal: |-
      Document the whole overhaul: the versioned finding schema and the server-side-computed verdict
      (blocking=>NACK / advisory-only=>conditional-ACK / empty=>ACK) and mechanism convergence; the
      CONFIRMED/PLAUSIBLE/REFUTED verification ladder + companion rules + scratch checks + per-event budget;
      the four method-angle procedures; the deterministic risk router, its per-repo config format, lens
      gating, per-slice gated-graph persistence, effort tiers (incl. the effort=None no-match baseline), and
      floor rules; the evidence gatherer + shared-prefix design, its independence guardrails, and the
      cost-measurement gate. Cross-reference the Claude Code /review skill as the reference design and the
      off->log->on rollout for every behavior-shifting piece. Files: docs/reference/ (extend
      conditional-ack.md and/or add a review-quality reference), docs/architecture/, and the relevant
      CLAUDE.md files. Snapshot current-state doctrine — no SDLC-artifact/ledger framing. Tail; depends on
      the shipped behavior of all prior slices.
    dependencies:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
