slices:
  - id: 1
    name: |-
      Validate check 'fix' key is non-empty string in validate_checks
    goal: |-
      Replace the silent str()-coercion of the optional 'fix' key in
      validate_checks with explicit isinstance(fix, str) and truthiness
      validation. When 'fix' is present but not a non-empty string
      (e.g. false, 0, '', or a YAML list), log a warning and drop it
      so the config error surfaces at load time rather than as a
      runtime green-gate mystery (#3630).

      Files to change:
      - shared/egg_config/validators.py — add logging import, replace
        fix handling, update docstring
      - config/repo_config.py — align the ImportError fallback
        validate_checks (uses existing module logger)
      - orchestrator/routes/pipelines/__init__.py — align the
        ImportError fallback validate_checks (uses existing module
        logger)
      - tests/egg_config/test_validators.py — update
        test_values_coerced_to_strings (fix: 3 now dropped, not
        coerced); extend test_empty_fix_dropped to verify warnings;
        add tests for: valid string accepted, false/0 rejected with
        warning, list rejected with warning, absent key unchanged.

      Scope: tightly scoped to the 'fix' key handling only. No changes
      to name/command coercion, full_command handling, or surrounding
      validators.
