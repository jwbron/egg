slices:
  - id: 1
    name: |-
      Docs and seam-table scaffolding
    goal: |-
      Lay the canvas for the 16 downstream decomposition slices. Update
      docs/guides/decomposition-pattern.md to reflect the non-negotiable #10
      relaxation (cq-4: scenario-organized test suites may stay topical;
      select_tests retrofit is not required). Update Pre-merge checklist
      accordingly. Retag all stale #2261 references in the pattern doc,
      orchestrator/CLAUDE.md, and gateway/CLAUDE.md to #2817 (cq-6). Add a
      Submodule seam table to sandbox/CLAUDE.md and create shared/CLAUDE.md
      with a Submodule seam table; sandbox/entrypoint.py,
      sandbox/egg_lib/orch_cli.py, shared/egg_contracts/checkpoint_cli.py,
      and shared/egg_contracts/plan_parser.py each get a TBD row in the
      new tables (cq-2). Refresh in-flight decomposition tables in
      orchestrator/CLAUDE.md and gateway/CLAUDE.md with current sizes; add
      seam-table rows for orchestrator/kubernetes_spawner.py and
      orchestrator/routes/phases.py (which were not in #2261's original
      table). Fix allowlist comments in scripts/file-size-allowlist.yaml:
      orchestrator/routes/phases.py issue field #2261 → #2817; the long
      comment block is retagged; shared/egg_contracts/plan_parser.py issue
      field #2548 → #2817 (cq-5). NO source decomposition lands in this
      slice. Acceptance: docs/guides/decomposition-pattern.md reflects
      cq-4; no #2261 references remain except the historical "refresh of
      #2261" pointer in the docstring of the pattern doc; sandbox/CLAUDE.md
      and shared/CLAUDE.md both carry a Submodule seam table; allowlist
      comments cite #2817 throughout.

  - id: 2
    name: |-
      pipelines.py baseline + simple clusters
    goal: |-
      Step-0 baseline plus the five small-to-medium flat clusters of
      orchestrator/routes/pipelines.py. Land the git mv
      orchestrator/routes/pipelines.py → orchestrator/routes/pipelines/__init__.py
      as its own bisectable commit (docs/guides/decomposition-pattern.md
      step-0 recipe). Then extract _criteria.py, _readers.py,
      _decisions.py, _status_helpers.py, _brc_verdicts.py as flat
      submodules with explicit per-symbol re-exports from __init__.py. The
      five sub-sub-packages (_run_loop/, _concurrent_phase/,
      _prompt_building/, _pr_lifecycle/, _worktree_ops/) are
      pre-allocated as TBD placeholders in __init__.py but NOT yet
      extracted — subsequent chained sub-slices fill them. The allowlist
      entry stays (file is still over the cap after this slice). Run the
      external-importer audit (docs/guides/decomposition-pattern.md
      section (d)) before each extraction; preserve every symbol
      referenced outside the package as a barrel re-export.
    dependencies: slice-1

  - id: 3
    name: |-
      pipelines.py _prompt_building/ sub-sub-package
    goal: |-
      Extract the ~13 _build_* / _render_* prompt-building helpers
      (_build_phase_prompt, _build_agent_prompt, _build_brc_preamble,
      _build_role_context, _build_reviewer_preparation,
      _build_producer_orientation, _build_file_boundary_section,
      _build_agent_roster, _re_review_priming_block,
      _build_role_restrictions_section,
      _build_impasse_escape_hatch_section, _render_contract_tasks,
      _build_review_prompt) into orchestrator/routes/pipelines/_prompt_building/
      as a nested sub-sub-package. The sub-sub-package gets its own
      __init__.py barrel re-exporting every symbol the parent
      orchestrator/routes/pipelines/__init__.py needs to surface to
      external consumers. Allowlist entry stays. Allowlist must show
      strict size decrease for pipelines/__init__.py (ratchet).
    dependencies: slice-2

  - id: 4
    name: |-
      pipelines.py _pr_lifecycle/ sub-sub-package
    goal: |-
      Extract the PR lifecycle cluster (_handle_pr_creation_failure,
      _open_context_pr_at_implement_start, _persist_context_pr_number,
      _build_pre_merge_obligations_section,
      _collect_pre_merge_obligations, _build_brc_history_link_line,
      _pr_metadata_from_plan_draft, _build_github_staging_manual_step,
      _render_brc_history_markdown, _write_brc_history*,
      _rewrite_brc_history_for_pr, _persist_phase_brc_history,
      _derive_producer_roles_with_tasks, _fetch_pr_state,
      _format_rescue_hint) into
      orchestrator/routes/pipelines/_pr_lifecycle/ as a nested
      sub-sub-package. Same barrel + ratchet expectations as slice-3.
    dependencies: slice-3

  - id: 5
    name: |-
      pipelines.py _worktree_ops/ sub-sub-package
    goal: |-
      Extract the worktree-operations cluster (_sync_worktree_with_remote,
      _rebase_pipeline_branch_onto_base,
      _refresh_pipeline_branch_against_current_base, _read_tree_head,
      _restore_missing_state_files_from_head,
      _commit_statefiles_to_worktree, _cleanup_agent_outputs_for_pr,
      _ensure_statefiles_on_branch, _collect_local_only_commits,
      _create_sync_recovery_backup_ref, _build_sync_recovery_backup_ref,
      _resolve_pipeline_worktree_path, _detect_default_branch,
      _resolve_origin_ref, plus WorktreeSyncOutcome /
      StalePipelineBranchError / SyncRebaseAndResetFailedError) into
      orchestrator/routes/pipelines/_worktree_ops/. Same barrel + ratchet
      expectations.
    dependencies: slice-4

  - id: 6
    name: |-
      pipelines.py _concurrent_phase/ sub-sub-package
    goal: |-
      Extract the concurrent-phase / slice-DAG runtime cluster
      (_run_concurrent_phase, _run_concurrent_phase_with_impasse_retry,
      _run_implement_phase_slices, _spawn_and_wait,
      _clear_stale_impasses_for_producers) into
      orchestrator/routes/pipelines/_concurrent_phase/. This cluster
      depends on _prompt_building, _pr_lifecycle, and _worktree_ops (all
      already landed by parent slices), so the extraction is mechanical.
      Same barrel + ratchet expectations.
    dependencies: slice-5

  - id: 7
    name: |-
      pipelines.py _run_loop/ + per-phase handler factoring (TERMINAL for pipelines.py)
    goal: |-
      Terminal sub-slice for orchestrator/routes/pipelines.py
      decomposition. Two-stage refactor inside the slice (mirrors prior
      #2261 plan's TASK-15-4 + TASK-15-5):
      (1) introduce PHASE_HANDLERS dispatch table inside _run_pipeline;
      bodies stay as local closures (bisectable indirection, no size
      win);
      (2) lift each per-phase handler body into its own module under
      _run_loop/ — _run_loop/_orchestration.py (thin _run_pipeline, <300
      LOC, + _PipelineRunContext dataclass), _run_loop/_run_refine.py,
      _run_loop/_run_plan.py, _run_loop/_run_implement.py,
      _run_loop/_run_pr.py. The _run_loop/__init__.py barrel re-exports
      _run_pipeline, _spawn_pipeline_run_thread, PHASE_HANDLERS,
      _PipelineRunContext. Acceptance: pipelines/__init__.py and every
      submodule lands under 1500 LOC; scripts/file-size-allowlist.yaml
      entry for orchestrator/routes/pipelines.py is REMOVED; the TBD row
      in orchestrator/CLAUDE.md is replaced with the concrete submodule
      layout; manual smoke-run of a refine→plan→implement→pr pipeline
      verifies no behaviour change. Follow-up issue #2319 (per-phase
      handler unit tests) tracked separately.
    dependencies: slice-6

  - id: 8
    name: |-
      gateway.py baseline + _app_factory + _auth + checkpoint/gh routes
    goal: |-
      Step-0 baseline plus the small-to-medium flat clusters of
      gateway/gateway.py. Land git mv gateway/gateway.py →
      gateway/gateway/__init__.py as its own bisectable commit. Then
      extract _app_factory.py (Flask app object + handle_unhandled_exception
      + make_response / make_error / make_success / make_worktree_not_found_error
      + audit_log + health_check + _check_orchestrator_connectivity +
      _check_squid_health + config_reload + main + _run_health_server),
      _auth.py (LauncherSecretNotConfiguredError + get_launcher_secret +
      check_launcher_auth + require_launcher_auth +
      require_session_or_launcher_auth + _verify_orchestrator_transition_auth
      + _is_in_cluster_source + translate_to_host_path + mount helpers +
      _is_checkpoint_repo_for_request + _detached_head_hint +
      _lookup_commit_observer_fn), _checkpoint_routes.py
      (checkpoint_list / checkpoint_cost / checkpoint_show +
      _resolve_checkpoint_repo / _resolve_checkpoint_token /
      _ensure_checkpoint_scratch_repo / _resolve_repo_path_for_checkpoints),
      and _gh_routes.py (_apply_pr_labels + gh_pr_create / gh_pr_comment /
      gh_pr_edit / gh_pr_close + gh_execute). The three sub-sub-packages
      (_git_routes/, _jira_routes/, _confluence_routes/) are
      pre-allocated as TBD placeholders. Routes still register via
      @app.route(...) thin wrappers in __init__.py (HITL decision-8 of
      #2261). Allowlist entry stays.
    dependencies: slice-1

  - id: 9
    name: |-
      gateway.py _git_routes/ sub-sub-package
    goal: |-
      Extract gateway/gateway.py's git routes (git_push, git_execute,
      git_fetch — ~2.8K LOC total) into gateway/gateway/_git_routes/. The
      ~1040-LOC git_push body decomposes into named helpers per the prior
      plan's R5 mitigation (gateway/CLAUDE.md row notes 'named helpers
      split out of the security-critical git_push mega-handler');
      sub-sub-package may itself need a further-split if git_push's
      helper module crosses the cap. security_review reviewer must ACK
      this slice. Allowlist entry stays.
    dependencies: slice-8

  - id: 10
    name: |-
      gateway.py _jira_routes/ sub-sub-package
    goal: |-
      Extract gateway/gateway.py's ~1.8K LOC Jira route cluster
      (_session_jira_context + _jira_error_from_upstream +
      _jira_not_configured_error + _project_not_allowlisted_response +
      _jira_write_audit_meta + _validate_jira_* + jira_ticket_get / search /
      comments / remotelinks / transition / execute / create / edit +
      jira_ticket_comment_add + jira_issue_link_create) into
      gateway/gateway/_jira_routes/. Routes still register via
      @app.route(...) thin wrappers in __init__.py. Allowlist entry stays.
    dependencies: slice-9

  - id: 11
    name: |-
      gateway.py _confluence_routes/ + _worktree_routes + _anthropic_proxy
    goal: |-
      Extract gateway/gateway.py's Confluence cluster (~1.1K LOC:
      _session_confluence_context + _confluence_error_from_upstream +
      _redact_upstream_error_body + _confluence_not_configured_error +
      _confluence_response_too_large + _confluence_forbidden_response +
