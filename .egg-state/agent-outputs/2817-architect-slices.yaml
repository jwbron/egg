      _check_post_fetch_space_allowlist + routes
      confluence_page_get/descendants/footer-comments/inline-comments +
      confluence_space_pages/list + confluence_search + confluence_execute)
      into gateway/gateway/_confluence_routes/. Also extract
      _worktree_routes.py (get_worktree_manager + map_container_path_to_worktree
      + _cleanup_stale_pack_files + _cleanup_empty_container_dir +
      worktree_create / delete / list + _derive_worktree_anchor_ids +
      _container_ids_from_sessions + _collect_active_container_ids +
      worktrees_prune) and _anthropic_proxy.py (~1K LOC: get_anthropic_client
      + _get_forwarded_headers + _filter_response_headers +
      _inject_upstream_credentials + _inject_anthropic_credentials +
      _resolve_proxy_session + _filter_blocked_tools + _is_streaming_request
      + _capture_non_streaming_response + _capture_streaming_response +
      _parse_sse_response + _SSEAccumulator + proxy_anthropic_messages +
      proxy_count_tokens). Allowlist entry stays.
    dependencies: slice-10

  - id: 12
    name: |-
      gateway.py _sessions + allowlist drop (TERMINAL for gateway.py)
    goal: |-
      Terminal sub-slice for gateway/gateway.py decomposition. Extract
      _sessions.py (_branch_exists_on_remote + session_create +
      _cleanup_container_worktrees + session_delete +
      session_delete_by_container + session_heartbeat_by_container +
      session_get + session_heartbeat + session_update +
      session_update_phase + repos_visibility + sessions_list).
      Acceptance: gateway/gateway/__init__.py and every submodule lands
      under 1500 LOC; scripts/file-size-allowlist.yaml entry for
      gateway/gateway.py is REMOVED; the TBD row in gateway/CLAUDE.md is
      replaced with the concrete submodule layout. security_review ACK
      required (final security pass on the decomposed gateway).
    dependencies: slice-11

  - id: 13
    name: |-
      sandbox/egg_lib/orch_cli.py decomposition
    goal: |-
      Decompose sandbox/egg_lib/orch_cli.py (4034 LOC) into a sub-package
      with flat submodule clusters: _http.py, _cmd_pipeline.py,
      _cmd_signal.py, _cmd_phase.py, _cmd_decision.py,
      _cmd_container_gateway.py, _cmd_message.py, _cmd_overseer.py,
      _cmd_consensus.py, _cmd_misc.py, _parser.py (may itself need
      further-split given create_parser is ~940 LOC). Allowlist entry
      REMOVED. sandbox/CLAUDE.md Submodule seam-table row populated with
      concrete layout (the TBD row added in slice-1).
    dependencies: slice-1

  - id: 14
    name: |-
      orchestrator/gateway_client.py decomposition (method-modules-on-class)
    goal: |-
      Decompose orchestrator/gateway_client.py (3713 LOC) using the
      method-modules-on-class pattern. GatewayClient class identity stays
      in __init__.py; methods become thin wrappers that delegate to
      module-level helpers in _http.py, _sessions.py, _worktrees.py,
      _push.py, _pr.py, _rebase.py, _remotes.py, _errors.py. Tests
