slices:
  - id: 1
    name: |-
      PR B — Long-haul monitoring tooling: wait-status filter flags + slice.closed event
    goal: |-
      Additive / low-risk. Two independent additions the skill consumes.
      (1) skills/sdlc/bin/wait-status (328-line pure-stdlib launcher):
      add --exclude-types (comma-separated event-type filter) and
      --quiet to the arg parser (~:292-320) and apply the filtering
      client-side at the two JSON print sites (print(json.dumps(line))
      at :249 and :271) — drop a line whose event type is in the
      exclude set; suppress non-essential lines under --quiet. Keep it
      pure-stdlib and self-contained (no new imports/deps). Existing
      --since/--inner-timeout/--max-iterations behavior and the
      non-filtered default output stay unchanged (regression-guarded).
      (2) Add SLICE_CLOSED = "slice.closed" to the EventType StrEnum in
      orchestrator/events.py (:35) and emit it at BOTH
      SliceScheduler.record_complete (slice_scheduler.py:361) and
      record_failure (:371), carrying a payload that distinguishes
      success vs failure and identifies the slice (a single event type
      with an outcome field is cleaner than two types). Emit via an
      injected emitter Callable added to __init__ — mirror the existing
      _hitl_escalator seam (default None, stored, invoked OUTSIDE the
      scheduler lock at :352-354) to avoid re-entrancy/deadlock; do not
      emit inside the lock. Add "slice.closed" to _STATUS_WAIT_EVENT_TYPES
      (orchestrator/routes/pipelines/__init__.py:405) so it passes the
      /status/wait allowlist checked at _routes_status.py:349. Tests:
      the two new flags (a filter that drops a type; --quiet); a slice
      completion AND a slice failure each emit exactly one allowlisted
      slice.closed event.
    # root slice — independent, no dependencies
  - id: 2
    name: |-
      PR C — Supervision hardening: rate-limit classification + windowed paced retry + deterministic-loop guard
    goal: |-
      Behavioral / medium-high risk (highest in this pipeline; weight
      toward test coverage). All in orchestrator/supervision_policy.py
      and its JobSupervisor integration (concurrent_executor.py).
      (1) Classification: detect the all-producers agent-invocation-
      failure streak whose underlying error carries bare throttling
      wording (HTTP 429 / "rate limit" / "overloaded" — exactly the
      signatures shared/egg_agent/auth_errors.py deliberately keeps OFF
      EX_AUTH_FATAL at :24-28/:45-47) and introduce a NEW transient
      rate-limit classification distinct from abnormal, so this
      signature does NOT feed the agent-invocation-fail-streak halt
      (supervision_policy.py:25-26) that currently exhausts in minutes
      because backoff caps at SUPERVISION_BACKOFF_CAP_SECONDS=30 (:19).
      The all-producers signature is observable at the streak-exhaustion
      broadcast site (concurrent_executor.py:988). (2) Windowed paced
      retry: on that classification, pace retries across the rolling cap
      window (hours-scale, not 30s) without hammering the API, using a
      restart_phase-equivalent that PRESERVES landed slices (does not
      reset completed slice runtimes — re-arm only the in-flight/failed
      frontier). (3) Deterministic-loop guard: capture a failure
      fingerprint (signature + phase/slice progression); if a restart
      reproduces the IDENTICAL fingerprint at the SAME point, stop and
      escalate instead of looping; if the restart advances state,
      continue. (4) Bounding per resolved HITL cq-1: NO hard wall-clock
      ceiling — emit an OVERSEER_ALERT once the cumulative wait crosses
      a threshold (attended-operator visibility while auto-recovery
      continues); do NOT conflate the loop-guard escalation with a
      time-ceiling halt (orthogonal triggers). Invariance: EX_AUTH_FATAL
      (incl. matched weekly/usage caps) and ordinary abnormal failures
      behave UNCHANGED — the new path triggers ONLY on the throttling-
      streak signature. Tests: throttling-streak -> rate-limit (not
      abnormal); paced-retry pacing/window; landed-slice preservation
      across a restart; loop-guard escalates on identical reproduction
      vs. continues when the restart advances state; threshold
      OVERSEER_ALERT fires.
    # independent slice — no dependencies
  - id: 3
    name: |-
      PR D — Slim the skill (GATED): coverage-map, then delete host detectors, then remove overseer_owns_host_detection
    goal: |-
      Deletion / medium risk, with a HARD internal gate — the
      task_planner should split this slice into three ordered tasks
      (D1 gates D2 and D3). D1 (GATE, do first): produce the
      coverage-map — for EACH of the five host detector blocks in
      skills/sdlc/SKILL.md (Stall detection ~637, Silent agent
      detection ~644, NACK escalation ~679, Long-Running Phase
      Detection ~722, and the host-side detection TRIGGER of Stuck
      Pipeline Rescue ~750) name the concrete overseer emitter and the
      OVERSEER_ALERT subject the skill already surfaces. This is REAL
      verification, not a rubber stamp: the host vocab (agent-stall /
      agent-silent / agent-nack-unresolved / phase-long-running) exists
      in production ONLY as a last-alert dedup map at
      shared/egg_overseer/state.py:86 and is otherwise produced by the
      overseer Haiku classifier/adjudicator (LLM path), while the live
      overseer monitor emits a DIFFERENT deterministic vocab
      (post_consensus_stall / incomplete_consensus_stall /
      rerun_anomaly / status_inconsistency / hitl_propagation_failure /
      cross_phase_inconsistency / orchestrator_unreachable via
      _broadcast_alert in orchestrator/overseer/monitor/
      _anomaly_checks.py + _consensus_stall.py). Any block that maps to
      NO confirmed emitter is a HITL raised at the point of discovery —
      NOT a silent delete into a dark gap. D2 (only after D1 confirms
      parity): delete from SKILL.md the "Host detector migration (issue
      #1962)" section (~553), the "Overseer-Absent Fallback" (~573),
      the five host-side detector blocks, and the short-flow Stall
      detection block (~1517) — detection/trigger prose ONLY. PRESERVE
      (AC-D3, key regression surface): the Long-Running Implement Phase
      and Unresolved NACK AskUserQuestion render-on-alert flows must
      still fire on their OVERSEER_ALERTs; keep the user-initiated Stuck
      Pipeline Rescue workflow (Steps 1-3) minus its host-side detection
      trigger; keep the two thin last-resort backstops (never
      blind-action a destructive recommendation — route through
      AskUserQuestion; TaskStop the Monitor before re-arming). D3
      (after D1): remove overseer_owns_host_detection ENTIRELY — the
      Field at orchestrator/models/_config.py:388 and both getattr
      references at orchestrator/routes/pipelines/_routes_status.py:126-127
      (conclude the calibration window; do not flip the default);
      grep-clean the symbol. Reviewer note: PR B (slice 1) also touches
      the routes/pipelines package (allowlist in __init__.py) — a
      different region from D3's _routes_status.py edit, but flag the
      shared package for merge-seam awareness.
    # independent slice — no cross-slice dependencies; internal D1->D2/D3 gate handled in task decomposition
