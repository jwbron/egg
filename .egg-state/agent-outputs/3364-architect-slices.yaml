      _STATUS_WAIT_EVENT_TYPES allowlist — the scheduler-close -> bus -> route
      chain, NOT a hand-published event. This closes the reviewer_contract
      slice-1 NACK and proves AC-B5 end-to-end. Keep all existing PR B
      suites; this is an addition. make test-all green.
    # independent slice — no dependencies
  - id: 2
    name: |-
      PR C — RE-PLANNED (cq-2): transient rate-limit classification via a distinct EX_RATE_LIMITED exit code mirroring the EX_AUTH_FATAL chain (#3447 JobSupervisor now in event_loop/)
    goal: |-
      SUPERSEDES the prior PR C plan. The operator resolved cq-2 (opt-3) to
      pause and re-scope PR C because the contracted mechanism cannot work:
      only a per-agent EXIT CODE crosses the pod boundary (handle_agent_failure
      sees f"Container exited with code {N}"; exit_detail_for returns
      "exit_code=N", kubernetes_spawner/_models.py:102-131) — the throttle
      wording (429 / "rate limit" / "overloaded") is NOT observable
      orchestrator-side, so classifying by wording at the streak site is
      unimplementable. The ONLY faithful mechanism is a distinct exit code
      mirroring EX_AUTH_FATAL (#3373), intercepted at the per-arm RECORDING
      layer (relocated into event_loop/ by #3447) so it never feeds the
      fail-streak halt. Corrected ~7-file chain (task_planner rebuilds the
      slice-2 task set over it):
      1. shared/egg_agent/auth_errors.py — add EX_RATE_LIMITED (distinct code,
         e.g. 78) + is_transient_rate_limit_error(text) reusing the throttling
         vocabulary this module already documents as excluded from
         EX_AUTH_FATAL (:24-28/:45-47). Do NOT widen EX_AUTH_FATAL.
      2. shared/egg_agent/__main__.py — return EX_RATE_LIMITED when
         is_transient_rate_limit_error matches, beside the existing
         EX_AUTH_FATAL return (:143); a genuine weekly-cap fatal still wins its
         own match.
      3. orchestrator/kubernetes_spawner/_models.py — map exit_code ==
         EX_RATE_LIMITED -> JOB_OUTCOME_RATE_LIMITED, mirroring the
         EX_AUTH_FATAL==77 -> _FATAL detection (:100) in JobStatusView.
      4. orchestrator/event_loop/__init__.py — add the JOB_OUTCOME_RATE_LIMITED
         constant beside JOB_OUTCOME_FATAL (:147).
      5. orchestrator/event_loop/_loop.py — add a JOB_OUTCOME_RATE_LIMITED
         branch in _observe_jobs (:86-116) dispatching to
         supervisor.record_rate_limited, beside the FATAL -> record_fatal
         branch (:94-101). This is the interception point.
      6. orchestrator/event_loop/_supervisor.py — add record_rate_limited: a
         PACED sibling of record_fatal (:205) that MUST NOT latch
         _alerted_10/_exhausted or increment the abort streak; it records a
         rate-limit-paced state (reset-time-paced when the error carries a
         reset hint, else bounded backoff). This is the concrete AC-C1
         realization ("not abnormal / does not trip the fail-streak halt") —
         the single highest-value test assertion.
      7. orchestrator/supervision_policy.py — hours-scale pacing-window
         constants (distinct from the 30s SUPERVISION_BACKOFF_CAP_SECONDS) +
         the loop-guard fingerprint definition (signature + phase/slice
         progression).
      8. orchestrator/concurrent_executor.py — windowed-retry driver,
         deterministic-loop guard (escalate on identical fingerprint at the
         same point), cq-1 threshold OVERSEER_ALERT, and the landed-slice-
         preserving restart_phase-equivalent wiring. (Old plan anchor
         "JobSupervisor integration (concurrent_executor.py)" predates #3447 —
         this file is now the retry/loop-guard/alert layer, not the recording
         layer.)
      All acceptance criteria AC-C1..C7 and the binding cq-1 resolution are
      UNCHANGED: no hard wall-clock ceiling; reset-time-paced retry when
      present else bounded backoff; an OVERSEER_ALERT fires once cumulative
      wait crosses a threshold (orthogonal to the loop-guard escalation —
      neither is a time-ceiling halt). EX_AUTH_FATAL (incl. weekly caps) and
      ordinary abnormal failures behave exactly as before; the new path fires
      ONLY on the EX_RATE_LIMITED exit code. Heaviest test coverage in the
      pipeline.
    # independent slice — no dependencies
