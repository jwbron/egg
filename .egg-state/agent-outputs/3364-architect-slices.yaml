      PR B — COMPLETE (do not re-derive); add two carry-forward follow-ups: wire the production slice.closed emitter + end-to-end emission test
    goal: |-
      PR B (wait-status --exclude-types/--quiet + slice.closed event) is
      already IMPLEMENTED and pushed: task-1-1/1-3 @ 4fcf1ed7a,
      task-1-2 @ c2a77847a, task-1-4 @ 3593d497c. DO NOT re-run those four
      tasks. Two post-consensus review findings were in flight when the
      operator kicked the phase back to plan (cq-2) and MUST be carried into
      this re-plan as explicit PR B follow-up tasks, not lost:
      (A) WIRE the slice_closed_emitter at the production SliceScheduler
      construction site orchestrator/routes/pipelines/_run_implement.py:86 —
      it is currently default-None, so slice.closed NEVER fires in production
