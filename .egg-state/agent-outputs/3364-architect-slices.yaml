      slice_closed_emitter at that site so record_complete/record_failure
      actually emit onto the event bus.
      (B) Add an INTEGRATION test that constructs SliceScheduler the way
      _run_implement.py:86 does (production _emit_event-backed emitter) or
      drives the _run_implement wiring, and asserts a real record_complete
      emits exactly one slice.closed(complete) and record_failure exactly one
