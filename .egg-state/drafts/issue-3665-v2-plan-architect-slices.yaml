# Recommended slice DAG for issue #3665 — supervision layer second pass.
# Architect RECOMMENDS; task_planner owns the final DAG, ordering, and PR packaging.
#
# CONTEXT: This pipeline implements supervision-layer improvements in a SINGLE-repo
# (egg) pipeline. Standard #3046 FILE-LEVEL overlap rules apply.
#
# CRITICAL FINDING: Commit 6ffe97c8e (tip: 68b185ca) on branch
# issue-3665-supervision-gaps already implements priorities 1-3 (livelock
# detection, timeout visibility, convergence-stall suppression + snapshot
# enrichment). The current working tree does NOT include this commit. The plan
# proposes INTEGRATION with CORRECTIONS, not reimplementation.
#
# The fix commit's livelock detector contradicts resolved HITL decisions:
# - cq-1: must read live session transcript, NOT agent_log_store; must NOT
#   truncate signatures to 80 chars
# - cq-3: recovery must be terminating message + fresh-session respawn, NOT nudge
# - The detector computes a ratio metric but the docstring promises novelty counting
#
# The fix commit's timeout and convergence-stall changes are correct and should
# be integrated as-is.
#
# Slice 1 integrates the fix commit with livelock detector corrections.
# Slice 2 implements alert evidence bundling (priority 4 — NOT in fix commit).
# Slice 3 (tests) is parallel.
slices:
  - id: 1
    name: |-
      Integrate fix commit 6ffe97c8e with livelock detector corrections (priorities 1-3)
    goal: |-
      MERGE commit 6ffe97c8e (tip: 68b185ca) from branch issue-3665-supervision-gaps.
      This commit implements:

      1. Agent livelock / repetition-loop detection (NEEDS CORRECTIONS per cq-1, cq-3):
         - The fix commit's loop_detection.py reads from agent_log_store (pod stdout)
           and truncates signatures to 80 chars. cq-1 rules this out: must read the
           live session transcript at $HOME/.claude/projects/<cwd>/<session>.jsonl
           and key on the full untruncated (tool_name, input) pair.
         - The fix commit computes unique_ratio = len(unique)/len(total) and fires
           at ratio < 0.1. The docstring promises "count of new signatures in the
           trailing window is zero". Must implement novelty counting instead.
         - The fix commit defaults to nudge (requires_adjudication=False). cq-3 rules
           this out: recovery must be terminating message + fresh-session respawn,
           escalating to HITL with the looping input quoted verbatim.
         CORRECTIONS:
         - Replace _get_agent_logs to read live session transcript, not agent_log_store
         - Remove 80-char truncation; key on full (tool_name, input) pair
         - Replace ratio metric with novelty counting (fire at zero new inputs)
         - Change requires_adjudication to True; escalate to HITL with looping input
         - Add WARN tier for monotonic decay below zero threshold

      2. Two-hour timeout visibility (INTEGRATE AS-IS — correct):
         - MODIFY orchestrator/models/_config.py: agent_timeout_seconds field
           (default 7200, ge=60)
         - MODIFY orchestrator/concurrent_executor.py: pass EGG_AGENT_TIMEOUT_SECONDS
           env to the sandbox
         - MODIFY orchestrator/kubernetes_spawner/_spawn.py: pass
           active_deadline_seconds from EGG_AGENT_TIMEOUT_SECONDS to K8s Job
         - MODIFY orchestrator/kubernetes_spawner/_models.py: add
           _failed_with_timeout_sigterm method; classify exit 143 as
           JOB_OUTCOME_LEGITIMATE (not ABNORMAL)
         - MODIFY orchestrator/kubernetes_monitor.py: treat exit 143 as clean
           during RUNNING phase (not just phase transitions)
         - MODIFY sandbox/llm/claude/config.py: read timeout from env var

      3. False convergence-stall suppression + snapshot enrichment (INTEGRATE AS-IS):
         - MODIFY orchestrator/health_monitor.py: add get_agent_activity_ages()
           returning per-agent heartbeat/progress/activity ages
         - MODIFY orchestrator/event_loop/_loop.py: add _has_recent_agent_activity()
           function; call it in _check_convergence_stall before firing to
           suppress alerts for agents with recent activity
         - MODIFY orchestrator/event_loop/__init__.py: bind _has_recent_agent_activity
           onto OrchestratorEventLoop class
         - MODIFY orchestrator/health_checks/detection_plane.py: enrich
           snapshot_from_health_context to populate last_tool_call_age_s and
           last_heartbeat_age_s on RunningAgent entries; register
           detect_heartbeat_stall in _register_coverage_gap_detectors

      4. Tests (included in fix commit, verify pass):
         - orchestrator/tests/test_loop_detection.py (210 lines)
         - orchestrator/tests/test_agent_timeout_config.py (36 lines)
         - orchestrator/tests/test_convergence_stall_suppression.py (127 lines)
         - orchestrator/tests/test_timeout_sigterm.py (148 lines)

      Acceptance: Merge commit 6ffe97c8e applies cleanly; livelock detector
      corrected per cq-1 and cq-3; all 4 test files pass; timeout exit 143
      classified as LEGITIMATE not ABNORMAL; convergence-stall consults
      alive-signal gates; snapshot builder populates age fields;
      detect_heartbeat_stall registered and fires in live path.
    dependencies: none

  - id: 2
    name: |-
      Alert evidence bundling (priority 4 — NOT in fix commit)
    goal: |-
      MODIFY orchestrator/concurrent_executor.py:
      - Enrich _emit_supervision_alert (line 1064) to include structured
        evidence in the OVERSEER_ALERT metadata:
        - latest_heartbeat_age_s: seconds since the agent's last heartbeat
        - latest_tool_call_age_s: seconds since the agent's last tool call
        - last_progress_event: the agent's last progress event data
        - blocking_agents: current BRC blocking set
        - consensus_state: the BRC consensus status dict
        - container_logs_tail: last N lines of container logs (already
          fetched by _query_container_logs in the overseer, just include
          in payload)
      - The enrichment is additive — new metadata fields. Existing consumers
        that read only the existing fields continue to work.

      Acceptance: OVERSEER_ALERT payloads carry structured evidence; unit
      tests verify the metadata enrichment; existing consumers unaffected.
    dependencies:
      - 1

  - id: 3
    name: |-
      Verify integrated tests + add corpus rows
    goal: |-
      VERIFY: All 4 test files from the fix commit pass with the corrected
      livelock detector:
      - test_loop_detection.py: livelock detector unit tests (must pass
        with novelty-counting detector, not ratio-based)
      - test_agent_timeout_config.py: config field tests
      - test_convergence_stall_suppression.py: suppression tests
      - test_timeout_sigterm.py: SIGTERM classification tests

      ADD: Corpus rows to orchestrator/tests/overseer_calibration/fixtures.json
      for agent_livelock detector (both polarities: livelock detected +
      normal activity not flagged). Check if the fix commit already includes
      these; if not, add them with the corrected novelty-counting semantics.

      Acceptance: All tests pass; corpus rows follow existing format;
      livelock detector has both polarities in corpus.
    dependencies: none
    parallel: true
