name: "egg: Address Review Feedback"

# Trigger when the review bot posts feedback on a PR, or when a human @mentions
# the bot in a PR comment.
#
# Handles three cases:
# - pull_request_review: formal review posted via gh pr review
# - issue_comment (bot): self-review posted as comment (GitHub blocks bots from
#   reviewing their own PRs via the Reviews API)
# - issue_comment (human): human @mentions the bot on a bot-authored or authorized-user-authored PR
on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to address feedback for'
        required: true
        type: number
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to address feedback for'
        required: true
        type: number
      bot_username:
        description: 'GitHub username of the bot (for comment filtering and authorship checks)'
        required: false
        type: string
      branch_prefix:
        description: 'Branch prefix for the bot (e.g., egg)'
        required: false
        type: string
      action_ref:
        description: 'Reference to egg action (owner/repo/path@ref format). NOTE: GitHub Actions uses: field cannot be dynamic - consuming repos must hardcode their action reference in the uses step below.'
        required: false
        type: string
        default: "jwbron/egg/action@main"
      authorized_users:
        description: 'Comma-separated list of GitHub usernames authorized to trigger the bot (via review or @mention)'
        required: false
        type: string
        default: "jwbron"
      reviewer_username:
        description: 'GitHub username of the reviewer bot (for review trigger detection)'
        required: false
        type: string
        default: ""
      max_feedback_rounds:
        description: 'Maximum number of feedback-addressing rounds before requiring human intervention'
        required: false
        type: number
        default: 3
      prompt_script:
        description: 'Path to prompt builder script (relative to repo root)'
        required: false
        type: string
        default: "action/build-feedback-prompt.sh"
      timeout:
        description: 'Timeout in minutes'
        required: false
        type: string
        default: "20"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true
      REVIEWER_APP_ID:
        required: false
      REVIEWER_APP_PRIVATE_KEY:
        required: false
      REVIEWER_APP_INSTALLATION_ID:
        required: false

jobs:
  # Validate required configuration for event-triggered runs
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_call' && github.event_name != 'workflow_dispatch'
    steps:
      - name: Validate required repository variables
        run: |
          if [[ -z "${{ vars.EGG_BOT_USERNAME }}" ]]; then
            echo "::error::Required repository variable 'EGG_BOT_USERNAME' is not set"
            echo "::error::Set it in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "All required repository variables are configured"

  # Workaround: GitHub Actions doesn't allow accessing inputs in job-level 'if' conditions.
  # This job passes inputs as outputs so subsequent jobs can use them in conditions.
  resolve-inputs:
    name: Resolve Inputs
    needs: [validate-config]
    if: always() && (needs.validate-config.result == 'success' || needs.validate-config.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      bot_username: ${{ steps.resolve.outputs.bot_username }}
      branch_prefix: ${{ steps.resolve.outputs.branch_prefix }}
      reviewer_username: ${{ steps.resolve.outputs.reviewer_username }}
      authorized_users: ${{ steps.resolve.outputs.authorized_users }}
      max_feedback_rounds: ${{ steps.resolve.outputs.max_feedback_rounds }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      should_check_trigger: ${{ steps.resolve.outputs.should_check_trigger }}
    steps:
      - name: Resolve inputs with defaults
        id: resolve
        run: |
          # Use inputs if called as reusable workflow, otherwise use repository variables
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            echo "bot_username=${{ inputs.bot_username }}" >> "$GITHUB_OUTPUT"
            echo "branch_prefix=${{ inputs.branch_prefix }}" >> "$GITHUB_OUTPUT"
            echo "reviewer_username=${{ inputs.reviewer_username || '' }}" >> "$GITHUB_OUTPUT"
            echo "authorized_users=${{ inputs.authorized_users || 'jwbron' }}" >> "$GITHUB_OUTPUT"
          else
            echo "bot_username=${{ vars.EGG_BOT_USERNAME }}" >> "$GITHUB_OUTPUT"
            echo "branch_prefix=${{ vars.EGG_BRANCH_PREFIX }}" >> "$GITHUB_OUTPUT"
            echo "reviewer_username=${{ vars.EGG_REVIEWER_USERNAME || '' }}" >> "$GITHUB_OUTPUT"
            echo "authorized_users=${{ vars.EGG_AUTHORIZED_USERS || 'jwbron' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "max_feedback_rounds=${{ inputs.max_feedback_rounds || '3' }}" >> "$GITHUB_OUTPUT"

          # Determine PR number based on event type
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            echo "pr_number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "should_check_trigger=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "should_check_trigger=false" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=${{ github.event.pull_request.number || github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "should_check_trigger=true" >> "$GITHUB_OUTPUT"
          fi

  # For event-triggered runs, check if the trigger matches our bot
  check-trigger:
    name: Check Trigger
    needs: resolve-inputs
    if: needs.resolve-inputs.outputs.should_check_trigger == 'true'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      trigger_type: ${{ steps.check.outputs.trigger_type }}
    steps:
      - name: Check if triggered by our bot or reviewer
        id: check
        env:
          BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
          REVIEWER_USERNAME: ${{ needs.resolve-inputs.outputs.reviewer_username }}
          AUTHORIZED_USERS: ${{ needs.resolve-inputs.outputs.authorized_users }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_USER: ${{ github.event.review.user.login }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_STATE: ${{ github.event.review.state }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Helper function to check if user matches bot or reviewer
          is_review_bot() {
            local user="$1"
            [[ "$user" == "$BOT_USERNAME" || "$user" == "${BOT_USERNAME}[bot]" ]] && return 0
            [[ -n "$REVIEWER_USERNAME" && ("$user" == "$REVIEWER_USERNAME" || "$user" == "${REVIEWER_USERNAME}[bot]") ]] && return 0
            return 1
          }

          # Helper: check if the PR was authored by our bot
          is_bot_authored_pr() {
            [[ "$PR_AUTHOR" == "$BOT_USERNAME" || "$PR_AUTHOR" == "${BOT_USERNAME}[bot]" ]]
          }

          # Helper: check if a user is in the authorized_users list (comma-separated)
          is_authorized_user() {
            local user="$1"
            local IFS=','
            for authorized in $AUTHORIZED_USERS; do
              # Trim whitespace
              authorized=$(echo "$authorized" | xargs)
              [[ "$user" == "$authorized" ]] && return 0
            done
            return 1
          }

          # For pull_request_review events
          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            # Case 1: Automated review (bot/reviewer with marker)
            # Trigger unless it's a clean approve (no suggestions)
            if is_review_bot "$REVIEW_USER" && \
               [[ "$REVIEW_BODY" == *"egg-automated-review"* ]] && \
               [[ "$REVIEW_STATE" != "approved" || "$REVIEW_BODY" == *"verdict=approve-with-suggestions"* ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "trigger_type=review" >> "$GITHUB_OUTPUT"
            # Case 2: Human review on bot-authored or authorized-user-authored PR
            # Trigger for non-approvals (changes_requested, commented) from authorized users only.
            # Note: Human approvals with suggestions won't trigger because humans
            # don't add the verdict=approve-with-suggestions marker. This is an
            # accepted limitation - non-blocking suggestions in human approvals
            # are considered optional and don't require automated follow-up.
            elif ! is_review_bot "$REVIEW_USER" && is_authorized_user "$REVIEW_USER" && \
               (is_bot_authored_pr || is_authorized_user "$PR_AUTHOR") && \
               [[ "$REVIEW_STATE" != "approved" ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "trigger_type=review" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          # For issue_comment events
          elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
            # Extract verdict using regex to distinguish approve from approve-with-suggestions
            comment_verdict=""
            if [[ "$COMMENT_BODY" =~ verdict=([a-z-]+) ]]; then
              comment_verdict="${BASH_REMATCH[1]}"
            fi
            # Case 3: Self-review as comment (GitHub blocks bots from reviewing own PRs)
            if is_review_bot "$COMMENT_USER" && \
               [[ "$IS_PR" == "true" && \
                  "$COMMENT_BODY" == *"egg-automated-review"* && \
                  "$comment_verdict" != "approve" ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "trigger_type=review" >> "$GITHUB_OUTPUT"
            # Case 4: Human @mentions the bot in a PR comment
            # Only authorized users can trigger via @mention.
            # The should-run step validates PR authorship; this just checks the mention.
            # Use regex with leading and trailing boundaries to avoid matching
            # substrings like @egg-bot-staging or email-like foo@egg-bot
            elif ! is_review_bot "$COMMENT_USER" && is_authorized_user "$COMMENT_USER" && \
               [[ "$IS_PR" == "true" ]] && \
               [[ "$COMMENT_BODY" =~ (^|[[:space:]]|[^a-zA-Z0-9_])@${BOT_USERNAME}($|[^a-zA-Z0-9_-]) ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "trigger_type=mention" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  address-feedback:
    name: Address Review Feedback
    needs: [resolve-inputs, check-trigger]
    runs-on: ubuntu-latest
    # Run when:
    # - workflow_call or workflow_dispatch (should_check_trigger=false means check-trigger was skipped)
    # - Event-triggered and check-trigger passed
    if: >-
      always() &&
      needs.resolve-inputs.result == 'success' &&
      (needs.check-trigger.result == 'skipped' || needs.check-trigger.outputs.should_run == 'true')

    permissions:
      contents: write
      pull-requests: write
      actions: read

    concurrency:
      group: egg-feedback-${{ needs.resolve-inputs.outputs.pr_number }}
      cancel-in-progress: true

    env:
      PR_NUMBER: ${{ needs.resolve-inputs.outputs.pr_number }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      BRANCH_PREFIX: ${{ needs.resolve-inputs.outputs.branch_prefix }}
      MAX_FEEDBACK_ROUNDS: ${{ needs.resolve-inputs.outputs.max_feedback_rounds }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Fetch PR metadata
        id: pr-meta
        run: |
          set -euo pipefail
          pr_json=$(gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }})
          {
            echo "head-ref=$(echo "$pr_json" | jq -r '.head.ref')"
            echo "head-repo=$(echo "$pr_json" | jq -r '.head.repo.full_name')"
            echo "title=$(echo "$pr_json" | jq -r '.title')"
            echo "author=$(echo "$pr_json" | jq -r '.user.login')"
            echo "state=$(echo "$pr_json" | jq -r '.state')"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Check if feedback should be addressed
        id: should-run
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_AUTHOR: ${{ steps.pr-meta.outputs.author }}
          PR_STATE: ${{ steps.pr-meta.outputs.state }}
          PR_TITLE: ${{ steps.pr-meta.outputs.title }}
          HEAD_REPO: ${{ steps.pr-meta.outputs.head-repo }}
          EVENT_NAME: ${{ github.event_name }}
          AUTHORIZED_USERS: ${{ needs.resolve-inputs.outputs.authorized_users }}
        run: |
          set -euo pipefail

          # Helper: check if a user is in the authorized_users list (comma-separated)
          is_authorized_user() {
            local user="$1"
            local IFS=','
            for authorized in $AUTHORIZED_USERS; do
              authorized=$(echo "$authorized" | xargs)
              [[ "$user" == "$authorized" ]] && return 0
            done
            return 1
          }

          # Only address feedback on open PRs
          if [[ "$PR_STATE" != "open" ]]; then
            echo "PR is $PR_STATE, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip fork PRs — bot can't push to forks
          if [[ "$HEAD_REPO" != "${{ github.repository }}" ]]; then
            echo "PR is from a fork ($HEAD_REPO), skipping — bot cannot push to forks"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For workflow_dispatch or workflow_call, skip remaining filters.
          # NOTE: This is intentional for debugging — allows manual trigger on any PR.
          # The bot-author check, skip-review check, and iteration limit are bypassed.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "workflow_call" ]]; then
            echo "Manual/reusable trigger — bypassing remaining filters"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only address feedback on bot-authored or authorized-user-authored PRs
          if [[ "$PR_AUTHOR" != "$EGG_BOT_USERNAME" && "$PR_AUTHOR" != "${EGG_BOT_USERNAME}[bot]" ]] && ! is_authorized_user "$PR_AUTHOR"; then
            echo "PR author '$PR_AUTHOR' is not the bot or an authorized user, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if [skip-review] in title
          if [[ "$PR_TITLE" == *"[skip-review]"* ]]; then
            echo "PR has [skip-review] marker, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # NOTE: Approval checks are handled at job level to avoid spinning up
          # runners for approvals. See job-level 'if' condition.

          # Check iteration count - prevent infinite feedback loops.
          # Count is checked before posting this run's marker, so it reflects
          # completed previous rounds. With -ge, exactly MAX_FEEDBACK_ROUNDS
          # rounds execute (at counts 0..MAX-1), and the next trigger is blocked.
          #
          # NOTE: There is a small race window between reading the count and posting
          # the marker comment. Two concurrent runs could both read the same count
          # and proceed. The concurrency group (cancel-in-progress: true) mitigates
          # this for most cases, but a brief window remains. This is acceptable since
          # the worst case is one extra round, and the human notification still fires.
          #
          # Uses --paginate to handle PRs with >30 comments. The --slurp combines
          # paginated results into a nested array, hence the .[][] in jq.
          feedback_count=$(gh api "repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/comments" \
            --paginate --slurp \
            --jq '[.[][] | select(.body | test("egg-feedback-addressing"))] | length' 2>/dev/null || echo "0")

          echo "Found $feedback_count previous feedback-addressing run(s)"

          if [[ "$feedback_count" -ge "$MAX_FEEDBACK_ROUNDS" ]]; then
            echo "Max feedback rounds ($MAX_FEEDBACK_ROUNDS) reached, notifying human"
            echo "run=false" >> "$GITHUB_OUTPUT"
            gh api "repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/comments" \
              -f body="Automated feedback loop has reached the maximum of $MAX_FEEDBACK_ROUNDS rounds. Human review is needed to make further progress on this PR."
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      # Wait for all reviewer checks to complete before addressing feedback.
      # This ensures we don't run multiple times when multiple reviewers trigger concurrently.
      - name: Wait for all reviewer checks to complete
        id: wait-for-reviewers
        if: steps.should-run.outputs.run == 'true' && needs.check-trigger.outputs.trigger_type != 'mention'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Get the HEAD SHA for this PR
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}" --jq '.head.sha')
          echo "Waiting for reviewer checks on commit: ${HEAD_SHA}"

          # Maximum wait time (10 minutes)
          MAX_WAIT_SECONDS=600
          POLL_INTERVAL=15
          start_time=$(date +%s)
          no_reviewers_count=0
          # After 2 minutes with no reviewer checks, assume none exist and proceed
          MAX_NO_REVIEWERS_ITERATIONS=8

          while true; do
            elapsed=$(( $(date +%s) - start_time ))
            if [[ $elapsed -ge $MAX_WAIT_SECONDS ]]; then
              echo "::warning::Timeout waiting for reviewer checks after ${MAX_WAIT_SECONDS} seconds — proceeding with feedback"
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Get all check runs matching egg-reviewer-* pattern
            reviewer_checks=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
              --jq '.check_runs | [.[] | select(.name | test("egg-reviewer-")) | {name: .name, status: .status, conclusion: .conclusion}]')

            total=$(echo "$reviewer_checks" | jq 'length')

            # Handle case where no reviewer checks exist
            if [[ "$total" -eq 0 ]]; then
              no_reviewers_count=$((no_reviewers_count + 1))
              if [[ $no_reviewers_count -ge $MAX_NO_REVIEWERS_ITERATIONS ]]; then
                echo "::warning::No egg-reviewer-* checks found but workflow was triggered by feedback. Check reviewer naming patterns."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                echo "reason=no_reviewers" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "No reviewer checks yet (poll ${no_reviewers_count}/${MAX_NO_REVIEWERS_ITERATIONS})"
              sleep "$POLL_INTERVAL"
              continue
            fi
            no_reviewers_count=0

            completed=$(echo "$reviewer_checks" | jq '[.[] | select(.status == "completed")] | length')
            pending_names=$(echo "$reviewer_checks" | jq -r '[.[] | select(.status != "completed") | .name] | join(", ")')

            echo "Reviewer checks: ${completed}/${total} completed"

            if [[ "$completed" -eq "$total" ]]; then
              echo "All ${total} reviewer check(s) completed"
              echo "$reviewer_checks" | jq -r '.[] | "  \(.name): \(.conclusion)"'
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Waiting for: ${pending_names}"
            sleep "$POLL_INTERVAL"
          done

      # Compute a single proceed flag to avoid repeating the long condition
      # on every downstream step. Mentions skip wait-for-reviewers, so we
      # also proceed when trigger_type is 'mention'.
      - name: Compute should-proceed
        id: should-proceed
        if: steps.should-run.outputs.run == 'true'
        run: |
          if [[ "${{ steps.wait-for-reviewers.outputs.proceed }}" == "true" || \
                "${{ needs.check-trigger.outputs.trigger_type }}" == "mention" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Minimize previous feedback status comments to reduce clutter
      # Uses semantic marker instead of content patterns per #363
      - name: Minimize previous feedback comments
        id: minimize
        if: steps.should-proceed.outputs.ok == 'true'
        run: |
          set -euo pipefail
          HIDDEN_COUNT=0
          # Use process substitution to avoid subshell variable scope issues
          while read -r node_id; do
            # shellcheck disable=SC2016 # $id is a GraphQL variable, not bash
            if gh api graphql -f query='
              mutation($id: ID!) {
                minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                  minimizedComment { isMinimized }
                }
              }
            ' -f id="$node_id"; then
              HIDDEN_COUNT=$((HIDDEN_COUNT + 1))
            else
              echo "Warning: Failed to minimize comment $node_id (may lack permissions)"
            fi
          done < <(gh api "repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/comments" \
            --jq ".[] | select(.user.login == \"$EGG_BOT_USERNAME\" or .user.login == \"${EGG_BOT_USERNAME}[bot]\") | select(.body | contains(\"<!-- egg-status-comment -->\")) | .node_id")
          echo "hidden_count=${HIDDEN_COUNT}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      # Post acknowledgment comment with marker for iteration tracking
      - name: Post starting comment
        if: steps.should-proceed.outputs.ok == 'true'
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/comments" \
            -f body="<!-- egg-status-comment --><!-- egg-feedback-addressing -->egg is addressing review feedback..."
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      # SECURITY: Build prompt from main (trusted) checkout before checking out PR branch.
      # This prevents malicious PRs from injecting content via .egg/feedback-rules.md.
      # The agent will check out the PR branch itself after the prompt is built.
      - name: Checkout main (trusted)
        if: steps.should-proceed.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build feedback prompt
        if: steps.should-proceed.outputs.ok == 'true'
        id: prompt
        run: bash ${{ inputs.prompt_script || 'action/build-feedback-prompt.sh' }}
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          EGG_BOT_USERNAME: ${{ env.EGG_BOT_USERNAME }}
          REVIEWER_USERNAME: ${{ needs.resolve-inputs.outputs.reviewer_username }}
          AUTHORIZED_USERS: ${{ needs.resolve-inputs.outputs.authorized_users }}

      - name: Checkout PR branch
        if: steps.should-proceed.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr-meta.outputs.head-repo }}
          ref: ${{ steps.pr-meta.outputs.head-ref }}
          persist-credentials: false

      - name: Run egg to address feedback
        if: steps.should-proceed.outputs.ok == 'true'
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          model: ${{ steps.prompt.outputs.model }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.EGG_BOT_USERNAME }}
          bot-branch-prefix: ${{ env.BRANCH_PREFIX }}
          checkpoint-repo: ${{ vars.EGG_CHECKPOINT_REPO || '' }}
          timeout: ${{ inputs.timeout || '20' }}
        env:
          EGG_BOT_NAME: feedback

      - name: Post result comment
        if: always() && !cancelled() && steps.should-proceed.outputs.ok == 'true'
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          HIDDEN_COUNT="${{ steps.minimize.outputs.hidden_count }}"
          HIDDEN_COUNT="${HIDDEN_COUNT:-0}"

          # Build hidden count suffix
          HIDDEN_MSG=""
          if [[ "$HIDDEN_COUNT" -gt 0 ]]; then
            HIDDEN_MSG="

          *${HIDDEN_COUNT} previous review(s) hidden.*"
          fi

          if [[ "${{ steps.egg.outcome }}" == "success" ]]; then
            BODY="<!-- egg-status-comment -->
          egg feedback addressed. [View run logs](${RUN_URL})${HIDDEN_MSG}"
          elif [[ "${{ steps.egg.outcome }}" == "failure" ]]; then
            BODY="<!-- egg-status-comment -->
          egg failed to address feedback. [View run logs](${RUN_URL})${HIDDEN_MSG}"
          else
            BODY="<!-- egg-status-comment -->
          Workflow failed before running egg. [View run logs](${RUN_URL})${HIDDEN_MSG}"
          fi

          # Strip leading whitespace from each line (caused by YAML indentation)
          # shellcheck disable=SC2001 # sed is needed for regex-based multiline substitution
          BODY=$(echo "$BODY" | sed 's/^[[:space:]]*//')
          gh api "repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/comments" -f body="$BODY"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
