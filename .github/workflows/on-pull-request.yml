name: "egg: Code Review"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    # Skip draft PRs and PRs with [skip-review] in title
    # For workflow_dispatch, always run (manual trigger implies intent)
    if: >-
      github.event_name == 'workflow_dispatch' || (
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.title, '[skip-review]')
      )

    permissions:
      contents: read
      pull-requests: write

    concurrency:
      group: egg-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      cancel-in-progress: true

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # For workflow_dispatch, fetch PR metadata via API since
      # github.event.pull_request is not available
      - name: Fetch PR metadata
        if: github.event_name == 'workflow_dispatch'
        id: pr-meta
        run: |
          pr_json=$(gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }})
          echo "head-ref=$(echo "$pr_json" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "head-repo=$(echo "$pr_json" | jq -r '.head.repo.full_name')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      # Dismiss previous bot reviews before starting new review
      - name: Dismiss previous bot reviews
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews" \
            --jq '[.[] | select(.user.login == "james-in-a-box" or .user.login == "james-in-a-box[bot]") | select(.state | test("PENDING|COMMENTED|CHANGES_REQUESTED"))] | .[].id' \
          | while read -r id; do
              gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews/$id/dismissals" \
                -X PUT -f message="Superseded by new review" || true
            done
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      # SECURITY: Build the review prompt from a trusted checkout (main).
      # A malicious PR could replace build-review-prompt-v2.sh to exfiltrate
      # the bot token. By checking out main for prompt building, we ensure
      # untrusted code never runs with secrets.
      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build review prompt
        id: prompt
        run: bash action/build-review-prompt-v2.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ env.PR_NUMBER }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || steps.pr-meta.outputs.head-repo }}
          ref: ${{ github.event.pull_request.head.ref || steps.pr-meta.outputs.head-ref }}
          persist-credentials: false

      - name: Run egg review
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          model: ${{ steps.prompt.outputs.model }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: james-in-a-box
          timeout: "10"

      - name: Post status comment
        if: always()
        run: |
          if [[ "${{ steps.egg.outcome }}" == "success" ]]; then
            BODY="egg review completed. [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            BODY="egg review failed. [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          gh pr comment "${{ env.PR_NUMBER }}" --body "$BODY"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
