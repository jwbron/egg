name: "egg: Code Review"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      authorized_users:
        description: 'Comma-separated list of authorized GitHub usernames'
        required: false
        type: string
        default: "jwbron"
  workflow_call:
    inputs:
      authorized_users:
        description: 'Comma-separated list of authorized GitHub usernames'
        required: false
        type: string
        default: "jwbron"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true

jobs:
  # Validate required configuration
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Validate required repository variables
        run: |
          if [[ -z "${{ vars.EGG_BOT_USERNAME }}" ]]; then
            echo "::error::Required repository variable 'EGG_BOT_USERNAME' is not set"
            echo "::error::Set it in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "All required repository variables are configured"

  # Check if PR author is authorized to trigger reviews
  check-author:
    name: Check authorization
    runs-on: ubuntu-latest
    # Only check for pull_request events; workflow_dispatch is explicit invocation
    if: github.event_name == 'pull_request'
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Check if PR author is authorized
        id: check
        env:
          SENDER_LOGIN: ${{ github.event.pull_request.user.login }}
          AUTHORIZED_USERS: ${{ inputs.authorized_users || 'jwbron' }}
          BOT_USERNAME: ${{ vars.EGG_BOT_USERNAME }}
        run: bash .github/scripts/check-authorization.sh

      - name: Log authorization result
        if: steps.check.outputs.authorized != 'true'
        run: |
          echo "::warning::PR author '${{ github.event.pull_request.user.login }}' is not authorized to trigger automated reviews"
          echo "Authorized users: ${{ inputs.authorized_users || 'jwbron' }}"

  review:
    name: egg-review / Code
    needs: [validate-config, check-author]
    # Run review if:
    # - validate-config passed, AND
    # - check-author was skipped (workflow_dispatch) OR check-author passed and user is authorized
    if: >-
      always() &&
      needs.validate-config.result == 'success' &&
      (needs.check-author.result == 'skipped' || needs.check-author.outputs.authorized == 'true')
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-review.yml
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      bot_name: review
      bot_username: ${{ vars.EGG_BOT_USERNAME }}
      branch_prefix: ${{ vars.EGG_BRANCH_PREFIX }}
      # action_ref: jwbron/egg/action@main  # Cannot be passed dynamically; hardcoded in reusable workflow
      timeout: "10"
      pr_title: ${{ github.event.pull_request.title || '' }}
      event_name: ${{ github.event_name }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      BOT_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
