name: "egg: Code Review"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    # Skip draft PRs and PRs with [skip-review] in title
    # For workflow_dispatch, always run (manual trigger implies intent)
    if: >-
      github.event_name == 'workflow_dispatch' || (
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.title, '[skip-review]')
      )

    permissions:
      contents: read
      pull-requests: write

    concurrency:
      group: egg-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      cancel-in-progress: true

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      BOT_USERNAME: james-in-a-box

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # For workflow_dispatch, fetch PR metadata via API since
      # github.event.pull_request is not available
      - name: Fetch PR metadata
        if: github.event_name == 'workflow_dispatch'
        id: pr-meta
        run: |
          pr_json=$(gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }})
          echo "head-ref=$(echo "$pr_json" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "head-repo=$(echo "$pr_json" | jq -r '.head.repo.full_name')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      # Capture last bot review info before dismissing (for re-review context)
      # The bot may post reviews via the Reviews API (normal PRs) or as issue
      # comments (self-reviews, where GitHub blocks bots from reviewing their
      # own PRs). We check both sources and use the most recent.
      - name: Get last review info
        id: last-review
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          # Get the most recent bot review from the Reviews API
          # This works for reviews on PRs the bot didn't author
          last_review=$(gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews" \
            --jq --arg bot "$BOT_USERNAME" \
            '[.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]"))] | sort_by(.submitted_at) | last')

          review_commit=""
          review_time=""
          if [[ -n "$last_review" && "$last_review" != "null" ]]; then
            review_commit=$(echo "$last_review" | jq -r '.commit_id')
            review_time=$(echo "$last_review" | jq -r '.submitted_at')
            echo "Found review API entry at commit $review_commit"
          fi

          # Also check issue comments for self-reviews (when bot reviews its own PR)
          # We identify review comments by the signature "— Authored by egg"
          # and exclude status comments like "egg review completed/failed"
          last_comment=$(gh api "repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/comments" \
            --jq --arg bot "$BOT_USERNAME" \
            '[.[] | select(
              (.user.login == $bot or .user.login == ($bot + "[bot]")) and
              (.body | test("— Authored by egg$")) and
              (.body | test("^egg review (completed|failed)") | not)
            )] | sort_by(.created_at) | last')

          comment_time=""
          if [[ -n "$last_comment" && "$last_comment" != "null" ]]; then
            comment_time=$(echo "$last_comment" | jq -r '.created_at')
            echo "Found review comment at $comment_time"
          fi

          # Use whichever is more recent (review or comment)
          # For comments, we need to look up the commit SHA at that time
          if [[ -n "$review_commit" && -z "$comment_time" ]]; then
            # Only have review API result
            echo "commit-sha=$review_commit" >> "$GITHUB_OUTPUT"
            echo "Using review API result"
          elif [[ -z "$review_commit" && -n "$comment_time" ]]; then
            # Only have comment result - need to find commit at that time
            # Get commits up to that timestamp and take the most recent
            commit_sha=$(gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/commits" \
              --jq --arg ts "$comment_time" \
              '[.[] | select(.commit.committer.date <= $ts)] | last | .sha')
            if [[ -n "$commit_sha" && "$commit_sha" != "null" ]]; then
              echo "commit-sha=$commit_sha" >> "$GITHUB_OUTPUT"
              echo "Using comment result, resolved to commit $commit_sha"
            else
              echo "commit-sha=" >> "$GITHUB_OUTPUT"
              echo "Could not resolve comment to commit"
            fi
          elif [[ -n "$review_commit" && -n "$comment_time" ]]; then
            # Have both - compare timestamps
            if [[ "$comment_time" > "$review_time" ]]; then
              # Comment is newer
              commit_sha=$(gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/commits" \
                --jq --arg ts "$comment_time" \
                '[.[] | select(.commit.committer.date <= $ts)] | last | .sha')
              if [[ -n "$commit_sha" && "$commit_sha" != "null" ]]; then
                echo "commit-sha=$commit_sha" >> "$GITHUB_OUTPUT"
                echo "Using comment result (newer), resolved to commit $commit_sha"
              else
                echo "commit-sha=$review_commit" >> "$GITHUB_OUTPUT"
                echo "Comment newer but couldn't resolve, falling back to review"
              fi
            else
              # Review is newer or same time
              echo "commit-sha=$review_commit" >> "$GITHUB_OUTPUT"
              echo "Using review API result (newer or same)"
            fi
          else
            echo "commit-sha=" >> "$GITHUB_OUTPUT"
            echo "No previous bot review found"
          fi

      # Dismiss previous bot reviews before starting new review
      - name: Dismiss previous bot reviews
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews" \
            --jq --arg bot "$BOT_USERNAME" \
            '[.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.state | test("PENDING|COMMENTED|CHANGES_REQUESTED"))] | .[].id' \
          | while read -r id; do
              gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews/$id/dismissals" \
                -X PUT -f message="Superseded by new review" || true
            done

      # SECURITY: Build the review prompt from a trusted checkout (main).
      # A malicious PR could replace build-review-prompt.sh to exfiltrate
      # the bot token. By checking out main for prompt building, we ensure
      # untrusted code never runs with secrets.
      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build review prompt
        id: prompt
        run: bash action/build-review-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          LAST_REVIEW_COMMIT: ${{ steps.last-review.outputs.commit-sha }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || steps.pr-meta.outputs.head-repo }}
          ref: ${{ github.event.pull_request.head.ref || steps.pr-meta.outputs.head-ref }}
          persist-credentials: false

      - name: Run egg review
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          model: ${{ steps.prompt.outputs.model }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: "10"

      - name: Post status comment
        if: always()
        run: |
          if [[ "${{ steps.egg.outcome }}" == "success" ]]; then
            BODY="egg review completed. [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            BODY="egg review failed. [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          gh pr comment "${{ env.PR_NUMBER }}" --body "$BODY"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
