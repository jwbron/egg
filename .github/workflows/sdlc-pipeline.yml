name: "egg: SDLC Pipeline"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to process'
        required: true
        type: number
      starting_phase:
        description: 'Pipeline phase to start from'
        required: false
        type: choice
        options:
          - refine
          - plan
          - implement
          - pr
        default: refine
  issues:
    types: [labeled]
  workflow_call:
    inputs:
      issue_number:
        description: 'GitHub issue number to process'
        required: true
        type: number
      starting_phase:
        description: 'Pipeline phase to start from'
        required: false
        type: string
        default: "refine"
      bot_username:
        description: 'GitHub username of the bot (for git identity and comment filtering)'
        required: false
        type: string
      action_ref:
        description: 'Reference to egg action (owner/repo/path@ref format). NOTE: GitHub Actions uses: field cannot be dynamic - consuming repos must hardcode their action reference in the uses step below.'
        required: false
        type: string
        default: "jwbron/egg/action@main"
      authorized_users:
        description: 'Comma-separated list of authorized GitHub usernames'
        required: false
        type: string
        default: "jwbron"
      branch_prefix:
        description: 'Prefix for issue branches (e.g., "my-bot" creates "my-bot/issue-N")'
        required: false
        type: string
      sdlc_label:
        description: 'Label that triggers the SDLC pipeline'
        required: false
        type: string
        default: "egg-sdlc"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

# Prevent concurrent pipeline runs for the same issue
concurrency:
  group: sdlc-pipeline-${{ github.event.inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Validate required configuration for event-triggered runs
  # ============================================================
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    # Only validate for event-triggered runs (not workflow_call where caller provides config)
    if: github.event_name != 'workflow_call'
    steps:
      - name: Validate required repository variables
        run: |
          missing_vars=()
          if [[ -z "${{ vars.EGG_BOT_USERNAME }}" ]]; then
            missing_vars+=("EGG_BOT_USERNAME")
          fi
          if [[ -z "${{ vars.EGG_BRANCH_PREFIX }}" ]]; then
            missing_vars+=("EGG_BRANCH_PREFIX")
          fi

          if [[ ${#missing_vars[@]} -gt 0 ]]; then
            echo "::error::Required repository variable(s) not set: ${missing_vars[*]}"
            echo "::error::Set these in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "All required repository variables are configured"

  # ============================================================
  # Resolve inputs for reusable workflow support
  # ============================================================
  resolve-inputs:
    name: Resolve inputs
    needs: [validate-config]
    # Run if validate-config succeeded OR was skipped (workflow_call)
    if: always() && (needs.validate-config.result == 'success' || needs.validate-config.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      bot_username: ${{ steps.resolve.outputs.bot_username }}
      branch_prefix: ${{ steps.resolve.outputs.branch_prefix }}
      sdlc_label: ${{ steps.resolve.outputs.sdlc_label }}
      issue_number: ${{ steps.resolve.outputs.issue_number }}
      starting_phase: ${{ steps.resolve.outputs.starting_phase }}
    steps:
      - name: Resolve inputs with defaults
        id: resolve
        run: |
          # Use inputs if called as reusable workflow, otherwise use repository variables
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            {
              echo "bot_username=${{ inputs.bot_username }}"
              echo "branch_prefix=${{ inputs.branch_prefix }}"
              echo "sdlc_label=${{ inputs.sdlc_label || 'egg-sdlc' }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "bot_username=${{ vars.EGG_BOT_USERNAME }}"
              echo "branch_prefix=${{ vars.EGG_BRANCH_PREFIX }}"
              echo "sdlc_label=${{ inputs.sdlc_label || 'egg-sdlc' }}"
            } >> "$GITHUB_OUTPUT"
          fi

          # Determine issue number and starting phase based on trigger type
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            {
              echo "issue_number=${{ inputs.issue_number }}"
              echo "starting_phase=${{ inputs.starting_phase || 'refine' }}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            {
              echo "issue_number=${{ github.event.inputs.issue_number }}"
              echo "starting_phase=${{ github.event.inputs.starting_phase || 'refine' }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "issue_number=${{ github.event.issue.number }}"
              echo "starting_phase=refine"
            } >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # Initialization: Create contract and branch
  # ============================================================
  init:
    name: Initialize pipeline
    needs: resolve-inputs
    runs-on: ubuntu-latest
    # Only trigger on sdlc:refine label, workflow_dispatch, or workflow_call
    if: >-
      always() &&
      needs.resolve-inputs.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'workflow_call') ||
        (github.event_name == 'issues' && github.event.label.name == 'sdlc:refine')
      )
    outputs:
      issue_number: ${{ steps.setup.outputs.issue_number }}
      issue_title: ${{ steps.setup.outputs.issue_title }}
      branch_name: ${{ steps.setup.outputs.branch_name }}
      current_phase: ${{ steps.setup.outputs.current_phase }}
      contract_exists: ${{ steps.setup.outputs.contract_exists }}
      workflow_owner: ${{ steps.setup.outputs.workflow_owner }}
      pr_number: ${{ steps.setup.outputs.pr_number }}

    env:
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      BRANCH_PREFIX: ${{ needs.resolve-inputs.outputs.branch_prefix }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install pydantic==2.10.* pyyaml==6.0.*

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${EGG_BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${EGG_BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Setup pipeline
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER_INPUT: ${{ needs.resolve-inputs.outputs.issue_number }}
          STARTING_PHASE: ${{ needs.resolve-inputs.outputs.starting_phase }}
          EVENT_SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail

          # Use resolved issue number
          ISSUE_NUMBER="${ISSUE_NUMBER_INPUT}"

          # Validate issue number is numeric (path traversal prevention)
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number: ${ISSUE_NUMBER}"
            exit 1
          fi

          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

          # Fetch issue metadata
          ISSUE_DATA=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}")
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_URL=$(echo "$ISSUE_DATA" | jq -r '.html_url')

          echo "issue_title=${ISSUE_TITLE}" >> "$GITHUB_OUTPUT"

          # Capture workflow owner (the user who triggered the workflow)
          # This is the user who added the sdlc:refine label or dispatched the workflow
          WORKFLOW_OWNER="${EVENT_SENDER:-}"

          # Validate workflow owner format (defense-in-depth)
          # GitHub usernames are alphanumeric with hyphens only
          if [[ -n "$WORKFLOW_OWNER" ]] && ! [[ "$WORKFLOW_OWNER" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "::warning::Invalid workflow owner format, skipping: ${WORKFLOW_OWNER}"
            WORKFLOW_OWNER=""
          fi

          echo "workflow_owner=${WORKFLOW_OWNER}" >> "$GITHUB_OUTPUT"

          # Branch name for this issue (using configured prefix)
          BRANCH_NAME="${BRANCH_PREFIX}/issue-${ISSUE_NUMBER}"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          # Check if branch exists
          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            echo "Branch ${BRANCH_NAME} already exists"
            git checkout "${BRANCH_NAME}"
            git pull origin "${BRANCH_NAME}"

            # Merge latest main into the issue branch to avoid working on stale code
            echo "Merging latest main into ${BRANCH_NAME}..."
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Main has commits not in ${BRANCH_NAME}, merging..."
              if git merge origin/main --no-edit; then
                echo "Successfully merged main into ${BRANCH_NAME}"
                # Push the merge commit so reviewers and subsequent steps see it
                git push origin "${BRANCH_NAME}" || {
                  echo "::warning::Initial push failed, attempting pull --rebase and retry..."
                  if ! git pull --rebase origin "${BRANCH_NAME}"; then
                    echo "::error::Failed to rebase during push retry"
                    exit 1
                  fi
                  if ! git push origin "${BRANCH_NAME}"; then
                    echo "::error::Failed to push after rebase"
                    exit 1
                  fi
                }
              else
                echo "::warning::Merge conflict detected, triggering conflict resolution workflow..."
                git merge --abort

                # Find PR number for this branch
                CONFLICT_PR_NUMBER=$(gh pr list --head "${BRANCH_NAME}" --json number --jq '.[0].number // empty' || echo "")

                if [[ -n "${CONFLICT_PR_NUMBER}" ]]; then
                  echo "Found PR #${CONFLICT_PR_NUMBER} for branch ${BRANCH_NAME}, triggering conflict resolution..."
                  # Record timestamp before triggering to avoid race condition with other runs
                  TRIGGER_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  if gh workflow run on-merge-conflict.yml -f pr_number="${CONFLICT_PR_NUMBER}"; then
                    echo "::notice::Conflict resolution workflow triggered for PR #${CONFLICT_PR_NUMBER}"

                    # Wait for conflict resolver to complete
                    echo "Waiting for conflict resolution workflow to start..."
                    sleep 10

                    # Find the triggered workflow run (filter by timestamp to avoid race condition)
                    CONFLICT_RUN_ID=""
                    for attempt in 1 2 3 4 5 6; do
                      CONFLICT_RUN_ID=$(gh run list \
                        --workflow on-merge-conflict.yml \
                        --limit 10 \
                        --json databaseId,status,createdAt \
                        --jq "[.[] | select(.createdAt > \"${TRIGGER_TIME}\")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty" 2>/dev/null || echo "")
                      if [[ -n "$CONFLICT_RUN_ID" ]]; then
                        break
                      fi
                      echo "::warning::Attempt ${attempt}: conflict resolution workflow run not found yet, retrying..."
                      sleep 5
                    done

                    if [[ -z "$CONFLICT_RUN_ID" ]]; then
                      echo "::error::Could not find triggered conflict resolution workflow run (triggered after ${TRIGGER_TIME}). Possible causes: workflow doesn't exist, permissions issue, or GitHub Actions delay."
                      exit 1
                    fi

                    echo "Watching conflict resolution workflow run ${CONFLICT_RUN_ID}..."
                    if gh run watch "$CONFLICT_RUN_ID" --exit-status; then
                      echo "Conflict resolution completed successfully"
                      # Pull the resolved changes with explicit error handling
                      if ! git fetch origin "${BRANCH_NAME}"; then
                        echo "::error::Failed to fetch resolved branch"
                        exit 1
                      fi
                      if ! git reset --hard "origin/${BRANCH_NAME}"; then
                        echo "::error::Failed to reset to resolved branch"
                        exit 1
                      fi
                      echo "Pulled resolved changes, continuing..."
                    else
                      echo "::error::Conflict resolution workflow failed (run ${CONFLICT_RUN_ID})"
                      exit 1
                    fi
                  else
                    echo "::warning::Failed to trigger conflict resolution workflow"
                    echo "::error::Merge conflict merging main into ${BRANCH_NAME}. Manual resolution required."
                    exit 1
                  fi
                else
                  echo "::warning::No PR found for branch ${BRANCH_NAME}, cannot trigger automatic conflict resolution"
                  echo "::error::Merge conflict merging main into ${BRANCH_NAME}. Manual resolution required."
                  exit 1
                fi
              fi
            else
              echo "Branch already contains latest main, skipping merge"
            fi
          else
            echo "Creating new branch ${BRANCH_NAME}"
            git checkout -b "${BRANCH_NAME}"
          fi

          # Create state directories
          mkdir -p .egg-state/contracts
          mkdir -p .egg-state/drafts
          mkdir -p .egg-state/reviews

          # Check if contract exists
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if [[ -f "$CONTRACT_PATH" ]]; then
            echo "contract_exists=true" >> "$GITHUB_OUTPUT"
            CURRENT_PHASE=$(jq -r '.current_phase' "$CONTRACT_PATH")

            # Phase ordering for validation: refine < plan < implement < pr
            declare -A PHASE_ORDER=([refine]=1 [plan]=2 [implement]=3 [pr]=4)

            # Validate starting_phase is not ahead of current_phase
            # (can only step back or restart at same phase)
            if [[ -n "$STARTING_PHASE" && "$STARTING_PHASE" != "$CURRENT_PHASE" ]]; then
              STARTING_ORD="${PHASE_ORDER[$STARTING_PHASE]:-0}"
              CURRENT_ORD="${PHASE_ORDER[$CURRENT_PHASE]:-0}"

              if [[ "$STARTING_ORD" -gt "$CURRENT_ORD" ]]; then
                echo "::error::Cannot jump ahead: starting_phase '$STARTING_PHASE' is ahead of current_phase '$CURRENT_PHASE'"
                exit 1
              fi

              # Phase step-back: reset work products for phases being re-done
              echo "Phase step-back: $CURRENT_PHASE -> $STARTING_PHASE"

              # Delete draft/review files for phases at or after starting_phase
              PHASES_TO_RESET=()
              for phase in refine plan implement; do
                PHASE_ORD="${PHASE_ORDER[$phase]}"
                if [[ "$PHASE_ORD" -ge "$STARTING_ORD" ]]; then
                  PHASES_TO_RESET+=("$phase")
                fi
              done

              for phase in "${PHASES_TO_RESET[@]}"; do
                echo "Resetting phase: $phase"
                # Remove draft files
                if [[ "$phase" == "refine" ]]; then
                  rm -f ".egg-state/drafts/${ISSUE_NUMBER}-analysis.md"
                elif [[ "$phase" == "plan" ]]; then
                  rm -f ".egg-state/drafts/${ISSUE_NUMBER}-plan.md"
                fi
                # Remove review files
                rm -f ".egg-state/reviews/${ISSUE_NUMBER}-${phase}-review.json"
              done

              # Update contract phase and reset review cycles
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              jq --arg phase "$STARTING_PHASE" \
                 --arg old_phase "$CURRENT_PHASE" \
                 --arg ts "$TIMESTAMP" '
                .current_phase = $phase |
                # Reset refine review cycles only when stepping back to refine
                (if $phase == "refine" then
                  .refine_review_cycles = 0 |
                  .refine_review_feedback = ""
                else . end) |
                # Reset plan review cycles when stepping back to refine or plan
                (if $phase == "refine" or $phase == "plan" then
                  .plan_review_cycles = 0 |
                  .plan_review_feedback = ""
                else . end) |
                # Reset circuit breaker to allow retry
                .circuit_breaker.status = "closed" |
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "transition",
                  "field_path": "current_phase",
                  "old_value": $old_phase,
                  "new_value": $phase,
                  "reason": "Phase step-back via starting_phase override"
                }]
              ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"

              CURRENT_PHASE="$STARTING_PHASE"
              git add .egg-state/
              git commit -m "Reset to ${STARTING_PHASE} phase for issue #${ISSUE_NUMBER}" || true

              # Push step-back changes immediately to ensure they persist
              # Uses simple retry since concurrency group prevents parallel runs
              for i in 1 2 3; do
                if git push origin "${BRANCH_NAME}"; then
                  echo "Step-back push succeeded"
                  break
                elif [[ $i -eq 3 ]]; then
                  echo "::warning::Step-back push failed after 3 attempts, will retry in Push branch step"
                else
                  echo "Step-back push attempt $i failed, retrying..."
                  git pull --rebase origin "${BRANCH_NAME}" || true
                fi
              done
            fi

            echo "current_phase=${CURRENT_PHASE}" >> "$GITHUB_OUTPUT"

            # Look up PR number from branch (contract schema doesn't store it)
            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "${BRANCH_NAME}" --state all --json number --jq '.[0].number // 0' 2>/dev/null || echo "0")
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            {
              echo "contract_exists=false"
              echo "current_phase=${STARTING_PHASE}"
              echo "pr_number=0"
            } >> "$GITHUB_OUTPUT"

            # Create initial contract
            # Build workflow_owner value (null if empty, quoted string otherwise)
            if [[ -n "$WORKFLOW_OWNER" ]]; then
              WORKFLOW_OWNER_JSON="\"${WORKFLOW_OWNER}\""
            else
              WORKFLOW_OWNER_JSON="null"
            fi

            cat > "$CONTRACT_PATH" << EOF
          {
            "schemaVersion": "1.0",
            "issue": {
              "number": ${ISSUE_NUMBER},
              "title": $(echo "$ISSUE_TITLE" | jq -R),
              "url": "${ISSUE_URL}"
            },
            "current_phase": "${STARTING_PHASE}",
            "acceptance_criteria": [],
            "phases": [],
            "decisions": [],
            "circuit_breaker": {
              "total_cycles": 0,
              "max_total_cycles": 10,
              "status": "closed"
            },
            "workflow_owner": ${WORKFLOW_OWNER_JSON},
            "audit_log": [],
            "autofix_attempts": 0,
            "max_autofix_attempts": 3,
            "phase_configs": {
              "refine": {
                "max_review_cycles": 3,
                "human_review_mechanism": "ISSUE_CHECKBOX"
              },
              "plan": {
                "max_review_cycles": 3,
                "human_review_mechanism": "ISSUE_CHECKBOX"
              },
              "implement": {
                "max_review_cycles": 3,
                "human_review_mechanism": "PR_REVIEW"
              }
            }
          }
          EOF

            # Commit the contract
            git add "$CONTRACT_PATH"
            git commit -m "Initialize SDLC contract for issue #${ISSUE_NUMBER}"
          fi

      - name: Push branch
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.setup.outputs.branch_name }}
        run: |
          set -euo pipefail
          # Retry push with rebase on conflict
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push -u origin "${BRANCH_NAME}"; then
              echo "Push succeeded"
              break
            elif [[ $i -eq $MAX_RETRIES ]]; then
              echo "Push failed after $MAX_RETRIES attempts"
              exit 1
            else
              echo "Push failed (attempt $i/$MAX_RETRIES), trying rebase..."
              git pull --rebase origin "${BRANCH_NAME}" || {
                echo "Rebase failed, cannot resolve conflict automatically"
                exit 1
              }
            fi
          done

      # Apply the appropriate phase label to the issue
      - name: Apply phase label
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.setup.outputs.issue_number }}
          CURRENT_PHASE: ${{ steps.setup.outputs.current_phase }}
        run: |
          set -euo pipefail

          # Map phase to label
          PHASE_LABEL="sdlc:${CURRENT_PHASE}"

          # Get current labels on the issue
          CURRENT_LABELS=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels" \
            --jq '.[].name' 2>/dev/null || echo "")

          # Check if correct label is already present
          NEEDS_LABEL=true
          if echo "$CURRENT_LABELS" | grep -qx "$PHASE_LABEL"; then
            echo "Correct phase label ${PHASE_LABEL} already present"
            NEEDS_LABEL=false
          fi

          # Remove incorrect phase labels using transition script
          for label in "sdlc:refine" "sdlc:plan" "sdlc:implement" "sdlc:pr"; do
            if [[ "$label" != "$PHASE_LABEL" ]] && echo "$CURRENT_LABELS" | grep -qx "$label"; then
              .github/scripts/transition-sdlc-label.sh \
                --issue "${ISSUE_NUMBER}" \
                --remove "$label"
            fi
          done

          # Add the correct phase label if needed
          if [[ "$NEEDS_LABEL" == "true" ]]; then
            .github/scripts/transition-sdlc-label.sh \
              --issue "${ISSUE_NUMBER}" \
              --add "$PHASE_LABEL"
          fi

          echo "Applied phase label: ${PHASE_LABEL}"

      # NOTE: Comment hiding removed from init job (issue-phase) per #363
      # Status comments on issues should remain visible for audit trail
      # Comment hiding is now only done in PR-phase jobs using semantic markers

      - name: Post initialization comment
        if: steps.setup.outputs.contract_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          BODY="<!-- egg-status-comment -->
          SDLC Pipeline initialized for this issue.

          **Branch:** \`${{ steps.setup.outputs.branch_name }}\`
          **Starting phase:** \`${{ steps.setup.outputs.current_phase }}\`

          The pipeline will now begin the **${{ steps.setup.outputs.current_phase }}** phase.

          --- Authored by egg"

          # Strip leading whitespace from each line (caused by YAML indentation)
          # shellcheck disable=SC2001 # sed is needed for regex-based multiline substitution
          BODY=$(echo "$BODY" | sed 's/^[[:space:]]*//')
          gh issue comment "${{ steps.setup.outputs.issue_number }}" --repo "${{ github.repository }}" --body "$BODY"

      - name: Close stale PRs
        id: close-stale-prs
        if: steps.setup.outputs.current_phase == 'implement' || steps.setup.outputs.current_phase == 'pr'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.setup.outputs.branch_name }}
        run: |
          set -euo pipefail

          # Close any existing open PRs on this branch (stale from previous runs)
          EXISTING_PRS=$(gh pr list --repo "${{ github.repository }}" --head "${BRANCH_NAME}" --state open --json number --jq '.[].number')

          if [[ -n "$EXISTING_PRS" ]]; then
            for PR_NUM in $EXISTING_PRS; do
              echo "Closing stale PR #${PR_NUM}"
              gh pr close "${PR_NUM}" --repo "${{ github.repository }}" --comment "Closing stale PR. A new PR will be created after implementation succeeds."
            done
          else
            echo "No existing open PRs found on branch ${BRANCH_NAME}"
          fi

  # ============================================================
  # Work Loop: Unified phase execution for refine/plan/implement
  # ============================================================
  work-loop:
    name: Execute phase (${{ needs.init.outputs.current_phase }})
    needs: [resolve-inputs, init]
    # Run for any phase except 'pr' (which is final and needs human merge)
    if: >-
      always() &&
      needs.init.result == 'success' &&
      needs.init.outputs.current_phase != 'pr'
    uses: ./.github/workflows/sdlc-work-loop.yml
    with:
      phase: ${{ needs.init.outputs.current_phase }}
      issue_number: ${{ fromJSON(needs.init.outputs.issue_number) }}
      branch_name: ${{ needs.init.outputs.branch_name }}
      bot_username: ${{ needs.resolve-inputs.outputs.bot_username }}
      branch_prefix: ${{ needs.resolve-inputs.outputs.branch_prefix }}
      workflow_owner: ${{ needs.init.outputs.workflow_owner }}
      pr_number: ${{ fromJSON(needs.init.outputs.pr_number) }}
      # Phase-specific timeouts
      work_timeout: ${{ needs.init.outputs.current_phase == 'implement' && '120' || '30' }}
      review_timeout: ${{ needs.init.outputs.current_phase == 'implement' && '30' || '15' }}
      # Output type and review mechanism are determined by phase in work-loop
    secrets: inherit
