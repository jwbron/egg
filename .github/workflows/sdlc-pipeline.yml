name: "egg: SDLC Pipeline"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to process'
        required: true
        type: number
      starting_phase:
        description: 'Pipeline phase to start from'
        required: false
        type: choice
        options:
          - refine
          - plan
          - implement
          - pr
        default: refine
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

# Prevent concurrent pipeline runs for the same issue
concurrency:
  group: sdlc-pipeline-${{ github.event.inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Initialization: Create contract and branch
  # ============================================================
  init:
    name: Initialize pipeline
    runs-on: ubuntu-latest
    # Only trigger on egg-sdlc label or workflow_dispatch
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.label.name == 'egg-sdlc')
    outputs:
      issue_number: ${{ steps.setup.outputs.issue_number }}
      issue_title: ${{ steps.setup.outputs.issue_title }}
      branch_name: ${{ steps.setup.outputs.branch_name }}
      current_phase: ${{ steps.setup.outputs.current_phase }}
      contract_exists: ${{ steps.setup.outputs.contract_exists }}
      pr_number: ${{ steps.draft-pr.outputs.pr_number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install pydantic==2.10.* pyyaml==6.0.*

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "james-in-a-box[bot]"
          git config user.email "${BOT_APP_ID}+james-in-a-box[bot]@users.noreply.github.com"

      - name: Setup pipeline
        id: setup
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number }}
          LABELED_ISSUE: ${{ github.event.issue.number }}
          STARTING_PHASE: ${{ github.event.inputs.starting_phase || 'refine' }}
        run: |
          set -euo pipefail

          # Determine issue number based on trigger
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ISSUE_NUMBER="${DISPATCH_ISSUE}"
          else
            ISSUE_NUMBER="${LABELED_ISSUE}"
          fi

          # Validate issue number is numeric (path traversal prevention)
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number: ${ISSUE_NUMBER}"
            exit 1
          fi

          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

          # Fetch issue metadata
          ISSUE_DATA=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}")
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_URL=$(echo "$ISSUE_DATA" | jq -r '.html_url')

          echo "issue_title=${ISSUE_TITLE}" >> "$GITHUB_OUTPUT"

          # Branch name for this issue
          BRANCH_NAME="egg/issue-${ISSUE_NUMBER}"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          # Check if branch exists
          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            echo "Branch ${BRANCH_NAME} already exists"
            git checkout "${BRANCH_NAME}"
            git pull origin "${BRANCH_NAME}"
          else
            echo "Creating new branch ${BRANCH_NAME}"
            git checkout -b "${BRANCH_NAME}"
          fi

          # Create contracts directory
          mkdir -p .egg-state/contracts

          # Check if contract exists
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if [[ -f "$CONTRACT_PATH" ]]; then
            echo "contract_exists=true" >> "$GITHUB_OUTPUT"
            CURRENT_PHASE=$(jq -r '.current_phase' "$CONTRACT_PATH")
            echo "current_phase=${CURRENT_PHASE}" >> "$GITHUB_OUTPUT"
          else
            echo "contract_exists=false" >> "$GITHUB_OUTPUT"
            echo "current_phase=${STARTING_PHASE}" >> "$GITHUB_OUTPUT"

            # Create initial contract
            cat > "$CONTRACT_PATH" << EOF
          {
            "schemaVersion": "1.0",
            "issue": {
              "number": ${ISSUE_NUMBER},
              "title": $(echo "$ISSUE_TITLE" | jq -R),
              "url": "${ISSUE_URL}"
            },
            "current_phase": "${STARTING_PHASE}",
            "acceptance_criteria": [],
            "phases": [],
            "decisions": [],
            "circuit_breaker": {
              "total_cycles": 0,
              "max_total_cycles": 10,
              "status": "closed"
            },
            "audit_log": []
          }
          EOF

            # Commit the contract
            git add "$CONTRACT_PATH"
            git commit -m "Initialize SDLC contract for issue #${ISSUE_NUMBER}"
          fi

      - name: Push branch
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.setup.outputs.branch_name }}
        run: |
          set -euo pipefail
          # Retry push with rebase on conflict
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push -u origin "${BRANCH_NAME}"; then
              echo "Push succeeded"
              break
            elif [[ $i -eq $MAX_RETRIES ]]; then
              echo "Push failed after $MAX_RETRIES attempts"
              exit 1
            else
              echo "Push failed (attempt $i/$MAX_RETRIES), trying rebase..."
              git pull --rebase origin "${BRANCH_NAME}" || {
                echo "Rebase failed, cannot resolve conflict automatically"
                exit 1
              }
            fi
          done

      - name: Post initialization comment
        if: steps.setup.outputs.contract_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          BODY="SDLC Pipeline initialized for this issue.

          **Branch:** \`${{ steps.setup.outputs.branch_name }}\`
          **Starting phase:** \`${{ steps.setup.outputs.current_phase }}\`

          The pipeline will now begin the **${{ steps.setup.outputs.current_phase }}** phase.

          --- Authored by egg"

          gh issue comment "${{ steps.setup.outputs.issue_number }}" --body "$BODY"

      - name: Create or find draft PR
        id: draft-pr
        if: steps.setup.outputs.current_phase == 'implement'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.setup.outputs.branch_name }}
          ISSUE_NUMBER: ${{ steps.setup.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.setup.outputs.issue_title }}
        run: |
          set -euo pipefail

          # Check for existing open PR on this branch
          EXISTING_PR=$(gh pr list --head "${BRANCH_NAME}" --state open --json number,state --jq '.[0].number // empty')

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Found existing PR #${EXISTING_PR}"
            echo "pr_number=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check for merged/closed PRs (edge case)
          CLOSED_PR=$(gh pr list --head "${BRANCH_NAME}" --state closed --json number,mergedAt --jq '.[0] // empty')
          if [[ -n "$CLOSED_PR" ]]; then
            echo "Warning: Found closed/merged PR on this branch. Creating a new draft PR."
          fi

          # Create a new draft PR
          PR_BODY="Draft PR for SDLC pipeline implementation."
          PR_BODY="${PR_BODY}"$'\n\n'"Issue: #${ISSUE_NUMBER}"
          PR_BODY="${PR_BODY}"$'\n'"Branch: \`${BRANCH_NAME}\`"
          PR_BODY="${PR_BODY}"$'\n\n'"This PR is managed by the SDLC pipeline. It will be marked ready for review once the implementation passes automated review."
          PR_BODY="${PR_BODY}"$'\n\n'"Authored-by: egg"

          PR_URL=$(gh pr create \
            --draft \
            --title "[SDLC] ${ISSUE_TITLE}" \
            --body "$PR_BODY" \
            --base main \
            --head "${BRANCH_NAME}")

          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "Created draft PR #${PR_NUMBER}"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Implement: Execute tasks in plan
  # ============================================================
  implement:
    name: Implement tasks
    needs: init
    if: needs.init.outputs.current_phase == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max, checkpoint at T-10 minutes
    outputs:
      implementation_complete: ${{ steps.implement.outputs.complete }}
      tasks_completed: ${{ steps.implement.outputs.tasks_completed }}
      checkpointed: ${{ steps.checkpoint.outputs.checkpointed }}

    env:
      BOT_USERNAME: james-in-a-box
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted action scripts
        run: |
          cp -r action "$RUNNER_TEMP/trusted-action"
          cp -r shared "$RUNNER_TEMP/trusted-shared"

      - name: Build implement prompt
        id: prompt
        run: bash action/build-sdlc-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_PIPELINE_PHASE: implement
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}
          EGG_PR_NUMBER: ${{ needs.init.outputs.pr_number }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "james-in-a-box[bot]"
          git config user.email "${BOT_APP_ID}+james-in-a-box[bot]@users.noreply.github.com"

      - name: Populate contract tasks from plan
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Use trusted scripts from main checkout
          pip install -q pyyaml pydantic
          PYTHONPATH="${RUNNER_TEMP}/trusted-shared:${PYTHONPATH:-}" \
            python3 "${RUNNER_TEMP}/trusted-action/populate-contract-tasks.py"

          # Commit if contract was updated
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if ! git diff --quiet "$CONTRACT_PATH" 2>/dev/null; then
            git add "$CONTRACT_PATH"
            git commit -m "Populate contract tasks from plan for issue #${ISSUE_NUMBER}"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Run egg implementer
        id: egg
        continue-on-error: true  # Allow checkpoint on controlled exit
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: "60"
        env:
          EGG_AGENT_ROLE: implementer
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_JOB_START_TIME: ${{ github.event.created_at }}

      - name: Check for timeout checkpoint
        id: checkpoint
        if: always()
        run: |
          set -euo pipefail

          # Check if we're within 10 minutes of timeout
          JOB_TIMEOUT_MINUTES=360
          CHECKPOINT_MARGIN_MINUTES=10

          # Get job start time (approximate using workflow run time)
          START_TIME="${{ github.event.created_at }}"
          if [[ -z "$START_TIME" ]]; then
            START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi

          # Calculate elapsed time
          START_EPOCH=$(date -d "$START_TIME" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$START_TIME" +%s 2>/dev/null || echo "0")
          NOW_EPOCH=$(date +%s)
          ELAPSED_SECONDS=$((NOW_EPOCH - START_EPOCH))
          ELAPSED_MINUTES=$((ELAPSED_SECONDS / 60))

          # Calculate remaining time
          REMAINING_MINUTES=$((JOB_TIMEOUT_MINUTES - ELAPSED_MINUTES))

          echo "Job elapsed: ${ELAPSED_MINUTES} minutes, remaining: ${REMAINING_MINUTES} minutes"

          # Check if we need to checkpoint
          if [[ $REMAINING_MINUTES -le $CHECKPOINT_MARGIN_MINUTES ]]; then
            echo "checkpointed=true" >> "$GITHUB_OUTPUT"
            echo "reason=timeout_approaching" >> "$GITHUB_OUTPUT"

            # Save checkpoint state to contract
            CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
            if [[ -f "$CONTRACT_PATH" ]]; then
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              jq --arg ts "$TIMESTAMP" --arg reason "Checkpoint: ${REMAINING_MINUTES} minutes remaining before timeout" '
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "update",
                  "field_path": "checkpoint",
                  "old_value": null,
                  "new_value": "timeout_checkpoint",
                  "reason": $reason
                }]
              ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"

              git add "$CONTRACT_PATH"
              git commit -m "Checkpoint state before timeout (${REMAINING_MINUTES}m remaining)" || true

              # Retry push with rebase on conflict
              MAX_RETRIES=3
              for i in $(seq 1 $MAX_RETRIES); do
                if git push origin "${BRANCH_NAME}"; then
                  echo "Push succeeded"
                  break
                elif [[ $i -eq $MAX_RETRIES ]]; then
                  echo "::warning::Checkpoint push failed after $MAX_RETRIES attempts"
                  break
                else
                  echo "Push failed (attempt $i/$MAX_RETRIES), trying rebase..."
                  git pull --rebase origin "${BRANCH_NAME}" || {
                    echo "::warning::Rebase failed, checkpoint may be lost"
                    break
                  }
                fi
              done
            fi
          else
            echo "checkpointed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update contract state
        id: implement
        run: bash "$RUNNER_TEMP/trusted-action/contract-state.sh" update-after-implement
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          REPO_PATH: ${{ github.workspace }}

      - name: Post status comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          EGG_EXIT_CODE: ${{ steps.egg.outputs.exit-code }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${EGG_EXIT_CODE:-1}" == "0" ]]; then
            BODY="Implementation phase completed. [View run logs](${RUN_URL})

          --- Authored by egg"
          else
            BODY="Implementation phase encountered issues (exit code: ${EGG_EXIT_CODE:-unknown}).
          [View run logs](${RUN_URL})

          --- Authored by egg"
          fi

          gh issue comment "${ISSUE_NUMBER}" --body "$BODY"

  # ============================================================
  # Review: Run reusable-review.yml against the draft PR
  # ============================================================
  sdlc-review:
    name: Auto-review via PR
    needs: [init, implement]
    if: always() && needs.implement.result == 'success' && needs.init.outputs.pr_number != ''
    uses: ./.github/workflows/reusable-review.yml
    with:
      pr_number: ${{ fromJSON(needs.init.outputs.pr_number) }}
      bot_name: sdlc-review
      force_review: true
      is_draft: true
      timeout: "30"
    secrets: inherit

  # Handle missing PR number (e.g., init failed or phase != implement)
  sdlc-review-skipped:
    name: Review skipped (no PR)
    needs: [init, implement]
    if: always() && needs.implement.result == 'success' && needs.init.outputs.pr_number == ''
    runs-on: ubuntu-latest
    steps:
      - name: Log missing PR number
        run: |
          echo "::warning::PR number is empty. This can happen if:"
          echo "  - The init job failed before creating the draft PR"
          echo "  - The current_phase was not 'implement' during init"
          echo "  - The gh pr create command failed"
          echo ""
          echo "Init job result: ${{ needs.init.result }}"
          echo "Current phase: ${{ needs.init.outputs.current_phase }}"
          echo ""
          echo "Check the init job logs for details."

  # ============================================================
  # Check review status: Read PR review state and decide next step
  # ============================================================
  check-review-status:
    name: Check review status
    needs: [init, implement, sdlc-review]
    if: always() && needs.sdlc-review.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      next_action: ${{ steps.check.outputs.next_action }}
      cycle_count: ${{ steps.check.outputs.cycle_count }}

    env:
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}
      PR_NUMBER: ${{ needs.init.outputs.pr_number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "james-in-a-box[bot]"
          git config user.email "${BOT_APP_ID}+james-in-a-box[bot]@users.noreply.github.com"

      - name: Checkout trusted contract-state script
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted-main
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check PR review state and update contract
        id: check
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ ! -f "$CONTRACT_PATH" ]]; then
            echo "Contract not found"
            echo "next_action=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get circuit breaker state
          TOTAL_CYCLES=$(jq -r '.circuit_breaker.total_cycles' "$CONTRACT_PATH")
          MAX_CYCLES=$(jq -r '.circuit_breaker.max_total_cycles' "$CONTRACT_PATH")
          CB_STATUS=$(jq -r '.circuit_breaker.status' "$CONTRACT_PATH")

          # Validate numeric values
          TOTAL_CYCLES=${TOTAL_CYCLES:-0}
          MAX_CYCLES=${MAX_CYCLES:-10}
          if ! [[ "$TOTAL_CYCLES" =~ ^[0-9]+$ ]]; then
            TOTAL_CYCLES=0
          fi
          if ! [[ "$MAX_CYCLES" =~ ^[0-9]+$ ]]; then
            MAX_CYCLES=10
          fi

          # Check if circuit breaker is already open
          if [[ "$CB_STATUS" == "open" ]]; then
            echo "Circuit breaker is OPEN - human intervention required"
            echo "next_action=escalate" >> "$GITHUB_OUTPUT"
            echo "cycle_count=${TOTAL_CYCLES}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read the latest bot review state from the PR
          # First try the Reviews API, then fall back to issue comments
          # (bots can't use the Reviews API on their own PRs — self-review)
          BOT_GH_USERNAME="james-in-a-box"  # GitHub username for Reviews API
          REVIEW_STATE=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
            --jq "[.[] | select(.user.login == \"${BOT_GH_USERNAME}\" or .user.login == \"${BOT_GH_USERNAME}[bot]\")] | sort_by(.submitted_at) | last | .state // \"NONE\"")

          echo "Reviews API state: ${REVIEW_STATE}"

          # If no review found via Reviews API, check issue comments for
          # the egg-automated-review marker with verdict (self-review fallback)
          if [[ "$REVIEW_STATE" == "NONE" || "$REVIEW_STATE" == "null" ]]; then
            echo "No review via Reviews API — checking issue comments for verdict marker"
            BOT_MARKER_ID="sdlc-review"  # Identifier in the review marker (bot= field)
            marker_regex='<!-- egg-automated-review bot='"${BOT_MARKER_ID}"' commit=([a-f0-9]+) verdict=([a-z-]+) -->'

            COMMENT_VERDICT=""
            COMMENT_TIME=""
            comments=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq '[.[] | {body: .body, created_at: .created_at}]')

            while IFS= read -r comment; do
              body=$(echo "$comment" | jq -r '.body // ""')
              created_at=$(echo "$comment" | jq -r '.created_at')
              if [[ "$body" =~ $marker_regex ]]; then
                verdict="${BASH_REMATCH[2]}"
                if [[ -z "$COMMENT_TIME" || "$created_at" > "$COMMENT_TIME" ]]; then
                  COMMENT_VERDICT="$verdict"
                  COMMENT_TIME="$created_at"
                fi
              fi
            done < <(echo "$comments" | jq -c '.[]')

            if [[ -n "$COMMENT_VERDICT" ]]; then
              echo "Found verdict in issue comment: ${COMMENT_VERDICT} at ${COMMENT_TIME}"
              # Map verdict to Reviews API state names
              case "$COMMENT_VERDICT" in
                approve) REVIEW_STATE="APPROVED" ;;
                request-changes) REVIEW_STATE="CHANGES_REQUESTED" ;;
                comment) REVIEW_STATE="COMMENTED" ;;
                *) REVIEW_STATE="NONE" ;;
              esac
            fi
          fi

          echo "Final review state: ${REVIEW_STATE}"

          case "$REVIEW_STATE" in
            APPROVED)
              echo "PR review approved — advancing to finalize"
              echo "next_action=pr" >> "$GITHUB_OUTPUT"
              echo "cycle_count=${TOTAL_CYCLES}" >> "$GITHUB_OUTPUT"

              # Update contract tasks via trusted script
              if ! ISSUE_NUMBER="${ISSUE_NUMBER}" REPO_PATH="${REPO_PATH}" \
                bash trusted-main/action/contract-state.sh update-from-pr-review APPROVED; then
                echo "::error::Failed to update contract for APPROVED verdict"
                exit 1
              fi
              ;;

            CHANGES_REQUESTED)
              echo "Review requested changes — triggering re-implementation cycle"

              # Update contract tasks via trusted script (this increments the cycle counter)
              if ! ISSUE_NUMBER="${ISSUE_NUMBER}" REPO_PATH="${REPO_PATH}" \
                bash trusted-main/action/contract-state.sh update-from-pr-review CHANGES_REQUESTED; then
                echo "::error::Failed to update contract for CHANGES_REQUESTED verdict"
                exit 1
              fi

              # Re-read cycle count after increment
              TOTAL_CYCLES=$(jq -r '.circuit_breaker.total_cycles' "$CONTRACT_PATH")
              echo "cycle_count=${TOTAL_CYCLES}" >> "$GITHUB_OUTPUT"

              # Check if max cycles exceeded after increment
              if [[ "$TOTAL_CYCLES" -ge "$MAX_CYCLES" ]]; then
                echo "Max cycles ($MAX_CYCLES) exceeded - triggering escalation"
                echo "next_action=escalate" >> "$GITHUB_OUTPUT"

                # Open circuit breaker
                ISSUE_NUMBER="${ISSUE_NUMBER}" REPO_PATH="${REPO_PATH}" \
                  bash trusted-main/action/contract-state.sh open-circuit-breaker "Max review cycles exceeded"
              else
                echo "next_action=implement" >> "$GITHUB_OUTPUT"
              fi
              ;;

            COMMENTED|NONE|null)
              # COMMENTED = advisory feedback without approve/reject decision
              # NONE/null = no review found (e.g., review workflow hasn't run yet)
              # In both cases, do NOT increment the cycle counter — wait for an
              # explicit APPROVED or CHANGES_REQUESTED verdict.
              echo "No explicit verdict (state: ${REVIEW_STATE}) — re-running review"
              echo "next_action=implement" >> "$GITHUB_OUTPUT"
              echo "cycle_count=${TOTAL_CYCLES}" >> "$GITHUB_OUTPUT"
              ;;
          esac

          # Commit and push contract changes
          if ! git diff --quiet "$CONTRACT_PATH" 2>/dev/null; then
            git add "$CONTRACT_PATH"
            git commit -m "Update contract after review cycle ${TOTAL_CYCLES} for issue #${ISSUE_NUMBER}"

            MAX_RETRIES=3
            for i in $(seq 1 $MAX_RETRIES); do
              if git push origin "${BRANCH_NAME}"; then
                echo "Push succeeded"
                break
              elif [[ $i -eq $MAX_RETRIES ]]; then
                echo "Push failed after $MAX_RETRIES attempts"
                exit 1
              else
                echo "Push failed (attempt $i/$MAX_RETRIES), trying rebase..."
                git pull --rebase origin "${BRANCH_NAME}" || {
                  echo "Rebase failed, cannot resolve conflict automatically"
                  exit 1
                }
              fi
            done
          fi

      - name: Post status comment
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          NEXT_ACTION: ${{ steps.check.outputs.next_action }}
          CYCLE_COUNT: ${{ steps.check.outputs.cycle_count }}
        run: |
          set -euo pipefail
          case "$NEXT_ACTION" in
            pr)
              BODY="PR review approved. Marking PR ready for human review.

          --- Authored by egg"
              ;;
            implement)
              BODY="Review cycle ${CYCLE_COUNT} complete. Reviewer requested changes.
          Re-running implementation to address feedback...

          --- Authored by egg"
              ;;
            escalate)
              BODY="**SDLC Pipeline Escalation Required**

          The pipeline has reached its cycle limit or encountered a blocking issue.
          Human intervention is required to proceed.

          **Cycle count:** ${CYCLE_COUNT}
          **Status:** Circuit breaker OPEN

          Please review the PR comments and incomplete tasks, then provide guidance.

          --- Authored by egg"
              gh issue edit "${ISSUE_NUMBER}" --add-label "needs-human-intervention" 2>/dev/null || true
              ;;
            *)
              BODY="Pipeline check complete.

          --- Authored by egg"
              ;;
          esac

          gh issue comment "${ISSUE_NUMBER}" --body "$BODY"

  # ============================================================
  # Escalate: Handle circuit breaker escalation
  # ============================================================
  escalate:
    name: Escalate to human
    needs: [init, check-review-status]
    if: always() && needs.check-review-status.outputs.next_action == 'escalate'
    runs-on: ubuntu-latest

    env:
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted action scripts
        run: cp -r action "$RUNNER_TEMP/trusted-action"

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Run escalation
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: bash "$RUNNER_TEMP/trusted-action/escalate.sh" "${ISSUE_NUMBER}" "${{ github.workspace }}"

  # ============================================================
  # Finalize PR: Mark draft PR ready for human review
  # ============================================================
  finalize-pr:
    name: Finalize pull request
    needs: [init, check-review-status]
    if: always() && needs.check-review-status.outputs.next_action == 'pr'
    runs-on: ubuntu-latest

    env:
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      ISSUE_TITLE: ${{ needs.init.outputs.issue_title }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}
      PR_NUMBER: ${{ needs.init.outputs.pr_number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "james-in-a-box[bot]"
          git config user.email "${BOT_APP_ID}+james-in-a-box[bot]@users.noreply.github.com"

      - name: Update PR title and mark ready
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Remove [SDLC] prefix from title
          CLEAN_TITLE="${ISSUE_TITLE}"
          gh pr edit "${PR_NUMBER}" --title "${CLEAN_TITLE}"

          # Update PR body with final details
          FINAL_BODY="## Summary"
          FINAL_BODY="${FINAL_BODY}"$'\n\n'"Implementation for issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          FINAL_BODY="${FINAL_BODY}"$'\n\n'"This PR was developed through the SDLC pipeline with automated review cycles."
          FINAL_BODY="${FINAL_BODY}"$'\n\n'"Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${ISSUE_NUMBER}"
          FINAL_BODY="${FINAL_BODY}"$'\n\n'"Authored-by: egg"

          gh pr edit "${PR_NUMBER}" --body "$FINAL_BODY"

          # Mark draft as ready for review
          gh pr ready "${PR_NUMBER}"

          echo "PR #${PR_NUMBER} marked ready for human review"

      - name: Update contract phase
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if [[ -f "$CONTRACT_PATH" ]]; then
            jq '.current_phase = "pr"' "$CONTRACT_PATH" > /tmp/contract.json
            mv /tmp/contract.json "$CONTRACT_PATH"
            git add "$CONTRACT_PATH"
            git commit -m "Advance to PR phase for issue #${ISSUE_NUMBER}"

            MAX_RETRIES=3
            for i in $(seq 1 $MAX_RETRIES); do
              if git push origin "${BRANCH_NAME}"; then
                echo "Push succeeded"
                break
              elif [[ $i -eq $MAX_RETRIES ]]; then
                echo "Push failed after $MAX_RETRIES attempts"
                exit 1
              else
                echo "Push failed (attempt $i/$MAX_RETRIES), trying rebase..."
                git pull --rebase origin "${BRANCH_NAME}" || {
                  echo "Rebase failed, cannot resolve conflict automatically"
                  exit 1
                }
              fi
            done
          fi

      - name: Post completion comment
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"
          BODY="Pull request ready for review: ${PR_URL}

          The implementation has passed automated review and is ready for human review and merge.

          --- Authored by egg"

          gh issue comment "${ISSUE_NUMBER}" --body "$BODY"

  # ============================================================
  # Retrigger: Re-run pipeline for next implement cycle
  # ============================================================
  retrigger:
    name: Re-trigger implementation
    needs: [init, check-review-status]
    if: always() && needs.check-review-status.outputs.next_action == 'implement'
    runs-on: ubuntu-latest

    env:
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Re-trigger pipeline
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          # Validate ISSUE_NUMBER is numeric to prevent injection
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid ISSUE_NUMBER: ${ISSUE_NUMBER}"
            exit 1
          fi

          gh workflow run sdlc-pipeline.yml \
            --repo "${{ github.repository }}" \
            --field issue_number="${ISSUE_NUMBER}" \
            --field starting_phase="implement"

  # ============================================================
  # Refine: Analyze issue and produce analysis document
  # ============================================================
  refine:
    name: Refine issue
    needs: init
    if: needs.init.outputs.current_phase == 'refine'
    runs-on: ubuntu-latest

    env:
      BOT_USERNAME: james-in-a-box
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build refine prompt
        id: prompt
        run: bash action/build-sdlc-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_PIPELINE_PHASE: refine
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Run egg refiner
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: "30"
        env:
          EGG_AGENT_ROLE: implementer
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}

      - name: Post completion comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          EGG_EXIT_CODE: ${{ steps.egg.outputs.exit-code }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${EGG_EXIT_CODE:-1}" == "0" ]]; then
            BODY="Refine phase completed. [View run logs](${RUN_URL})

          Please review the analysis and approve to advance to the **plan** phase.

          --- Authored by egg"
          else
            BODY="Refine phase encountered issues (exit code: ${EGG_EXIT_CODE:-unknown}). [View run logs](${RUN_URL})

          --- Authored by egg"
          fi

          gh issue comment "${ISSUE_NUMBER}" --body "$BODY"

  # ============================================================
  # Plan: Create implementation plan
  # ============================================================
  plan:
    name: Create plan
    needs: init
    if: needs.init.outputs.current_phase == 'plan'
    runs-on: ubuntu-latest

    env:
      BOT_USERNAME: james-in-a-box
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build plan prompt
        id: prompt
        run: bash action/build-sdlc-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_PIPELINE_PHASE: plan
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Run egg planner
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: "30"
        env:
          EGG_AGENT_ROLE: implementer
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}

      - name: Post completion comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          EGG_EXIT_CODE: ${{ steps.egg.outputs.exit-code }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${EGG_EXIT_CODE:-1}" == "0" ]]; then
            BODY="Plan phase completed. [View run logs](${RUN_URL})

          Please review the implementation plan and approve to advance to the **implement** phase.

          --- Authored by egg"
          else
            BODY="Plan phase encountered issues (exit code: ${EGG_EXIT_CODE:-unknown}). [View run logs](${RUN_URL})

          --- Authored by egg"
          fi

          gh issue comment "${ISSUE_NUMBER}" --body "$BODY"
