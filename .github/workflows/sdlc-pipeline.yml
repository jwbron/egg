name: "egg: SDLC Pipeline"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to process'
        required: true
        type: number
      starting_phase:
        description: 'Pipeline phase to start from'
        required: false
        type: choice
        options:
          - refine
          - plan
          - implement
          - pr
        default: refine
  issues:
    types: [labeled]
  workflow_call:
    inputs:
      issue_number:
        description: 'GitHub issue number to process'
        required: true
        type: number
      starting_phase:
        description: 'Pipeline phase to start from'
        required: false
        type: string
        default: "refine"
      bot_username:
        description: 'GitHub username of the bot (for git identity and comment filtering)'
        required: false
        type: string
        default: "james-in-a-box"
      action_ref:
        description: 'Reference to egg action (owner/repo/path@ref format). NOTE: GitHub Actions uses: field cannot be dynamic - consuming repos must hardcode their action reference in the uses step below.'
        required: false
        type: string
        default: "jwbron/egg/action@main"
      authorized_users:
        description: 'Comma-separated list of authorized GitHub usernames'
        required: false
        type: string
        default: "jwbron"
      branch_prefix:
        description: 'Prefix for issue branches (e.g., "egg" creates "egg/issue-N")'
        required: false
        type: string
        default: "egg"
      sdlc_label:
        description: 'Label that triggers the SDLC pipeline'
        required: false
        type: string
        default: "egg-sdlc"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

# Prevent concurrent pipeline runs for the same issue
concurrency:
  group: sdlc-pipeline-${{ github.event.inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Resolve inputs for reusable workflow support
  # ============================================================
  resolve-inputs:
    name: Resolve inputs
    runs-on: ubuntu-latest
    outputs:
      bot_username: ${{ steps.resolve.outputs.bot_username }}
      branch_prefix: ${{ steps.resolve.outputs.branch_prefix }}
      sdlc_label: ${{ steps.resolve.outputs.sdlc_label }}
      issue_number: ${{ steps.resolve.outputs.issue_number }}
      starting_phase: ${{ steps.resolve.outputs.starting_phase }}
    steps:
      - name: Resolve inputs with defaults
        id: resolve
        run: |
          # Use inputs if called as reusable workflow, otherwise use defaults
          {
            echo "bot_username=${{ inputs.bot_username || 'james-in-a-box' }}"
            echo "branch_prefix=${{ inputs.branch_prefix || 'egg' }}"
            echo "sdlc_label=${{ inputs.sdlc_label || 'egg-sdlc' }}"
          } >> "$GITHUB_OUTPUT"

          # Determine issue number and starting phase based on trigger type
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            {
              echo "issue_number=${{ inputs.issue_number }}"
              echo "starting_phase=${{ inputs.starting_phase || 'refine' }}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            {
              echo "issue_number=${{ github.event.inputs.issue_number }}"
              echo "starting_phase=${{ github.event.inputs.starting_phase || 'refine' }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "issue_number=${{ github.event.issue.number }}"
              echo "starting_phase=refine"
            } >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # Initialization: Create contract and branch
  # ============================================================
  init:
    name: Initialize pipeline
    needs: resolve-inputs
    runs-on: ubuntu-latest
    # Only trigger on sdlc:refine label, workflow_dispatch, or workflow_call
    if: >-
      always() &&
      needs.resolve-inputs.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'workflow_call') ||
        (github.event_name == 'issues' && github.event.label.name == 'sdlc:refine')
      )
    outputs:
      issue_number: ${{ steps.setup.outputs.issue_number }}
      issue_title: ${{ steps.setup.outputs.issue_title }}
      branch_name: ${{ steps.setup.outputs.branch_name }}
      current_phase: ${{ steps.setup.outputs.current_phase }}
      contract_exists: ${{ steps.setup.outputs.contract_exists }}
      workflow_owner: ${{ steps.setup.outputs.workflow_owner }}

    env:
      BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      BRANCH_PREFIX: ${{ needs.resolve-inputs.outputs.branch_prefix }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install pydantic==2.10.* pyyaml==6.0.*

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Setup pipeline
        id: setup
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ISSUE_NUMBER_INPUT: ${{ needs.resolve-inputs.outputs.issue_number }}
          STARTING_PHASE: ${{ needs.resolve-inputs.outputs.starting_phase }}
          EVENT_SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail

          # Use resolved issue number
          ISSUE_NUMBER="${ISSUE_NUMBER_INPUT}"

          # Validate issue number is numeric (path traversal prevention)
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number: ${ISSUE_NUMBER}"
            exit 1
          fi

          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

          # Fetch issue metadata
          ISSUE_DATA=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}")
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_URL=$(echo "$ISSUE_DATA" | jq -r '.html_url')

          echo "issue_title=${ISSUE_TITLE}" >> "$GITHUB_OUTPUT"

          # Capture workflow owner (the user who triggered the workflow)
          # This is the user who added the sdlc:refine label or dispatched the workflow
          WORKFLOW_OWNER="${EVENT_SENDER:-}"

          # Validate workflow owner format (defense-in-depth)
          # GitHub usernames are alphanumeric with hyphens only
          if [[ -n "$WORKFLOW_OWNER" ]] && ! [[ "$WORKFLOW_OWNER" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "::warning::Invalid workflow owner format, skipping: ${WORKFLOW_OWNER}"
            WORKFLOW_OWNER=""
          fi

          echo "workflow_owner=${WORKFLOW_OWNER}" >> "$GITHUB_OUTPUT"

          # Branch name for this issue (using configured prefix)
          BRANCH_NAME="${BRANCH_PREFIX}/issue-${ISSUE_NUMBER}"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          # Check if branch exists
          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            echo "Branch ${BRANCH_NAME} already exists"
            git checkout "${BRANCH_NAME}"
            git pull origin "${BRANCH_NAME}"
          else
            echo "Creating new branch ${BRANCH_NAME}"
            git checkout -b "${BRANCH_NAME}"
          fi

          # Create state directories
          mkdir -p .egg-state/contracts
          mkdir -p .egg-state/drafts
          mkdir -p .egg-state/reviews

          # Check if contract exists
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if [[ -f "$CONTRACT_PATH" ]]; then
            echo "contract_exists=true" >> "$GITHUB_OUTPUT"
            CURRENT_PHASE=$(jq -r '.current_phase' "$CONTRACT_PATH")
            echo "current_phase=${CURRENT_PHASE}" >> "$GITHUB_OUTPUT"
          else
            echo "contract_exists=false" >> "$GITHUB_OUTPUT"
            echo "current_phase=${STARTING_PHASE}" >> "$GITHUB_OUTPUT"

            # Create initial contract
            # Build workflow_owner value (null if empty, quoted string otherwise)
            if [[ -n "$WORKFLOW_OWNER" ]]; then
              WORKFLOW_OWNER_JSON="\"${WORKFLOW_OWNER}\""
            else
              WORKFLOW_OWNER_JSON="null"
            fi

            cat > "$CONTRACT_PATH" << EOF
          {
            "schemaVersion": "1.0",
            "issue": {
              "number": ${ISSUE_NUMBER},
              "title": $(echo "$ISSUE_TITLE" | jq -R),
              "url": "${ISSUE_URL}"
            },
            "current_phase": "${STARTING_PHASE}",
            "acceptance_criteria": [],
            "phases": [],
            "decisions": [],
            "circuit_breaker": {
              "total_cycles": 0,
              "max_total_cycles": 10,
              "status": "closed"
            },
            "workflow_owner": ${WORKFLOW_OWNER_JSON},
            "audit_log": []
          }
          EOF

            # Commit the contract
            git add "$CONTRACT_PATH"
            git commit -m "Initialize SDLC contract for issue #${ISSUE_NUMBER}"
          fi

      - name: Push branch
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.setup.outputs.branch_name }}
        run: |
          set -euo pipefail
          # Retry push with rebase on conflict
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push -u origin "${BRANCH_NAME}"; then
              echo "Push succeeded"
              break
            elif [[ $i -eq $MAX_RETRIES ]]; then
              echo "Push failed after $MAX_RETRIES attempts"
              exit 1
            else
              echo "Push failed (attempt $i/$MAX_RETRIES), trying rebase..."
              git pull --rebase origin "${BRANCH_NAME}" || {
                echo "Rebase failed, cannot resolve conflict automatically"
                exit 1
              }
            fi
          done

      # Apply the appropriate phase label to the issue
      - name: Apply phase label
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.setup.outputs.issue_number }}
          CURRENT_PHASE: ${{ steps.setup.outputs.current_phase }}
        run: |
          set -euo pipefail

          # Map phase to label
          PHASE_LABEL="sdlc:${CURRENT_PHASE}"

          # Get current labels on the issue
          CURRENT_LABELS=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels" \
            --jq '.[].name' 2>/dev/null || echo "")

          # Check if correct label is already present
          NEEDS_LABEL=true
          if echo "$CURRENT_LABELS" | grep -qx "$PHASE_LABEL"; then
            echo "Correct phase label ${PHASE_LABEL} already present"
            NEEDS_LABEL=false
          fi

          # Remove incorrect phase labels using transition script
          for label in "sdlc:refine" "sdlc:plan" "sdlc:implement" "sdlc:pr"; do
            if [[ "$label" != "$PHASE_LABEL" ]] && echo "$CURRENT_LABELS" | grep -qx "$label"; then
              .github/scripts/transition-sdlc-label.sh \
                --issue "${ISSUE_NUMBER}" \
                --remove "$label"
            fi
          done

          # Add the correct phase label if needed
          if [[ "$NEEDS_LABEL" == "true" ]]; then
            .github/scripts/transition-sdlc-label.sh \
              --issue "${ISSUE_NUMBER}" \
              --add "$PHASE_LABEL"
          fi

          echo "Applied phase label: ${PHASE_LABEL}"

      # Minimize previous pipeline status comments to reduce clutter
      - name: Minimize previous pipeline comments
        if: steps.setup.outputs.contract_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
        run: |
          set -euo pipefail
          # Find previous bot comments that are pipeline status updates
          # Match: "SDLC Pipeline", "phase completed", "phase encountered"
          # shellcheck disable=SC2016
          gh api "repos/${{ github.repository }}/issues/${{ steps.setup.outputs.issue_number }}/comments" \
            | jq -r --arg bot "$BOT_USERNAME" \
            '.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.body | test("SDLC Pipeline|phase completed|phase encountered")) | .node_id' \
          | while read -r node_id; do
              # shellcheck disable=SC2016 # $id is a GraphQL variable, not bash
              if ! gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }
              ' -f id="$node_id"; then
                echo "Warning: Failed to minimize comment $node_id (may lack permissions)"
              fi
            done

      - name: Post initialization comment
        if: steps.setup.outputs.contract_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          BODY="SDLC Pipeline initialized for this issue.

          **Branch:** \`${{ steps.setup.outputs.branch_name }}\`
          **Starting phase:** \`${{ steps.setup.outputs.current_phase }}\`

          The pipeline will now begin the **${{ steps.setup.outputs.current_phase }}** phase.

          --- Authored by egg"

          gh issue comment "${{ steps.setup.outputs.issue_number }}" --repo "${{ github.repository }}" --body "$BODY"

      - name: Close stale PRs
        id: close-stale-prs
        if: steps.setup.outputs.current_phase == 'implement' || steps.setup.outputs.current_phase == 'pr'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.setup.outputs.branch_name }}
        run: |
          set -euo pipefail

          # Close any existing open PRs on this branch (stale from previous runs)
          EXISTING_PRS=$(gh pr list --head "${BRANCH_NAME}" --state open --json number --jq '.[].number')

          if [[ -n "$EXISTING_PRS" ]]; then
            for PR_NUM in $EXISTING_PRS; do
              echo "Closing stale PR #${PR_NUM}"
              gh pr close "${PR_NUM}" --comment "Closing stale PR. A new PR will be created after implementation succeeds."
            done
          else
            echo "No existing open PRs found on branch ${BRANCH_NAME}"
          fi

  # ============================================================
  # Implement: Execute tasks in plan
  # ============================================================
  implement:
    name: Implement tasks
    needs: [resolve-inputs, init]
    if: needs.init.outputs.current_phase == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max, checkpoint at T-10 minutes
    outputs:
      implementation_complete: ${{ steps.implement.outputs.complete }}
      tasks_completed: ${{ steps.implement.outputs.tasks_completed }}
      checkpointed: ${{ steps.checkpoint.outputs.checkpointed }}
      head_sha: ${{ steps.capture-sha.outputs.head_sha }}
      pr_number: ${{ steps.create-pr.outputs.pr_number }}

    env:
      BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted action scripts
        run: |
          cp -r action "$RUNNER_TEMP/trusted-action"
          cp -r shared "$RUNNER_TEMP/trusted-shared"

      - name: Build implement prompt
        id: prompt
        run: bash action/build-sdlc-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_PIPELINE_PHASE: implement
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Populate contract tasks from plan
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Use trusted scripts from main checkout
          pip install -q pyyaml pydantic
          PYTHONPATH="${RUNNER_TEMP}/trusted-shared:${PYTHONPATH:-}" \
            python3 "${RUNNER_TEMP}/trusted-action/populate-contract-tasks.py"

          # Commit if contract was updated
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if ! git diff --quiet "$CONTRACT_PATH" 2>/dev/null; then
            git add "$CONTRACT_PATH"
            git commit -m "Populate contract tasks from plan for issue #${ISSUE_NUMBER}"

            # Create reapply script for retry logic
            # Export RUNNER_TEMP so it's available in the child script
            export RUNNER_TEMP
            cat > /tmp/reapply-populate.sh << 'REAPPLY_EOF'
          pip install -q pyyaml pydantic
          PYTHONPATH="${RUNNER_TEMP}/trusted-shared:${PYTHONPATH:-}" \
            python3 "${RUNNER_TEMP}/trusted-action/populate-contract-tasks.py"
          REAPPLY_EOF

            # Push with conflict-resistant retry logic
            export CONTRACT_PATH
            export BRANCH_NAME
            export COMMIT_MESSAGE="Populate contract tasks from plan for issue #${ISSUE_NUMBER}"
            export JQ_SCRIPT_PATH="/tmp/reapply-populate.sh"
            .github/scripts/push-contract-update.sh
          fi

      - name: Run egg implementer
        id: egg
        continue-on-error: true  # Allow checkpoint on controlled exit
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: "60"
        env:
          EGG_AGENT_ROLE: implementer
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_JOB_START_TIME: ${{ github.event.created_at }}

      - name: Check for timeout checkpoint
        id: checkpoint
        if: always()
        run: |
          set -euo pipefail

          # Check if we're within 10 minutes of timeout
          JOB_TIMEOUT_MINUTES=360
          CHECKPOINT_MARGIN_MINUTES=10

          # Get job start time (approximate using workflow run time)
          START_TIME="${{ github.event.created_at }}"
          if [[ -z "$START_TIME" ]]; then
            START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi

          # Calculate elapsed time
          START_EPOCH=$(date -d "$START_TIME" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$START_TIME" +%s 2>/dev/null || echo "0")
          NOW_EPOCH=$(date +%s)
          ELAPSED_SECONDS=$((NOW_EPOCH - START_EPOCH))
          ELAPSED_MINUTES=$((ELAPSED_SECONDS / 60))

          # Calculate remaining time
          REMAINING_MINUTES=$((JOB_TIMEOUT_MINUTES - ELAPSED_MINUTES))

          echo "Job elapsed: ${ELAPSED_MINUTES} minutes, remaining: ${REMAINING_MINUTES} minutes"

          # Check if we need to checkpoint
          if [[ $REMAINING_MINUTES -le $CHECKPOINT_MARGIN_MINUTES ]]; then
            echo "checkpointed=true" >> "$GITHUB_OUTPUT"
            echo "reason=timeout_approaching" >> "$GITHUB_OUTPUT"

            # Save checkpoint state to contract
            CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
            if [[ -f "$CONTRACT_PATH" ]]; then
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              # Store checkpoint reason for use in JQ_FILTER (needed for reapply on retry)
              CHECKPOINT_REASON="Checkpoint: ${REMAINING_MINUTES} minutes remaining before timeout"

              jq --arg ts "$TIMESTAMP" --arg reason "$CHECKPOINT_REASON" '
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "update",
                  "field_path": "checkpoint",
                  "old_value": null,
                  "new_value": "timeout_checkpoint",
                  "reason": $reason
                }]
              ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"

              git add "$CONTRACT_PATH"
              git commit -m "Checkpoint state before timeout (${REMAINING_MINUTES}m remaining)" || true

              # Create reapply script for retry logic (uses current timestamp on each retry)
              # Export variables needed by the reapply script
              export CHECKPOINT_REASON
              export CONTRACT_PATH
              cat > /tmp/reapply-checkpoint.sh << 'REAPPLY_EOF'
              TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              jq --arg ts "$TS" --arg reason "${CHECKPOINT_REASON}" '
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "update",
                  "field_path": "checkpoint",
                  "old_value": null,
                  "new_value": "timeout_checkpoint",
                  "reason": $reason
                }]
              ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"
          REAPPLY_EOF

              # Push with conflict-resistant retry logic (soft-fail for checkpoints)
              export BRANCH_NAME
              export COMMIT_MESSAGE="Checkpoint state before timeout (${REMAINING_MINUTES}m remaining)"
              export JQ_SCRIPT_PATH="/tmp/reapply-checkpoint.sh"
              export SOFT_FAIL=true
              .github/scripts/push-contract-update.sh
            fi
          else
            echo "checkpointed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update contract state
        id: implement
        run: bash "$RUNNER_TEMP/trusted-action/contract-state.sh" update-after-implement
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          REPO_PATH: ${{ github.workspace }}

      - name: Create draft PR
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ needs.init.outputs.branch_name }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          ISSUE_TITLE: ${{ needs.init.outputs.issue_title }}
          EGG_EXIT_CODE: ${{ steps.egg.outputs.exit-code }}
        run: |
          set -euo pipefail

          # Only create a new PR if implementation succeeded
          if [[ "${EGG_EXIT_CODE}" != "0" ]]; then
            echo "Implementation failed (exit code: ${EGG_EXIT_CODE}) - skipping PR creation"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Try to read PR metadata from contract (planner-generated title/description)
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          CONTRACT_PR_TITLE=""
          CONTRACT_PR_DESC=""
          if [[ -f "$CONTRACT_PATH" ]]; then
            CONTRACT_PR_TITLE=$(jq -r '.pr.title // empty' "$CONTRACT_PATH" 2>/dev/null || true)
            CONTRACT_PR_DESC=$(jq -r '.pr.description // empty' "$CONTRACT_PATH" 2>/dev/null || true)
            if [[ -n "$CONTRACT_PR_TITLE" ]]; then
              echo "Using planner-generated PR metadata from contract"
            fi
          fi

          # Build PR title: use contract title if available, otherwise fall back to issue title
          if [[ -n "$CONTRACT_PR_TITLE" ]]; then
            PR_TITLE="[SDLC] ${CONTRACT_PR_TITLE}"
          else
            PR_TITLE="[SDLC] ${ISSUE_TITLE}"
          fi

          # Build PR body to temp file (avoids shell injection from planner-generated content)
          PR_BODY_FILE=$(mktemp)
          trap 'rm -f "$PR_BODY_FILE"' EXIT

          if [[ -n "$CONTRACT_PR_DESC" ]]; then
            # Use planner-generated description as the summary
            printf '%s\n\n' "## Summary" > "$PR_BODY_FILE"
            printf '%s\n' "$CONTRACT_PR_DESC" >> "$PR_BODY_FILE"
          else
            # Fall back to building body from commit messages (excluding contract-only commits)
            # Get commits on this branch that aren't on main
            # Use a single grep -Ev with || true to avoid exit code 1 when all lines are filtered
            COMMIT_MESSAGES=$(git log origin/main..HEAD --pretty=format:'%s%n%n%b' --reverse \
              | grep -Ev "^(Initialize SDLC contract|Populate contract tasks|Advance to .* phase|Checkpoint state)" || true)
            # Clean up consecutive blank lines
            COMMIT_MESSAGES=$(echo "$COMMIT_MESSAGES" | sed '/^$/N;/^\n$/d')

            # Fallback if all commits were filtered out
            if [[ -z "$COMMIT_MESSAGES" ]]; then
              COMMIT_MESSAGES="Initial implementation (see commit history for details)"
            fi

            printf '%s\n\n' "## Summary" > "$PR_BODY_FILE"
            printf '%s\n' "$COMMIT_MESSAGES" >> "$PR_BODY_FILE"
          fi

          # Add standard footer
          {
            printf '\n---\n\n'
            printf 'Closes #%s\n' "${ISSUE_NUMBER}"
            # shellcheck disable=SC2016 # Backticks are literal markdown, not command substitution
            printf 'Branch: `%s`\n\n' "${BRANCH_NAME}"
            printf '%s\n' "This PR is managed by the SDLC pipeline. It will be marked ready for review once the implementation passes automated review."
          } >> "$PR_BODY_FILE"

          PR_URL=$(gh pr create \
            --draft \
            --title "$PR_TITLE" \
            --body-file "$PR_BODY_FILE" \
            --base main \
            --head "${BRANCH_NAME}")

          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::Failed to extract PR number from URL: ${PR_URL}"
            exit 1
          fi
          echo "Created draft PR #${PR_NUMBER}"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          # Add sdlc:pr label to trigger contract verification workflow
          gh pr edit "${PR_NUMBER}" --add-label "sdlc:pr" || {
            echo "::warning::Failed to add sdlc:pr label (label may not exist)"
          }

          # Transition issue from sdlc:implement to sdlc:pr using transition script
          .github/scripts/transition-sdlc-label.sh \
            --issue "${ISSUE_NUMBER}" \
            --from "sdlc:implement" \
            --to "sdlc:pr"

      # Minimize previous pipeline status comments to reduce clutter
      - name: Minimize previous pipeline comments
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          # Find previous bot comments that are pipeline status updates
          # shellcheck disable=SC2016
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            | jq -r --arg bot "$BOT_USERNAME" \
            '.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.body | test("SDLC Pipeline|phase completed|phase encountered|Pull request ready")) | .node_id' \
          | while read -r node_id; do
              # shellcheck disable=SC2016 # $id is a GraphQL variable, not bash
              if ! gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }
              ' -f id="$node_id"; then
                echo "Warning: Failed to minimize comment $node_id (may lack permissions)"
              fi
            done

      - name: Post status comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          EGG_EXIT_CODE: ${{ steps.egg.outputs.exit-code }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${EGG_EXIT_CODE:-1}" == "0" ]]; then
            BODY="Implementation phase completed. [View run logs](${RUN_URL})

          --- Authored by egg"
          else
            BODY="Implementation phase encountered issues (exit code: ${EGG_EXIT_CODE:-unknown}).
          [View run logs](${RUN_URL})

          --- Authored by egg"
          fi

          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body "$BODY"

      - name: Capture final HEAD SHA
        id: capture-sha
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ needs.init.outputs.branch_name }}
        run: |
          set -euo pipefail
          # Fetch latest from remote to capture the final SHA after all pushes
          git fetch origin "${BRANCH_NAME}" --quiet
          HEAD_SHA=$(git rev-parse "origin/${BRANCH_NAME}")
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Captured final HEAD SHA: ${HEAD_SHA}"

  # ============================================================
  # PR Finalization (Event-Driven)
  # ============================================================
  #
  # After the implement job completes and creates a draft PR, the pipeline
  # hands off to the event-driven on-check-success.yml workflow. This workflow
  # is triggered by workflow_run events when CI checks (Lint, Test, Code Review,
  # Contract Verification) complete.
  #
  # When all checks pass and no automated reviewers have requested changes,
  # on-check-success.yml will:
  # - Mark the draft PR as ready for review
  # - Update the PR title/body
  # - Assign the workflow owner as reviewer
  # - Update the contract phase to "pr"
  # - Post completion comment to the SDLC issue
  #
  # This replaces the previous polling-based wait-for-checks, finalize-pr, and
  # checks-failed jobs, eliminating up to 30 minutes of wasted runner time.
  #
  # See: .github/workflows/on-check-success.yml
  # Issue: #387
  # ============================================================

  # ============================================================
  # Refine: Analyze issue and produce analysis document
  # ============================================================
  refine:
    name: Refine issue
    needs: [resolve-inputs, init]
    if: needs.init.outputs.current_phase == 'refine'
    runs-on: ubuntu-latest

    env:
      BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build refine prompt
        id: prompt
        run: bash action/build-sdlc-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_PIPELINE_PHASE: refine
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Run egg refiner
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: "30"
        env:
          EGG_AGENT_ROLE: implementer
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}

      - name: Validate refine output
        id: validate-refine
        if: steps.egg.outputs.exit-code == '0'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          # Check that the agent wrote an analysis draft file to .egg-state/drafts/
          # Pull latest to ensure we have the agent's commits
          for i in 1 2 3; do
            if git pull origin "${BRANCH_NAME}" --rebase; then
              break
            fi
            echo "::warning::git pull attempt $i failed, retrying..."
            sleep 2
          done

          DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-analysis.md"
          if [[ -f "$DRAFT_FILE" ]]; then
            # Verify the draft has expected content
            if grep -qE '## Problem Statement|## Recommended Approach|## Analysis' "$DRAFT_FILE"; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "Draft analysis found at ${DRAFT_FILE}"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "Draft file exists but missing expected sections"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No draft file found at ${DRAFT_FILE}"
          fi

      # Minimize previous pipeline status comments to reduce clutter
      - name: Minimize previous pipeline comments
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          # Find previous bot comments that are pipeline status updates
          # shellcheck disable=SC2016
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            | jq -r --arg bot "$BOT_USERNAME" \
            '.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.body | test("SDLC Pipeline|phase completed|phase encountered")) | .node_id' \
          | while read -r node_id; do
              # shellcheck disable=SC2016 # $id is a GraphQL variable, not bash
              if ! gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }
              ' -f id="$node_id"; then
                echo "Warning: Failed to minimize comment $node_id (may lack permissions)"
              fi
            done

      - name: Post failure comment
        if: always() && (steps.egg.outputs.exit-code != '0' || steps.validate-refine.outputs.found != 'true')
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          EGG_EXIT_CODE: ${{ steps.egg.outputs.exit-code }}
          ANALYSIS_FOUND: ${{ steps.validate-refine.outputs.found }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${EGG_EXIT_CODE:-1}" == "0" ]] && [[ "${ANALYSIS_FOUND:-}" != "true" ]]; then
            BODY="**Warning:** Refine phase exited successfully but no analysis draft was found. The agent may have failed to write to \`.egg-state/drafts/\`. [View run logs](${RUN_URL})

          Please check the run logs and retry if needed.

          --- Authored by egg"
          elif [[ "${EGG_EXIT_CODE:-1}" != "0" ]]; then
            BODY="Refine phase encountered issues (exit code: ${EGG_EXIT_CODE:-unknown}). [View run logs](${RUN_URL})

          --- Authored by egg"
          fi

          # Only post if BODY is set (success cases don't post here - they wait for review)
          if [[ -n "${BODY:-}" ]]; then
            gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body "$BODY"
          fi

  # ============================================================
  # Refine Review: Review the analysis before human approval
  # ============================================================
  refine-review:
    name: Review analysis
    needs: [resolve-inputs, init, refine]
    if: >-
      always() &&
      needs.init.outputs.current_phase == 'refine' &&
      needs.refine.result == 'success'
    runs-on: ubuntu-latest

    env:
      BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}

    outputs:
      review_passed: ${{ steps.parse-verdict.outputs.passed }}
      review_feedback: ${{ steps.parse-verdict.outputs.feedback }}
      review_cycle: ${{ steps.get-cycle.outputs.cycle }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted action scripts
        run: |
          cp -r action "$RUNNER_TEMP/trusted-action"
          cp -r shared "$RUNNER_TEMP/trusted-shared"

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Get review cycle from contract
        id: get-cycle
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            # For refine phase, we track cycles in a special refine_review_cycles field
            # Since refine doesn't have phases, we store it at the top level
            CYCLE=$(jq -r '.refine_review_cycles // 0' "$CONTRACT_PATH")
            CYCLE=$((CYCLE + 1))
            {
              echo "cycle=${CYCLE}"

              # Get prior feedback if this is a re-review
              if [[ "$CYCLE" -gt 1 ]]; then
                PRIOR=$(jq -r '.refine_review_feedback // ""' "$CONTRACT_PATH")
                echo "prior_feedback<<EOF"
                echo "$PRIOR"
                echo "EOF"
              fi
            } >> "$GITHUB_OUTPUT"
          else
            echo "cycle=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check circuit breaker
        id: check-circuit-breaker
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            STATUS=$(jq -r '.circuit_breaker.status // "closed"' "$CONTRACT_PATH")
            if [[ "$STATUS" == "open" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Circuit breaker is OPEN — skipping review"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build refine review prompt
        id: prompt
        if: steps.check-circuit-breaker.outputs.skip != 'true'
        run: bash "$RUNNER_TEMP/trusted-action/build-refine-review-prompt.sh"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          REVIEW_CYCLE: ${{ steps.get-cycle.outputs.cycle }}
          PRIOR_FEEDBACK: ${{ steps.get-cycle.outputs.prior_feedback }}

      - name: Run reviewer agent
        id: egg
        if: steps.check-circuit-breaker.outputs.skip != 'true'
        uses: jwbron/egg/action@main
        with:
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          model: ${{ steps.prompt.outputs.model }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: "15"
        env:
          EGG_AGENT_ROLE: reviewer
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}

      - name: Parse review verdict
        id: parse-verdict
        if: steps.check-circuit-breaker.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Pull latest to ensure we have the reviewer's commits
          for i in 1 2 3; do
            if git pull origin "${BRANCH_NAME}" --rebase; then
              break
            fi
            echo "::warning::git pull attempt $i failed, retrying..."
            sleep 2
          done

          # Read verdict from the review JSON file
          REVIEW_FILE=".egg-state/reviews/${ISSUE_NUMBER}-refine-review.json"

          if [[ -f "$REVIEW_FILE" ]]; then
            VERDICT=$(jq -r '.verdict // ""' "$REVIEW_FILE")
            FEEDBACK=$(jq -r '.feedback // ""' "$REVIEW_FILE")

            if [[ "$VERDICT" == "approved" ]]; then
              {
                echo "passed=true"
                echo "feedback="
              } >> "$GITHUB_OUTPUT"
              echo "Review verdict: APPROVED"
            elif [[ "$VERDICT" == "needs_revision" ]]; then
              {
                echo "passed=false"
                echo "feedback<<EOF"
                echo "$FEEDBACK"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              echo "Review verdict: NEEDS REVISION"
            else
              # Unknown verdict — treat as passed to avoid blocking
              {
                echo "passed=true"
                echo "feedback="
              } >> "$GITHUB_OUTPUT"
              echo "::warning::Unknown review verdict '${VERDICT}' — proceeding as if approved"
            fi
          else
            # No review file found — treat as passed to avoid blocking
            {
              echo "passed=true"
              echo "feedback="
            } >> "$GITHUB_OUTPUT"
            echo "::warning::No review file found at ${REVIEW_FILE} — proceeding as if approved"
          fi

      - name: Update contract with review state
        if: steps.check-circuit-breaker.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REVIEW_PASSED: ${{ steps.parse-verdict.outputs.passed }}
          REVIEW_FEEDBACK: ${{ steps.parse-verdict.outputs.feedback }}
          REVIEW_CYCLE: ${{ steps.get-cycle.outputs.cycle }}
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          set -euo pipefail

          git config user.name "${BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${BOT_USERNAME}[bot]@users.noreply.github.com"

          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            # Create reapply script for retry logic (complex multi-step jq)
            cat > /tmp/reapply-refine-review.sh << 'REAPPLY_EOF'
            TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            # Update the contract with review cycle info
            # Capture old value before update
            OLD_CYCLES=$(jq -r '.refine_review_cycles // 0' "$CONTRACT_PATH")

            jq --arg cycle "$REVIEW_CYCLE" \
               --arg feedback "$REVIEW_FEEDBACK" \
               --arg ts "$TS" \
               --arg passed "$REVIEW_PASSED" \
               --arg old_cycles "$OLD_CYCLES" '
              .refine_review_cycles = ($cycle | tonumber) |
              .refine_review_feedback = $feedback |
              .audit_log += [{
                "timestamp": $ts,
                "actor": "system",
                "role": "reviewer",
                "action": "update",
                "field_path": "refine_review_cycles",
                "old_value": ($old_cycles | tonumber),
                "new_value": ($cycle | tonumber),
                "reason": ("Refine review cycle " + $cycle + ": " + (if $passed == "true" then "approved" else "needs_revision" end))
              }]
            ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"

            # Check if we've exceeded max cycles (3 by default)
            MAX_CYCLES=3
            if [[ "$REVIEW_PASSED" != "true" && "$REVIEW_CYCLE" -ge "$MAX_CYCLES" ]]; then
              # Add audit entry for circuit breaker opening
              OLD_CB_STATUS=$(jq -r '.circuit_breaker.status // "closed"' "$CONTRACT_PATH")
              jq --arg ts "$TS" --arg old_status "$OLD_CB_STATUS" '
                .circuit_breaker.status = "open" |
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "update",
                  "field_path": "circuit_breaker.status",
                  "old_value": $old_status,
                  "new_value": "open",
                  "reason": "Max refine review cycles exceeded"
                }]
              ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"
              echo "::warning::Max review cycles exceeded — circuit breaker OPEN"
            fi
          REAPPLY_EOF

            # Apply transformation initially
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            OLD_CYCLES=$(jq -r '.refine_review_cycles // 0' "$CONTRACT_PATH")

            jq --arg cycle "$REVIEW_CYCLE" \
               --arg feedback "$REVIEW_FEEDBACK" \
               --arg ts "$TIMESTAMP" \
               --arg passed "$REVIEW_PASSED" \
               --arg old_cycles "$OLD_CYCLES" '
              .refine_review_cycles = ($cycle | tonumber) |
              .refine_review_feedback = $feedback |
              .audit_log += [{
                "timestamp": $ts,
                "actor": "system",
                "role": "reviewer",
                "action": "update",
                "field_path": "refine_review_cycles",
                "old_value": ($old_cycles | tonumber),
                "new_value": ($cycle | tonumber),
                "reason": ("Refine review cycle " + $cycle + ": " + (if $passed == "true" then "approved" else "needs_revision" end))
              }]
            ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"

            # Check if we've exceeded max cycles (3 by default)
            MAX_CYCLES=3
            if [[ "$REVIEW_PASSED" != "true" && "$REVIEW_CYCLE" -ge "$MAX_CYCLES" ]]; then
              OLD_CB_STATUS=$(jq -r '.circuit_breaker.status // "closed"' "$CONTRACT_PATH")
              jq --arg ts "$TIMESTAMP" --arg old_status "$OLD_CB_STATUS" '
                .circuit_breaker.status = "open" |
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "update",
                  "field_path": "circuit_breaker.status",
                  "old_value": $old_status,
                  "new_value": "open",
                  "reason": "Max refine review cycles exceeded"
                }]
              ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"
              echo "::warning::Max review cycles exceeded — circuit breaker OPEN"
            fi

            git add "$CONTRACT_PATH"
            git commit -m "Update refine review state (cycle ${REVIEW_CYCLE})" || true

            # Push with conflict-resistant retry logic
            export CONTRACT_PATH
            export BRANCH_NAME
            export COMMIT_MESSAGE="Update refine review state (cycle ${REVIEW_CYCLE})"
            export JQ_SCRIPT_PATH="/tmp/reapply-refine-review.sh"
            export REVIEW_CYCLE
            export REVIEW_FEEDBACK
            export REVIEW_PASSED
            .github/scripts/push-contract-update.sh
          fi

      - name: Post final analysis to issue
        if: steps.check-circuit-breaker.outputs.skip != 'true' && steps.parse-verdict.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-analysis.md"

          if [[ -f "$DRAFT_FILE" ]]; then
            # Read the draft analysis content and create the final comment
            ANALYSIS_CONTENT=$(cat "$DRAFT_FILE")
            {
              echo "$ANALYSIS_CONTENT"
              echo ""
              echo "---"
              echo ""
              echo "## Refine Phase Complete"
              echo ""
              echo "The analysis above has passed internal review and is ready for human approval."
              echo ""
              echo "[View run logs](${RUN_URL})"
              echo ""
              echo "### Ready for Review"
              echo ""
              echo "<!-- egg-phase-approval -->"
              echo "- [ ] Approve and advance to plan phase"
              echo ""
              echo "---"
              echo ""
              echo "*Authored-by: egg*"
            } > /tmp/final-analysis.md

            gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/final-analysis.md
          else
            # Fallback: post a simple message if draft not found
            {
              echo "**Analysis review passed.** ✅"
              echo ""
              echo "The analysis has been reviewed and approved by the automated reviewer, but the draft file was not found."
              echo "Please check the run logs."
              echo ""
              echo "[View run logs](${RUN_URL})"
              echo ""
              echo "### Ready for Review"
              echo ""
              echo "<!-- egg-phase-approval -->"
              echo "- [ ] Approve and advance to plan phase"
              echo ""
              echo "---"
              echo ""
              echo "*Authored-by: egg*"
            } > /tmp/fallback-analysis.md

            gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/fallback-analysis.md
          fi

          # Add sdlc:awaiting-approval label to indicate human review is needed
          .github/scripts/transition-sdlc-label.sh \
            --issue "${ISSUE_NUMBER}" \
            --add "sdlc:awaiting-approval" || {
              echo "Warning: Failed to add sdlc:awaiting-approval label"
            }

  # ============================================================
  # Refine Re-dispatch: Re-run refine if review failed
  # ============================================================
  refine-redispatch:
    name: Re-dispatch refine
    needs: [init, refine, refine-review]
    if: >-
      always() &&
      needs.init.outputs.current_phase == 'refine' &&
      needs.refine-review.result == 'success' &&
      needs.refine-review.outputs.review_passed == 'false'
    runs-on: ubuntu-latest

    env:
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}
      REVIEW_CYCLE: ${{ needs.refine-review.outputs.review_cycle }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Check circuit breaker before re-dispatch
        id: check-circuit-breaker
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            STATUS=$(jq -r '.circuit_breaker.status // "closed"' "$CONTRACT_PATH")
            if [[ "$STATUS" == "open" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Circuit breaker is OPEN — escalating to human instead of re-dispatch"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post escalation comment with draft
        if: steps.check-circuit-breaker.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-analysis.md"
          REVIEW_FILE=".egg-state/reviews/${ISSUE_NUMBER}-refine-review.json"

          # Read the last review feedback if available
          LAST_FEEDBACK=""
          if [[ -f "$REVIEW_FILE" ]]; then
            LAST_FEEDBACK=$(jq -r '.feedback // ""' "$REVIEW_FILE")
          fi

          {
            echo "**⚠️ Refine phase escalated to human review.**"
            echo ""
            echo "The analysis has gone through ${REVIEW_CYCLE} review cycles without passing automated review."
            echo ""
            if [[ -n "$LAST_FEEDBACK" ]]; then
              echo "### Unresolved Issues from Last Review"
              echo ""
              echo "$LAST_FEEDBACK"
              echo ""
            fi
            echo "---"
            echo ""
            if [[ -f "$DRAFT_FILE" ]]; then
              echo "### Current Draft Analysis"
              echo ""
              cat "$DRAFT_FILE"
              echo ""
            fi
            echo "---"
            echo ""
            echo "Human intervention is required to either:"
            echo ""
            echo "1. Provide guidance on the analysis issues"
            echo "2. Override and approve the analysis as-is"
            echo "3. Cancel and restart with different approach"
            echo ""
            echo "[View run logs](${RUN_URL})"
            echo ""
            echo "---"
            echo ""
            echo "<!-- egg-phase-approval -->"
            echo "- [ ] Override: Approve analysis and advance to plan phase"
            echo ""
            echo "---"
            echo ""
            echo "*Authored-by: egg*"
          } > /tmp/escalation.md

          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/escalation.md

          # Add sdlc:awaiting-approval label for escalation
          .github/scripts/transition-sdlc-label.sh \
            --issue "${ISSUE_NUMBER}" \
            --add "sdlc:awaiting-approval" || true

      - name: Re-dispatch refine phase
        if: steps.check-circuit-breaker.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          echo "Re-dispatching refine phase (cycle $((REVIEW_CYCLE + 1)))"

          gh workflow run sdlc-pipeline.yml \
            --field issue_number="${ISSUE_NUMBER}" \
            --field starting_phase="refine"

  # ============================================================
  # Plan: Create implementation plan
  # ============================================================
  plan:
    name: Create plan
    needs: [resolve-inputs, init]
    if: needs.init.outputs.current_phase == 'plan'
    runs-on: ubuntu-latest

    env:
      BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted action scripts
        run: |
          cp -r action "$RUNNER_TEMP/trusted-action"
          cp -r shared "$RUNNER_TEMP/trusted-shared"

      - name: Build plan prompt
        id: prompt
        run: bash action/build-sdlc-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_PIPELINE_PHASE: plan
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Run egg planner
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: "30"
        env:
          EGG_AGENT_ROLE: implementer
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}

      - name: Validate plan output
        id: validate-plan
        if: steps.egg.outputs.exit-code == '0'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          # Check that the agent wrote a plan draft file to .egg-state/drafts/
          # Pull latest to ensure we have the agent's commits
          for i in 1 2 3; do
            if git pull origin "${BRANCH_NAME}" --rebase; then
              break
            fi
            echo "::warning::git pull attempt $i failed, retrying..."
            sleep 2
          done

          DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-plan.md"
          if [[ -f "$DRAFT_FILE" ]]; then
            # Verify the draft has expected content
            if grep -qE '## Implementation Phases|## Test Strategy|## Implementation Plan' "$DRAFT_FILE"; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "Draft plan found at ${DRAFT_FILE}"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "Draft file exists but missing expected sections"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No draft file found at ${DRAFT_FILE}"
          fi

      - name: Populate contract from plan
        id: populate-contract
        if: steps.egg.outputs.exit-code == '0' && steps.validate-plan.outputs.found == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          set -euo pipefail

          # Configure git for potential commit
          git config user.name "${BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${BOT_USERNAME}[bot]@users.noreply.github.com"

          # Install dependencies and run the populate script from trusted copies
          pip install -q pyyaml pydantic
          PYTHONPATH="${RUNNER_TEMP}/trusted-shared:${PYTHONPATH:-}" \
            python3 "${RUNNER_TEMP}/trusted-action/populate-contract-tasks.py"

          # Commit if contract was updated
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if ! git diff --quiet "$CONTRACT_PATH" 2>/dev/null; then
            git add "$CONTRACT_PATH"
            git commit -m "Populate contract from plan for issue #${ISSUE_NUMBER}"

            # Create reapply script for retry logic
            # Export RUNNER_TEMP so it's available in the child script
            export RUNNER_TEMP
            cat > /tmp/reapply-populate-plan.sh << 'REAPPLY_EOF'
            pip install -q pyyaml pydantic
            PYTHONPATH="${RUNNER_TEMP}/trusted-shared:${PYTHONPATH:-}" \
              python3 "${RUNNER_TEMP}/trusted-action/populate-contract-tasks.py"
          REAPPLY_EOF

            # Push with conflict-resistant retry logic
            export CONTRACT_PATH
            export BRANCH_NAME
            export COMMIT_MESSAGE="Populate contract from plan for issue #${ISSUE_NUMBER}"
            export JQ_SCRIPT_PATH="/tmp/reapply-populate-plan.sh"
            .github/scripts/push-contract-update.sh

            echo "Contract populated and pushed"
          else
            echo "Contract already up to date"
          fi

      - name: Post PR metadata comment
        if: steps.egg.outputs.exit-code == '0' && steps.populate-contract.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Read PR metadata from contract
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if [[ ! -f "$CONTRACT_PATH" ]]; then
            echo "Contract not found, skipping PR metadata comment"
            exit 0
          fi

          PR_TITLE=$(jq -r '.pr.title // empty' "$CONTRACT_PATH" 2>/dev/null || true)
          PR_DESC=$(jq -r '.pr.description // empty' "$CONTRACT_PATH" 2>/dev/null || true)

          if [[ -z "$PR_TITLE" ]]; then
            echo "No PR metadata in contract, skipping comment"
            exit 0
          fi

          # Post PR metadata as a separate comment for easy editing
          # Use a temp file to avoid shell injection from planner-generated content
          COMMENT_FILE=$(mktemp)
          trap 'rm -f "$COMMENT_FILE"' EXIT

          {
            printf '%s\n\n' "## Planned PR Metadata"
            printf '%s\n' "The following title and description will be used when creating the pull request."
            printf '%s\n\n' "You can edit this comment to adjust the PR content before approving the plan."
            printf '%s\n' "**Title:**"
            printf '%s\n' '```'
            printf '%s\n' "$PR_TITLE"
            printf '%s\n\n' '```'
            printf '%s\n' "**Description:**"
            printf '%s\n' "$PR_DESC"
            printf '\n---\n\n'
            printf '%s\n' "*Authored-by: egg*"
          } > "$COMMENT_FILE"

          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file "$COMMENT_FILE"
          echo "Posted PR metadata comment"

      # Minimize previous pipeline status comments to reduce clutter
      - name: Minimize previous pipeline comments
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          # Find previous bot comments that are pipeline status updates
          # shellcheck disable=SC2016
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            | jq -r --arg bot "$BOT_USERNAME" \
            '.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.body | test("SDLC Pipeline|phase completed|phase encountered")) | .node_id' \
          | while read -r node_id; do
              # shellcheck disable=SC2016 # $id is a GraphQL variable, not bash
              if ! gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }
              ' -f id="$node_id"; then
                echo "Warning: Failed to minimize comment $node_id (may lack permissions)"
              fi
            done

      - name: Post failure comment
        if: always() && (steps.egg.outputs.exit-code != '0' || steps.validate-plan.outputs.found != 'true')
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          EGG_EXIT_CODE: ${{ steps.egg.outputs.exit-code }}
          PLAN_FOUND: ${{ steps.validate-plan.outputs.found }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${EGG_EXIT_CODE:-1}" == "0" ]] && [[ "${PLAN_FOUND:-}" != "true" ]]; then
            BODY="**Warning:** Plan phase exited successfully but no plan draft was found. The agent may have failed to write to \`.egg-state/drafts/\`. [View run logs](${RUN_URL})

          Please check the run logs and retry if needed.

          --- Authored by egg"
          elif [[ "${EGG_EXIT_CODE:-1}" != "0" ]]; then
            BODY="Plan phase encountered issues (exit code: ${EGG_EXIT_CODE:-unknown}). [View run logs](${RUN_URL})

          --- Authored by egg"
          fi

          # Only post if BODY is set (success cases don't post here - they wait for review)
          if [[ -n "${BODY:-}" ]]; then
            gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body "$BODY"
          fi

  # ============================================================
  # Plan Review: Review the plan before human approval
  # ============================================================
  plan-review:
    name: Review plan
    needs: [resolve-inputs, init, plan]
    if: >-
      always() &&
      needs.init.outputs.current_phase == 'plan' &&
      needs.plan.result == 'success'
    runs-on: ubuntu-latest

    env:
      BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}

    outputs:
      review_passed: ${{ steps.parse-verdict.outputs.passed }}
      review_feedback: ${{ steps.parse-verdict.outputs.feedback }}
      review_cycle: ${{ steps.get-cycle.outputs.cycle }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted action scripts
        run: |
          cp -r action "$RUNNER_TEMP/trusted-action"
          cp -r shared "$RUNNER_TEMP/trusted-shared"

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Get review cycle from contract
        id: get-cycle
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            # For plan phase, we track cycles in a special plan_review_cycles field
            CYCLE=$(jq -r '.plan_review_cycles // 0' "$CONTRACT_PATH")
            CYCLE=$((CYCLE + 1))
            {
              echo "cycle=${CYCLE}"

              # Get prior feedback if this is a re-review
              if [[ "$CYCLE" -gt 1 ]]; then
                PRIOR=$(jq -r '.plan_review_feedback // ""' "$CONTRACT_PATH")
                echo "prior_feedback<<EOF"
                echo "$PRIOR"
                echo "EOF"
              fi
            } >> "$GITHUB_OUTPUT"
          else
            echo "cycle=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check circuit breaker
        id: check-circuit-breaker
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            STATUS=$(jq -r '.circuit_breaker.status // "closed"' "$CONTRACT_PATH")
            if [[ "$STATUS" == "open" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Circuit breaker is OPEN — skipping review"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plan review prompt
        id: prompt
        if: steps.check-circuit-breaker.outputs.skip != 'true'
        run: bash "$RUNNER_TEMP/trusted-action/build-plan-review-prompt.sh"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          REVIEW_CYCLE: ${{ steps.get-cycle.outputs.cycle }}
          PRIOR_FEEDBACK: ${{ steps.get-cycle.outputs.prior_feedback }}

      - name: Run reviewer agent
        id: egg
        if: steps.check-circuit-breaker.outputs.skip != 'true'
        uses: jwbron/egg/action@main
        with:
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          model: ${{ steps.prompt.outputs.model }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: "15"
        env:
          EGG_AGENT_ROLE: reviewer
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}

      - name: Parse review verdict
        id: parse-verdict
        if: steps.check-circuit-breaker.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Pull latest to ensure we have the reviewer's commits
          for i in 1 2 3; do
            if git pull origin "${BRANCH_NAME}" --rebase; then
              break
            fi
            echo "::warning::git pull attempt $i failed, retrying..."
            sleep 2
          done

          # Read verdict from the review JSON file
          REVIEW_FILE=".egg-state/reviews/${ISSUE_NUMBER}-plan-review.json"

          if [[ -f "$REVIEW_FILE" ]]; then
            VERDICT=$(jq -r '.verdict // ""' "$REVIEW_FILE")
            FEEDBACK=$(jq -r '.feedback // ""' "$REVIEW_FILE")

            if [[ "$VERDICT" == "approved" ]]; then
              {
                echo "passed=true"
                echo "feedback="
              } >> "$GITHUB_OUTPUT"
              echo "Review verdict: APPROVED"
            elif [[ "$VERDICT" == "needs_revision" ]]; then
              {
                echo "passed=false"
                echo "feedback<<EOF"
                echo "$FEEDBACK"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              echo "Review verdict: NEEDS REVISION"
            else
              # Unknown verdict — treat as passed to avoid blocking
              {
                echo "passed=true"
                echo "feedback="
              } >> "$GITHUB_OUTPUT"
              echo "::warning::Unknown review verdict '${VERDICT}' — proceeding as if approved"
            fi
          else
            # No review file found — treat as passed to avoid blocking
            {
              echo "passed=true"
              echo "feedback="
            } >> "$GITHUB_OUTPUT"
            echo "::warning::No review file found at ${REVIEW_FILE} — proceeding as if approved"
          fi

      - name: Update contract with review state
        if: steps.check-circuit-breaker.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REVIEW_PASSED: ${{ steps.parse-verdict.outputs.passed }}
          REVIEW_FEEDBACK: ${{ steps.parse-verdict.outputs.feedback }}
          REVIEW_CYCLE: ${{ steps.get-cycle.outputs.cycle }}
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          set -euo pipefail

          git config user.name "${BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${BOT_USERNAME}[bot]@users.noreply.github.com"

          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            # Create reapply script for retry logic (complex multi-step jq)
            cat > /tmp/reapply-plan-review.sh << 'REAPPLY_EOF'
            TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            # Capture old value before update
            OLD_CYCLES=$(jq -r '.plan_review_cycles // 0' "$CONTRACT_PATH")

            # Update the contract with review cycle info
            jq --arg cycle "$REVIEW_CYCLE" \
               --arg feedback "$REVIEW_FEEDBACK" \
               --arg ts "$TS" \
               --arg passed "$REVIEW_PASSED" \
               --arg old_cycles "$OLD_CYCLES" '
              .plan_review_cycles = ($cycle | tonumber) |
              .plan_review_feedback = $feedback |
              .audit_log += [{
                "timestamp": $ts,
                "actor": "system",
                "role": "reviewer",
                "action": "update",
                "field_path": "plan_review_cycles",
                "old_value": ($old_cycles | tonumber),
                "new_value": ($cycle | tonumber),
                "reason": ("Plan review cycle " + $cycle + ": " + (if $passed == "true" then "approved" else "needs_revision" end))
              }]
            ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"

            # Check if we've exceeded max cycles (3 by default)
            MAX_CYCLES=3
            if [[ "$REVIEW_PASSED" != "true" && "$REVIEW_CYCLE" -ge "$MAX_CYCLES" ]]; then
              # Add audit entry for circuit breaker opening
              OLD_CB_STATUS=$(jq -r '.circuit_breaker.status // "closed"' "$CONTRACT_PATH")
              jq --arg ts "$TS" --arg old_status "$OLD_CB_STATUS" '
                .circuit_breaker.status = "open" |
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "update",
                  "field_path": "circuit_breaker.status",
                  "old_value": $old_status,
                  "new_value": "open",
                  "reason": "Max plan review cycles exceeded"
                }]
              ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"
              echo "::warning::Max review cycles exceeded — circuit breaker OPEN"
            fi
          REAPPLY_EOF

            # Apply transformation initially
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            OLD_CYCLES=$(jq -r '.plan_review_cycles // 0' "$CONTRACT_PATH")

            jq --arg cycle "$REVIEW_CYCLE" \
               --arg feedback "$REVIEW_FEEDBACK" \
               --arg ts "$TIMESTAMP" \
               --arg passed "$REVIEW_PASSED" \
               --arg old_cycles "$OLD_CYCLES" '
              .plan_review_cycles = ($cycle | tonumber) |
              .plan_review_feedback = $feedback |
              .audit_log += [{
                "timestamp": $ts,
                "actor": "system",
                "role": "reviewer",
                "action": "update",
                "field_path": "plan_review_cycles",
                "old_value": ($old_cycles | tonumber),
                "new_value": ($cycle | tonumber),
                "reason": ("Plan review cycle " + $cycle + ": " + (if $passed == "true" then "approved" else "needs_revision" end))
              }]
            ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"

            # Check if we've exceeded max cycles (3 by default)
            MAX_CYCLES=3
            if [[ "$REVIEW_PASSED" != "true" && "$REVIEW_CYCLE" -ge "$MAX_CYCLES" ]]; then
              OLD_CB_STATUS=$(jq -r '.circuit_breaker.status // "closed"' "$CONTRACT_PATH")
              jq --arg ts "$TIMESTAMP" --arg old_status "$OLD_CB_STATUS" '
                .circuit_breaker.status = "open" |
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "update",
                  "field_path": "circuit_breaker.status",
                  "old_value": $old_status,
                  "new_value": "open",
                  "reason": "Max plan review cycles exceeded"
                }]
              ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"
              echo "::warning::Max review cycles exceeded — circuit breaker OPEN"
            fi

            git add "$CONTRACT_PATH"
            git commit -m "Update plan review state (cycle ${REVIEW_CYCLE})" || true

            # Push with conflict-resistant retry logic
            export CONTRACT_PATH
            export BRANCH_NAME
            export COMMIT_MESSAGE="Update plan review state (cycle ${REVIEW_CYCLE})"
            export JQ_SCRIPT_PATH="/tmp/reapply-plan-review.sh"
            export REVIEW_CYCLE
            export REVIEW_FEEDBACK
            export REVIEW_PASSED
            .github/scripts/push-contract-update.sh
          fi

      - name: Post final plan to issue
        if: steps.check-circuit-breaker.outputs.skip != 'true' && steps.parse-verdict.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-plan.md"

          if [[ -f "$DRAFT_FILE" ]]; then
            # Read the draft plan content and create the final comment
            PLAN_CONTENT=$(cat "$DRAFT_FILE")
            {
              echo "$PLAN_CONTENT"
              echo ""
              echo "---"
              echo ""
              echo "## Plan Phase Complete"
              echo ""
              echo "The implementation plan above has passed internal review and is ready for human approval."
              echo ""
              echo "[View run logs](${RUN_URL})"
              echo ""
              echo "### Ready for Review"
              echo ""
              echo "<!-- egg-phase-approval -->"
              echo "- [ ] Approve and advance to implement phase"
              echo ""
              echo "---"
              echo ""
              echo "*Authored-by: egg*"
            } > /tmp/final-plan.md

            gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/final-plan.md
          else
            # Fallback: post a simple message if draft not found
            {
              echo "**Plan review passed.** ✅"
              echo ""
              echo "The implementation plan has been reviewed and approved by the automated reviewer, but the draft file was not found."
              echo "Please check the run logs."
              echo ""
              echo "[View run logs](${RUN_URL})"
              echo ""
              echo "### Ready for Review"
              echo ""
              echo "<!-- egg-phase-approval -->"
              echo "- [ ] Approve and advance to implement phase"
              echo ""
              echo "---"
              echo ""
              echo "*Authored-by: egg*"
            } > /tmp/fallback-plan.md

            gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/fallback-plan.md
          fi

          # Add sdlc:awaiting-approval label to indicate human review is needed
          .github/scripts/transition-sdlc-label.sh \
            --issue "${ISSUE_NUMBER}" \
            --add "sdlc:awaiting-approval" || {
              echo "Warning: Failed to add sdlc:awaiting-approval label"
            }

  # ============================================================
  # Plan Re-dispatch: Re-run plan if review failed
  # ============================================================
  plan-redispatch:
    name: Re-dispatch plan
    needs: [init, plan, plan-review]
    if: >-
      always() &&
      needs.init.outputs.current_phase == 'plan' &&
      needs.plan-review.result == 'success' &&
      needs.plan-review.outputs.review_passed == 'false'
    runs-on: ubuntu-latest

    env:
      ISSUE_NUMBER: ${{ needs.init.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.init.outputs.branch_name }}
      REVIEW_CYCLE: ${{ needs.plan-review.outputs.review_cycle }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Check circuit breaker before re-dispatch
        id: check-circuit-breaker
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            STATUS=$(jq -r '.circuit_breaker.status // "closed"' "$CONTRACT_PATH")
            if [[ "$STATUS" == "open" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Circuit breaker is OPEN — escalating to human instead of re-dispatch"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post escalation comment with draft
        if: steps.check-circuit-breaker.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-plan.md"
          REVIEW_FILE=".egg-state/reviews/${ISSUE_NUMBER}-plan-review.json"

          # Read the last review feedback if available
          LAST_FEEDBACK=""
          if [[ -f "$REVIEW_FILE" ]]; then
            LAST_FEEDBACK=$(jq -r '.feedback // ""' "$REVIEW_FILE")
          fi

          {
            echo "**⚠️ Plan phase escalated to human review.**"
            echo ""
            echo "The implementation plan has gone through ${REVIEW_CYCLE} review cycles without passing automated review."
            echo ""
            if [[ -n "$LAST_FEEDBACK" ]]; then
              echo "### Unresolved Issues from Last Review"
              echo ""
              echo "$LAST_FEEDBACK"
              echo ""
            fi
            echo "---"
            echo ""
            if [[ -f "$DRAFT_FILE" ]]; then
              echo "### Current Draft Plan"
              echo ""
              cat "$DRAFT_FILE"
              echo ""
            fi
            echo "---"
            echo ""
            echo "Human intervention is required to either:"
            echo ""
            echo "1. Provide guidance on the plan issues"
            echo "2. Override and approve the plan as-is"
            echo "3. Cancel and restart with different approach"
            echo ""
            echo "[View run logs](${RUN_URL})"
            echo ""
            echo "---"
            echo ""
            echo "<!-- egg-phase-approval -->"
            echo "- [ ] Override: Approve plan and advance to implement phase"
            echo ""
            echo "---"
            echo ""
            echo "*Authored-by: egg*"
          } > /tmp/escalation.md

          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/escalation.md

          # Add sdlc:awaiting-approval label for escalation
          .github/scripts/transition-sdlc-label.sh \
            --issue "${ISSUE_NUMBER}" \
            --add "sdlc:awaiting-approval" || true

      - name: Re-dispatch plan phase
        if: steps.check-circuit-breaker.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          echo "Re-dispatching plan phase (cycle $((REVIEW_CYCLE + 1)))"

          gh workflow run sdlc-pipeline.yml \
            --field issue_number="${ISSUE_NUMBER}" \
            --field starting_phase="plan"
