name: Release Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (defaults to latest)
        required: false
        default: latest

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GATEWAY_IMAGE: ghcr.io/jwbron/egg-gateway
  SANDBOX_IMAGE: ghcr.io/jwbron/egg-sandbox

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.GATEWAY_IMAGE }}:latest

      - name: Build and push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.SANDBOX_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.SANDBOX_IMAGE }}:latest
