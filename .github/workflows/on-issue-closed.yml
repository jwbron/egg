name: "egg: Cleanup SDLC State on Issue Close"

# This workflow cleans up SDLC state when an issue is closed:
# - Cancels in-progress sdlc-pipeline workflow runs for the issue
# - Deletes the issue branch (egg/issue-{N}) if no open PR exists
# - Posts an audit comment documenting what was cleaned up
#
# Note: HITL runs (sdlc-hitl.yml) are NOT cancelled by this workflow.
# HITL runs trigger on issue_comment events and run on main branch,
# making it impractical to reliably identify which runs belong to which issue.
# Once an issue is closed, HITL runs will naturally complete or fail since
# no further comments can trigger new actions on the closed issue.

on:
  issues:
    types: [closed]

permissions:
  actions: write
  contents: write
  issues: write

# Prevent concurrent cleanup runs for the same issue
concurrency:
  group: sdlc-cleanup-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup SDLC state
    runs-on: ubuntu-latest
    # Only run for issues with any SDLC phase label
    if: >-
      contains(github.event.issue.labels.*.name, 'sdlc:refine') ||
      contains(github.event.issue.labels.*.name, 'sdlc:plan') ||
      contains(github.event.issue.labels.*.name, 'sdlc:implement') ||
      contains(github.event.issue.labels.*.name, 'sdlc:pr') ||
      contains(github.event.issue.labels.*.name, 'sdlc:awaiting-approval')

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Initialize cleanup status
        id: init
        run: |
          set -euo pipefail

          # Validate issue number is numeric (path traversal prevention)
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number: ${ISSUE_NUMBER}"
            exit 1
          fi

          BRANCH_NAME="egg/issue-${ISSUE_NUMBER}"

          # Initialize cleanup status tracking
          {
            echo "branch_name=${BRANCH_NAME}"
            echo "workflows_cancelled=false"
            echo "branch_deleted=false"
            echo "errors="
          } >> "$GITHUB_OUTPUT"

      - name: Cancel in-progress SDLC workflows
        id: cancel-workflows
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          CANCELLED_COUNT=0
          ERRORS=""

          # Cancel sdlc-pipeline runs for this issue
          echo "Checking for in-progress sdlc-pipeline runs..."
          PIPELINE_RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/sdlc-pipeline.yml/runs" \
            --jq "[.workflow_runs[] | select(.status == \"in_progress\" or .status == \"queued\")] | .[].id" 2>/dev/null || echo "")

          for RUN_ID in $PIPELINE_RUNS; do
            # Check if this run is for our issue by looking at the inputs or branch
            RUN_DATA=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" 2>/dev/null || echo "{}")
            RUN_BRANCH=$(echo "$RUN_DATA" | jq -r '.head_branch // ""')
            RUN_ISSUE=$(echo "$RUN_DATA" | jq -r '.inputs.issue_number // ""')

            if [[ "$RUN_BRANCH" == "egg/issue-${ISSUE_NUMBER}" ]] || [[ "$RUN_ISSUE" == "${ISSUE_NUMBER}" ]]; then
              echo "Cancelling sdlc-pipeline run ${RUN_ID}..."
              if ERROR_OUTPUT=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/cancel" -X POST 2>&1); then
                CANCELLED_COUNT=$((CANCELLED_COUNT + 1))
              else
                ERRORS="${ERRORS}Failed to cancel pipeline run ${RUN_ID}: ${ERROR_OUTPUT}. "
              fi
            fi
          done

          # Note: HITL runs are NOT cancelled here. They run on main branch
          # triggered by issue_comment events, and the GitHub API doesn't expose
          # concurrency group info needed to identify which runs belong to which issue.
          # HITL runs will naturally complete once the issue is closed.

          {
            echo "cancelled_count=${CANCELLED_COUNT}"
            if [[ -n "$ERRORS" ]]; then
              echo "errors=${ERRORS}"
            fi
          } >> "$GITHUB_OUTPUT"

          echo "Cancelled ${CANCELLED_COUNT} workflow run(s)"

      - name: Check for open PRs on branch
        id: check-prs
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.init.outputs.branch_name }}
        run: |
          set -euo pipefail

          # Check if any open PRs exist on this branch
          OPEN_PRS=$(gh pr list --repo "${{ github.repository }}" --head "${BRANCH_NAME}" --state open --json number --jq 'length' 2>/dev/null || echo "0")

          if [[ "$OPEN_PRS" -gt 0 ]]; then
            echo "has_open_pr=true" >> "$GITHUB_OUTPUT"
            PR_NUMBERS=$(gh pr list --repo "${{ github.repository }}" --head "${BRANCH_NAME}" --state open --json number --jq '.[].number' | tr '\n' ',' | sed 's/,$//')
            echo "pr_numbers=${PR_NUMBERS}" >> "$GITHUB_OUTPUT"
            echo "Found ${OPEN_PRS} open PR(s) on branch ${BRANCH_NAME}: ${PR_NUMBERS}"
          else
            echo "has_open_pr=false" >> "$GITHUB_OUTPUT"
            echo "No open PRs found on branch ${BRANCH_NAME}"
          fi

      - name: Delete issue branch
        id: delete-branch
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.init.outputs.branch_name }}
          HAS_OPEN_PR: ${{ steps.check-prs.outputs.has_open_pr }}
        run: |
          set -euo pipefail

          # Skip deletion if there are open PRs
          if [[ "$HAS_OPEN_PR" == "true" ]]; then
            echo "Skipping branch deletion — open PR exists"
            echo "branch_deleted=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=open_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if branch exists
          # Note: There's a small race window where a new commit could be pushed
          # between this check and the deletion. This is acceptable for cleanup
          # purposes; the branch can be manually deleted if needed.
          if ! gh api "repos/${{ github.repository }}/git/refs/heads/${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH_NAME} does not exist (already deleted or never created)"
            echo "branch_deleted=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=not_found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Delete the branch
          echo "Deleting branch ${BRANCH_NAME}..."
          if ERROR_OUTPUT=$(gh api "repos/${{ github.repository }}/git/refs/heads/${BRANCH_NAME}" -X DELETE 2>&1); then
            echo "Branch ${BRANCH_NAME} deleted successfully"
            echo "branch_deleted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Failed to delete branch ${BRANCH_NAME}: ${ERROR_OUTPUT}"
            echo "branch_deleted=false" >> "$GITHUB_OUTPUT"
            echo "error=Failed to delete branch: ${ERROR_OUTPUT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove SDLC labels
        id: remove-labels
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          REMOVED_LABELS=""

          # Remove all SDLC phase and status labels
          for label in "sdlc:refine" "sdlc:plan" "sdlc:implement" "sdlc:pr" "sdlc:awaiting-approval"; do
            encoded_label="${label//:/%3A}"
            if gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/${encoded_label}" \
                -X DELETE --silent 2>/dev/null; then
              REMOVED_LABELS="${REMOVED_LABELS}${label}, "
            fi
          done

          if [[ -n "$REMOVED_LABELS" ]]; then
            # Remove trailing comma and space
            REMOVED_LABELS="${REMOVED_LABELS%, }"
            echo "labels_removed=${REMOVED_LABELS}" >> "$GITHUB_OUTPUT"
            echo "Removed labels: ${REMOVED_LABELS}"
          else
            echo "labels_removed=" >> "$GITHUB_OUTPUT"
            echo "No SDLC labels to remove"
          fi

      - name: Post cleanup summary comment
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.init.outputs.branch_name }}
          CANCELLED_COUNT: ${{ steps.cancel-workflows.outputs.cancelled_count }}
          BRANCH_DELETED: ${{ steps.delete-branch.outputs.branch_deleted }}
          HAS_OPEN_PR: ${{ steps.check-prs.outputs.has_open_pr }}
          PR_NUMBERS: ${{ steps.check-prs.outputs.pr_numbers }}
          SKIP_REASON: ${{ steps.delete-branch.outputs.skip_reason }}
          CANCEL_ERRORS: ${{ steps.cancel-workflows.outputs.errors }}
          DELETE_ERROR: ${{ steps.delete-branch.outputs.error }}
          LABELS_REMOVED: ${{ steps.remove-labels.outputs.labels_removed }}
        run: |
          set -euo pipefail

          # Build cleanup summary
          SUMMARY="**SDLC cleanup completed.**"$'\n\n'

          # Workflow cancellation status
          if [[ "${CANCELLED_COUNT:-0}" -gt 0 ]]; then
            SUMMARY="${SUMMARY}- Cancelled ${CANCELLED_COUNT} in-progress workflow run(s)"$'\n'
          else
            SUMMARY="${SUMMARY}- No in-progress workflows to cancel"$'\n'
          fi

          # Branch deletion status
          if [[ "$BRANCH_DELETED" == "true" ]]; then
            SUMMARY="${SUMMARY}- Deleted branch \`${BRANCH_NAME}\`"$'\n'
          elif [[ "$HAS_OPEN_PR" == "true" ]]; then
            SUMMARY="${SUMMARY}- Branch \`${BRANCH_NAME}\` preserved (open PR #${PR_NUMBERS} exists)"$'\n'
          elif [[ "$SKIP_REASON" == "not_found" ]]; then
            SUMMARY="${SUMMARY}- Branch \`${BRANCH_NAME}\` already deleted or never existed"$'\n'
          else
            SUMMARY="${SUMMARY}- Branch deletion skipped"$'\n'
          fi

          # Labels removed status
          if [[ -n "${LABELS_REMOVED:-}" ]]; then
            SUMMARY="${SUMMARY}- Removed SDLC labels: ${LABELS_REMOVED}"$'\n'
          fi

          # Report any errors
          if [[ -n "${CANCEL_ERRORS:-}" ]] || [[ -n "${DELETE_ERROR:-}" ]]; then
            SUMMARY="${SUMMARY}"$'\n'"**Warnings:**"$'\n'
            if [[ -n "${CANCEL_ERRORS:-}" ]]; then
              SUMMARY="${SUMMARY}- ${CANCEL_ERRORS}"$'\n'
            fi
            if [[ -n "${DELETE_ERROR:-}" ]]; then
              SUMMARY="${SUMMARY}- ${DELETE_ERROR}"$'\n'
            fi
          fi

          SUMMARY="${SUMMARY}"$'\n'"--- Authored by egg"

          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body "$SUMMARY"
