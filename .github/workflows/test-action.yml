name: Test Action

on:
  pull_request:
    branches: [main]
    paths:
      - "action/**"
      - ".github/workflows/test-action.yml"
      - ".github/workflows/on-check-failure.yml"
  workflow_dispatch:

jobs:
  gh-shim:
    name: gh review-marker shim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test gh shim passes non-review commands through
        run: |
          set -euo pipefail
          # Stub "real gh" that just records its argv.
          STUB="${RUNNER_TEMP}/real-gh"
          cat > "$STUB" <<'EOF'
          #!/usr/bin/env bash
          printf 'REALGH'; for a in "$@"; do printf ' [%s]' "$a"; done; printf '\n'
          EOF
          chmod +x "$STUB"

          out=$(EGG_REAL_GH="$STUB" action/bin/gh issue list --repo foo/bar)
          echo "$out"
          [[ "$out" == "REALGH [issue] [list] [--repo] [foo/bar]" ]]
          echo "passthrough OK"

      - name: Test gh shim injects the automated-review marker
        run: |
          set -euo pipefail
          STUB="${RUNNER_TEMP}/real-gh"
          cat > "$STUB" <<'EOF'
          #!/usr/bin/env bash
          printf 'REALGH'; for a in "$@"; do printf ' [%s]' "$a"; done; printf '\n'
          EOF
          chmod +x "$STUB"

          out=$(EGG_REAL_GH="$STUB" EGG_BOT_NAME=review EGG_COMMIT_SHA=deadbeef \
            action/bin/gh pr review 42 --repo foo/bar --comment --body "ship it")
          echo "$out"
          # Marker is embedded in the review body passed to the real gh.
          grep -q "<!-- egg-automated-review bot=review commit=deadbeef verdict=comment -->" <<<"$out"
          # And the verdict flag is preserved.
          grep -q "\[--comment\]" <<<"$out"
          echo "marker injection OK"

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck on action scripts
        run: |
          shellcheck --severity=warning action/entrypoint.sh action/bin/gh action/build-review-prompt.sh action/build-autofixer-prompt.sh action/build-conflict-prompt.sh action/build-feedback-prompt.sh action/build-doc-updater-prompt.sh action/build-agent-mode-design-review-prompt.sh action/build-contract-verification-prompt.sh

  prompt-builders:
    name: Prompt Builder Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test build-autofixer-prompt.sh
        env:
          PR_NUMBER: "123"
          FAILED_WORKFLOW: "Lint"
          FAILED_RUN_ID: "456789"
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          bash action/build-autofixer-prompt.sh

          PROMPT_FILE="${RUNNER_TEMP}/autofixer-prompt-123.txt"

          # Verify prompt file was created
          test -f "$PROMPT_FILE"
          test -s "$PROMPT_FILE"

          # Verify prompt contains expected content
          # Note: GITHUB_REPOSITORY is a default GHA env var that cannot be
          # overridden at the step level, so we assert against its actual value.
          grep -q "PR #123" "$PROMPT_FILE"
          grep -q "$GITHUB_REPOSITORY" "$PROMPT_FILE"
          grep -q "Lint" "$PROMPT_FILE"
          grep -q "gh pr checks" "$PROMPT_FILE"

          echo "build-autofixer-prompt.sh test passed"

      - name: Test build-autofixer-prompt.sh with custom rules
        env:
          PR_NUMBER: "456"
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          # Create custom autofixer rules
          mkdir -p .egg
          cat > .egg/autofixer-rules.md << 'RULES'
          ## Custom Rules
          - Always run `make format` before committing
          - Never auto-fix security issues
          RULES

          bash action/build-autofixer-prompt.sh

          PROMPT_FILE="${RUNNER_TEMP}/autofixer-prompt-456.txt"

          # Verify custom rules were included
          grep -q "Custom Rules" "$PROMPT_FILE"
          grep -q "make format" "$PROMPT_FILE"

          echo "Custom autofixer rules test passed"

      - name: Test build-review-prompt.sh
        env:
          PR_NUMBER: "789"
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          bash action/build-review-prompt.sh

          PROMPT_FILE="${RUNNER_TEMP}/review-prompt-789.txt"

          test -f "$PROMPT_FILE"
          grep -q "PR #789" "$PROMPT_FILE"
          grep -q "gh pr diff" "$PROMPT_FILE"

          echo "build-review-prompt.sh test passed"

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Run action (smoke test)
        uses: ./action
        with:
          prompt: "Echo 'Hello from egg' and exit successfully"
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          timeout: "5"
