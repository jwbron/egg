name: Test Action

on:
  pull_request:
    branches: [main]
    paths:
      - "action/**"
      - ".github/workflows/test-action.yml"
      - ".github/workflows/on-check-failure.yml"
  workflow_dispatch:

jobs:
  config-generation:
    name: Config Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test generate-config.sh
        env:
          INPUT_ANTHROPIC_OAUTH_TOKEN: test-token-placeholder
          INPUT_GITHUB_TOKEN: test-github-token
          INPUT_BOT_USERNAME: my-test-bot
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          bash action/generate-config.sh

          # GITHUB_* vars are built-in GHA variables that cannot be overridden,
          # so we validate against the actual runtime values
          CONFIG_DIR="${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"

          echo "=== Validating repositories.yaml ==="
          cat "$CONFIG_DIR/repositories.yaml"

          # Verify required fields use actual GHA context values
          # Use -F for fixed string matching — GITHUB_ACTOR may contain
          # regex-special characters (e.g., "app[bot]")
          grep -qF "github_username: ${GITHUB_ACTOR}" "$CONFIG_DIR/repositories.yaml"
          grep -qF "bot_username: my-test-bot" "$CONFIG_DIR/repositories.yaml"
          grep -qF "${GITHUB_REPOSITORY}" "$CONFIG_DIR/repositories.yaml"
          grep -qF "auth_mode: user" "$CONFIG_DIR/repositories.yaml"
          grep -qF "${GITHUB_WORKSPACE}" "$CONFIG_DIR/repositories.yaml"

          echo "=== Validating secrets.env ==="
          # Don't cat secrets, just verify they exist
          test -f "$CONFIG_DIR/secrets.env"
          grep -q "CLAUDE_CODE_OAUTH_TOKEN=" "$CONFIG_DIR/secrets.env"
          grep -q "GITHUB_USER_TOKEN=" "$CONFIG_DIR/secrets.env"

          echo "=== Validating launcher-secret ==="
          test -f "$CONFIG_DIR/launcher-secret"
          test -s "$CONFIG_DIR/launcher-secret"

          echo "All config generation tests passed"

      - name: Test generate-config.sh with no bot_username uses empty value
        env:
          INPUT_ANTHROPIC_OAUTH_TOKEN: test-token-placeholder
          INPUT_GITHUB_TOKEN: test-github-token
          # Intentionally omitting INPUT_BOT_USERNAME — no default
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          rm -rf "${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"
          bash action/generate-config.sh
          CONFIG_DIR="${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"
          grep -qF "bot_username:" "$CONFIG_DIR/repositories.yaml"
          echo "Empty bot_username test passed"

      - name: Test generate-config.sh with bot App credentials
        env:
          INPUT_ANTHROPIC_OAUTH_TOKEN: test-token-placeholder
          INPUT_GITHUB_TOKEN: test-github-token
          INPUT_BOT_APP_ID: "123456"
          INPUT_BOT_APP_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\ntest-key-placeholder\n-----END RSA PRIVATE KEY-----"
          INPUT_BOT_APP_INSTALLATION_ID: "789012"
          INPUT_BOT_USERNAME: my-bot
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          # Clean up config from previous step so we validate fresh output
          rm -rf "${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"

          bash action/generate-config.sh

          CONFIG_DIR="${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"

          grep -q "bot_username: my-bot" "$CONFIG_DIR/repositories.yaml"
          grep -q "auth_mode: bot" "$CONFIG_DIR/repositories.yaml"
          grep -q "GITHUB_APP_ID=123456" "$CONFIG_DIR/secrets.env"
          grep -q "GITHUB_APP_INSTALLATION_ID=789012" "$CONFIG_DIR/secrets.env"
          test -f "$CONFIG_DIR/github-app.pem"
          test -s "$CONFIG_DIR/github-app.pem"

          echo "Bot App credentials config generation tests passed"

      - name: Test generate-config.sh with single-line PEM (literal \n)
        env:
          INPUT_ANTHROPIC_OAUTH_TOKEN: test-token-placeholder
          INPUT_GITHUB_TOKEN: test-github-token
          INPUT_BOT_APP_ID: "123456"
          INPUT_BOT_APP_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\\ntest-key-placeholder\\n-----END RSA PRIVATE KEY-----"
          INPUT_BOT_APP_INSTALLATION_ID: "789012"
          INPUT_BOT_USERNAME: my-bot
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          rm -rf "${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"

          bash action/generate-config.sh

          CONFIG_DIR="${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"

          # PEM should contain real newlines, not literal \n
          test -f "$CONFIG_DIR/github-app.pem"
          grep -q "BEGIN RSA PRIVATE KEY" "$CONFIG_DIR/github-app.pem"
          grep -q "END RSA PRIVATE KEY" "$CONFIG_DIR/github-app.pem"
          LINE_COUNT=$(wc -l < "$CONFIG_DIR/github-app.pem")
          if [[ "$LINE_COUNT" -lt 3 ]]; then
            printf "ERROR: PEM should have multiple lines after \\n normalization, got %s\n" "$LINE_COUNT"
            exit 1
          fi

          echo "Single-line PEM normalization tests passed"

      - name: Test generate-config.sh rejects invalid PEM
        env:
          INPUT_ANTHROPIC_OAUTH_TOKEN: test-token-placeholder
          INPUT_GITHUB_TOKEN: test-github-token
          INPUT_BOT_APP_ID: "123456"
          INPUT_BOT_APP_PRIVATE_KEY: "not-a-pem-key"
          INPUT_BOT_APP_INSTALLATION_ID: "789012"
          INPUT_BOT_USERNAME: my-bot
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          rm -rf "${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"

          if bash action/generate-config.sh 2>/dev/null; then
            echo "ERROR: generate-config.sh should have failed for invalid PEM"
            exit 1
          fi

          echo "Invalid PEM rejection test passed"

      - name: Test generate-config.sh with checkpoint-repo
        env:
          INPUT_ANTHROPIC_OAUTH_TOKEN: test-token-placeholder
          INPUT_GITHUB_TOKEN: test-github-token
          INPUT_BOT_USERNAME: my-test-bot
          INPUT_CHECKPOINT_REPO: "myorg/my-checkpoints"
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          rm -rf "${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"
          bash action/generate-config.sh

          CONFIG_DIR="${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"

          grep -qF "checkpoint_repo: myorg/my-checkpoints" "$CONFIG_DIR/repositories.yaml"
          echo "Checkpoint repo config generation test passed"

      - name: Test generate-config.sh without checkpoint-repo omits setting
        env:
          INPUT_ANTHROPIC_OAUTH_TOKEN: test-token-placeholder
          INPUT_GITHUB_TOKEN: test-github-token
          INPUT_BOT_USERNAME: my-test-bot
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          rm -rf "${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"
          bash action/generate-config.sh

          CONFIG_DIR="${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"

          if grep -q "checkpoint_repo" "$CONFIG_DIR/repositories.yaml"; then
            echo "ERROR: checkpoint_repo should not be present when not configured"
            exit 1
          fi
          echo "No checkpoint repo (default) test passed"

      - name: Test generate-config.sh rejects invalid checkpoint-repo format
        env:
          INPUT_ANTHROPIC_OAUTH_TOKEN: test-token-placeholder
          INPUT_GITHUB_TOKEN: test-github-token
          INPUT_BOT_USERNAME: my-test-bot
          INPUT_CHECKPOINT_REPO: "not-valid-format"
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          rm -rf "${RUNNER_TEMP}/egg-config-${GITHUB_RUN_ID}"

          if bash action/generate-config.sh 2>/dev/null; then
            echo "ERROR: generate-config.sh should have failed for invalid checkpoint-repo"
            exit 1
          fi
          echo "Invalid checkpoint-repo rejection test passed"

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck on action scripts
        run: |
          shellcheck --severity=warning action/entrypoint.sh action/generate-config.sh action/build-review-prompt.sh action/build-autofixer-prompt.sh action/build-conflict-prompt.sh action/build-feedback-prompt.sh action/build-doc-updater-prompt.sh action/build-agent-mode-design-review-prompt.sh action/build-contract-verification-prompt.sh

  prompt-builders:
    name: Prompt Builder Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test build-autofixer-prompt.sh
        env:
          PR_NUMBER: "123"
          FAILED_WORKFLOW: "Lint"
          FAILED_RUN_ID: "456789"
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          bash action/build-autofixer-prompt.sh

          PROMPT_FILE="${RUNNER_TEMP}/autofixer-prompt-123.txt"

          # Verify prompt file was created
          test -f "$PROMPT_FILE"
          test -s "$PROMPT_FILE"

          # Verify prompt contains expected content
          # Note: GITHUB_REPOSITORY is a default GHA env var that cannot be
          # overridden at the step level, so we assert against its actual value.
          grep -q "PR #123" "$PROMPT_FILE"
          grep -q "$GITHUB_REPOSITORY" "$PROMPT_FILE"
          grep -q "Lint" "$PROMPT_FILE"
          grep -q "gh pr checks" "$PROMPT_FILE"

          echo "build-autofixer-prompt.sh test passed"

      - name: Test build-autofixer-prompt.sh with custom rules
        env:
          PR_NUMBER: "456"
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          # Create custom autofixer rules
          mkdir -p .egg
          cat > .egg/autofixer-rules.md << 'RULES'
          ## Custom Rules
          - Always run `make format` before committing
          - Never auto-fix security issues
          RULES

          bash action/build-autofixer-prompt.sh

          PROMPT_FILE="${RUNNER_TEMP}/autofixer-prompt-456.txt"

          # Verify custom rules were included
          grep -q "Custom Rules" "$PROMPT_FILE"
          grep -q "make format" "$PROMPT_FILE"

          echo "Custom autofixer rules test passed"

      - name: Test build-review-prompt.sh
        env:
          PR_NUMBER: "789"
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          bash action/build-review-prompt.sh

          PROMPT_FILE="${RUNNER_TEMP}/review-prompt-789.txt"

          test -f "$PROMPT_FILE"
          grep -q "PR #789" "$PROMPT_FILE"
          grep -q "gh pr diff" "$PROMPT_FILE"

          echo "build-review-prompt.sh test passed"

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Run action (smoke test)
        uses: ./action
        with:
          prompt: "Echo 'Hello from egg' and exit successfully"
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          timeout: "5"
