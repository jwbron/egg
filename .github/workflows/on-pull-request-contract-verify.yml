name: "egg: Contract Verification"

# Trigger on PRs with the sdlc:pr label, a new contract file in the diff, or a
# slice PR (egg/<id>/slice-N -> egg/<id>/work) whose work branch carries a contract.
# This workflow verifies that implementation matches the SDLC contract
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to verify'
        required: true
        type: number

jobs:
  # Validate required configuration
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Validate required repository variables
        run: |
          if [[ -z "${{ vars.EGG_BOT_USERNAME }}" ]]; then
            echo "::error::Required repository variable 'EGG_BOT_USERNAME' is not set"
            echo "::error::Set it in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "All required repository variables are configured"

  should-run:
    name: Check if verification should run
    needs: [validate-config]
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Check for sdlc:pr label or contract file
        id: check
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          # Count the implementation slices in a pipeline's contract on a given
          # ref. Mirrors the orchestrator's _is_slice_dag_mode discriminator
          # (len(slices) > 1) so the work->main gate below can tell a multi-slice
          # context roll-up apart from a single-slice/monolithic implementation
          # PR (#3254 review). The contract is fetched by the pipeline's OWN key
          # (egg/<id>/work -> id -> id.json, with a legacy bare-number fallback
          # for pre-unification issue contracts) — never the whole contracts/
          # dir, which inherits historical multi-slice contracts from main and
          # would cause a false skip. Echoes the slice count; 0 on any
          # fetch/parse failure so the caller fails open (review runs).
          __egg_work_slice_count() {
            local pid="$1" ref="$2" b64 count cf candidates
            candidates="${pid}.json"
            if [[ "$pid" == issue-* ]]; then
              candidates="${candidates} ${pid#issue-}.json"
            fi
            for cf in $candidates; do
              b64=$(gh api "repos/${{ github.repository }}/contents/.egg-state/contracts/${cf}?ref=${ref}" \
                --jq '.content // ""' 2>/dev/null || echo "")
              if [[ -n "$b64" ]]; then
                count=$(printf '%s' "$b64" | base64 -d 2>/dev/null \
                  | jq '((.slices // .phases) // []) | length' 2>/dev/null || echo 0)
                echo "${count:-0}"
                return 0
              fi
            done
            echo 0
          }

          # Fetch PR metadata (labels, head + base branch, body) in a single API call
          pr_data=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '{labels: [.labels[].name], branch: .head.ref, base: .base.ref, body: .body}')
          branch_name=$(echo "$pr_data" | jq -r '.branch')
          base_name=$(echo "$pr_data" | jq -r '.base')
          labels=$(echo "$pr_data" | jq -r '.labels[]')
          pr_body=$(echo "$pr_data" | jq -r '.body // ""')

          # Extract issue number — try multiple sources in priority order
          issue_number=""

          # 1. Branch name: egg/issue-{number}...
          if [[ "$branch_name" =~ ^egg/issue-([0-9]+) ]]; then
            issue_number="${BASH_REMATCH[1]}"
            echo "Extracted issue number from branch name: $issue_number"

          # 2. PR body: "Issue: https://github.com/.../issues/{number}" or "Issue: #{number}"
          else
            # Try URL form: Issue: https://github.com/owner/repo/issues/1234
            issue_number=$(echo "$pr_body" | grep -oi 'Issue:[[:space:]]*https\?://github\.com/[^/]*/[^/]*/issues/[0-9]*' | grep -o '[0-9]*$' | head -1 || true)
            # Try shorthand form: Issue: #1234
            if [[ -z "$issue_number" ]]; then
              issue_number=$(echo "$pr_body" | grep -oi 'Issue:[[:space:]]*#[0-9]*' | grep -o '[0-9]*$' | head -1 || true)
            fi
            if [[ -n "$issue_number" ]]; then
              echo "Extracted issue number from PR body: $issue_number"
            fi
          fi

          # 3. Fallback: scan .egg-state/contracts/ on the branch for any contract file
          if [[ -z "$issue_number" ]]; then
            echo "Could not extract issue number from branch name or PR body"
            echo "Scanning .egg-state/contracts/ on branch $branch_name..."
            contract_files=$(gh api "repos/${{ github.repository }}/contents/.egg-state/contracts?ref=${branch_name}" \
              --jq '.[].name' 2>/dev/null || echo "")
            if [[ -n "$contract_files" ]]; then
              # Take the first .json file and extract the number from its filename
              first_contract=$(echo "$contract_files" | grep '\.json$' | head -1)
              if [[ "$first_contract" =~ ^([0-9]+)\.json$ ]]; then
                issue_number="${BASH_REMATCH[1]}"
                echo "Extracted issue number from contract filename: $issue_number"
              fi
            fi
          fi

          echo "issue_number=${issue_number}" >> "$GITHUB_OUTPUT"

          # For workflow_dispatch, always run
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # The work->main PR (egg/<id>/work -> main) shares ONE head/base
            # topology across two very different cases, and topology ALONE
            # cannot tell them apart (#3254 review):
            #
            #   * Multi-slice pipeline — implementation is delivered through
            #     stacked slice PRs (egg/<id>/slice-N -> egg/<id>/work), each
            #     verified on its own (see the slice trigger below). The
            #     work->main PR is then a pure context/state roll-up carrying
            #     only .egg-state/ artifacts, so verifying it is a false
            #     positive by construction. SKIP.
            #   * Single-slice / monolithic pipeline — no slice PR is ever
            #     opened (the orchestrator routes the implement phase through
            #     the slice loop only when the contract has >1 slice; see
            #     _is_slice_dag_mode). Implementation is committed directly onto
            #     egg/<id>/work, so work->main IS the implementation PR and is
            #     the ONLY GitHub-level verification it gets. DO NOT SKIP.
            #
            # Discriminate on the same key the orchestrator uses: the slice
            # count in the contract on the work branch (len(slices) > 1). This
            # must run BEFORE the sdlc:pr / added-contract triggers, since the
            # work->main diff *adds* the contract relative to main and would
            # otherwise trip the added-contract trigger below for the multi-slice
            # roll-up too. A failed contract fetch yields 0 -> falls through to
            # normal gating (fail-open — the safe direction).
            if [[ "$branch_name" =~ ^egg/(.+)/work$ && ( "$base_name" == "main" || "$base_name" == "master" ) ]]; then
              pipeline_id="${BASH_REMATCH[1]}"
              slice_count=$(__egg_work_slice_count "$pipeline_id" "$branch_name")
              if [[ "${slice_count:-0}" -gt 1 ]]; then
                echo "Context PR ${branch_name} -> ${base_name}: multi-slice contract (${slice_count} slices) — implementation delivered via slice PRs, skipping contract verification (#3254)"
                echo "run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "PR ${branch_name} -> ${base_name}: ${slice_count} slice(s) — single-slice/monolithic implementation PR, not a context roll-up; continuing to normal gating (#3254)"
            fi

            # Check if PR has sdlc:pr label
            if echo "$labels" | grep -q "^sdlc:pr$"; then
              echo "PR has sdlc:pr label, running contract verification"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # No label — only run if the PR adds a new file to .egg-state/contracts/
            added_contract=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '[.[] | select(.status == "added" and (.filename | startswith(".egg-state/contracts/")))] | length')
            if [[ "${added_contract:-0}" -gt 0 ]]; then
              echo "PR adds a new contract file, running contract verification"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Slice PRs (egg/<pipeline_id>/slice-<N> -> egg/<pipeline_id>/work)
            # carry agent:<role> labels (not sdlc:pr) and inherit the contract
            # from the work branch rather than *adding* it, so neither trigger
            # above fires (#3040). Detect them by the head-branch topology — a
            # docs/normal PR's head never has the egg/<id>/slice-<N> shape — then
            # confirm the contract is present on the pipeline's work branch.
            #
            # NOTE: do NOT trigger on bare "a contract file exists on the
            # branch": every PR inherits the contracts accumulated on the
            # default branch, which is exactly why #1134 removed the
            # branch-level existence check. The slice-branch head match is the
            # real discriminator; the work-branch contract check is a sanity
            # guard. Deriving the work branch from the head (not the PR base)
            # also covers stacked slices whose base is another slice branch.
            if [[ "$branch_name" =~ ^egg/(.+)/slice-[0-9]+$ ]]; then
              work_branch="egg/${BASH_REMATCH[1]}/work"
              work_contracts=$(
                gh api "repos/${{ github.repository }}/contents/.egg-state/contracts?ref=${work_branch}" \
                  --jq '[.[] | select(.name | endswith(".json"))] | length' 2>/dev/null || echo 0)
              if [[ "${work_contracts:-0}" -gt 0 ]]; then
                echo "Slice PR ${branch_name}: contract present on ${work_branch}, running contract verification"
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Slice PR but no contract found on work branch ${work_branch}; skipping"
            fi

            echo "No sdlc:pr label, no new contract file, and not a slice PR with a contract; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: egg-review / Contract Verification
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-review.yml
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      bot_name: contract-verification
      bot_username: ${{ vars.EGG_BOT_USERNAME }}
      branch_prefix: ${{ vars.EGG_BRANCH_PREFIX }}
      # action_ref: jwbron/egg/action@main  # Cannot be passed dynamically; hardcoded in reusable workflow
      prompt_script: "action/build-contract-verification-prompt.sh"
      timeout: "30"
      pr_title: ${{ github.event.pull_request.title || '' }}
      event_name: ${{ github.event_name }}
      agent_role: reviewer_contract
      issue_number: ${{ needs.should-run.outputs.issue_number }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      BOT_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
