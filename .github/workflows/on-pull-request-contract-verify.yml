name: "egg: Contract Verification"

# Trigger on PRs with the sdlc:pr label or a new contract file in the diff
# This workflow verifies that implementation matches the SDLC contract
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to verify'
        required: true
        type: number

jobs:
  # Validate required configuration
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Validate required repository variables
        run: |
          if [[ -z "${{ vars.EGG_BOT_USERNAME }}" ]]; then
            echo "::error::Required repository variable 'EGG_BOT_USERNAME' is not set"
            echo "::error::Set it in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "All required repository variables are configured"

  should-run:
    name: Check if verification should run
    needs: [validate-config]
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Check for sdlc:pr label or contract file
        id: check
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          # Fetch PR metadata (labels, branch name, body) in a single API call
          pr_data=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '{labels: [.labels[].name], branch: .head.ref, body: .body}')
          branch_name=$(echo "$pr_data" | jq -r '.branch')
          labels=$(echo "$pr_data" | jq -r '.labels[]')
          pr_body=$(echo "$pr_data" | jq -r '.body // ""')

          # Extract issue number — try multiple sources in priority order
          issue_number=""

          # 1. Branch name: egg/issue-{number}...
          if [[ "$branch_name" =~ ^egg/issue-([0-9]+) ]]; then
            issue_number="${BASH_REMATCH[1]}"
            echo "Extracted issue number from branch name: $issue_number"

          # 2. PR body: "Issue: https://github.com/.../issues/{number}" or "Issue: #{number}"
          else
            # Try URL form: Issue: https://github.com/owner/repo/issues/1234
            issue_number=$(echo "$pr_body" | grep -oi 'Issue:[[:space:]]*https\?://github\.com/[^/]*/[^/]*/issues/[0-9]*' | grep -o '[0-9]*$' | head -1 || true)
            # Try shorthand form: Issue: #1234
            if [[ -z "$issue_number" ]]; then
              issue_number=$(echo "$pr_body" | grep -oi 'Issue:[[:space:]]*#[0-9]*' | grep -o '[0-9]*$' | head -1 || true)
            fi
            if [[ -n "$issue_number" ]]; then
              echo "Extracted issue number from PR body: $issue_number"
            fi
          fi

          # 3. Fallback: scan .egg-state/contracts/ on the branch for any contract file
          if [[ -z "$issue_number" ]]; then
            echo "Could not extract issue number from branch name or PR body"
            echo "Scanning .egg-state/contracts/ on branch $branch_name..."
            contract_files=$(gh api "repos/${{ github.repository }}/contents/.egg-state/contracts?ref=${branch_name}" \
              --jq '.[].name' 2>/dev/null || echo "")
            if [[ -n "$contract_files" ]]; then
              # Take the first .json file and extract the number from its filename
              first_contract=$(echo "$contract_files" | grep '\.json$' | head -1)
              if [[ "$first_contract" =~ ^([0-9]+)\.json$ ]]; then
                issue_number="${BASH_REMATCH[1]}"
                echo "Extracted issue number from contract filename: $issue_number"
              fi
            fi
          fi

          echo "issue_number=${issue_number}" >> "$GITHUB_OUTPUT"

          # For workflow_dispatch, always run
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # Check if PR has sdlc:pr label
            if echo "$labels" | grep -q "^sdlc:pr$"; then
              echo "PR has sdlc:pr label, running contract verification"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # No label — only run if the PR adds a new file to .egg-state/contracts/
            added_contract=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '[.[] | select(.status == "added" and (.filename | startswith(".egg-state/contracts/")))] | length')
            if [[ "${added_contract:-0}" -gt 0 ]]; then
              echo "PR adds a new contract file, running contract verification"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "No sdlc:pr label and no new contract file in diff, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: egg-review / Contract Verification
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-review.yml
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      bot_name: contract-verification
      bot_username: ${{ vars.EGG_BOT_USERNAME }}
      branch_prefix: ${{ vars.EGG_BRANCH_PREFIX }}
      # action_ref: jwbron/egg/action@main  # Cannot be passed dynamically; hardcoded in reusable workflow
      prompt_script: "action/build-contract-verification-prompt.sh"
      timeout: "15"
      pr_title: ${{ github.event.pull_request.title || '' }}
      event_name: ${{ github.event_name }}
      agent_role: reviewer
      issue_number: ${{ needs.should-run.outputs.issue_number }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      BOT_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
