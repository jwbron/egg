name: "egg: Contract Verification"

# Trigger on PRs with the sdlc:pr label or a contract file
# This workflow verifies that implementation matches the SDLC contract
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to verify'
        required: true
        type: number

jobs:
  # Validate required configuration
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Validate required repository variables
        run: |
          if [[ -z "${{ vars.EGG_BOT_USERNAME }}" ]]; then
            echo "::error::Required repository variable 'EGG_BOT_USERNAME' is not set"
            echo "::error::Set it in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "All required repository variables are configured"

  should-run:
    name: Check if verification should run
    needs: [validate-config]
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Check for sdlc:pr label or contract file
        id: check
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          # Fetch PR metadata (labels + branch name) in a single API call
          pr_data=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '{labels: [.labels[].name], branch: .head.ref}')
          branch_name=$(echo "$pr_data" | jq -r '.branch')
          labels=$(echo "$pr_data" | jq -r '.labels[]')

          # Extract issue number from branch name (egg/issue-{number}...)
          if [[ "$branch_name" =~ ^egg/issue-([0-9]+) ]]; then
            issue_number="${BASH_REMATCH[1]}"
            echo "Extracted issue number from branch: $issue_number"
            echo "issue_number=${issue_number}" >> "$GITHUB_OUTPUT"
          else
            echo "Could not extract issue number from branch name: $branch_name"
            echo "issue_number=" >> "$GITHUB_OUTPUT"
          fi

          # For workflow_dispatch, always run
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # Check if PR has sdlc:pr label
            if echo "$labels" | grep -q "^sdlc:pr$"; then
              echo "PR has sdlc:pr label, running contract verification"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # No label — check if a contract file exists on the PR's head branch
            if [[ -n "${issue_number:-}" ]]; then
              contract_path=".egg-state/contracts/${issue_number}.json"
              echo "Checking for contract file: $contract_path on branch $branch_name"
              set +o pipefail
              http_code=$(gh api "repos/${{ github.repository }}/contents/${contract_path}?ref=${branch_name}" \
                --silent -i 2>/dev/null | head -1 | awk '{print $2}')
              set -o pipefail
              http_code="${http_code:-000}"
              if [[ "$http_code" == "200" ]]; then
                echo "Contract file found, running contract verification"
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
              elif [[ "$http_code" != "404" ]]; then
                echo "::warning::Unexpected HTTP $http_code checking contract file at $contract_path"
              else
                echo "No contract file found at $contract_path"
              fi
            fi

            echo "No sdlc:pr label and no contract file, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: egg-review / Contract Verification
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-review.yml
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      bot_name: contract-verification
      bot_username: ${{ vars.EGG_BOT_USERNAME }}
      branch_prefix: ${{ vars.EGG_BRANCH_PREFIX }}
      # action_ref: jwbron/egg/action@main  # Cannot be passed dynamically; hardcoded in reusable workflow
      prompt_script: "action/build-contract-verification-prompt.sh"
      timeout: "15"
      pr_title: ${{ github.event.pull_request.title || '' }}
      event_name: ${{ github.event_name }}
      agent_role: reviewer
      issue_number: ${{ needs.should-run.outputs.issue_number }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      BOT_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
