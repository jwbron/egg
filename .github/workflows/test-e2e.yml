name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  e2e-deterministic:
    name: E2E Deterministic Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build containers
        run: |
          docker build -t egg-gateway -f gateway/Dockerfile .
          docker build -t egg-sandbox -f sandbox/Dockerfile .

      - name: Set up k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--flannel-backend=none --disable-network-policy --write-kubeconfig-mode=644" sh -
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"
          scripts/install-calico.sh
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Import images into k3s
        run: |
          docker save egg-gateway:latest | sudo k3s ctr images import -
          docker save egg-sandbox:latest | sudo k3s ctr images import -

      - name: Deploy egg to k3s
        run: |
          kubectl apply -k k8s/overlays/local/
          kubectl -n egg-system wait --for=condition=Available deployment/egg-orchestrator --timeout=120s
          kubectl -n egg-system wait --for=condition=Available deployment/egg-gateway --timeout=120s

      - name: Run deterministic E2E tests
        env:
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          EGG_RUNTIME: kubernetes
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          PYTHONPATH=shared .venv/bin/pytest integration_tests -v \
            -m "e2e and not agent_flaky" \
            --timeout=600 \
            --junitxml=e2e-deterministic-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-deterministic-results
          path: e2e-deterministic-results.xml

      - name: Cleanup
        if: always()
        run: |
          kubectl delete namespace egg-test-agents --ignore-not-found=true 2>/dev/null || true
          kubectl delete namespace egg-system --ignore-not-found=true 2>/dev/null || true
          /usr/local/bin/k3s-uninstall.sh 2>/dev/null || true

  e2e-agent-fuzz:
    name: E2E Agent Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build containers
        run: |
          docker build -t egg-gateway -f gateway/Dockerfile .
          docker build -t egg-sandbox -f sandbox/Dockerfile .

      - name: Set up k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--flannel-backend=none --disable-network-policy --write-kubeconfig-mode=644" sh -
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"
          scripts/install-calico.sh
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Import images into k3s
        run: |
          docker save egg-gateway:latest | sudo k3s ctr images import -
          docker save egg-sandbox:latest | sudo k3s ctr images import -

      - name: Deploy egg to k3s
        run: |
          kubectl apply -k k8s/overlays/local/
          kubectl -n egg-system wait --for=condition=Available deployment/egg-orchestrator --timeout=120s
          kubectl -n egg-system wait --for=condition=Available deployment/egg-gateway --timeout=120s

      - name: Run agent fuzz tests
        env:
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          AGENT_FINDINGS_DIR: ${{ github.workspace }}/agent-findings
          EGG_RUNTIME: kubernetes
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          PYTHONPATH=shared .venv/bin/pytest integration_tests -v \
            -m "e2e and agent_flaky" \
            --timeout=600 \
            --junitxml=e2e-agent-fuzz-results.xml

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-agent-fuzz-results
          path: |
            e2e-agent-fuzz-results.xml
            agent-findings/

      - name: Cleanup
        if: always()
        run: |
          kubectl delete namespace egg-test-agents --ignore-not-found=true 2>/dev/null || true
          kubectl delete namespace egg-system --ignore-not-found=true 2>/dev/null || true
          /usr/local/bin/k3s-uninstall.sh 2>/dev/null || true
