name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: All Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: .venv/bin/ruff check .

      - name: Ruff format
        run: .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy gateway shared sandbox --exclude 'gateway/tests/' || true

      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck sandbox/scripts/* || true

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: gateway/Dockerfile
        continue-on-error: true  # Don't fail if Dockerfile doesn't exist yet

      - name: Yamllint
        run: .venv/bin/yamllint -c .yamllint.yaml . || true

      - name: Check Claude/Anthropic imports
        run: .venv/bin/python scripts/check-claude-imports.py

      - name: Check container/host boundary
        run: .venv/bin/python scripts/check-container-host-boundary.py

      - name: Check gh CLI usage
        run: .venv/bin/python scripts/check-gh-cli-usage.py

      - name: Check bin symlinks
        run: .venv/bin/python scripts/check-bin-symlinks.py

      - name: Validate config
        run: .venv/bin/python scripts/validate-config.py
        continue-on-error: true  # Config may not be available in CI
