name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: All Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      # ---- Python ----

      - name: Ruff check
        run: .venv/bin/ruff check .

      - name: Ruff format
        run: .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy gateway shared sandbox --exclude 'gateway/tests/' || true

      # ---- Shell ----

      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          SHELL_FILES=$(find . -name "*.sh" -not -path "./.venv/*" -not -path "./.git/*")
          if [ -n "$SHELL_FILES" ]; then
            echo "$SHELL_FILES" | xargs shellcheck --severity=warning
          fi
          if [ -d "sandbox/scripts" ]; then
            shellcheck --severity=warning sandbox/scripts/*
          fi

      # ---- YAML ----

      - name: Yamllint
        run: .venv/bin/yamllint -c .yamllint.yaml .

      # ---- Docker ----

      - name: Hadolint
        run: |
          wget -qO /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --config .hadolint.yaml gateway/Dockerfile
          hadolint --config .hadolint.yaml sandbox/Dockerfile

      # ---- Custom lint scripts ----

      - name: Check container paths
        run: python3 scripts/check-container-paths.py

      - name: Check container-host boundary
        run: python3 scripts/check-container-host-boundary.py

      - name: Check gh CLI usage
        run: python3 scripts/check-gh-cli-usage.py

      - name: Check Claude imports
        run: python3 scripts/check-claude-imports.py
