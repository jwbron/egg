name: "egg: Respond to @mention"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  respond:
    name: Run egg
    runs-on: ubuntu-latest
    # Bot-self checks (!= james-in-a-box) are defense-in-depth: prevent
    # self-triggering if authorized users list expands beyond jwbron.
    if: >-
      (
        (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@james-in-a-box') || contains(github.event.comment.body, '@egg'))) ||
        (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, '@james-in-a-box') || contains(github.event.comment.body, '@egg'))) ||
        (github.event_name == 'pull_request_review' && github.event.review.body != null && (contains(github.event.review.body, '@james-in-a-box') || contains(github.event.review.body, '@egg'))) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@james-in-a-box') || contains(github.event.issue.body, '@egg')))
      ) &&
      github.event.sender.login == 'jwbron' &&
      github.event.sender.login != 'james-in-a-box' &&
      github.event.sender.login != 'james-in-a-box[bot]'

    permissions:
      contents: write
      pull-requests: write
      issues: write

    concurrency:
      group: egg-mention-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    env:
      BOT_USERNAME: james-in-a-box

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Acknowledge with reaction
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            # React to the issue itself
            gh api \
              repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions \
              -X POST -f content='eyes'
          elif [[ "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
            # React to the PR review comment
            gh api \
              repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.id }}/reactions \
              -X POST -f content='eyes'
          elif [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            # No reaction API for reviews — acknowledge via PR comment
            gh api \
              repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              -X POST -f body='👀 Working on it...'
          else
            # React to the issue/PR comment
            gh api \
              repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
              -X POST -f content='eyes'
          fi

      - name: Determine checkout ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            # Check if this is a PR comment by looking for pull_request in the issue
            PR_URL="${{ github.event.issue.pull_request.url }}"
            if [[ -n "$PR_URL" && "$PR_URL" != "null" ]]; then
              # It's a PR comment — fetch the head ref
              PR_NUMBER="${{ github.event.issue.number }}"
              PR_DATA=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} --jq '.head.ref')
              echo "ref=${PR_DATA}" >> "$GITHUB_OUTPUT"
              echo "is_pr=true" >> "$GITHUB_OUTPUT"
            else
              echo "ref=main" >> "$GITHUB_OUTPUT"
              echo "is_pr=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.event_name }}" == "pull_request_review_comment" || "${{ github.event_name }}" == "pull_request_review" ]]; then
            echo "ref=${PR_HEAD_REF}" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            # issues (opened)
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      # SECURITY: Always run build-mention-prompt.sh from a trusted checkout
      # (main branch). A malicious PR could replace this script to exfiltrate
      # the bot token, and it would execute if the maintainer mentions the bot
      # on that PR. By checking out main first for prompt building, then the
      # PR branch for egg, we ensure untrusted code never runs with secrets.
      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build prompt
        id: prompt
        run: bash action/build-mention-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Checkout PR branch
        if: steps.ref.outputs.is_pr == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Run egg
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}

      # Minimize previous status comments to reduce clutter
      # Uses semantic marker instead of content patterns per #363
      - name: Minimize previous status comments
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Determine where to look for comments
          if [[ "${{ github.event_name }}" == "pull_request_review_comment" || "${{ github.event_name }}" == "pull_request_review" ]]; then
            ISSUE_NUMBER="${{ github.event.pull_request.number }}"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi

          # Find previous bot comments with status marker
          # shellcheck disable=SC2016
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            | jq -r --arg bot "${{ env.BOT_USERNAME }}" \
            '.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.body | contains("<!-- egg-status-comment -->")) | .node_id' \
          | while read -r node_id; do
              # shellcheck disable=SC2016 # $id is a GraphQL variable, not bash
              if ! gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }
              ' -f id="$node_id"; then
                echo "Warning: Failed to minimize comment $node_id (may lack permissions)"
              fi
            done

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          EGG_EXIT_CODE: ${{ steps.egg.outputs.exit-code }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Determine where to post the comment
          if [[ "${{ github.event_name }}" == "pull_request_review_comment" || "${{ github.event_name }}" == "pull_request_review" ]]; then
            ISSUE_NUMBER="${{ github.event.pull_request.number }}"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi

          # Check if egg already posted a substantive comment since the triggering event
          # For pull_request_review events, use review.submitted_at; for comments, use comment.created_at; fallback to issue.created_at
          TRIGGER_TIME="${{ github.event.comment.created_at || github.event.review.submitted_at || github.event.issue.created_at }}"
          # Match both "james-in-a-box" and "james-in-a-box[bot]" since GitHub App comments use the [bot] suffix
          EXISTING_COMMENTS=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            --jq "[.[] | select((.user.login == \"${{ env.BOT_USERNAME }}\" or .user.login == \"${{ env.BOT_USERNAME }}[bot]\") and .created_at > \"${TRIGGER_TIME}\" and (.body | test(\"finished successfully|run failed|👀 Working on it\") | not))] | length")

          if [[ "${EXISTING_COMMENTS:-0}" -gt 0 ]]; then
            # Agent already posted a substantive comment — only add run link on failure
            if [[ "${EGG_EXIT_CODE:-1}" != "0" ]]; then
              BODY="<!-- egg-status-comment -->
          egg run had errors (exit code: ${EGG_EXIT_CODE:-unknown}). [View run logs](${RUN_URL})"
              gh api repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments \
                -X POST -f body="${BODY}"
            fi
          else
            # No substantive comment posted — post fallback
            if [[ "${EGG_EXIT_CODE:-1}" == "0" ]]; then
              BODY="<!-- egg-status-comment -->
          egg finished successfully but did not post a response. [View run logs](${RUN_URL})"
            else
              BODY="<!-- egg-status-comment -->
          egg run failed (exit code: ${EGG_EXIT_CODE:-unknown}). [View run logs](${RUN_URL})"
            fi
            gh api repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments \
              -X POST -f body="${BODY}"
          fi
