name: "egg: Respond to @mention"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
  workflow_call:
    inputs:
      issue_or_pr_number:
        description: 'Issue or PR number to respond to'
        required: true
        type: number
      comment_id:
        description: 'Comment ID that triggered the mention (optional)'
        required: false
        type: string
        default: ""
      bot_username:
        description: 'GitHub username of the bot (for self-trigger prevention and comment filtering)'
        required: false
        type: string
      action_ref:
        description: 'Reference to egg action (owner/repo/path@ref format). NOTE: GitHub Actions uses: field cannot be dynamic - consuming repos must hardcode their action reference in the uses step below.'
        required: false
        type: string
        default: "jwbron/egg/action@main"
      authorized_users:
        description: 'Comma-separated list of authorized GitHub usernames'
        required: false
        type: string
        default: "jwbron"
      mention_patterns:
        description: 'Comma-separated list of mention patterns to trigger on (e.g., "@my-bot")'
        required: false
        type: string
      prompt_script:
        description: 'Path to prompt builder script (relative to repo root)'
        required: false
        type: string
        default: "action/build-mention-prompt.sh"
      timeout:
        description: 'Timeout in minutes'
        required: false
        type: string
        default: "30"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true

jobs:
  # Validate required configuration for event-triggered runs
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_call'
    steps:
      - name: Validate required repository variables
        run: |
          missing_vars=()
          if [[ -z "${{ vars.EGG_BOT_USERNAME }}" ]]; then
            missing_vars+=("EGG_BOT_USERNAME")
          fi
          if [[ -z "${{ vars.EGG_MENTION_PATTERNS }}" ]]; then
            missing_vars+=("EGG_MENTION_PATTERNS")
          fi

          if [[ ${#missing_vars[@]} -gt 0 ]]; then
            echo "::error::Required repository variable(s) not set: ${missing_vars[*]}"
            echo "::error::Set these in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "All required repository variables are configured"

  # Workaround: GitHub Actions doesn't allow accessing inputs in job-level 'if' conditions.
  # This job passes inputs as outputs so subsequent jobs can use them in conditions.
  resolve-inputs:
    name: Resolve Inputs
    needs: [validate-config]
    if: always() && (needs.validate-config.result == 'success' || needs.validate-config.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      bot_username: ${{ steps.resolve.outputs.bot_username }}
      authorized_users: ${{ steps.resolve.outputs.authorized_users }}
      mention_patterns: ${{ steps.resolve.outputs.mention_patterns }}
      issue_or_pr_number: ${{ steps.resolve.outputs.issue_or_pr_number }}
      should_check_trigger: ${{ steps.resolve.outputs.should_check_trigger }}
    steps:
      - name: Resolve inputs with defaults
        id: resolve
        run: |
          # Use inputs if called as reusable workflow, otherwise use repository variables
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            {
              echo "bot_username=${{ inputs.bot_username }}"
              echo "mention_patterns=${{ inputs.mention_patterns }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "bot_username=${{ vars.EGG_BOT_USERNAME }}"
              echo "mention_patterns=${{ vars.EGG_MENTION_PATTERNS }}"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "authorized_users=${{ inputs.authorized_users || 'jwbron' }}" >> "$GITHUB_OUTPUT"

          # Determine issue/PR number based on event type
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            {
              echo "issue_or_pr_number=${{ inputs.issue_or_pr_number }}"
              echo "should_check_trigger=false"
            } >> "$GITHUB_OUTPUT"
          else
            # For event-triggered runs, determine the number
            if [[ "${{ github.event_name }}" == "pull_request_review_comment" || "${{ github.event_name }}" == "pull_request_review" ]]; then
              echo "issue_or_pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            else
              echo "issue_or_pr_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            fi
            echo "should_check_trigger=true" >> "$GITHUB_OUTPUT"
          fi

  # For event-triggered runs, check if this is a valid mention from an authorized user
  check-trigger:
    name: Check Trigger
    needs: resolve-inputs
    if: needs.resolve-inputs.outputs.should_check_trigger == 'true'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if mention is valid and from authorized user
        id: check
        env:
          BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
          AUTHORIZED_USERS: ${{ needs.resolve-inputs.outputs.authorized_users }}
          MENTION_PATTERNS: ${{ needs.resolve-inputs.outputs.mention_patterns }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          # Check if sender is authorized (comma-separated list)
          is_authorized=false
          IFS=',' read -ra users <<< "$AUTHORIZED_USERS"
          for user in "${users[@]}"; do
            user=$(echo "$user" | xargs)  # trim whitespace
            if [[ "$SENDER_LOGIN" == "$user" ]]; then
              is_authorized=true
              break
            fi
          done

          if [[ "$is_authorized" != "true" ]]; then
            echo "Sender '$SENDER_LOGIN' not in authorized users: $AUTHORIZED_USERS"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prevent self-triggering
          if [[ "$SENDER_LOGIN" == "$BOT_USERNAME" || "$SENDER_LOGIN" == "${BOT_USERNAME}[bot]" ]]; then
            echo "Ignoring self-trigger from bot"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine the body to check for mentions
          body=""
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            body="$COMMENT_BODY"
          elif [[ "$EVENT_NAME" == "pull_request_review_comment" ]]; then
            body="$COMMENT_BODY"
          elif [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            body="$REVIEW_BODY"
          elif [[ "$EVENT_NAME" == "issues" ]]; then
            body="$ISSUE_BODY"
          fi

          # Check if any mention pattern matches
          has_mention=false
          IFS=',' read -ra patterns <<< "$MENTION_PATTERNS"
          for pattern in "${patterns[@]}"; do
            pattern=$(echo "$pattern" | xargs)  # trim whitespace
            if [[ "$body" == *"$pattern"* ]]; then
              has_mention=true
              break
            fi
          done

          if [[ "$has_mention" != "true" ]]; then
            echo "No matching mention pattern found in body"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Valid mention from authorized user"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  respond:
    name: Run egg
    needs: [resolve-inputs, check-trigger]
    runs-on: ubuntu-latest
    # Run when:
    # - workflow_call (should_check_trigger=false means check-trigger was skipped)
    # - Event-triggered and check-trigger passed
    if: >-
      always() &&
      needs.resolve-inputs.result == 'success' &&
      (needs.check-trigger.result == 'skipped' || needs.check-trigger.outputs.should_run == 'true')

    permissions:
      contents: write
      pull-requests: write
      issues: write

    concurrency:
      group: egg-mention-${{ needs.resolve-inputs.outputs.issue_or_pr_number }}
      cancel-in-progress: false

    env:
      BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      ISSUE_OR_PR_NUMBER: ${{ needs.resolve-inputs.outputs.issue_or_pr_number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Acknowledge with reaction
        if: github.event_name != 'workflow_call'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            # React to the issue itself
            gh api \
              repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions \
              -X POST -f content='eyes'
          elif [[ "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
            # React to the PR review comment
            gh api \
              repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.id }}/reactions \
              -X POST -f content='eyes'
          elif [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            # No reaction API for reviews — acknowledge via PR comment
            gh api \
              repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              -X POST -f body='👀 Working on it...'
          else
            # React to the issue/PR comment
            gh api \
              repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
              -X POST -f content='eyes'
          fi

      - name: Determine checkout ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            # For reusable workflow calls, default to main
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            # Check if this is a PR comment by looking for pull_request in the issue
            PR_URL="${{ github.event.issue.pull_request.url }}"
            if [[ -n "$PR_URL" && "$PR_URL" != "null" ]]; then
              # It's a PR comment — fetch the head ref
              PR_NUMBER="${{ github.event.issue.number }}"
              PR_DATA=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} --jq '.head.ref')
              echo "ref=${PR_DATA}" >> "$GITHUB_OUTPUT"
              echo "is_pr=true" >> "$GITHUB_OUTPUT"
            else
              echo "ref=main" >> "$GITHUB_OUTPUT"
              echo "is_pr=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.event_name }}" == "pull_request_review_comment" || "${{ github.event_name }}" == "pull_request_review" ]]; then
            echo "ref=${PR_HEAD_REF}" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            # issues (opened)
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      # SECURITY: Always run build-mention-prompt.sh from a trusted checkout
      # (main branch). A malicious PR could replace this script to exfiltrate
      # the bot token, and it would execute if the maintainer mentions the bot
      # on that PR. By checking out main first for prompt building, then the
      # PR branch for egg, we ensure untrusted code never runs with secrets.
      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build prompt
        id: prompt
        run: bash ${{ inputs.prompt_script || 'action/build-mention-prompt.sh' }}
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Checkout PR branch
        if: steps.ref.outputs.is_pr == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Run egg
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: ${{ inputs.timeout || '30' }}

      # Minimize previous status comments to reduce clutter
      # Uses semantic marker instead of content patterns per #363
      - name: Minimize previous status comments
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Find previous bot comments with status marker
          # shellcheck disable=SC2016
          gh api "repos/${{ github.repository }}/issues/${{ env.ISSUE_OR_PR_NUMBER }}/comments" \
            | jq -r --arg bot "$BOT_USERNAME" \
            '.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.body | contains("<!-- egg-status-comment -->")) | .node_id' \
          | while read -r node_id; do
              # shellcheck disable=SC2016 # $id is a GraphQL variable, not bash
              if ! gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }
              ' -f id="$node_id"; then
                echo "Warning: Failed to minimize comment $node_id (may lack permissions)"
              fi
            done

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          EGG_EXIT_CODE: ${{ steps.egg.outputs.exit-code }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Check if egg already posted a substantive comment since the triggering event
          # For pull_request_review events, use review.submitted_at; for comments, use comment.created_at; fallback to issue.created_at
          TRIGGER_TIME="${{ github.event.comment.created_at || github.event.review.submitted_at || github.event.issue.created_at }}"
          # Handle null/empty TRIGGER_TIME (GitHub expression may return literal "null")
          if [[ -z "$TRIGGER_TIME" || "$TRIGGER_TIME" == "null" ]]; then
            TRIGGER_TIME="1970-01-01"
          fi
          # Match both bot username and bot[bot] since GitHub App comments use the [bot] suffix
          EXISTING_COMMENTS=$(gh api "repos/${{ github.repository }}/issues/${{ env.ISSUE_OR_PR_NUMBER }}/comments" \
            --jq "[.[] | select((.user.login == \"$BOT_USERNAME\" or .user.login == \"${BOT_USERNAME}[bot]\") and .created_at > \"${TRIGGER_TIME}\" and (.body | test(\"finished successfully|run failed|👀 Working on it\") | not))] | length")

          if [[ "${EXISTING_COMMENTS:-0}" -gt 0 ]]; then
            # Agent already posted a substantive comment — only add run link on failure
            if [[ "${EGG_EXIT_CODE:-1}" != "0" ]]; then
              BODY="<!-- egg-status-comment -->
          egg run had errors (exit code: ${EGG_EXIT_CODE:-unknown}). [View run logs](${RUN_URL})"
              # Strip leading whitespace from each line (caused by YAML indentation)
              # shellcheck disable=SC2001 # sed is needed for regex-based multiline substitution
              BODY=$(echo "$BODY" | sed 's/^[[:space:]]*//')
              gh api repos/${{ github.repository }}/issues/${{ env.ISSUE_OR_PR_NUMBER }}/comments \
                -X POST -f body="${BODY}"
            fi
          else
            # No substantive comment posted — post fallback
            if [[ "${EGG_EXIT_CODE:-1}" == "0" ]]; then
              BODY="<!-- egg-status-comment -->
          egg finished successfully but did not post a response. [View run logs](${RUN_URL})"
            else
              BODY="<!-- egg-status-comment -->
          egg run failed (exit code: ${EGG_EXIT_CODE:-unknown}). [View run logs](${RUN_URL})"
            fi
            # Strip leading whitespace from each line (caused by YAML indentation)
            # shellcheck disable=SC2001 # sed is needed for regex-based multiline substitution
            BODY=$(echo "$BODY" | sed 's/^[[:space:]]*//')
            gh api repos/${{ github.repository }}/issues/${{ env.ISSUE_OR_PR_NUMBER }}/comments \
              -X POST -f body="${BODY}"
          fi
