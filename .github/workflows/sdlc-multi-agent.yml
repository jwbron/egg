name: "egg: Multi-Agent Orchestration"

# Multi-agent orchestration workflow for the implement phase.
# Dispatches specialized agents (coder, tester, documenter, integrator)
# in waves based on dependencies, enabling parallel execution where possible.
#
# Part of issue #438 - Multi-agent orchestration.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number'
        required: true
        type: number
      branch_name:
        description: 'Branch name for this issue'
        required: true
        type: string
      agent_role:
        description: 'Agent role to dispatch (coder, tester, documenter, integrator, or auto)'
        required: false
        type: choice
        options:
          - auto
          - coder
          - tester
          - documenter
          - integrator
        default: auto
  workflow_call:
    inputs:
      issue_number:
        description: 'GitHub issue number'
        required: true
        type: number
      branch_name:
        description: 'Branch name for this issue'
        required: true
        type: string
      agent_role:
        description: 'Agent role to dispatch (coder, tester, documenter, integrator, or auto)'
        required: false
        type: string
        default: auto
      bot_username:
        description: 'GitHub username of the bot'
        required: false
        type: string
      branch_prefix:
        description: 'Branch prefix for the bot (e.g., "egg")'
        required: false
        type: string
      timeout:
        description: 'Timeout in minutes for agent execution'
        required: false
        type: string
        default: "30"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true
    outputs:
      status:
        description: 'Final status (complete, failed, pending)'
        value: ${{ jobs.orchestrate.outputs.final_status }}
      agents_run:
        description: 'Comma-separated list of agents that ran'
        value: ${{ jobs.orchestrate.outputs.agents_run }}

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

# Prevent concurrent multi-agent runs for the same issue
concurrency:
  group: sdlc-multi-agent-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Orchestrate: Determine which agents to dispatch
  # ============================================================
  orchestrate:
    name: Orchestrate agents
    runs-on: ubuntu-latest
    outputs:
      agents_to_run: ${{ steps.dispatch.outputs.agents }}
      wave_number: ${{ steps.dispatch.outputs.wave }}
      is_parallel: ${{ steps.dispatch.outputs.parallel }}
      is_complete: ${{ steps.dispatch.outputs.complete }}
      has_failures: ${{ steps.dispatch.outputs.failed }}
      final_status: ${{ steps.finalize.outputs.status }}
      agents_run: ${{ steps.finalize.outputs.agents_run }}

    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BRANCH_NAME: ${{ inputs.branch_name }}
      EGG_BOT_USERNAME: ${{ inputs.bot_username }}
      AGENT_ROLE: ${{ inputs.agent_role || 'auto' }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pydantic pyyaml

      - name: Determine next dispatch
        id: dispatch
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ ! -f "$CONTRACT_PATH" ]]; then
            echo "::error::Contract not found at ${CONTRACT_PATH}"
            exit 1
          fi

          # If specific agent requested, use that
          if [[ "$AGENT_ROLE" != "auto" ]]; then
            echo "agents=${AGENT_ROLE}" >> "$GITHUB_OUTPUT"
            echo "wave=1" >> "$GITHUB_OUTPUT"
            echo "parallel=false" >> "$GITHUB_OUTPUT"
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use Python to determine next dispatch based on contract state
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import sys

          contract_path = os.environ['CONTRACT_PATH']

          with open(contract_path) as f:
              contract = json.load(f)

          agent_executions = contract.get('agent_executions', [])

          if not agent_executions:
              # No agent executions - initialize with coder
              print("agents=coder", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print("wave=1", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print("parallel=false", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print("complete=false", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print("failed=false", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              sys.exit(0)

          # Categorize executions
          pending = []
          running = []
          complete = []
          failed = []

          for ex in agent_executions:
              role = ex.get('role')
              status = ex.get('status', 'pending')
              if status == 'pending':
                  pending.append(role)
              elif status == 'running':
                  running.append(role)
              elif status == 'complete':
                  complete.append(role)
              elif status == 'failed':
                  failed.append(role)

          output = open(os.environ['GITHUB_OUTPUT'], 'a')

          if failed:
              print(f"agents=", file=output)
              print(f"wave=0", file=output)
              print(f"parallel=false", file=output)
              print(f"complete=false", file=output)
              print(f"failed=true", file=output)
              print(f"::error::Agents failed: {', '.join(failed)}")
              sys.exit(0)

          if not pending and not running:
              print(f"agents=", file=output)
              print(f"wave=0", file=output)
              print(f"parallel=false", file=output)
              print(f"complete=true", file=output)
              print(f"failed=false", file=output)
              print("All agents complete")
              sys.exit(0)

          if running:
              print(f"agents=", file=output)
              print(f"wave=0", file=output)
              print(f"parallel=false", file=output)
              print(f"complete=false", file=output)
              print(f"failed=false", file=output)
              print(f"::warning::Waiting for running agents: {', '.join(running)}")
              sys.exit(0)

          # Determine which pending agents can run based on dependencies
          # Dependencies: tester/documenter depend on coder, integrator depends on coder+tester
          runnable = []
          for role in pending:
              if role == 'coder':
                  runnable.append(role)
              elif role in ('tester', 'documenter'):
                  if 'coder' in complete:
                      runnable.append(role)
              elif role == 'integrator':
                  if 'coder' in complete and 'tester' in complete:
                      runnable.append(role)

          if runnable:
              # Determine wave number
              wave = 1
              if 'coder' in complete:
                  wave = 2
              if 'tester' in complete and 'documenter' in complete:
                  wave = 3

              print(f"agents={','.join(runnable)}", file=output)
              print(f"wave={wave}", file=output)
              print(f"parallel={'true' if len(runnable) > 1 else 'false'}", file=output)
              print(f"complete=false", file=output)
              print(f"failed=false", file=output)
          else:
              print(f"agents=", file=output)
              print(f"wave=0", file=output)
              print(f"parallel=false", file=output)
              print(f"complete=false", file=output)
              print(f"failed=false", file=output)
              print(f"::warning::Pending agents blocked by dependencies")
          PYTHON_SCRIPT

      - name: Debug dispatch decision
        run: |
          echo "Dispatch decision:"
          echo "  Agents: ${{ steps.dispatch.outputs.agents }}"
          echo "  Wave: ${{ steps.dispatch.outputs.wave }}"
          echo "  Parallel: ${{ steps.dispatch.outputs.parallel }}"
          echo "  Complete: ${{ steps.dispatch.outputs.complete }}"
          echo "  Failed: ${{ steps.dispatch.outputs.failed }}"

      - name: Finalize status
        id: finalize
        run: |
          set -euo pipefail

          AGENTS="${{ steps.dispatch.outputs.agents }}"
          COMPLETE="${{ steps.dispatch.outputs.complete }}"
          FAILED="${{ steps.dispatch.outputs.failed }}"

          if [[ "$FAILED" == "true" ]]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          elif [[ "$COMPLETE" == "true" ]]; then
            echo "status=complete" >> "$GITHUB_OUTPUT"
          elif [[ -z "$AGENTS" ]]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
          else
            echo "status=dispatching" >> "$GITHUB_OUTPUT"
          fi

          echo "agents_run=${AGENTS}" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Run Coder Agent
  # ============================================================
  run-coder:
    name: Run coder agent
    needs: orchestrate
    if: >-
      needs.orchestrate.outputs.is_complete != 'true' &&
      needs.orchestrate.outputs.has_failures != 'true' &&
      contains(needs.orchestrate.outputs.agents_to_run, 'coder')
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.result.outputs.success }}
      commit: ${{ steps.result.outputs.commit }}

    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BRANCH_NAME: ${{ inputs.branch_name }}
      EGG_BOT_USERNAME: ${{ inputs.bot_username }}
      BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      TIMEOUT: ${{ inputs.timeout || '30' }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # SECURITY: Build prompts from trusted checkout (main branch)
      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted action scripts
        run: |
          cp -r action "$RUNNER_TEMP/trusted-action"
          cp -r shared "$RUNNER_TEMP/trusted-shared"

      - name: Build coder prompt
        id: prompt
        run: bash action/build-coder-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${EGG_BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${EGG_BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Mark agent as running
        run: |
          # Update contract to mark coder as running
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if [[ -f "$CONTRACT_PATH" ]]; then
            if jq '(.agent_executions[] | select(.role == "coder")).status = "running"' \
              "$CONTRACT_PATH" > /tmp/contract.json; then
              mv /tmp/contract.json "$CONTRACT_PATH"
              git add "$CONTRACT_PATH"
              git commit -m "Mark coder agent as running" || true
              git push origin "${BRANCH_NAME}" || true
            else
              echo "::warning::Failed to update contract - jq error"
            fi
          fi

      - name: Run coder agent
        id: egg
        continue-on-error: true
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.EGG_BOT_USERNAME }}
          bot-branch-prefix: ${{ env.BRANCH_PREFIX }}
          timeout: ${{ env.TIMEOUT }}
        env:
          EGG_AGENT_ROLE: coder
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}

      - name: Capture result
        id: result
        run: |
          set -euo pipefail

          # Pull latest
          git pull origin "${BRANCH_NAME}" --rebase || true

          # Get HEAD commit
          HEAD_SHA=$(git rev-parse HEAD)

          if [[ "${{ steps.egg.outputs.exit-code }}" == "0" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "commit=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "commit=" >> "$GITHUB_OUTPUT"
          fi

      - name: Update agent status
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            SUCCESS="${{ steps.result.outputs.success }}"
            COMMIT="${{ steps.result.outputs.commit }}"

            if [[ "$SUCCESS" == "true" ]]; then
              if ! jq --arg commit "$COMMIT" '
                (.agent_executions[] | select(.role == "coder")).status = "complete" |
                (.agent_executions[] | select(.role == "coder")).commit = $commit
              ' "$CONTRACT_PATH" > /tmp/contract.json; then
                echo "::error::Failed to update contract - jq error"
                exit 1
              fi
            else
              if ! jq '
                (.agent_executions[] | select(.role == "coder")).status = "failed" |
                (.agent_executions[] | select(.role == "coder")).error = "Agent execution failed"
              ' "$CONTRACT_PATH" > /tmp/contract.json; then
                echo "::error::Failed to update contract - jq error"
                exit 1
              fi
            fi
            mv /tmp/contract.json "$CONTRACT_PATH"

            git add "$CONTRACT_PATH"
            git commit -m "Update coder agent status" || true
            git push origin "${BRANCH_NAME}" || true
          fi

  # ============================================================
  # Run Tester Agent
  # ============================================================
  run-tester:
    name: Run tester agent
    needs: [orchestrate, run-coder]
    if: >-
      always() &&
      needs.orchestrate.outputs.is_complete != 'true' &&
      needs.orchestrate.outputs.has_failures != 'true' &&
      (contains(needs.orchestrate.outputs.agents_to_run, 'tester') ||
       (needs.run-coder.result == 'success' && needs.run-coder.outputs.success == 'true'))
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.result.outputs.success }}

    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BRANCH_NAME: ${{ inputs.branch_name }}
      EGG_BOT_USERNAME: ${{ inputs.bot_username }}
      BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      TIMEOUT: ${{ inputs.timeout || '30' }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted action scripts
        run: |
          cp -r action "$RUNNER_TEMP/trusted-action"

      - name: Build tester prompt
        id: prompt
        run: bash action/build-tester-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${EGG_BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${EGG_BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Mark agent as running
        run: |
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if [[ -f "$CONTRACT_PATH" ]]; then
            if jq '(.agent_executions[] | select(.role == "tester")).status = "running"' \
              "$CONTRACT_PATH" > /tmp/contract.json; then
              mv /tmp/contract.json "$CONTRACT_PATH"
              git add "$CONTRACT_PATH"
              git commit -m "Mark tester agent as running" || true
              git push origin "${BRANCH_NAME}" || true
            else
              echo "::warning::Failed to update contract - jq error"
            fi
          fi

      - name: Run tester agent
        id: egg
        continue-on-error: true
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.EGG_BOT_USERNAME }}
          bot-branch-prefix: ${{ env.BRANCH_PREFIX }}
          timeout: ${{ env.TIMEOUT }}
        env:
          EGG_AGENT_ROLE: tester
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}

      - name: Capture result
        id: result
        run: |
          if [[ "${{ steps.egg.outputs.exit-code }}" == "0" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update agent status
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          git pull origin "${BRANCH_NAME}" --rebase || true

          if [[ -f "$CONTRACT_PATH" ]]; then
            SUCCESS="${{ steps.result.outputs.success }}"
            if [[ "$SUCCESS" == "true" ]]; then
              if ! jq '(.agent_executions[] | select(.role == "tester")).status = "complete"' \
                "$CONTRACT_PATH" > /tmp/contract.json; then
                echo "::error::Failed to update contract - jq error"
                exit 1
              fi
            else
              if ! jq '
                (.agent_executions[] | select(.role == "tester")).status = "failed" |
                (.agent_executions[] | select(.role == "tester")).error = "Agent execution failed"
              ' "$CONTRACT_PATH" > /tmp/contract.json; then
                echo "::error::Failed to update contract - jq error"
                exit 1
              fi
            fi
            mv /tmp/contract.json "$CONTRACT_PATH"
            git add "$CONTRACT_PATH"
            git commit -m "Update tester agent status" || true
            git push origin "${BRANCH_NAME}" || true
          fi

  # ============================================================
  # Run Documenter Agent (can run parallel with tester)
  # ============================================================
  run-documenter:
    name: Run documenter agent
    needs: [orchestrate, run-coder]
    if: >-
      always() &&
      needs.orchestrate.outputs.is_complete != 'true' &&
      needs.orchestrate.outputs.has_failures != 'true' &&
      (contains(needs.orchestrate.outputs.agents_to_run, 'documenter') ||
       (needs.run-coder.result == 'success' && needs.run-coder.outputs.success == 'true'))
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.result.outputs.success }}

    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BRANCH_NAME: ${{ inputs.branch_name }}
      EGG_BOT_USERNAME: ${{ inputs.bot_username }}
      BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      TIMEOUT: ${{ inputs.timeout || '30' }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build documenter prompt
        id: prompt
        run: bash action/build-documenter-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${EGG_BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${EGG_BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Mark agent as running
        run: |
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if [[ -f "$CONTRACT_PATH" ]]; then
            if jq '(.agent_executions[] | select(.role == "documenter")).status = "running"' \
              "$CONTRACT_PATH" > /tmp/contract.json; then
              mv /tmp/contract.json "$CONTRACT_PATH"
              git add "$CONTRACT_PATH"
              git commit -m "Mark documenter agent as running" || true
              git push origin "${BRANCH_NAME}" || true
            else
              echo "::warning::Failed to update contract - jq error"
            fi
          fi

      - name: Run documenter agent
        id: egg
        continue-on-error: true
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.EGG_BOT_USERNAME }}
          bot-branch-prefix: ${{ env.BRANCH_PREFIX }}
          timeout: ${{ env.TIMEOUT }}
        env:
          EGG_AGENT_ROLE: documenter
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}

      - name: Capture result
        id: result
        run: |
          if [[ "${{ steps.egg.outputs.exit-code }}" == "0" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update agent status
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          git pull origin "${BRANCH_NAME}" --rebase || true

          if [[ -f "$CONTRACT_PATH" ]]; then
            SUCCESS="${{ steps.result.outputs.success }}"
            if [[ "$SUCCESS" == "true" ]]; then
              if ! jq '(.agent_executions[] | select(.role == "documenter")).status = "complete"' \
                "$CONTRACT_PATH" > /tmp/contract.json; then
                echo "::error::Failed to update contract - jq error"
                exit 1
              fi
            else
              if ! jq '
                (.agent_executions[] | select(.role == "documenter")).status = "failed" |
                (.agent_executions[] | select(.role == "documenter")).error = "Agent execution failed"
              ' "$CONTRACT_PATH" > /tmp/contract.json; then
                echo "::error::Failed to update contract - jq error"
                exit 1
              fi
            fi
            mv /tmp/contract.json "$CONTRACT_PATH"
            git add "$CONTRACT_PATH"
            git commit -m "Update documenter agent status" || true
            git push origin "${BRANCH_NAME}" || true
          fi

  # ============================================================
  # Run Integrator Agent
  # ============================================================
  run-integrator:
    name: Run integrator agent
    needs: [orchestrate, run-coder, run-tester, run-documenter]
    # Integrator requires coder + tester to succeed, but documenter can fail
    # This allows independent agents to continue even if others fail
    if: >-
      always() &&
      needs.orchestrate.outputs.is_complete != 'true' &&
      (contains(needs.orchestrate.outputs.agents_to_run, 'integrator') ||
       (needs.run-coder.result == 'success' && needs.run-coder.outputs.success == 'true' &&
        needs.run-tester.result == 'success' && needs.run-tester.outputs.success == 'true'))
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.result.outputs.success }}

    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BRANCH_NAME: ${{ inputs.branch_name }}
      EGG_BOT_USERNAME: ${{ inputs.bot_username }}
      BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      TIMEOUT: ${{ inputs.timeout || '30' }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build integrator prompt
        id: prompt
        run: bash action/build-integrator-prompt.sh
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${EGG_BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${EGG_BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Mark agent as running
        run: |
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if [[ -f "$CONTRACT_PATH" ]]; then
            if jq '(.agent_executions[] | select(.role == "integrator")).status = "running"' \
              "$CONTRACT_PATH" > /tmp/contract.json; then
              mv /tmp/contract.json "$CONTRACT_PATH"
              git add "$CONTRACT_PATH"
              git commit -m "Mark integrator agent as running" || true
              git push origin "${BRANCH_NAME}" || true
            else
              echo "::warning::Failed to update contract - jq error"
            fi
          fi

      - name: Run integrator agent
        id: egg
        continue-on-error: true
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.EGG_BOT_USERNAME }}
          bot-branch-prefix: ${{ env.BRANCH_PREFIX }}
          timeout: ${{ env.TIMEOUT }}
        env:
          EGG_AGENT_ROLE: integrator
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}

      - name: Capture result
        id: result
        run: |
          if [[ "${{ steps.egg.outputs.exit-code }}" == "0" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update agent status
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          git pull origin "${BRANCH_NAME}" --rebase || true

          if [[ -f "$CONTRACT_PATH" ]]; then
            SUCCESS="${{ steps.result.outputs.success }}"
            if [[ "$SUCCESS" == "true" ]]; then
              if ! jq '(.agent_executions[] | select(.role == "integrator")).status = "complete"' \
                "$CONTRACT_PATH" > /tmp/contract.json; then
                echo "::error::Failed to update contract - jq error"
                exit 1
              fi
            else
              if ! jq '
                (.agent_executions[] | select(.role == "integrator")).status = "failed" |
                (.agent_executions[] | select(.role == "integrator")).error = "Agent execution failed"
              ' "$CONTRACT_PATH" > /tmp/contract.json; then
                echo "::error::Failed to update contract - jq error"
                exit 1
              fi
            fi
            mv /tmp/contract.json "$CONTRACT_PATH"
            git add "$CONTRACT_PATH"
            git commit -m "Update integrator agent status" || true
            git push origin "${BRANCH_NAME}" || true
          fi

  # ============================================================
  # Finalize: Report overall status and handle partial failures
  # ============================================================
  finalize:
    name: Finalize orchestration
    needs: [orchestrate, run-coder, run-tester, run-documenter, run-integrator]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.status.outputs.status }}
      summary: ${{ steps.status.outputs.summary }}

    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BRANCH_NAME: ${{ inputs.branch_name }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 1

      - name: Collect agent results
        id: status
        run: |
          set -euo pipefail

          # Collect results from all agents
          CODER_RESULT="${{ needs.run-coder.result }}"
          CODER_SUCCESS="${{ needs.run-coder.outputs.success }}"
          TESTER_RESULT="${{ needs.run-tester.result }}"
          TESTER_SUCCESS="${{ needs.run-tester.outputs.success }}"
          DOCUMENTER_RESULT="${{ needs.run-documenter.result }}"
          DOCUMENTER_SUCCESS="${{ needs.run-documenter.outputs.success }}"
          INTEGRATOR_RESULT="${{ needs.run-integrator.result }}"
          INTEGRATOR_SUCCESS="${{ needs.run-integrator.outputs.success }}"

          FAILED_AGENTS=""
          SUCCESSFUL_AGENTS=""
          SKIPPED_AGENTS=""

          # Check coder
          if [[ "$CODER_RESULT" == "success" && "$CODER_SUCCESS" == "true" ]]; then
            SUCCESSFUL_AGENTS+="coder,"
          elif [[ "$CODER_RESULT" == "skipped" ]]; then
            SKIPPED_AGENTS+="coder,"
          else
            FAILED_AGENTS+="coder,"
          fi

          # Check tester
          if [[ "$TESTER_RESULT" == "success" && "$TESTER_SUCCESS" == "true" ]]; then
            SUCCESSFUL_AGENTS+="tester,"
          elif [[ "$TESTER_RESULT" == "skipped" ]]; then
            SKIPPED_AGENTS+="tester,"
          else
            FAILED_AGENTS+="tester,"
          fi

          # Check documenter
          if [[ "$DOCUMENTER_RESULT" == "success" && "$DOCUMENTER_SUCCESS" == "true" ]]; then
            SUCCESSFUL_AGENTS+="documenter,"
          elif [[ "$DOCUMENTER_RESULT" == "skipped" ]]; then
            SKIPPED_AGENTS+="documenter,"
          else
            FAILED_AGENTS+="documenter,"
          fi

          # Check integrator
          if [[ "$INTEGRATOR_RESULT" == "success" && "$INTEGRATOR_SUCCESS" == "true" ]]; then
            SUCCESSFUL_AGENTS+="integrator,"
          elif [[ "$INTEGRATOR_RESULT" == "skipped" ]]; then
            SKIPPED_AGENTS+="integrator,"
          else
            FAILED_AGENTS+="integrator,"
          fi

          # Determine overall status
          # All agents successful = complete
          # Some agents failed but others continued = partial
          # Critical agents failed (coder or integrator) = failed
          if [[ -z "$FAILED_AGENTS" ]]; then
            STATUS="complete"
            SUMMARY="All agents completed successfully"
          elif [[ "$FAILED_AGENTS" == *"coder"* ]]; then
            STATUS="failed"
            SUMMARY="Coder agent failed - blocking subsequent agents"
          elif [[ "$FAILED_AGENTS" == *"integrator"* && -n "$SUCCESSFUL_AGENTS" ]]; then
            STATUS="partial"
            SUMMARY="Integration failed but some agents succeeded: ${SUCCESSFUL_AGENTS%,}"
          elif [[ -n "$SUCCESSFUL_AGENTS" ]]; then
            STATUS="partial"
            SUMMARY="Some agents succeeded (${SUCCESSFUL_AGENTS%,}) but others failed (${FAILED_AGENTS%,})"
          else
            STATUS="failed"
            SUMMARY="All agents failed: ${FAILED_AGENTS%,}"
          fi

          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          echo "successful_agents=${SUCCESSFUL_AGENTS%,}" >> "$GITHUB_OUTPUT"
          echo "failed_agents=${FAILED_AGENTS%,}" >> "$GITHUB_OUTPUT"

          echo "Orchestration status: ${STATUS}"
          echo "Summary: ${SUMMARY}"

      - name: Report partial success
        if: steps.status.outputs.status == 'partial'
        run: |
          echo "::warning::Partial success - some agents failed but independent agents continued"
          echo "Failed: ${{ steps.status.outputs.failed_agents }}"
          echo "Successful: ${{ steps.status.outputs.successful_agents }}"
