name: Reusable Review Bot Workflow

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      bot_name:
        description: 'Bot name for status messages and marker detection'
        required: true
        type: string
      prompt_script:
        description: 'Path to prompt builder script (relative to repo root)'
        required: false
        type: string
        default: "action/build-review-prompt.sh"
      timeout:
        description: 'Timeout in minutes'
        required: false
        type: string
        default: "10"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    concurrency:
      group: egg-${{ inputs.bot_name }}-${{ inputs.pr_number }}
      cancel-in-progress: true

    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      BOT_USERNAME: james-in-a-box

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # For workflow_dispatch, fetch PR metadata via API since
      # github.event.pull_request is not available
      - name: Fetch PR metadata
        id: pr-meta
        run: |
          pr_json=$(gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }})
          echo "head-ref=$(echo "$pr_json" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "head-repo=$(echo "$pr_json" | jq -r '.head.repo.full_name')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      # Capture last bot review info before dismissing (for re-review context)
      # The gh wrapper adds a marker to all automated reviews:
      #   <!-- egg-automated-review bot=<name> commit=<sha> -->
      # We search for this marker in reviews and comments to find the last review.
      - name: Get last review info
        id: last-review
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          # Regex to extract commit SHA from the automated review marker
          # Format: <!-- egg-automated-review bot=<name> commit=<sha> -->
          marker_regex='<!-- egg-automated-review bot=${{ inputs.bot_name }} commit=([a-f0-9]+) -->'

          # Check reviews from the Reviews API for the marker
          # The marker is in the review body
          last_review_commit=""
          last_review_time=""
          reviews=$(gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews" \
            --jq '[.[] | {body: .body, submitted_at: .submitted_at}]')

          while IFS= read -r review; do
            body=$(echo "$review" | jq -r '.body // ""')
            submitted_at=$(echo "$review" | jq -r '.submitted_at')
            if [[ "$body" =~ $marker_regex ]]; then
              commit="${BASH_REMATCH[1]}"
              # Keep track of the most recent one
              if [[ -z "$last_review_time" || "$submitted_at" > "$last_review_time" ]]; then
                last_review_commit="$commit"
                last_review_time="$submitted_at"
              fi
            fi
          done < <(echo "$reviews" | jq -c '.[]')

          if [[ -n "$last_review_commit" ]]; then
            echo "Found automated review marker in Reviews API: commit=$last_review_commit at $last_review_time"
          fi

          # Also check issue comments for the marker (for self-reviews where
          # GitHub blocks bots from using the Reviews API on their own PRs)
          last_comment_commit=""
          last_comment_time=""
          comments=$(gh api "repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/comments" \
            --jq '[.[] | {body: .body, created_at: .created_at}]')

          while IFS= read -r comment; do
            body=$(echo "$comment" | jq -r '.body // ""')
            created_at=$(echo "$comment" | jq -r '.created_at')
            if [[ "$body" =~ $marker_regex ]]; then
              commit="${BASH_REMATCH[1]}"
              # Keep track of the most recent one
              if [[ -z "$last_comment_time" || "$created_at" > "$last_comment_time" ]]; then
                last_comment_commit="$commit"
                last_comment_time="$created_at"
              fi
            fi
          done < <(echo "$comments" | jq -c '.[]')

          if [[ -n "$last_comment_commit" ]]; then
            echo "Found automated review marker in issue comments: commit=$last_comment_commit at $last_comment_time"
          fi

          # Use whichever is more recent (review or comment)
          if [[ -n "$last_review_commit" && -z "$last_comment_commit" ]]; then
            echo "commit-sha=$last_review_commit" >> "$GITHUB_OUTPUT"
            echo "Using review marker result"
          elif [[ -z "$last_review_commit" && -n "$last_comment_commit" ]]; then
            echo "commit-sha=$last_comment_commit" >> "$GITHUB_OUTPUT"
            echo "Using comment marker result"
          elif [[ -n "$last_review_commit" && -n "$last_comment_commit" ]]; then
            # Compare timestamps to find the most recent
            # Note: ISO 8601 timestamps (YYYY-MM-DDTHH:MM:SSZ) can be compared
            # as strings since lexicographic ordering matches chronological ordering
            if [[ "$last_comment_time" > "$last_review_time" ]]; then
              echo "commit-sha=$last_comment_commit" >> "$GITHUB_OUTPUT"
              echo "Using comment marker result (newer)"
            else
              echo "commit-sha=$last_review_commit" >> "$GITHUB_OUTPUT"
              echo "Using review marker result (newer or same)"
            fi
          else
            echo "commit-sha=" >> "$GITHUB_OUTPUT"
            echo "No automated review marker found"
          fi

      # Dismiss previous bot reviews before starting new review
      - name: Dismiss previous bot reviews
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          # shellcheck disable=SC2016
          gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews" \
            --jq --arg bot "$BOT_USERNAME" \
            '[.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.state | test("PENDING|COMMENTED|CHANGES_REQUESTED"))] | .[].id' \
          | while read -r id; do
              gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews/$id/dismissals" \
                -X PUT -f message="Superseded by new review" || true
            done

      # SECURITY: Build the review prompt from a trusted checkout (main).
      # A malicious PR could replace build-review-prompt.sh to exfiltrate
      # the bot token. By checking out main for prompt building, we ensure
      # untrusted code never runs with secrets.
      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build review prompt
        id: prompt
        run: bash ${{ inputs.prompt_script }}
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          LAST_REVIEW_COMMIT: ${{ steps.last-review.outputs.commit-sha }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr-meta.outputs.head-repo }}
          ref: ${{ steps.pr-meta.outputs.head-ref }}
          persist-credentials: false

      - name: Run egg review
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          model: ${{ steps.prompt.outputs.model }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: ${{ inputs.timeout }}
        env:
          EGG_BOT_NAME: ${{ inputs.bot_name }}

      - name: Post status comment
        if: always()
        run: |
          if [[ "${{ steps.egg.outcome }}" == "success" ]]; then
            BODY="egg ${{ inputs.bot_name }} completed. [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            BODY="egg ${{ inputs.bot_name }} failed. [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          gh pr comment "${{ env.PR_NUMBER }}" --body "$BODY"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
