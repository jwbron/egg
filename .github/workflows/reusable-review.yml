name: Reusable Review Bot Workflow

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      prompt:
        description: 'The review prompt to send to egg'
        required: true
        type: string
      bot_name:
        description: 'Bot name for status messages'
        required: true
        type: string
      timeout:
        description: 'Timeout in minutes'
        required: false
        type: string
        default: "10"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      BOT_USERNAME: james-in-a-box

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Fetch PR head ref
        id: pr-meta
        run: |
          pr_json=$(gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }})
          echo "head-ref=$(echo "$pr_json" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "head-repo=$(echo "$pr_json" | jq -r '.head.repo.full_name')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr-meta.outputs.head-repo }}
          ref: ${{ steps.pr-meta.outputs.head-ref }}
          persist-credentials: false

      - name: Write prompt to file
        id: prompt
        run: |
          prompt_file="${RUNNER_TEMP}/review-prompt.txt"
          cat > "$prompt_file" << 'PROMPT_EOF'
          ${{ inputs.prompt }}
          PROMPT_EOF
          echo "prompt-file=${prompt_file}" >> "$GITHUB_OUTPUT"

      - name: Run egg review
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          model: opus
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: ${{ inputs.timeout }}
        env:
          EGG_BOT_NAME: ${{ inputs.bot_name }}

      - name: Post status comment
        if: always()
        run: |
          if [[ "${{ steps.egg.outcome }}" == "success" ]]; then
            BODY="egg ${{ inputs.bot_name }} review completed. [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            BODY="egg ${{ inputs.bot_name }} review failed. [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          gh pr comment "${{ env.PR_NUMBER }}" --body "$BODY"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
