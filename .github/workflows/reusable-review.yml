name: Reusable Review Bot Workflow

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      bot_name:
        description: 'Bot name for status messages and marker detection'
        required: true
        type: string
      prompt_script:
        description: 'Path to prompt builder script (relative to repo root)'
        required: false
        type: string
        default: "action/build-review-prompt.sh"
      timeout:
        description: 'Timeout in minutes'
        required: false
        type: string
        default: "10"
      pr_title:
        description: 'PR title (for skip-review check)'
        required: false
        type: string
        default: ""
      event_name:
        description: 'The triggering event name (pull_request, workflow_run, or workflow_dispatch)'
        required: false
        type: string
        default: "pull_request"
      head_sha:
        description: 'The commit SHA to review (from workflow_run trigger)'
        required: false
        type: string
        default: ""
      wait_for_checks:
        description: 'Whether to wait for all checks to pass before reviewing'
        required: false
        type: boolean
        default: false
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true

jobs:
  should-run:
    name: Check if review should run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check if PR is ready for review
        id: check
        env:
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          # For workflow_dispatch, always run
          if [[ "${{ inputs.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if [skip-review] in title
          if [[ "$PR_TITLE" == *"[skip-review]"* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

  # Wait for all check runs to complete before reviewing.
  # This prevents the reviewer from posting feedback while CI is still running,
  # which would cause duplicate reviews when autofixer pushes fixes.
  wait-for-checks:
    name: Wait for checks
    needs: should-run
    if: needs.should-run.outputs.run == 'true' && inputs.wait_for_checks == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      all_passed: ${{ steps.wait.outputs.passed }}
      head_sha: ${{ steps.wait.outputs.head_sha }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Wait for all check runs to complete
        id: wait
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          # Determine HEAD SHA to wait on
          if [[ -n "${{ inputs.head_sha }}" ]]; then
            HEAD_SHA="${{ inputs.head_sha }}"
          else
            # Fetch from PR API if not provided
            HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')
          fi
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Waiting for checks on commit: ${HEAD_SHA}"

          # Wait for all check runs to complete (CI, other reviews, etc.)
          # Excludes this workflow's own checks to avoid self-deadlock
          # (filtering is done inline in jq below)

          # Maximum wait time (30 minutes)
          MAX_WAIT_SECONDS=1800
          POLL_INTERVAL=30
          start_time=$(date +%s)
          zero_checks_iterations=0
          # After 10 minutes with no checks, assume none are configured and pass
          MAX_ZERO_CHECKS_ITERATIONS=20

          while true; do
            # Use wall-clock elapsed time (accounts for API latency, not just sleep)
            elapsed=$(( $(date +%s) - start_time ))
            if [[ $elapsed -ge $MAX_WAIT_SECONDS ]]; then
              break
            fi

            # Get all check runs for this commit
            check_runs=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
              --jq '.check_runs | map({name: .name, status: .status, conclusion: .conclusion})')

            # Filter out our own workflow's checks and the SDLC pipeline
            external_checks=$(echo "$check_runs" | jq '
              [.[] | select(
                (.name | startswith("egg: Code Review") | not) and
                (.name | startswith("egg: Agent-Mode Design Review") | not) and
                (.name | startswith("egg: SDLC Pipeline") | not)
              )]
            ')

            total=$(echo "$external_checks" | jq 'length')
            completed=$(echo "$external_checks" | jq '[.[] | select(.status == "completed")] | length')
            failed=$(echo "$external_checks" | jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')
            pending=$(echo "$external_checks" | jq -r '[.[] | select(.status != "completed")] | map(.name) | join(", ")')

            echo "Checks: ${completed}/${total} completed, ${failed} failed"

            if [[ "$total" -eq 0 ]]; then
              zero_checks_iterations=$((zero_checks_iterations + 1))
              if [[ $zero_checks_iterations -ge $MAX_ZERO_CHECKS_ITERATIONS ]]; then
                echo "No external checks found after ${zero_checks_iterations} iterations — assuming none are configured"
                echo "passed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "No external checks found yet (attempt ${zero_checks_iterations}/${MAX_ZERO_CHECKS_ITERATIONS})"
              sleep $POLL_INTERVAL
              continue
            fi
            # Reset counter once checks appear
            zero_checks_iterations=0

            # All checks completed
            if [[ "$completed" -eq "$total" ]]; then
              if [[ "$failed" -gt 0 ]]; then
                echo "::warning::${failed} check(s) failed — skipping review (autofixer will handle)"
                echo "$external_checks" | jq -r '.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "  FAILED: \(.name) (\(.conclusion))"'
                echo "passed=false" >> "$GITHUB_OUTPUT"
              else
                echo "All ${total} checks passed"
                echo "passed=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi

            echo "Waiting for: ${pending}"
            sleep $POLL_INTERVAL
          done

          echo "::warning::Timeout waiting for checks after ${MAX_WAIT_SECONDS} seconds"
          echo "passed=false" >> "$GITHUB_OUTPUT"

  review:
    name: Run review
    needs: [should-run, wait-for-checks]
    # Run if:
    # 1. should-run passed AND
    # 2. Either wait_for_checks is false (skip waiting), OR wait-for-checks passed
    if: >-
      always() &&
      needs.should-run.outputs.run == 'true' &&
      (inputs.wait_for_checks == false || needs.wait-for-checks.outputs.all_passed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    concurrency:
      group: egg-${{ inputs.bot_name }}-${{ inputs.pr_number }}
      cancel-in-progress: true

    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      BOT_USERNAME: james-in-a-box

    steps:
      - name: Generate GitHub App token for bot
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # For workflow_dispatch, fetch PR metadata via API since
      # github.event.pull_request is not available
      - name: Fetch PR head branch and repo
        id: pr-meta
        run: |
          pr_json=$(gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }})
          echo "head-ref=$(echo "$pr_json" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "head-repo=$(echo "$pr_json" | jq -r '.head.repo.full_name')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      # Capture last bot review info before dismissing (for re-review context)
      # The gh wrapper adds a marker to all automated reviews:
      #   <!-- egg-automated-review bot=<name> commit=<sha> verdict=<type> -->
      # We search for this marker in reviews and comments to find the last review.
      - name: Find last bot review commit for re-review context
        id: last-review
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          # Regex to extract commit SHA from the automated review marker
          # Format: <!-- egg-automated-review bot=<name> commit=<sha> verdict=<type> -->
          # The verdict field is optional for backwards compatibility with old markers
          # Escape regex metacharacters in bot_name to prevent pattern breakage
          # shellcheck disable=SC2016
          escaped_bot_name=$(printf '%s' '${{ inputs.bot_name }}' | sed 's/[.[\*^$()+?{|\\]/\\&/g')
          marker_regex="<!-- egg-automated-review bot=${escaped_bot_name} commit=([a-f0-9]+)( verdict=([a-z-]+))? -->"

          # Check reviews from the Reviews API for the marker
          # The marker is in the review body
          last_review_commit=""
          last_review_time=""
          reviews=$(gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews" \
            --jq '[.[] | {body: .body, submitted_at: .submitted_at}]')

          while IFS= read -r review; do
            body=$(echo "$review" | jq -r '.body // ""')
            submitted_at=$(echo "$review" | jq -r '.submitted_at')
            if [[ "$body" =~ $marker_regex ]]; then
              commit="${BASH_REMATCH[1]}"
              # Keep track of the most recent one
              if [[ -z "$last_review_time" || "$submitted_at" > "$last_review_time" ]]; then
                last_review_commit="$commit"
                last_review_time="$submitted_at"
              fi
            fi
          done < <(echo "$reviews" | jq -c '.[]')

          if [[ -n "$last_review_commit" ]]; then
            echo "Found automated review marker in Reviews API: commit=$last_review_commit at $last_review_time"
          fi

          # Also check issue comments for the marker (for self-reviews where
          # GitHub blocks bots from using the Reviews API on their own PRs)
          last_comment_commit=""
          last_comment_time=""
          comments=$(gh api "repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/comments" \
            --jq '[.[] | {body: .body, created_at: .created_at}]')

          while IFS= read -r comment; do
            body=$(echo "$comment" | jq -r '.body // ""')
            created_at=$(echo "$comment" | jq -r '.created_at')
            if [[ "$body" =~ $marker_regex ]]; then
              commit="${BASH_REMATCH[1]}"
              # Keep track of the most recent one
              if [[ -z "$last_comment_time" || "$created_at" > "$last_comment_time" ]]; then
                last_comment_commit="$commit"
                last_comment_time="$created_at"
              fi
            fi
          done < <(echo "$comments" | jq -c '.[]')

          if [[ -n "$last_comment_commit" ]]; then
            echo "Found automated review marker in issue comments: commit=$last_comment_commit at $last_comment_time"
          fi

          # Use whichever is more recent (review or comment)
          if [[ -n "$last_review_commit" && -z "$last_comment_commit" ]]; then
            echo "commit-sha=$last_review_commit" >> "$GITHUB_OUTPUT"
            echo "Using review marker result"
          elif [[ -z "$last_review_commit" && -n "$last_comment_commit" ]]; then
            echo "commit-sha=$last_comment_commit" >> "$GITHUB_OUTPUT"
            echo "Using comment marker result"
          elif [[ -n "$last_review_commit" && -n "$last_comment_commit" ]]; then
            # Compare timestamps to find the most recent
            # Note: ISO 8601 timestamps (YYYY-MM-DDTHH:MM:SSZ) can be compared
            # as strings since lexicographic ordering matches chronological ordering
            if [[ "$last_comment_time" > "$last_review_time" ]]; then
              echo "commit-sha=$last_comment_commit" >> "$GITHUB_OUTPUT"
              echo "Using comment marker result (newer)"
            else
              echo "commit-sha=$last_review_commit" >> "$GITHUB_OUTPUT"
              echo "Using review marker result (newer or same)"
            fi
          else
            echo "commit-sha=" >> "$GITHUB_OUTPUT"
            echo "No automated review marker found"
          fi

      # Dismiss previous bot reviews before starting new review
      - name: Dismiss stale bot reviews
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          # shellcheck disable=SC2016
          gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews" \
            --jq --arg bot "$BOT_USERNAME" \
            '[.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.state | test("PENDING|COMMENTED|CHANGES_REQUESTED"))] | .[].id' \
          | while read -r id; do
              gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews/$id/dismissals" \
                -X PUT -f message="Superseded by new review" || true
            done

      # SECURITY: Build the review prompt from a trusted checkout (main).
      # A malicious PR could replace build-review-prompt.sh to exfiltrate
      # the bot token. By checking out main for prompt building, we ensure
      # untrusted code never runs with secrets.
      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Build review prompt from trusted main branch
        id: prompt
        run: bash ${{ inputs.prompt_script }}
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          LAST_REVIEW_COMMIT: ${{ steps.last-review.outputs.commit-sha }}

      - name: Checkout PR code for review
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr-meta.outputs.head-repo }}
          ref: ${{ steps.pr-meta.outputs.head-ref }}
          persist-credentials: false

      - name: Run egg to review and post feedback
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          model: ${{ steps.prompt.outputs.model }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.BOT_USERNAME }}
          timeout: ${{ inputs.timeout }}
        env:
          EGG_BOT_NAME: ${{ inputs.bot_name }}

      - name: Post workflow run status to PR
        if: always() && !cancelled()
        run: |
          if [[ "${{ steps.egg.outcome }}" == "success" ]]; then
            BODY="egg ${{ inputs.bot_name }} completed. [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            BODY="egg ${{ inputs.bot_name }} failed. [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          gh pr comment "${{ env.PR_NUMBER }}" --body "$BODY"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
