name: "egg: SDLC Work Loop"

# Unified work loop workflow for SDLC phases.
# Consolidates the work/review/respond cycle pattern across refine, plan, and implement phases.
# Part of SDLC unification (#436, #449).

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'SDLC phase (refine, plan, implement)'
        required: true
        type: choice
        options:
          - refine
          - plan
          - implement
      issue_number:
        description: 'GitHub issue number to process'
        required: true
        type: number
      branch_name:
        description: 'Branch name for this issue'
        required: true
        type: string
  workflow_call:
    inputs:
      phase:
        description: 'SDLC phase (refine, plan, implement)'
        required: true
        type: string
      issue_number:
        description: 'GitHub issue number to process'
        required: true
        type: number
      branch_name:
        description: 'Branch name for this issue'
        required: true
        type: string
      work_prompt_script:
        description: 'Path to prompt builder script for work phase'
        required: false
        type: string
        default: "action/build-sdlc-prompt.sh"
      review_prompt_script:
        description: 'Path to prompt builder script for review phase (deprecated, use reviewers)'
        required: false
        type: string
        default: "action/build-unified-review-prompt.sh"
      reviewers:
        description: 'JSON array of reviewer configs [{name, script}]. Defaults by phase.'
        required: false
        type: string
        default: ""
      output_type:
        description: 'Output type: draft (refine/plan) or pr (implement). Empty = phase-based default.'
        required: false
        type: string
        default: ""
      human_review_mechanism:
        description: 'Human review mechanism: issue_checkbox or pr_review. Empty = phase-based default.'
        required: false
        type: string
        default: ""
      max_review_cycles:
        description: 'Maximum review cycles before escalation'
        required: false
        type: number
        default: 3
      max_total_cycles:
        description: 'Maximum total work loop iterations before circuit breaker opens'
        required: false
        type: number
        default: 10
      work_timeout:
        description: 'Timeout in minutes for the work step'
        required: false
        type: string
        default: "30"
      review_timeout:
        description: 'Timeout in minutes for each reviewer (default: 30)'
        required: false
        type: string
        default: "30"
      bot_username:
        description: 'GitHub username of the bot'
        required: false
        type: string
      branch_prefix:
        description: 'Branch prefix for the bot (e.g., "egg")'
        required: false
        type: string
      workflow_owner:
        description: 'GitHub username who initiated the workflow'
        required: false
        type: string
        default: ""
      pr_number:
        description: 'PR number for implement phase (if PR already exists)'
        required: false
        type: number
        default: 0
      mode:
        description: 'Execution mode: full (work+checks+review) or checks-only (skip work, run checks only)'
        required: false
        type: string
        default: "full"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

# Prevent concurrent work loop runs for the same issue
concurrency:
  group: sdlc-work-loop-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Resolve inputs for workflow_dispatch support
  # ============================================================
  resolve-inputs:
    name: Resolve inputs
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.resolve.outputs.phase }}
      issue_number: ${{ steps.resolve.outputs.issue_number }}
      branch_name: ${{ steps.resolve.outputs.branch_name }}
      work_prompt_script: ${{ steps.resolve.outputs.work_prompt_script }}
      review_prompt_script: ${{ steps.resolve.outputs.review_prompt_script }}
      reviewers: ${{ steps.resolve.outputs.reviewers }}
      output_type: ${{ steps.resolve.outputs.output_type }}
      human_review_mechanism: ${{ steps.resolve.outputs.human_review_mechanism }}
      max_review_cycles: ${{ steps.resolve.outputs.max_review_cycles }}
      max_total_cycles: ${{ steps.resolve.outputs.max_total_cycles }}
      work_timeout: ${{ steps.resolve.outputs.work_timeout }}
      review_timeout: ${{ steps.resolve.outputs.review_timeout }}
      bot_username: ${{ steps.resolve.outputs.bot_username }}
      branch_prefix: ${{ steps.resolve.outputs.branch_prefix }}
      workflow_owner: ${{ steps.resolve.outputs.workflow_owner }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Resolve inputs with defaults
        id: resolve
        run: |
          set -euo pipefail

          # Core inputs (required)
          PHASE="${{ inputs.phase }}"
          ISSUE_NUMBER="${{ inputs.issue_number }}"
          BRANCH_NAME="${{ inputs.branch_name }}"
          WORK_PROMPT_SCRIPT="${{ inputs.work_prompt_script || 'action/build-sdlc-prompt.sh' }}"
          REVIEW_PROMPT_SCRIPT="${{ inputs.review_prompt_script || 'action/build-unified-review-prompt.sh' }}"

          # Validate phase
          if [[ ! "$PHASE" =~ ^(refine|plan|implement)$ ]]; then
            echo "::error::Invalid phase: $PHASE (must be refine, plan, or implement)"
            exit 1
          fi

          # Validate issue number is numeric
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number: $ISSUE_NUMBER"
            exit 1
          fi

          # Validate branch_name format (alphanumeric, hyphens, underscores, slashes)
          if ! [[ "$BRANCH_NAME" =~ ^[a-zA-Z0-9/_-]+$ ]]; then
            echo "::error::Invalid branch name format: $BRANCH_NAME"
            exit 1
          fi

          # Validate work_prompt_script path (must start with action/ and be a safe filename)
          if [[ ! "$WORK_PROMPT_SCRIPT" =~ ^action/[a-zA-Z0-9_-]+\.sh$ ]]; then
            echo "::error::Invalid work_prompt_script path: $WORK_PROMPT_SCRIPT (must match action/*.sh)"
            exit 1
          fi

          # Validate review_prompt_script path (must start with action/ and be a safe filename)
          if [[ ! "$REVIEW_PROMPT_SCRIPT" =~ ^action/[a-zA-Z0-9_-]+\.sh$ ]]; then
            echo "::error::Invalid review_prompt_script path: $REVIEW_PROMPT_SCRIPT (must match action/*.sh)"
            exit 1
          fi

          # Write outputs
          {
            echo "phase=${PHASE}"
            echo "issue_number=${ISSUE_NUMBER}"
            echo "branch_name=${BRANCH_NAME}"
            echo "work_prompt_script=${WORK_PROMPT_SCRIPT}"
            echo "review_prompt_script=${REVIEW_PROMPT_SCRIPT}"
          } >> "$GITHUB_OUTPUT"

          # Compute reviewers based on phase (or use explicit input)
          REVIEWERS_INPUT='${{ inputs.reviewers }}'
          if [[ -n "$REVIEWERS_INPUT" && "$REVIEWERS_INPUT" != "null" ]]; then
            # Use explicit reviewers input
            REVIEWERS="$REVIEWERS_INPUT"
          else
            # Phase-based defaults
            case "$PHASE" in
              refine|plan)
                # For refine/plan: unified reviewer + agent-mode design reviewer
                REVIEWERS='[{"name":"unified","script":"action/build-unified-review-prompt.sh"},{"name":"agent-design","script":"action/build-agent-mode-design-review-prompt-workloop.sh"}]'
                ;;
              implement)
                # For implement: unified + agent-design + contract + code reviewers
                REVIEWERS='[{"name":"unified","script":"action/build-unified-review-prompt.sh"},{"name":"agent-design","script":"action/build-agent-mode-design-review-prompt-workloop.sh"},{"name":"contract","script":"action/build-contract-verification-prompt-workloop.sh"},{"name":"code","script":"action/build-code-review-prompt-workloop.sh"}]'
                ;;
              *)
                # Fallback to single unified reviewer
                REVIEWERS='[{"name":"unified","script":"action/build-unified-review-prompt.sh"}]'
                ;;
            esac
          fi

          # Validate reviewers JSON
          if ! echo "$REVIEWERS" | jq -e '.' > /dev/null 2>&1; then
            echo "::error::Invalid reviewers JSON: $REVIEWERS"
            exit 1
          fi

          # Validate each reviewer script path
          for script in $(echo "$REVIEWERS" | jq -r '.[].script'); do
            if [[ ! "$script" =~ ^action/[a-zA-Z0-9_-]+\.sh$ ]]; then
              echo "::error::Invalid reviewer script path: $script (must match action/*.sh)"
              exit 1
            fi
          done

          # Validate each reviewer name
          for name in $(echo "$REVIEWERS" | jq -r '.[].name'); do
            if [[ ! "$name" =~ ^[a-zA-Z][a-zA-Z0-9_-]*$ ]]; then
              echo "::error::Invalid reviewer name: $name (must start with letter, contain only alphanumerics, underscores, and hyphens)"
              exit 1
            fi
          done

          {
            echo "reviewers=${REVIEWERS}"
            echo "output_type=${{ inputs.output_type || format('{0}', env.DEFAULT_OUTPUT_TYPE) }}"
            echo "human_review_mechanism=${{ inputs.human_review_mechanism || format('{0}', env.DEFAULT_HUMAN_REVIEW) }}"
            echo "max_review_cycles=${{ inputs.max_review_cycles || '3' }}"
            echo "max_total_cycles=${{ inputs.max_total_cycles || '10' }}"
            echo "work_timeout=${{ inputs.work_timeout || '30' }}"
            echo "review_timeout=${{ inputs.review_timeout || '30' }}"
            echo "bot_username=${{ inputs.bot_username }}"
            echo "branch_prefix=${{ inputs.branch_prefix }}"
            echo "workflow_owner=${{ inputs.workflow_owner || '' }}"
            echo "pr_number=${{ inputs.pr_number || '0' }}"
            echo "mode=${{ inputs.mode || 'full' }}"
          } >> "$GITHUB_OUTPUT"
        env:
          DEFAULT_OUTPUT_TYPE: ${{ inputs.phase == 'implement' && 'pr' || 'draft' }}
          DEFAULT_HUMAN_REVIEW: ${{ inputs.phase == 'implement' && 'pr_review' || 'issue_checkbox' }}

      # Note: autofix_attempts is reset in the work job after checkout for manual triggers

  # ============================================================
  # Work: Execute the primary work for this phase
  # ============================================================
  work:
    name: Execute work (${{ needs.resolve-inputs.outputs.phase }})
    needs: resolve-inputs
    # Skip work step when mode is checks-only (re-dispatch after autofix)
    if: needs.resolve-inputs.outputs.mode != 'checks-only'
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.egg.outputs.exit-code }}
      draft_file: ${{ steps.capture-output.outputs.draft_file }}
      head_sha: ${{ steps.capture-sha.outputs.head_sha }}

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      BRANCH_PREFIX: ${{ needs.resolve-inputs.outputs.branch_prefix }}
      WORK_TIMEOUT: ${{ needs.resolve-inputs.outputs.work_timeout }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # SECURITY: Build prompts from trusted checkout (main branch)
      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted action scripts
        run: |
          cp -r action "$RUNNER_TEMP/trusted-action"
          cp -r shared "$RUNNER_TEMP/trusted-shared"

      - name: Build work prompt
        id: prompt
        run: bash ${{ needs.resolve-inputs.outputs.work_prompt_script }}
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_PIPELINE_PHASE: ${{ env.PHASE }}
          EGG_BRANCH_NAME: ${{ env.BRANCH_NAME }}
          EGG_PR_NUMBER: ${{ needs.resolve-inputs.outputs.pr_number }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${EGG_BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${EGG_BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Reset autofix attempts on manual trigger
        if: github.event_name == 'workflow_dispatch' && env.PHASE == 'implement'
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            CURRENT_ATTEMPTS=$(jq -r '.autofix_attempts // 0' "$CONTRACT_PATH")
            if [[ "$CURRENT_ATTEMPTS" -gt 0 ]]; then
              echo "Resetting autofix_attempts from $CURRENT_ATTEMPTS to 0 for manual re-trigger"
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              jq --arg ts "$TIMESTAMP" --arg old "$CURRENT_ATTEMPTS" '
                .autofix_attempts = 0 |
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "update",
                  "field_path": "autofix_attempts",
                  "old_value": ($old | tonumber),
                  "new_value": 0,
                  "reason": "Reset on manual workflow dispatch"
                }]
              ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"

              git add "$CONTRACT_PATH"
              git commit -m "Reset autofix attempts for issue #${ISSUE_NUMBER}" || true
              git push origin "${BRANCH_NAME}" || {
                echo "::warning::Initial push failed, attempting pull --rebase and retry..."
                if ! git pull --rebase origin "${BRANCH_NAME}"; then
                  echo "::error::Failed to rebase during autofix reset push"
                  exit 1
                fi
                if ! git push origin "${BRANCH_NAME}"; then
                  echo "::error::Failed to push autofix reset after rebase"
                  exit 1
                fi
              }
            fi
          fi

      - name: Merge latest main into issue branch
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ needs.resolve-inputs.outputs.pr_number }}
        run: |
          set -euo pipefail
          echo "Merging latest main into ${BRANCH_NAME}..."
          git fetch origin main

          # Check if merge is needed
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch already contains latest main, skipping merge"
            exit 0
          fi

          echo "Main has commits not in ${BRANCH_NAME}, merging..."
          if git merge origin/main --no-edit; then
            echo "Successfully merged main into ${BRANCH_NAME}"
            # Push the merge commit so reviewers and subsequent steps see it
            git push origin "${BRANCH_NAME}" || {
              echo "::warning::Initial push failed, attempting pull --rebase and retry..."
              if ! git pull --rebase origin "${BRANCH_NAME}"; then
                echo "::error::Failed to rebase during push retry"
                exit 1
              fi
              if ! git push origin "${BRANCH_NAME}"; then
                echo "::error::Failed to push after rebase"
                exit 1
              fi
            }
          else
            echo "::warning::Merge conflict detected, triggering conflict resolution workflow..."
            git merge --abort

            # Find PR number for this branch if not already known
            CONFLICT_PR_NUMBER="${PR_NUMBER}"
            if [[ "${CONFLICT_PR_NUMBER}" == "0" || -z "${CONFLICT_PR_NUMBER}" ]]; then
              CONFLICT_PR_NUMBER=$(gh pr list --head "${BRANCH_NAME}" --json number --jq '.[0].number // empty' || echo "")
            fi

            if [[ -n "${CONFLICT_PR_NUMBER}" && "${CONFLICT_PR_NUMBER}" != "0" ]]; then
              echo "Found PR #${CONFLICT_PR_NUMBER} for branch ${BRANCH_NAME}, triggering conflict resolution..."
              # Record timestamp before triggering to avoid race condition with other runs
              TRIGGER_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              if gh workflow run on-merge-conflict.yml -f pr_number="${CONFLICT_PR_NUMBER}"; then
                echo "::notice::Conflict resolution workflow triggered for PR #${CONFLICT_PR_NUMBER}"

                # Wait for conflict resolver to complete
                echo "Waiting for conflict resolution workflow to start..."
                sleep 10

                # Find the triggered workflow run (filter by timestamp to avoid race condition)
                CONFLICT_RUN_ID=""
                for attempt in 1 2 3 4 5 6; do
                  CONFLICT_RUN_ID=$(gh run list \
                    --workflow on-merge-conflict.yml \
                    --limit 10 \
                    --json databaseId,status,createdAt \
                    --jq "[.[] | select(.createdAt > \"${TRIGGER_TIME}\")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty" 2>/dev/null || echo "")
                  if [[ -n "$CONFLICT_RUN_ID" ]]; then
                    break
                  fi
                  echo "::warning::Attempt ${attempt}: conflict resolution workflow run not found yet, retrying..."
                  sleep 5
                done

                if [[ -z "$CONFLICT_RUN_ID" ]]; then
                  echo "::error::Could not find triggered conflict resolution workflow run (triggered after ${TRIGGER_TIME}). Possible causes: workflow doesn't exist, permissions issue, or GitHub Actions delay."
                  exit 1
                fi

                echo "Watching conflict resolution workflow run ${CONFLICT_RUN_ID}..."
                if gh run watch "$CONFLICT_RUN_ID" --exit-status; then
                  echo "Conflict resolution completed successfully"
                  # Pull the resolved changes with explicit error handling
                  if ! git fetch origin "${BRANCH_NAME}"; then
                    echo "::error::Failed to fetch resolved branch"
                    exit 1
                  fi
                  if ! git reset --hard "origin/${BRANCH_NAME}"; then
                    echo "::error::Failed to reset to resolved branch"
                    exit 1
                  fi
                  echo "Pulled resolved changes, continuing..."
                else
                  echo "::error::Conflict resolution workflow failed (run ${CONFLICT_RUN_ID})"
                  exit 1
                fi
              else
                echo "::warning::Failed to trigger conflict resolution workflow"
                echo "::error::Merge conflict merging main into ${BRANCH_NAME}. Manual resolution required."
                exit 1
              fi
            else
              echo "::warning::No PR found for branch ${BRANCH_NAME}, cannot trigger automatic conflict resolution"
              echo "::error::Merge conflict merging main into ${BRANCH_NAME}. Manual resolution required."
              exit 1
            fi
          fi

      - name: Populate contract tasks (implement phase only)
        if: env.PHASE == 'implement'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Install dependencies and run populate script from trusted copies
          pip install -q pyyaml pydantic
          PYTHONPATH="${RUNNER_TEMP}/trusted-shared:${PYTHONPATH:-}" \
            python3 "${RUNNER_TEMP}/trusted-action/populate-contract-tasks.py"

          # Commit if contract was updated
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          if ! git diff --quiet "$CONTRACT_PATH" 2>/dev/null; then
            git add "$CONTRACT_PATH"
            git commit -m "Populate contract tasks from plan for issue #${ISSUE_NUMBER}"
            git push origin "${BRANCH_NAME}" || {
              echo "::warning::Initial push failed, attempting pull --rebase and retry..."
              if ! git pull --rebase origin "${BRANCH_NAME}"; then
                echo "::error::Failed to rebase during contract push"
                exit 1
              fi
              if ! git push origin "${BRANCH_NAME}"; then
                echo "::error::Failed to push contract after rebase"
                exit 1
              fi
            }
          fi

      - name: Check for multi-agent mode (implement phase)
        id: check-multi-agent
        if: env.PHASE == 'implement'
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          # Check if contract has multi-agent configuration enabled
          if [[ -f "$CONTRACT_PATH" ]]; then
            MULTI_AGENT=$(jq -r '.multi_agent_config.enabled // false' "$CONTRACT_PATH" 2>/dev/null || echo "false")
            echo "enabled=${MULTI_AGENT}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger multi-agent workflow (if enabled)
        id: multi-agent
        if: env.PHASE == 'implement' && steps.check-multi-agent.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          echo "Multi-agent mode enabled, triggering orchestration workflow..."

          # Trigger the multi-agent workflow
          gh workflow run sdlc-multi-agent.yml \
            --repo "${{ github.repository }}" \
            --field issue_number="${ISSUE_NUMBER}" \
            --field branch_name="${BRANCH_NAME}" \
            --field agent_role="auto"

          # Wait for the workflow run to appear then track its status
          echo "Waiting for workflow run to start..."
          sleep 5

          # Find the run ID of the triggered workflow
          RUN_ID=""
          for attempt in 1 2 3 4 5; do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow sdlc-multi-agent.yml \
              --branch "${BRANCH_NAME}" \
              --limit 1 \
              --json databaseId,status \
              --jq '.[0].databaseId' 2>/dev/null || echo "")
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            echo "::warning::Attempt ${attempt}: workflow run not found yet, retrying..."
            sleep 5
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Could not find triggered multi-agent workflow run"
            exit 1
          fi

          echo "Watching workflow run ${RUN_ID}..."
          if gh run watch "$RUN_ID" --repo "${{ github.repository }}" --exit-status; then
            echo "Multi-agent workflow completed successfully"
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Multi-agent workflow failed (run ${RUN_ID})"
            echo "result=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Run egg agent
        id: egg
        # Skip if multi-agent mode was triggered for implement phase
        if: steps.multi-agent.outputs.triggered != 'true'
        continue-on-error: true
        uses: jwbron/egg/action@main
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.EGG_BOT_USERNAME }}
          bot-branch-prefix: ${{ env.BRANCH_PREFIX }}
          timeout: ${{ env.WORK_TIMEOUT }}
        env:
          EGG_AGENT_ROLE: implementer
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_PIPELINE_PHASE: ${{ env.PHASE }}

      - name: Capture output artifact
        id: capture-output
        run: |
          set -euo pipefail

          # Pull latest to get agent's commits
          for i in 1 2 3; do
            if git pull origin "${BRANCH_NAME}" --rebase; then
              break
            fi
            echo "::warning::git pull attempt $i failed, retrying..."
            sleep 2
          done

          # Determine draft file based on phase
          if [[ "$PHASE" == "refine" ]]; then
            DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-analysis.md"
          elif [[ "$PHASE" == "plan" ]]; then
            DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-plan.md"
          else
            DRAFT_FILE=""
          fi

          if [[ -n "$DRAFT_FILE" && -f "$DRAFT_FILE" ]]; then
            echo "draft_file=${DRAFT_FILE}" >> "$GITHUB_OUTPUT"
            echo "Draft file found at ${DRAFT_FILE}"
          else
            echo "draft_file=" >> "$GITHUB_OUTPUT"
            if [[ -n "$DRAFT_FILE" ]]; then
              echo "::warning::No draft file found at ${DRAFT_FILE}"
            fi
          fi

      - name: Capture HEAD SHA
        id: capture-sha
        if: always()
        run: |
          set -euo pipefail
          git fetch origin "${BRANCH_NAME}" --quiet
          HEAD_SHA=$(git rev-parse "origin/${BRANCH_NAME}")
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Captured HEAD SHA: ${HEAD_SHA}"

  # ============================================================
  # Check: Merge Conflict Resolution (implement phase only)
  # ============================================================
  check-merge-conflict:
    name: Check merge conflicts
    needs: [resolve-inputs, work]
    if: >-
      always() &&
      (needs.work.result == 'success' || needs.work.result == 'skipped') &&
      needs.resolve-inputs.outputs.phase == 'implement'
    runs-on: ubuntu-latest
    outputs:
      has_conflicts: ${{ steps.check.outputs.has_conflicts }}
      resolved: ${{ steps.resolve.outputs.resolved }}

    env:
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Check for merge conflicts
        id: check
        run: |
          set -euo pipefail

          # Fetch main to check mergability
          git fetch origin main

          # Try to merge main into current branch (dry-run)
          if git merge-tree "$(git merge-base HEAD origin/main)" HEAD origin/main | grep -q "^<<<<<<<"; then
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            echo "Merge conflicts detected"
          else
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
            echo "No merge conflicts"
          fi

      - name: Resolve conflicts if needed
        id: resolve
        if: steps.check.outputs.has_conflicts == 'true'
        run: |
          # For now, just mark as not resolved - conflict resolution workflow will handle this
          echo "resolved=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Merge conflicts detected - conflict resolution workflow should be triggered"

  # ============================================================
  # Check: Lint (implement phase only)
  # ============================================================
  check-lint:
    name: Check lint
    needs: [resolve-inputs, work, check-merge-conflict]
    if: >-
      always() &&
      (needs.work.result == 'success' || needs.work.result == 'skipped') &&
      needs.resolve-inputs.outputs.phase == 'implement' &&
      (needs.check-merge-conflict.result == 'skipped' ||
       (needs.check-merge-conflict.result == 'success' && needs.check-merge-conflict.outputs.has_conflicts == 'false'))
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  # ============================================================
  # Check: Test (implement phase only)
  # ============================================================
  check-test:
    name: Check tests
    needs: [resolve-inputs, work, check-merge-conflict]
    if: >-
      always() &&
      (needs.work.result == 'success' || needs.work.result == 'skipped') &&
      needs.resolve-inputs.outputs.phase == 'implement' &&
      (needs.check-merge-conflict.result == 'skipped' ||
       (needs.check-merge-conflict.result == 'success' && needs.check-merge-conflict.outputs.has_conflicts == 'false'))
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # ============================================================
  # Check: Integration Tests (implement phase only)
  # ============================================================
  check-integration:
    name: Check integration tests
    needs: [resolve-inputs, work, check-merge-conflict]
    if: >-
      always() &&
      (needs.work.result == 'success' || needs.work.result == 'skipped') &&
      needs.resolve-inputs.outputs.phase == 'implement' &&
      (needs.check-merge-conflict.result == 'skipped' ||
       (needs.check-merge-conflict.result == 'success' && needs.check-merge-conflict.outputs.has_conflicts == 'false'))
    uses: ./.github/workflows/test-integration.yml
    secrets: inherit

  # ============================================================
  # Check: Fixer (runs if lint, test, or integration failed)
  # ============================================================
  check-fixer:
    name: Auto-fix failures
    needs: [resolve-inputs, work, check-merge-conflict, check-lint, check-test, check-integration]
    if: >-
      always() &&
      (needs.work.result == 'success' || needs.work.result == 'skipped') &&
      needs.resolve-inputs.outputs.phase == 'implement' &&
      (
        needs.check-lint.outputs.passed == 'false' ||
        (needs.check-lint.result == 'failure' && needs.check-lint.outputs.passed != 'true') ||
        needs.check-test.outputs.passed == 'false' ||
        (needs.check-test.result == 'failure' && needs.check-test.outputs.passed != 'true') ||
        needs.check-integration.outputs.passed == 'false' ||
        (needs.check-integration.result == 'failure' && needs.check-integration.outputs.passed != 'true')
      )
    runs-on: ubuntu-latest
    outputs:
      # Only report fixed=true if both the autofix succeeded AND the counter was updated.
      # This prevents re-dispatch if the counter update fails.
      fixed: ${{ (steps.fix.outputs.fixed == 'true' && steps.update-counter.outputs.counter_updated != 'false') && 'true' || steps.limit-exceeded.outputs.fixed || 'false' }}
      limit_exceeded: ${{ steps.check-limit.outputs.exceeded }}

    env:
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      PR_NUMBER: ${{ needs.resolve-inputs.outputs.pr_number }}
      BRANCH_PREFIX: ${{ needs.resolve-inputs.outputs.branch_prefix }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${EGG_BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${EGG_BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Check autofix attempt limit
        id: check-limit
        run: |
          set -euo pipefail

          # Fetch latest to get any concurrent updates to autofix_attempts
          git fetch origin "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"

          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            CURRENT_ATTEMPTS=$(jq -r '.autofix_attempts // 0' "$CONTRACT_PATH")
            MAX_ATTEMPTS=$(jq -r '.max_autofix_attempts // 3' "$CONTRACT_PATH")
            echo "current_attempts=${CURRENT_ATTEMPTS}" >> "$GITHUB_OUTPUT"
            echo "max_attempts=${MAX_ATTEMPTS}" >> "$GITHUB_OUTPUT"

            if [[ "$CURRENT_ATTEMPTS" -ge "$MAX_ATTEMPTS" ]]; then
              echo "exceeded=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Autofix attempt limit exceeded ($CURRENT_ATTEMPTS >= $MAX_ATTEMPTS)"
            else
              echo "exceeded=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "current_attempts=0" >> "$GITHUB_OUTPUT"
            echo "max_attempts=3" >> "$GITHUB_OUTPUT"
            echo "exceeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger and wait for autofix workflow
        id: fix
        if: steps.check-limit.outputs.exceeded != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Detect PR number from branch if not provided
          ACTUAL_PR_NUMBER="${PR_NUMBER}"
          if [[ "${ACTUAL_PR_NUMBER}" == "0" || -z "${ACTUAL_PR_NUMBER}" ]]; then
            ACTUAL_PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "${BRANCH_NAME}" --json number --jq '.[0].number // 0')
            echo "Detected PR number from branch: ${ACTUAL_PR_NUMBER}"
          fi

          if [[ "${ACTUAL_PR_NUMBER}" == "0" || -z "${ACTUAL_PR_NUMBER}" ]]; then
            echo "::warning::No PR number available for autofix (branch: ${BRANCH_NAME})"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "no_pr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Triggering autofix for PR #${ACTUAL_PR_NUMBER}"

          # Determine which checks failed (collect all, not just first)
          FAILED_CHECKS=""

          LINT_PASSED="${{ needs.check-lint.outputs.passed }}"
          LINT_RESULT="${{ needs.check-lint.result }}"
          if [[ "$LINT_PASSED" == "false" || ("$LINT_RESULT" == "failure" && "$LINT_PASSED" != "true") ]]; then
            FAILED_CHECKS="lint"
          fi

          TEST_PASSED="${{ needs.check-test.outputs.passed }}"
          TEST_RESULT="${{ needs.check-test.result }}"
          if [[ "$TEST_PASSED" == "false" || ("$TEST_RESULT" == "failure" && "$TEST_PASSED" != "true") ]]; then
            FAILED_CHECKS="${FAILED_CHECKS:+$FAILED_CHECKS,}test"
          fi

          INTEGRATION_PASSED="${{ needs.check-integration.outputs.passed }}"
          INTEGRATION_RESULT="${{ needs.check-integration.result }}"
          if [[ "$INTEGRATION_PASSED" == "false" || ("$INTEGRATION_RESULT" == "failure" && "$INTEGRATION_PASSED" != "true") ]]; then
            FAILED_CHECKS="${FAILED_CHECKS:+$FAILED_CHECKS,}integration"
          fi

          echo "Failed checks: ${FAILED_CHECKS}"

          # Capture timestamp before dispatch to filter runs created after this point
          DISPATCH_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Dispatch time: ${DISPATCH_TIME}"

          # Trigger the reusable autofix workflow
          # Note: branch_prefix is only available for workflow_call, not workflow_dispatch
          if ! gh workflow run reusable-autofix.yml \
            --repo "${{ github.repository }}" \
            --field pr_number="${ACTUAL_PR_NUMBER}" \
            --field failed_workflow="${FAILED_CHECKS}" \
            --field bot_username="${EGG_BOT_USERNAME}"; then
            echo "::warning::Failed to trigger autofix workflow"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Waiting for autofix workflow to appear..."
          sleep 5

          # Find the triggered workflow run
          # Filter by: timestamp only (workflow_dispatch doesn't set headBranch to issue branch)
          # We use timestamp filtering to identify the run we just triggered
          RUN_ID=""
          for attempt in 1 2 3 4 5 6; do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow reusable-autofix.yml \
              --limit 10 \
              --json databaseId,status,createdAt \
              --jq --arg dispatch_time "${DISPATCH_TIME}" '
                [.[] | select(
                  (.status == "queued" or .status == "in_progress" or .status == "completed") and
                  .createdAt >= $dispatch_time
                )] | sort_by(.createdAt) | .[0].databaseId // empty
              ' 2>/dev/null || echo "")
            if [[ -n "$RUN_ID" ]]; then
              echo "Found autofix workflow run: ${RUN_ID}"
              break
            fi
            echo "::warning::Attempt ${attempt}: workflow run not found yet, retrying..."
            sleep 5
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::warning::Could not find triggered autofix workflow run after 30 seconds (triggered at ${DISPATCH_TIME}). Possible causes: workflow doesn't exist, permissions issue, or GitHub Actions delay."
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Wait for the workflow to complete (30 minute timeout)
          echo "Watching autofix workflow run ${RUN_ID}..."
          WATCH_RESULT=0
          timeout 1800 gh run watch "$RUN_ID" --repo "${{ github.repository }}" --exit-status || WATCH_RESULT=$?

          if [[ "$WATCH_RESULT" -eq 0 ]]; then
            echo "Autofix workflow completed successfully"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$WATCH_RESULT" -eq 124 ]]; then
            echo "::warning::Autofix workflow timed out after 30 minutes"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Autofix workflow failed or was cancelled (exit code: ${WATCH_RESULT})"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set fixed=false when limit exceeded
        id: limit-exceeded
        if: steps.check-limit.outputs.exceeded == 'true'
        run: |
          echo "Autofix limit exceeded, skipping autofix"
          echo "fixed=false" >> "$GITHUB_OUTPUT"

      - name: Update autofix attempts counter
        id: update-counter
        if: steps.check-limit.outputs.exceeded != 'true'
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          # Pull latest to get any concurrent updates
          git fetch origin "${BRANCH_NAME}"
          git reset --hard "origin/${BRANCH_NAME}"

          if [[ -f "$CONTRACT_PATH" ]]; then
            CURRENT_ATTEMPTS=$(jq -r '.autofix_attempts // 0' "$CONTRACT_PATH")
            NEW_ATTEMPTS=$((CURRENT_ATTEMPTS + 1))
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            FIXED_STATUS="${{ steps.fix.outputs.fixed || 'false' }}"

            echo "Incrementing autofix_attempts from $CURRENT_ATTEMPTS to $NEW_ATTEMPTS (fixed=$FIXED_STATUS)"

            jq --arg ts "$TIMESTAMP" \
               --arg old "$CURRENT_ATTEMPTS" \
               --arg new "$NEW_ATTEMPTS" \
               --arg fixed "$FIXED_STATUS" '
              .autofix_attempts = ($new | tonumber) |
              .audit_log += [{
                "timestamp": $ts,
                "actor": "system",
                "role": "system",
                "action": "update",
                "field_path": "autofix_attempts",
                "old_value": ($old | tonumber),
                "new_value": ($new | tonumber),
                "reason": ("Autofix attempt completed with result: " + $fixed)
              }]
            ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"

            git add "$CONTRACT_PATH"
            git commit -m "Update autofix attempts for issue #${ISSUE_NUMBER}" || true

            # Push with retry
            PUSH_SUCCEEDED="false"
            for i in 1 2 3; do
              if git push origin "${BRANCH_NAME}"; then
                echo "Push succeeded"
                PUSH_SUCCEEDED="true"
                break
              fi
              echo "::warning::Push failed (attempt $i), retrying..."
              git fetch origin "${BRANCH_NAME}"
              git reset --hard "origin/${BRANCH_NAME}"
              # Re-apply the update with fresh timestamp
              CURRENT_ATTEMPTS=$(jq -r '.autofix_attempts // 0' "$CONTRACT_PATH")
              NEW_ATTEMPTS=$((CURRENT_ATTEMPTS + 1))
              RETRY_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              jq --arg ts "$RETRY_TIMESTAMP" \
                 --arg old "$CURRENT_ATTEMPTS" \
                 --arg new "$NEW_ATTEMPTS" \
                 --arg fixed "$FIXED_STATUS" '
                .autofix_attempts = ($new | tonumber) |
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "update",
                  "field_path": "autofix_attempts",
                  "old_value": ($old | tonumber),
                  "new_value": ($new | tonumber),
                  "reason": ("Autofix attempt completed with result: " + $fixed)
                }]
              ' "$CONTRACT_PATH" > /tmp/contract.json && mv /tmp/contract.json "$CONTRACT_PATH"
              git add "$CONTRACT_PATH"
              git commit -m "Update autofix attempts for issue #${ISSUE_NUMBER}" || true
            done

            # Fail the step if push never succeeded - this prevents re-dispatch
            if [[ "$PUSH_SUCCEEDED" != "true" ]]; then
              echo "::error::Failed to push contract update after 3 attempts"
              echo "counter_updated=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "counter_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "counter_updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redispatch work-loop for check failures (no PR)
        if: >-
          steps.fix.outputs.no_pr == 'true' &&
          steps.check-limit.outputs.exceeded != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          MAX_REVIEW_CYCLES_ENV: ${{ needs.resolve-inputs.outputs.max_review_cycles }}
          MAX_TOTAL_CYCLES_ENV: ${{ needs.resolve-inputs.outputs.max_total_cycles }}
          WORKFLOW_OWNER_ENV: ${{ needs.resolve-inputs.outputs.workflow_owner }}
        run: |
          set -euo pipefail

          echo "No PR available for reusable autofix — redispatching work-loop so agent can fix check failures"

          gh workflow run sdlc-work-loop.yml \
            --repo "${{ github.repository }}" \
            --field phase="${{ needs.resolve-inputs.outputs.phase }}" \
            --field issue_number="${ISSUE_NUMBER}" \
            --field branch_name="${BRANCH_NAME}" \
            --field max_review_cycles="${MAX_REVIEW_CYCLES_ENV}" \
            --field max_total_cycles="${MAX_TOTAL_CYCLES_ENV}" \
            --field workflow_owner="${WORKFLOW_OWNER_ENV:-}" \
            --field pr_number="0"

          echo "Work-loop redispatched for check failure remediation"

  # ============================================================
  # Aggregate Checks: Collect all check results
  # ============================================================
  aggregate-checks:
    name: Aggregate check results
    needs: [resolve-inputs, work, check-merge-conflict, check-lint, check-test, check-integration, check-fixer]
    if: always() && (needs.work.result == 'success' || needs.work.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      all_passed: ${{ steps.aggregate.outputs.all_passed }}
      has_conflicts: ${{ steps.aggregate.outputs.has_conflicts }}
      autofix_succeeded: ${{ steps.aggregate.outputs.autofix_succeeded }}
      autofix_limit_exceeded: ${{ steps.aggregate.outputs.autofix_limit_exceeded }}
      lint_passed: ${{ steps.aggregate.outputs.lint_passed }}
      test_passed: ${{ steps.aggregate.outputs.test_passed }}
      integration_passed: ${{ steps.aggregate.outputs.integration_passed }}

    steps:
      - name: Aggregate results
        id: aggregate
        run: |
          set -euo pipefail

          PHASE="${{ needs.resolve-inputs.outputs.phase }}"

          # For non-implement phases, checks always pass (no checks to run)
          if [[ "$PHASE" != "implement" ]]; then
            {
              echo "all_passed=true"
              echo "has_conflicts=false"
              echo "autofix_succeeded=false"
              echo "autofix_limit_exceeded=false"
            } >> "$GITHUB_OUTPUT"
            echo "No checks for ${PHASE} phase"
            exit 0
          fi

          # Check merge conflicts
          HAS_CONFLICTS="${{ needs.check-merge-conflict.outputs.has_conflicts || 'false' }}"

          # Check lint, test, and integration
          # When a reusable workflow has failing jobs, its result is 'failure'
          # and outputs may not propagate. Default to 'false' in that case.
          if [[ "${{ needs.check-lint.result }}" == "failure" ]]; then
            LINT_PASSED="${{ needs.check-lint.outputs.passed || 'false' }}"
          else
            LINT_PASSED="${{ needs.check-lint.outputs.passed || 'true' }}"
          fi

          if [[ "${{ needs.check-test.result }}" == "failure" ]]; then
            TEST_PASSED="${{ needs.check-test.outputs.passed || 'false' }}"
          else
            TEST_PASSED="${{ needs.check-test.outputs.passed || 'true' }}"
          fi

          if [[ "${{ needs.check-integration.result }}" == "failure" ]]; then
            INTEGRATION_PASSED="${{ needs.check-integration.outputs.passed || 'false' }}"
          else
            INTEGRATION_PASSED="${{ needs.check-integration.outputs.passed || 'true' }}"
          fi

          # Check autofix status (now synchronous - true/false, not pending)
          AUTOFIX_FIXED="${{ needs.check-fixer.outputs.fixed || 'false' }}"
          AUTOFIX_LIMIT_EXCEEDED="${{ needs.check-fixer.outputs.limit_exceeded || 'false' }}"

          # Determine if autofix ran and succeeded
          AUTOFIX_SUCCEEDED="false"
          if [[ "$AUTOFIX_FIXED" == "true" ]]; then
            AUTOFIX_SUCCEEDED="true"
          fi

          # Determine overall pass/fail
          # Checks pass only if all individual checks passed (no special treatment for fixer)
          ALL_PASSED="true"
          if [[ "$HAS_CONFLICTS" == "true" ]]; then
            ALL_PASSED="false"
          fi
          if [[ "$LINT_PASSED" == "false" ]]; then
            ALL_PASSED="false"
          fi
          if [[ "$TEST_PASSED" == "false" ]]; then
            ALL_PASSED="false"
          fi
          if [[ "$INTEGRATION_PASSED" == "false" ]]; then
            ALL_PASSED="false"
          fi

          {
            echo "all_passed=${ALL_PASSED}"
            echo "has_conflicts=${HAS_CONFLICTS}"
            echo "autofix_succeeded=${AUTOFIX_SUCCEEDED}"
            echo "autofix_limit_exceeded=${AUTOFIX_LIMIT_EXCEEDED}"
            echo "lint_passed=${LINT_PASSED}"
            echo "test_passed=${TEST_PASSED}"
            echo "integration_passed=${INTEGRATION_PASSED}"
          } >> "$GITHUB_OUTPUT"

          echo "Check aggregation: all_passed=${ALL_PASSED}, has_conflicts=${HAS_CONFLICTS}, autofix_succeeded=${AUTOFIX_SUCCEEDED}, autofix_limit_exceeded=${AUTOFIX_LIMIT_EXCEEDED}, lint=${LINT_PASSED}, test=${TEST_PASSED}, integration=${INTEGRATION_PASSED}"

  # ============================================================
  # Re-dispatch Checks: Re-run checks after autofix succeeded
  # ============================================================
  re-dispatch-checks:
    name: Re-dispatch checks after autofix
    needs: [resolve-inputs, aggregate-checks]
    if: >-
      always() &&
      needs.aggregate-checks.result == 'success' &&
      needs.aggregate-checks.outputs.autofix_succeeded == 'true' &&
      needs.aggregate-checks.outputs.autofix_limit_exceeded != 'true' &&
      needs.aggregate-checks.outputs.all_passed != 'true'
    runs-on: ubuntu-latest

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Re-dispatch work loop in checks-only mode
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          MAX_REVIEW_CYCLES_ENV: ${{ needs.resolve-inputs.outputs.max_review_cycles }}
          MAX_TOTAL_CYCLES_ENV: ${{ needs.resolve-inputs.outputs.max_total_cycles }}
          WORKFLOW_OWNER_ENV: ${{ needs.resolve-inputs.outputs.workflow_owner }}
          PR_NUMBER_ENV: ${{ needs.resolve-inputs.outputs.pr_number }}
        run: |
          set -euo pipefail

          echo "Autofix succeeded, re-dispatching work loop in checks-only mode"
          echo "This will re-run lint/test/integration checks to verify the fix"

          gh workflow run sdlc-work-loop.yml \
            --repo "${{ github.repository }}" \
            --field phase="${PHASE}" \
            --field issue_number="${ISSUE_NUMBER}" \
            --field branch_name="${BRANCH_NAME}" \
            --field mode="checks-only" \
            --field max_review_cycles="${MAX_REVIEW_CYCLES_ENV}" \
            --field max_total_cycles="${MAX_TOTAL_CYCLES_ENV}" \
            --field workflow_owner="${WORKFLOW_OWNER_ENV:-}" \
            --field pr_number="${PR_NUMBER_ENV:-0}"

          echo "Work loop re-dispatched in checks-only mode"

  # ============================================================
  # Review: Check preconditions before running reviewers
  # ============================================================
  review-setup:
    name: Review setup
    needs: [resolve-inputs, work, aggregate-checks, re-dispatch-checks]
    if: >-
      always() &&
      (needs.work.result == 'success' || needs.work.result == 'skipped') &&
      needs.aggregate-checks.outputs.all_passed == 'true' &&
      needs.re-dispatch-checks.result != 'success'
    runs-on: ubuntu-latest
    outputs:
      review_cycle: ${{ steps.get-cycle.outputs.cycle }}
      prior_feedback: ${{ steps.get-cycle.outputs.prior_feedback }}
      circuit_breaker_open: ${{ steps.check-circuit-breaker.outputs.open }}
      reviewers_matrix: ${{ steps.build-matrix.outputs.matrix }}

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      REVIEWERS: ${{ needs.resolve-inputs.outputs.reviewers }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Get review cycle from contract
        id: get-cycle
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            CYCLES_FIELD="${PHASE}_review_cycles"
            CYCLE=$(jq -r ".${CYCLES_FIELD} // 0" "$CONTRACT_PATH")
            CYCLE=$((CYCLE + 1))
            echo "cycle=${CYCLE}" >> "$GITHUB_OUTPUT"

            # Get prior feedback if this is a re-review
            if [[ "$CYCLE" -gt 1 ]]; then
              FEEDBACK_FIELD="${PHASE}_review_feedback"
              PRIOR=$(jq -r ".${FEEDBACK_FIELD} // \"\"" "$CONTRACT_PATH")
              {
                echo "prior_feedback<<EOF"
                echo "$PRIOR"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
            fi
          else
            echo "cycle=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check circuit breaker
        id: check-circuit-breaker
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            STATUS=$(jq -r '.circuit_breaker.status // "closed"' "$CONTRACT_PATH")
            if [[ "$STATUS" == "open" ]]; then
              echo "open=true" >> "$GITHUB_OUTPUT"
              echo "Circuit breaker is OPEN — skipping review"
            else
              echo "open=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build reviewers matrix
        id: build-matrix
        run: |
          set -euo pipefail
          # Parse reviewers JSON and build matrix for parallel execution
          MATRIX=$(echo "$REVIEWERS" | jq -c '{include: .}')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Reviewers matrix: ${MATRIX}"

  # ============================================================
  # Review: Run specialized reviewers in parallel (matrix job)
  # ============================================================
  review:
    name: Review (${{ matrix.name }})
    needs: [resolve-inputs, work, aggregate-checks, review-setup]
    if: >-
      always() &&
      needs.review-setup.result == 'success' &&
      needs.review-setup.outputs.circuit_breaker_open != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.review-setup.outputs.reviewers_matrix) }}

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      BRANCH_PREFIX: ${{ needs.resolve-inputs.outputs.branch_prefix }}
      REVIEW_TIMEOUT: ${{ needs.resolve-inputs.outputs.review_timeout }}
      REVIEWER_NAME: ${{ matrix.name }}
      REVIEWER_SCRIPT: ${{ matrix.script }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main (trusted)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted action scripts
        run: |
          cp -r action "$RUNNER_TEMP/trusted-action"
          cp -r shared "$RUNNER_TEMP/trusted-shared"

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Build review prompt
        id: prompt
        run: |
          set -euo pipefail
          SCRIPT_PATH="$RUNNER_TEMP/trusted-action/$(basename "$REVIEWER_SCRIPT")"
          if [[ -f "$SCRIPT_PATH" ]]; then
            bash "$SCRIPT_PATH"
          else
            echo "::error::Reviewer script not found: $SCRIPT_PATH"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_PIPELINE_PHASE: ${{ env.PHASE }}
          REVIEW_CYCLE: ${{ needs.review-setup.outputs.review_cycle }}
          PRIOR_FEEDBACK: ${{ needs.review-setup.outputs.prior_feedback }}

      - name: Run reviewer agent
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          model: ${{ steps.prompt.outputs.model }}
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          bot-username: ${{ env.EGG_BOT_USERNAME }}
          bot-branch-prefix: ${{ env.BRANCH_PREFIX }}
          timeout: ${{ env.REVIEW_TIMEOUT }}
        env:
          EGG_AGENT_ROLE: reviewer
          EGG_ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          EGG_PIPELINE_PHASE: ${{ env.PHASE }}
          EGG_REVIEWER_NAME: ${{ matrix.name }}

  # ============================================================
  # Aggregate Reviews: Combine verdicts from all reviewers
  # ============================================================
  aggregate-reviews:
    name: Aggregate review verdicts
    needs: [resolve-inputs, review-setup, review]
    if: >-
      always() &&
      needs.review-setup.result == 'success' &&
      needs.review-setup.outputs.circuit_breaker_open != 'true'
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.aggregate.outputs.verdict }}
      feedback: ${{ steps.aggregate.outputs.feedback }}
      review_cycle: ${{ needs.review-setup.outputs.review_cycle }}
      circuit_breaker_open: ${{ needs.review-setup.outputs.circuit_breaker_open }}
      any_failed: ${{ steps.aggregate.outputs.any_failed }}
      failed_reviewers: ${{ steps.aggregate.outputs.failed_reviewers }}

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      REVIEWERS: ${{ needs.resolve-inputs.outputs.reviewers }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${EGG_BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${EGG_BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Pull latest from all reviewers
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if git pull origin "${BRANCH_NAME}" --rebase; then
              echo "Pull succeeded on attempt $i"
              break
            fi
            if [[ "$i" -eq 5 ]]; then
              echo "::error::git pull failed after 5 attempts"
              exit 1
            fi
            echo "::warning::git pull attempt $i failed, retrying..."
            sleep $((i * 2))
          done

      - name: Aggregate review verdicts
        id: aggregate
        run: |
          set -euo pipefail

          # Parse reviewer names from the reviewers JSON
          REVIEWER_NAMES=$(echo "$REVIEWERS" | jq -r '.[].name')

          # Track aggregated state
          OVERALL_VERDICT="approved"
          COMBINED_FEEDBACK=""
          ANY_FAILED="false"
          FAILED_REVIEWERS=""

          # Check if the matrix jobs failed
          MATRIX_RESULT="${{ needs.review.result }}"
          if [[ "$MATRIX_RESULT" == "failure" ]]; then
            ANY_FAILED="true"
            echo "::warning::Some reviewer jobs failed"
          fi

          # Process each reviewer's verdict
          for REVIEWER in $REVIEWER_NAMES; do
            # Handle different review file naming patterns
            if [[ "$REVIEWER" == "unified" ]]; then
              REVIEW_FILE=".egg-state/reviews/${ISSUE_NUMBER}-${PHASE}-review.json"
            else
              REVIEW_FILE=".egg-state/reviews/${ISSUE_NUMBER}-${PHASE}-${REVIEWER}.json"
            fi

            if [[ -f "$REVIEW_FILE" ]]; then
              VERDICT=$(jq -r '.verdict // "unknown"' "$REVIEW_FILE")
              FEEDBACK=$(jq -r '.feedback // ""' "$REVIEW_FILE")
              SUMMARY=$(jq -r '.summary // ""' "$REVIEW_FILE")

              echo "Reviewer '$REVIEWER': verdict=$VERDICT"

              if [[ "$VERDICT" == "needs_revision" ]]; then
                OVERALL_VERDICT="needs_revision"
                # Add feedback with header
                if [[ -n "$FEEDBACK" ]]; then
                  COMBINED_FEEDBACK+="## Feedback from ${REVIEWER} reviewer\n\n"
                  COMBINED_FEEDBACK+="${FEEDBACK}\n\n"
                fi
              elif [[ "$VERDICT" != "approved" ]]; then
                echo "::warning::Unknown verdict '$VERDICT' from reviewer '$REVIEWER'"
              fi
            else
              echo "::warning::No review file found for reviewer '$REVIEWER' at ${REVIEW_FILE}"
              # Check if the reviewer job failed vs just didn't produce output
              if [[ "$MATRIX_RESULT" == "failure" ]]; then
                ANY_FAILED="true"
                FAILED_REVIEWERS="${FAILED_REVIEWERS}${REVIEWER},"
              fi
            fi
          done

          # Write outputs
          {
            echo "verdict=${OVERALL_VERDICT}"
            echo "any_failed=${ANY_FAILED}"
            echo "failed_reviewers=${FAILED_REVIEWERS%,}"
          } >> "$GITHUB_OUTPUT"

          # Handle multiline feedback
          if [[ -n "$COMBINED_FEEDBACK" ]]; then
            {
              echo "feedback<<EOF"
              printf '%b\n' "$COMBINED_FEEDBACK"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "feedback=" >> "$GITHUB_OUTPUT"
          fi

          echo "Aggregate verdict: $OVERALL_VERDICT"
          if [[ "$ANY_FAILED" == "true" ]]; then
            echo "::warning::Some reviewers failed: ${FAILED_REVIEWERS%,}"
          fi

  # ============================================================
  # Escalate Reviewer Failures: Handle failed reviewer jobs
  # ============================================================
  escalate-reviewer-failure:
    name: Escalate reviewer failures
    needs: [resolve-inputs, review-setup, aggregate-reviews]
    if: >-
      always() &&
      needs.aggregate-reviews.result == 'success' &&
      needs.aggregate-reviews.outputs.any_failed == 'true'
    runs-on: ubuntu-latest

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      FAILED_REVIEWERS: ${{ needs.aggregate-reviews.outputs.failed_reviewers }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Post escalation comment
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "**⚠️ Reviewer job failure during ${PHASE} phase review.**"
            echo ""
            echo "The following reviewer(s) failed to complete: \`${FAILED_REVIEWERS}\`"
            echo ""
            echo "This may be due to:"
            echo "- Agent timeout"
            echo "- Infrastructure issues"
            echo "- Errors in the reviewer script"
            echo ""
            echo "[View run logs](${RUN_URL})"
            echo ""
            echo "The pipeline will continue with verdicts from successful reviewers."
            echo ""
            echo "---"
            echo ""
            echo "*Authored-by: egg*"
          } > /tmp/escalation.md

          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/escalation.md

  # ============================================================
  # Respond: Handle review verdict and update contract
  # ============================================================
  respond:
    name: Respond to review
    needs: [resolve-inputs, work, aggregate-checks, review-setup, aggregate-reviews]
    if: >-
      always() &&
      needs.aggregate-reviews.result == 'success' &&
      needs.aggregate-reviews.outputs.circuit_breaker_open != 'true'
    runs-on: ubuntu-latest
    outputs:
      next_action: ${{ steps.route.outputs.next_action }}
      should_redispatch: ${{ steps.route.outputs.should_redispatch }}
      circuit_breaker_triggered: ${{ steps.update-contract.outputs.circuit_breaker_triggered }}

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      MAX_REVIEW_CYCLES: ${{ needs.resolve-inputs.outputs.max_review_cycles }}
      REVIEW_VERDICT: ${{ needs.aggregate-reviews.outputs.verdict }}
      REVIEW_FEEDBACK: ${{ needs.aggregate-reviews.outputs.feedback }}
      REVIEW_CYCLE: ${{ needs.aggregate-reviews.outputs.review_cycle }}
      REVIEWERS: ${{ needs.resolve-inputs.outputs.reviewers }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Pull latest
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if git pull origin "${BRANCH_NAME}" --rebase; then
              echo "Pull succeeded on attempt $i"
              break
            fi
            if [[ "$i" -eq 5 ]]; then
              echo "::error::git pull failed after 5 attempts"
              exit 1
            fi
            echo "::warning::git pull attempt $i failed, retrying..."
            sleep $((i * 2))
          done

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${EGG_BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${EGG_BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Route based on verdict
        id: route
        run: |
          set -euo pipefail

          if [[ "$REVIEW_VERDICT" == "approved" ]]; then
            echo "next_action=human_gate" >> "$GITHUB_OUTPUT"
            echo "should_redispatch=false" >> "$GITHUB_OUTPUT"
            echo "Review approved — proceeding to human gate"
          else
            echo "next_action=redispatch" >> "$GITHUB_OUTPUT"
            echo "should_redispatch=true" >> "$GITHUB_OUTPUT"
            echo "Review needs revision — will redispatch"
          fi

      - name: Update contract with review state
        id: update-contract
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          MAX_TOTAL_CYCLES: ${{ needs.resolve-inputs.outputs.max_total_cycles }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ ! -f "$CONTRACT_PATH" ]]; then
            echo "::warning::Contract not found at ${CONTRACT_PATH}"
            echo "circuit_breaker_triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Collect per-reviewer verdicts from review files
          collect_reviewer_verdicts() {
            local result="{}"
            local reviewer_names
            reviewer_names=$(echo "$REVIEWERS" | jq -r '.[].name')

            for reviewer in $reviewer_names; do
              if [[ "$reviewer" == "unified" ]]; then
                review_file=".egg-state/reviews/${ISSUE_NUMBER}-${PHASE}-review.json"
              else
                review_file=".egg-state/reviews/${ISSUE_NUMBER}-${PHASE}-${reviewer}.json"
              fi

              if [[ -f "$review_file" ]]; then
                verdict=$(jq -r '.verdict // "unknown"' "$review_file")
              else
                verdict="missing"
              fi

              # Use jq for proper JSON construction to avoid escaping issues
              result=$(echo "$result" | jq --arg k "$reviewer" --arg v "$verdict" '. + {($k): $v}')
            done
            echo "$result"
          }

          # Function to apply the jq transformation (idempotent - can be re-run)
          apply_review_update() {
            local contract_path="$1"

            # Re-read current state on each call (for idempotent re-application)
            local timestamp
            timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            local cycles_field="${PHASE}_review_cycles"
            local feedback_field="${PHASE}_review_feedback"
            local per_reviewer_field="${PHASE}_reviewer_verdicts"
            local old_cycles
            old_cycles=$(jq -r ".${cycles_field} // 0" "$contract_path")
            local old_total
            old_total=$(jq -r '.circuit_breaker.total_cycles // 0' "$contract_path")
            local new_total=$((old_total + 1))
            local old_cb_status
            old_cb_status=$(jq -r '.circuit_breaker.status // "closed"' "$contract_path")

            # Collect per-reviewer verdicts
            local reviewer_verdicts
            reviewer_verdicts=$(collect_reviewer_verdicts)

            # Determine if circuit breaker should be opened
            local open_cb="false"
            local cb_reason=""
            if [[ "$REVIEW_VERDICT" != "approved" && "$REVIEW_CYCLE" -ge "$MAX_REVIEW_CYCLES" ]]; then
              open_cb="true"
              cb_reason="Max review cycles exceeded"
            elif [[ "$new_total" -ge "$MAX_TOTAL_CYCLES" ]]; then
              open_cb="true"
              cb_reason="Max total cycles exceeded"
            fi

            # Build and apply the jq transformation
            jq --arg cycle "$REVIEW_CYCLE" \
               --arg feedback "$REVIEW_FEEDBACK" \
               --arg ts "$timestamp" \
               --arg verdict "$REVIEW_VERDICT" \
               --arg old_cycles "$old_cycles" \
               --arg cycles_field "$cycles_field" \
               --arg feedback_field "$feedback_field" \
               --arg per_reviewer_field "$per_reviewer_field" \
               --argjson reviewer_verdicts "$reviewer_verdicts" \
               --arg new_total "$new_total" \
               --arg open_cb "$open_cb" \
               --arg cb_reason "$cb_reason" \
               --arg old_cb_status "$old_cb_status" '
              .[$cycles_field] = ($cycle | tonumber) |
              .[$feedback_field] = $feedback |
              .[$per_reviewer_field] = $reviewer_verdicts |
              .circuit_breaker.total_cycles = ($new_total | tonumber) |
              .audit_log += [{
                "timestamp": $ts,
                "actor": "system",
                "role": "reviewer",
                "action": "update",
                "field_path": $cycles_field,
                "old_value": ($old_cycles | tonumber),
                "new_value": ($cycle | tonumber),
                "reason": ("Review cycle " + $cycle + ": " + $verdict + " (per-reviewer: " + ($reviewer_verdicts | tostring) + ")")
              }] |
              if $open_cb == "true" then
                .circuit_breaker.status = "open" |
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "update",
                  "field_path": "circuit_breaker.status",
                  "old_value": $old_cb_status,
                  "new_value": "open",
                  "reason": $cb_reason
                }]
              else . end
            ' "$contract_path" > /tmp/contract-update.json && mv /tmp/contract-update.json "$contract_path"
          }

          # Run transformation once to update contract
          apply_review_update "$CONTRACT_PATH"

          # Check if circuit breaker was triggered
          CB_STATUS=$(jq -r '.circuit_breaker.status // "closed"' "$CONTRACT_PATH")
          if [[ "$CB_STATUS" == "open" ]]; then
            echo "circuit_breaker_triggered=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Circuit breaker is now OPEN"
          else
            echo "circuit_breaker_triggered=false" >> "$GITHUB_OUTPUT"
          fi

          git add "$CONTRACT_PATH"
          git commit -m "Update ${PHASE} review state (cycle ${REVIEW_CYCLE})" || true

          # Push with conflict-resistant retry (re-apply transformation on each retry)
          push_succeeded=false
          for i in 1 2 3; do
            if git push origin "${BRANCH_NAME}"; then
              echo "Push succeeded"
              push_succeeded=true
              break
            fi
            echo "::warning::Push failed (attempt $i), resetting and reapplying transformation..."
            git fetch origin "${BRANCH_NAME}"
            git reset --hard "origin/${BRANCH_NAME}"
            apply_review_update "$CONTRACT_PATH"
            git add "$CONTRACT_PATH"
            git commit -m "Update ${PHASE} review state (cycle ${REVIEW_CYCLE})" || true
          done

          if [[ "$push_succeeded" != "true" ]]; then
            echo "::error::Contract update push failed after 3 attempts"
            exit 1
          fi

      - name: Redispatch for revision
        if: steps.route.outputs.should_redispatch == 'true' && steps.update-contract.outputs.circuit_breaker_triggered != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          MAX_REVIEW_CYCLES_ENV: ${{ needs.resolve-inputs.outputs.max_review_cycles }}
          MAX_TOTAL_CYCLES_ENV: ${{ needs.resolve-inputs.outputs.max_total_cycles }}
          WORKFLOW_OWNER_ENV: ${{ needs.resolve-inputs.outputs.workflow_owner }}
          PR_NUMBER_ENV: ${{ needs.resolve-inputs.outputs.pr_number }}
        run: |
          set -euo pipefail

          echo "Redispatching ${PHASE} phase (cycle $((REVIEW_CYCLE + 1)))"

          gh workflow run sdlc-work-loop.yml \
            --repo "${{ github.repository }}" \
            --field phase="${PHASE}" \
            --field issue_number="${ISSUE_NUMBER}" \
            --field branch_name="${BRANCH_NAME}" \
            --field max_review_cycles="${MAX_REVIEW_CYCLES_ENV}" \
            --field max_total_cycles="${MAX_TOTAL_CYCLES_ENV}" \
            --field workflow_owner="${WORKFLOW_OWNER_ENV:-}" \
            --field pr_number="${PR_NUMBER_ENV:-0}"

  # ============================================================
  # Human Gate: Post draft and request human approval (refine/plan)
  # ============================================================
  human-gate:
    name: Request human approval (issue)
    needs: [resolve-inputs, work, aggregate-reviews, respond]
    if: >-
      always() &&
      needs.respond.result == 'success' &&
      needs.respond.outputs.next_action == 'human_gate' &&
      needs.resolve-inputs.outputs.human_review_mechanism == 'issue_checkbox'
    runs-on: ubuntu-latest

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Post draft to issue with approval checkbox
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Determine draft file and next phase
          if [[ "$PHASE" == "refine" ]]; then
            DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-analysis.md"
            NEXT_PHASE="plan"
            TITLE="Analysis"
          else
            DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-plan.md"
            NEXT_PHASE="implement"
            TITLE="Plan"
          fi

          if [[ -f "$DRAFT_FILE" ]]; then
            DRAFT_CONTENT=$(cat "$DRAFT_FILE")
            {
              echo "$DRAFT_CONTENT"
              echo ""
              echo "---"
              echo ""
              echo "## ${TITLE} Phase Complete"
              echo ""
              echo "The ${TITLE,,} above has passed internal review and is ready for human approval."
              echo ""
              echo "[View run logs](${RUN_URL})"
              echo ""
              echo "### Ready for Review"
              echo ""
              echo "<!-- egg-phase-approval -->"
              echo "- [ ] Approve and advance to ${NEXT_PHASE} phase"
              echo ""
              echo "---"
              echo ""
              echo "*Authored-by: egg*"
            } > /tmp/final-draft.md

            gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/final-draft.md
          else
            {
              echo "**${TITLE} review passed.** ✅"
              echo ""
              echo "The ${TITLE,,} has been reviewed and approved by the automated reviewer, but the draft file was not found."
              echo "Please check the run logs."
              echo ""
              echo "[View run logs](${RUN_URL})"
              echo ""
              echo "### Ready for Review"
              echo ""
              echo "<!-- egg-phase-approval -->"
              echo "- [ ] Approve and advance to ${NEXT_PHASE} phase"
              echo ""
              echo "---"
              echo ""
              echo "*Authored-by: egg*"
            } > /tmp/fallback-draft.md

            gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/fallback-draft.md
          fi

      - name: Add awaiting-approval label
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Use transition script if available, otherwise add directly
          if [[ -f ".github/scripts/transition-sdlc-label.sh" ]]; then
            .github/scripts/transition-sdlc-label.sh \
              --issue "${ISSUE_NUMBER}" \
              --add "sdlc:awaiting-approval" || {
                echo "::warning::Failed to add sdlc:awaiting-approval label via script"
              }
          else
            gh issue edit "${ISSUE_NUMBER}" --add-label "sdlc:awaiting-approval" || {
              echo "::warning::Failed to add sdlc:awaiting-approval label"
            }
          fi

  # ============================================================
  # Human Gate PR: Mark PR ready for review (implement)
  # ============================================================
  human-gate-pr:
    name: Request human approval (PR)
    needs: [resolve-inputs, work, aggregate-checks, aggregate-reviews, respond]
    if: >-
      always() &&
      needs.respond.result == 'success' &&
      needs.respond.outputs.next_action == 'human_gate' &&
      needs.resolve-inputs.outputs.human_review_mechanism == 'pr_review'
    runs-on: ubuntu-latest

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      WORKFLOW_OWNER: ${{ needs.resolve-inputs.outputs.workflow_owner }}
      PR_NUMBER: ${{ needs.resolve-inputs.outputs.pr_number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure git identity
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "${EGG_BOT_USERNAME}[bot]"
          git config user.email "${BOT_APP_ID}+${EGG_BOT_USERNAME}[bot]@users.noreply.github.com"

      - name: Get or create PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ "${PR_NUMBER}" != "0" && -n "${PR_NUMBER}" ]]; then
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "Using provided PR #${PR_NUMBER}"
            exit 0
          fi

          # Check if PR exists for this branch
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "${BRANCH_NAME}" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            echo "pr_number=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            echo "Found existing PR #${EXISTING_PR}"
            exit 0
          fi

          # No PR exists — create one
          ISSUE_TITLE=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" --jq '.title // "Issue #'"${ISSUE_NUMBER}"'"')

          if ! PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --head "${BRANCH_NAME}" \
            --base main \
            --title "${ISSUE_TITLE}" \
            --body "Implementation for #${ISSUE_NUMBER}." \
            --draft); then
            echo "::error::Failed to create PR for branch ${BRANCH_NAME}"
            exit 1
          fi

          CREATED_PR=$(echo "$PR_URL" | grep -oE '[0-9]+$' || true)
          if [[ -z "$CREATED_PR" ]]; then
            echo "::error::Failed to extract PR number from: ${PR_URL}"
            exit 1
          fi
          echo "pr_number=${CREATED_PR}" >> "$GITHUB_OUTPUT"
          echo "Created draft PR #${CREATED_PR}"

      - name: Update PR title and mark ready
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ACTUAL_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          # Try to read planner-generated PR title from contract
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          CONTRACT_PR_TITLE=""
          if [[ -f "$CONTRACT_PATH" ]]; then
            CONTRACT_PR_TITLE=$(jq -r '.pr.title // empty' "$CONTRACT_PATH" 2>/dev/null || true)
          fi

          # Update PR title if we have one from the contract
          if [[ -n "$CONTRACT_PR_TITLE" ]]; then
            gh pr edit "${ACTUAL_PR_NUMBER}" --title "${CONTRACT_PR_TITLE}"
            echo "Updated PR title from contract"
          fi

          # Update PR body with completion status
          EXISTING_BODY=$(gh pr view "${ACTUAL_PR_NUMBER}" --json body --jq '.body')
          FINAL_BODY_FILE=$(mktemp)
          trap 'rm -f "$FINAL_BODY_FILE"' EXIT

          printf '%s\n\n---\n\n' "$EXISTING_BODY" > "$FINAL_BODY_FILE"
          printf '%s\n' "✅ All automated checks passed. Ready for human review." >> "$FINAL_BODY_FILE"

          if [[ -n "${WORKFLOW_OWNER}" ]]; then
            printf '\n%s\n' "Reviewer: @${WORKFLOW_OWNER}" >> "$FINAL_BODY_FILE"
          fi

          printf '\n%s\n' "Authored-by: egg" >> "$FINAL_BODY_FILE"

          gh pr edit "${ACTUAL_PR_NUMBER}" --body-file "$FINAL_BODY_FILE"

          # Mark draft as ready for review
          gh pr ready "${ACTUAL_PR_NUMBER}"

          echo "PR #${ACTUAL_PR_NUMBER} marked ready for human review"

      - name: Add reviewer
        if: env.WORKFLOW_OWNER != ''
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ACTUAL_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          if gh pr edit "${ACTUAL_PR_NUMBER}" --add-reviewer "${WORKFLOW_OWNER}"; then
            echo "Added @${WORKFLOW_OWNER} as reviewer for PR #${ACTUAL_PR_NUMBER}"
          else
            echo "::warning::Could not add @${WORKFLOW_OWNER} as reviewer"
          fi

      - name: Update contract phase
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            # Function to apply the jq transformation (idempotent - can be re-run)
            apply_phase_update() {
              local contract_path="$1"

              # Re-read current state on each call (for idempotent re-application)
              local timestamp
              timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              local old_phase
              old_phase=$(jq -r '.current_phase' "$contract_path")

              jq --arg phase "pr" --arg ts "$timestamp" --arg old_phase "$old_phase" '
                .current_phase = $phase |
                .audit_log += [{
                  "timestamp": $ts,
                  "actor": "system",
                  "role": "system",
                  "action": "transition",
                  "field_path": "current_phase",
                  "old_value": $old_phase,
                  "new_value": "pr",
                  "reason": "Implementation complete, PR ready for review"
                }]
              ' "$contract_path" > /tmp/contract.json && mv /tmp/contract.json "$contract_path"
            }

            # Run transformation once to update contract
            apply_phase_update "$CONTRACT_PATH"

            git add "$CONTRACT_PATH"
            git commit -m "Advance to PR phase for issue #${ISSUE_NUMBER}"

            # Push with conflict-resistant retry (re-apply transformation on each retry)
            push_succeeded=false
            for i in 1 2 3; do
              if git push origin "${BRANCH_NAME}"; then
                echo "Push succeeded"
                push_succeeded=true
                break
              fi
              echo "::warning::Push failed (attempt $i), resetting and reapplying transformation..."
              git fetch origin "${BRANCH_NAME}"
              git reset --hard "origin/${BRANCH_NAME}"
              apply_phase_update "$CONTRACT_PATH"
              git add "$CONTRACT_PATH"
              git commit -m "Advance to PR phase for issue #${ISSUE_NUMBER}"
            done

            if [[ "$push_succeeded" != "true" ]]; then
              echo "::error::Contract phase update push failed after 3 attempts"
              exit 1
            fi
          fi

      - name: Post completion comment on issue
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ACTUAL_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${ACTUAL_PR_NUMBER}"

          BODY="<!-- egg-status-comment -->
          Pull request ready for review: ${PR_URL}

          All automated checks passed. The PR is ready for human review and merge.

          --- Authored by egg"

          # shellcheck disable=SC2001
          BODY=$(echo "$BODY" | sed 's/^[[:space:]]*//')
          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body "$BODY"

      - name: Transition issue label
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ -f ".github/scripts/transition-sdlc-label.sh" ]]; then
            .github/scripts/transition-sdlc-label.sh \
              --issue "${ISSUE_NUMBER}" \
              --from "sdlc:implement" \
              --to "sdlc:pr" || {
                echo "::warning::Failed to transition labels via script"
              }
          else
            gh issue edit "${ISSUE_NUMBER}" --add-label "sdlc:pr" || {
              echo "::warning::Failed to add sdlc:pr label"
            }
          fi

  # ============================================================
  # Escalate Autofix Failure: Handle max autofix attempts exceeded
  # ============================================================
  escalate-autofix-failure:
    name: Escalate autofix failure
    needs: [resolve-inputs, aggregate-checks]
    if: >-
      always() &&
      needs.aggregate-checks.result == 'success' &&
      needs.aggregate-checks.outputs.autofix_limit_exceeded == 'true' &&
      needs.aggregate-checks.outputs.all_passed != 'true'
    runs-on: ubuntu-latest

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Get autofix attempt count
        id: get-attempts
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ -f "$CONTRACT_PATH" ]]; then
            ATTEMPTS=$(jq -r '.autofix_attempts // 0' "$CONTRACT_PATH")
            MAX_ATTEMPTS=$(jq -r '.max_autofix_attempts // 3' "$CONTRACT_PATH")
            echo "attempts=${ATTEMPTS}" >> "$GITHUB_OUTPUT"
            echo "max_attempts=${MAX_ATTEMPTS}" >> "$GITHUB_OUTPUT"
          else
            echo "attempts=0" >> "$GITHUB_OUTPUT"
            echo "max_attempts=3" >> "$GITHUB_OUTPUT"
          fi

      - name: Post escalation comment
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          AUTOFIX_ATTEMPTS: ${{ steps.get-attempts.outputs.attempts }}
          MAX_AUTOFIX_ATTEMPTS: ${{ steps.get-attempts.outputs.max_attempts }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Determine which checks are still failing
          FAILING_CHECKS=""
          LINT_PASSED="${{ needs.aggregate-checks.outputs.lint_passed || 'true' }}"
          TEST_PASSED="${{ needs.aggregate-checks.outputs.test_passed || 'true' }}"
          INTEGRATION_PASSED="${{ needs.aggregate-checks.outputs.integration_passed || 'true' }}"

          if [[ "$LINT_PASSED" == "false" ]]; then
            FAILING_CHECKS="${FAILING_CHECKS:+$FAILING_CHECKS, }lint"
          fi
          if [[ "$TEST_PASSED" == "false" ]]; then
            FAILING_CHECKS="${FAILING_CHECKS:+$FAILING_CHECKS, }test"
          fi
          if [[ "$INTEGRATION_PASSED" == "false" ]]; then
            FAILING_CHECKS="${FAILING_CHECKS:+$FAILING_CHECKS, }integration"
          fi
          FAILING_CHECKS="${FAILING_CHECKS:-unknown checks}"

          {
            echo "**⚠️ Autofix circuit breaker triggered.**"
            echo ""
            echo "The autofix agent has attempted to fix check failures **${AUTOFIX_ATTEMPTS} times** (max: ${MAX_AUTOFIX_ATTEMPTS})."
            echo "The following checks are still failing: **${FAILING_CHECKS}**."
            echo ""
            echo "Human intervention is required."
            echo ""
            echo "### What to do"
            echo ""
            echo "1. Review the failing checks in the [workflow run](${RUN_URL})"
            echo "2. Fix the issues manually and push to the branch"
            echo "3. Re-trigger the workflow by adding or removing the \`sdlc:implement\` label"
            echo ""
            echo "Alternatively, if the failures are expected or can be ignored:"
            echo ""
            echo "<!-- egg-phase-approval -->"
            echo "- [ ] Override: Skip failing checks and proceed to review"
            echo ""
            echo "---"
            echo ""
            echo "*Authored-by: egg*"
          } > /tmp/escalation.md

          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/escalation.md

      - name: Add awaiting-approval label
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ -f ".github/scripts/transition-sdlc-label.sh" ]]; then
            .github/scripts/transition-sdlc-label.sh \
              --issue "${ISSUE_NUMBER}" \
              --add "sdlc:awaiting-approval" || true
          else
            gh issue edit "${ISSUE_NUMBER}" --add-label "sdlc:awaiting-approval" || true
          fi

  # ============================================================
  # Escalate: Handle circuit breaker escalation
  # ============================================================
  escalate:
    name: Escalate to human
    needs: [resolve-inputs, aggregate-checks, aggregate-reviews, respond, escalate-autofix-failure]
    if: >-
      always() &&
      needs.escalate-autofix-failure.result != 'success' &&
      (
        needs.aggregate-reviews.outputs.circuit_breaker_open == 'true' ||
        needs.respond.outputs.circuit_breaker_triggered == 'true'
      )
    runs-on: ubuntu-latest

    env:
      PHASE: ${{ needs.resolve-inputs.outputs.phase }}
      ISSUE_NUMBER: ${{ needs.resolve-inputs.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.resolve-inputs.outputs.branch_name }}
      EGG_BOT_USERNAME: ${{ needs.resolve-inputs.outputs.bot_username }}
      REVIEW_CYCLE: ${{ needs.aggregate-reviews.outputs.review_cycle }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ steps.bot-token.outputs.token }}

      - name: Post escalation comment
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Determine draft file based on phase
          if [[ "$PHASE" == "refine" ]]; then
            DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-analysis.md"
            REVIEW_FILE=".egg-state/reviews/${ISSUE_NUMBER}-refine-review.json"
            TITLE="Analysis"
          elif [[ "$PHASE" == "plan" ]]; then
            DRAFT_FILE=".egg-state/drafts/${ISSUE_NUMBER}-plan.md"
            REVIEW_FILE=".egg-state/reviews/${ISSUE_NUMBER}-plan-review.json"
            TITLE="Plan"
          else
            DRAFT_FILE=""
            REVIEW_FILE=".egg-state/reviews/${ISSUE_NUMBER}-implement-review.json"
            TITLE="Implementation"
          fi

          # Read last review feedback if available
          LAST_FEEDBACK=""
          if [[ -f "$REVIEW_FILE" ]]; then
            LAST_FEEDBACK=$(jq -r '.feedback // ""' "$REVIEW_FILE")
          fi

          {
            echo "**⚠️ ${TITLE} phase escalated to human review.**"
            echo ""
            echo "The ${TITLE,,} has gone through ${REVIEW_CYCLE} review cycles without passing automated review."
            echo ""
            if [[ -n "$LAST_FEEDBACK" ]]; then
              echo "### Unresolved Issues from Last Review"
              echo ""
              echo "$LAST_FEEDBACK"
              echo ""
            fi
            echo "---"
            echo ""
            if [[ -n "$DRAFT_FILE" && -f "$DRAFT_FILE" ]]; then
              echo "### Current Draft ${TITLE}"
              echo ""
              cat "$DRAFT_FILE"
              echo ""
            fi
            echo "---"
            echo ""
            echo "Human intervention is required to either:"
            echo ""
            echo "1. Provide guidance on the ${TITLE,,} issues"
            echo "2. Override and approve the ${TITLE,,} as-is"
            echo "3. Cancel and restart with different approach"
            echo ""
            echo "[View run logs](${RUN_URL})"
            echo ""
            echo "---"
            echo ""
            echo "<!-- egg-phase-approval -->"
            if [[ "$PHASE" == "refine" ]]; then
              echo "- [ ] Override: Approve analysis and advance to plan phase"
            elif [[ "$PHASE" == "plan" ]]; then
              echo "- [ ] Override: Approve plan and advance to implement phase"
            else
              echo "- [ ] Override: Approve implementation and mark PR ready"
            fi
            echo ""
            echo "---"
            echo ""
            echo "*Authored-by: egg*"
          } > /tmp/escalation.md

          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/escalation.md

      - name: Add awaiting-approval label
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ -f ".github/scripts/transition-sdlc-label.sh" ]]; then
            .github/scripts/transition-sdlc-label.sh \
              --issue "${ISSUE_NUMBER}" \
              --add "sdlc:awaiting-approval" || true
          else
            gh issue edit "${ISSUE_NUMBER}" --add-label "sdlc:awaiting-approval" || true
          fi
