name: "egg: SDLC HITL Decision Handler"

# This workflow handles Human-In-The-Loop (HITL) decisions for the SDLC pipeline.
# It triggers when issue comments are edited (checkbox state changes) and
# updates the contract state accordingly.
#
# The workflow implements a 30-second debounce to prevent rapid-fire updates
# when humans check/uncheck multiple boxes in quick succession.

on:
  issue_comment:
    types: [edited]

permissions:
  actions: write
  contents: write
  issues: write

# Prevent concurrent HITL runs for the same issue
concurrency:
  group: sdlc-hitl-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle-decision:
    name: Handle HITL decision
    runs-on: ubuntu-latest
    # Only trigger on comments that contain HITL decision markers
    # Authorization: Only jwbron can trigger HITL decisions, and bot cannot trigger itself
    if: >-
      contains(github.event.comment.body, '<!-- egg-hitl-decision') &&
      github.event.sender.login == 'jwbron' &&
      github.event.sender.login != 'james-in-a-box' &&
      github.event.sender.login != 'james-in-a-box[bot]'

    env:
      BOT_USERNAME: james-in-a-box
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Parse decision changes
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PREVIOUS_BODY: ${{ github.event.changes.body.from }}
        run: |
          set -euo pipefail
          # Extract decision ID from marker
          # Format: <!-- egg-hitl-decision id=decision-N -->
          DECISION_ID=$(echo "$COMMENT_BODY" | grep -oP '<!-- egg-hitl-decision id=\K[a-z0-9-]+' | head -1)

          if [[ -z "$DECISION_ID" ]]; then
            echo "No decision ID found in comment"
            echo "has_decision=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "decision_id=${DECISION_ID}" >> "$GITHUB_OUTPUT"
          echo "has_decision=true" >> "$GITHUB_OUTPUT"

          # Parse checkbox states from current and previous body
          # Format: - [x] Option label or - [ ] Option label

          # Extract selected options from current body
          SELECTED_CURRENT=$(echo "$COMMENT_BODY" | grep -oP '^\s*-\s*\[x\]\s*\K.+' || true)
          SELECTED_PREVIOUS=$(echo "$PREVIOUS_BODY" | grep -oP '^\s*-\s*\[x\]\s*\K.+' || true)

          # Compare to detect changes
          if [[ "$SELECTED_CURRENT" != "$SELECTED_PREVIOUS" ]]; then
            echo "checkbox_changed=true" >> "$GITHUB_OUTPUT"
            echo "selected_option=${SELECTED_CURRENT}" >> "$GITHUB_OUTPUT"
          else
            echo "checkbox_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check debounce
        if: steps.parse.outputs.has_decision == 'true' && steps.parse.outputs.checkbox_changed == 'true'
        id: debounce
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          DECISION_ID: ${{ steps.parse.outputs.decision_id }}
        run: |
          set -euo pipefail

          DEBOUNCE_SECONDS=30

          # Wait for debounce period FIRST to allow rapid edits to settle
          echo "Waiting ${DEBOUNCE_SECONDS}s for debounce..."
          sleep "$DEBOUNCE_SECONDS"

          # After waiting, check if we're the only run still processing
          JQ_FILTER='[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")'
          JQ_FILTER+=' | select(.head_branch == "main")] | length'
          RECENT_RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/sdlc-hitl.yml/runs" \
            --jq "$JQ_FILTER")

          # Validate RECENT_RUNS is numeric (issue #6)
          RECENT_RUNS=${RECENT_RUNS:-0}
          if ! [[ "$RECENT_RUNS" =~ ^[0-9]+$ ]]; then
            echo "Warning: RECENT_RUNS is not numeric, defaulting to 0"
            RECENT_RUNS=0
          fi

          if [[ "$RECENT_RUNS" -gt 1 ]]; then
            echo "Debounce: Another run is in progress, skipping"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_process=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.debounce.outputs.should_process == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Find and checkout issue branch
        if: steps.debounce.outputs.should_process == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Validate issue number is numeric (issue #10 - path traversal prevention)
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue number: ${ISSUE_NUMBER}"
            exit 1
          fi

          BRANCH_NAME="egg/issue-${ISSUE_NUMBER}"

          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
            git checkout "${BRANCH_NAME}"
            git pull origin "${BRANCH_NAME}"
          else
            echo "Branch ${BRANCH_NAME} not found"
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.branch.outputs.branch_exists == 'true'
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "james-in-a-box[bot]"
          git config user.email "${BOT_APP_ID}+james-in-a-box[bot]@users.noreply.github.com"

      - name: Update contract with decision
        if: steps.branch.outputs.branch_exists == 'true'
        id: update
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          DECISION_ID: ${{ steps.parse.outputs.decision_id }}
          SELECTED_OPTION: ${{ steps.parse.outputs.selected_option }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ ! -f "$CONTRACT_PATH" ]]; then
            echo "Contract not found at ${CONTRACT_PATH}"
            echo "contract_updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the decision by ID and update it
          DECISION_INDEX=$(jq --arg id "$DECISION_ID" \
            '.decisions | to_entries | .[] | select(.value.id == $id) | .key' \
            "$CONTRACT_PATH")

          if [[ -z "$DECISION_INDEX" ]]; then
            echo "Decision ${DECISION_ID} not found in contract"
            echo "contract_updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create reapply script for retry logic (multi-step jq transformation)
          # Store values needed by script (SENDER_LOGIN is from GitHub context)
          SENDER_LOGIN="${{ github.event.sender.login }}"
          export SENDER_LOGIN DECISION_ID SELECTED_OPTION DECISION_INDEX CONTRACT_PATH

          cat > /tmp/reapply-hitl-decision.sh << 'REAPPLY_EOF'
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Re-find the decision index (may have changed after reset)
          DECISION_INDEX=$(jq --arg id "$DECISION_ID" \
            '.decisions | to_entries | .[] | select(.value.id == $id) | .key' \
            "$CONTRACT_PATH")

          if [[ -z "$DECISION_INDEX" ]]; then
            echo "Decision ${DECISION_ID} not found in contract after reset"
            exit 1
          fi

          # Update the decision
          jq --arg idx "$DECISION_INDEX" \
             --arg resolution "$SELECTED_OPTION" \
             --arg timestamp "$TS" \
             --arg actor "$SENDER_LOGIN" \
            '.decisions[$idx | tonumber].resolved = true |
             .decisions[$idx | tonumber].resolution = $resolution |
             .decisions[$idx | tonumber].resolved_by = $actor |
             .decisions[$idx | tonumber].resolved_at = $timestamp' \
            "$CONTRACT_PATH" > /tmp/contract.json

          mv /tmp/contract.json "$CONTRACT_PATH"

          # Add audit entry
          AUDIT_ENTRY=$(jq -n \
            --arg timestamp "$TS" \
            --arg actor "$SENDER_LOGIN" \
            --arg decision "$DECISION_ID" \
            --arg resolution "$SELECTED_OPTION" \
            '{
              timestamp: $timestamp,
              actor: $actor,
              role: "human",
              action: "update",
              field_path: ("decisions." + $decision),
              old_value: null,
              new_value: $resolution,
              reason: "HITL decision resolved"
            }')

          jq --argjson entry "$AUDIT_ENTRY" '.audit_log += [$entry]' \
            "$CONTRACT_PATH" > /tmp/contract.json
          mv /tmp/contract.json "$CONTRACT_PATH"
          REAPPLY_EOF

          # Apply transformation initially
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg idx "$DECISION_INDEX" \
             --arg resolution "$SELECTED_OPTION" \
             --arg timestamp "$TIMESTAMP" \
             --arg actor "$SENDER_LOGIN" \
            '.decisions[$idx | tonumber].resolved = true |
             .decisions[$idx | tonumber].resolution = $resolution |
             .decisions[$idx | tonumber].resolved_by = $actor |
             .decisions[$idx | tonumber].resolved_at = $timestamp' \
            "$CONTRACT_PATH" > /tmp/contract.json

          mv /tmp/contract.json "$CONTRACT_PATH"

          # Add audit entry
          AUDIT_ENTRY=$(jq -n \
            --arg timestamp "$TIMESTAMP" \
            --arg actor "$SENDER_LOGIN" \
            --arg decision "$DECISION_ID" \
            --arg resolution "$SELECTED_OPTION" \
            '{
              timestamp: $timestamp,
              actor: $actor,
              role: "human",
              action: "update",
              field_path: ("decisions." + $decision),
              old_value: null,
              new_value: $resolution,
              reason: "HITL decision resolved"
            }')

          jq --argjson entry "$AUDIT_ENTRY" '.audit_log += [$entry]' \
            "$CONTRACT_PATH" > /tmp/contract.json
          mv /tmp/contract.json "$CONTRACT_PATH"

          # Commit the update
          git add "$CONTRACT_PATH"
          git commit -m "Resolve HITL decision ${DECISION_ID} for issue #${ISSUE_NUMBER}"

          # Push with conflict-resistant retry logic
          export CONTRACT_PATH
          export BRANCH_NAME
          export COMMIT_MESSAGE="Resolve HITL decision ${DECISION_ID} for issue #${ISSUE_NUMBER}"
          export JQ_SCRIPT_PATH="/tmp/reapply-hitl-decision.sh"
          if ! .github/scripts/push-contract-update.sh; then
            echo "contract_updated=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "contract_updated=true" >> "$GITHUB_OUTPUT"

      # Determine next phase (read-only) BEFORE any state changes.
      # This ensures retries are idempotent: if dispatch fails, the contract
      # phase is unchanged, so retrying computes the same next_phase.
      - name: Check for phase advancement
        if: steps.update.outputs.contract_updated == 'true'
        id: advance
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          CURRENT_PHASE=$(jq -r '.current_phase' "$CONTRACT_PATH")

          # Check if all decisions for current phase are resolved
          UNRESOLVED=$(jq '[.decisions[] | select(.resolved == false)] | length' "$CONTRACT_PATH")

          if [[ "$UNRESOLVED" -eq "0" ]]; then
            echo "All decisions resolved"

            # Determine next phase
            case "$CURRENT_PHASE" in
              refine)
                NEXT_PHASE="plan"
                ;;
              plan)
                NEXT_PHASE="implement"
                ;;
              implement)
                # Implement doesn't advance via HITL - uses review cycle
                NEXT_PHASE=""
                ;;
              *)
                NEXT_PHASE=""
                ;;
            esac

            if [[ -n "$NEXT_PHASE" ]]; then
              echo "Advancing to ${NEXT_PHASE} phase"
              echo "next_phase=${NEXT_PHASE}" >> "$GITHUB_OUTPUT"
              echo "should_advance=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_advance=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "${UNRESOLVED} decisions still pending"
            echo "should_advance=false" >> "$GITHUB_OUTPUT"
          fi

      # Dispatch pipeline BEFORE updating contract phase. If dispatch fails,
      # the contract is unchanged and retrying will compute the same next_phase.
      - name: Trigger pipeline continuation
        if: steps.advance.outputs.should_advance == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PHASE: ${{ steps.advance.outputs.next_phase }}
        run: |
          set -euo pipefail
          if ! gh workflow run sdlc-pipeline.yml \
            --field issue_number="${ISSUE_NUMBER}" \
            --field starting_phase="${NEXT_PHASE}"; then
            echo "::error::Failed to trigger sdlc-pipeline.yml workflow"
            exit 1
          fi

      - name: Update contract phase
        if: steps.advance.outputs.should_advance == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          NEXT_PHASE: ${{ steps.advance.outputs.next_phase }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          jq --arg phase "$NEXT_PHASE" '.current_phase = $phase' \
            "$CONTRACT_PATH" > /tmp/contract.json
          mv /tmp/contract.json "$CONTRACT_PATH"

          git add "$CONTRACT_PATH"
          git commit -m "Advance to ${NEXT_PHASE} phase for issue #${ISSUE_NUMBER}"

          # Push with conflict-resistant retry logic
          export CONTRACT_PATH
          export BRANCH_NAME
          export COMMIT_MESSAGE="Advance to ${NEXT_PHASE} phase for issue #${ISSUE_NUMBER}"
          export JQ_FILTER=".current_phase = \"${NEXT_PHASE}\""
          .github/scripts/push-contract-update.sh

      # Transition SDLC labels when all decisions resolved
      - name: Transition SDLC labels on decision resolution
        if: steps.advance.outputs.should_advance == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          NEXT_PHASE: ${{ steps.advance.outputs.next_phase }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          CURRENT_PHASE=$(jq -r '.current_phase' "$CONTRACT_PATH" 2>/dev/null || echo "")

          # Map current and next phase to labels
          case "$CURRENT_PHASE" in
            refine) OLD_LABEL="sdlc:refine" ;;
            plan) OLD_LABEL="sdlc:plan" ;;
            implement) OLD_LABEL="sdlc:implement" ;;
            *) OLD_LABEL="" ;;
          esac

          case "$NEXT_PHASE" in
            refine) NEW_LABEL="sdlc:refine" ;;
            plan) NEW_LABEL="sdlc:plan" ;;
            implement) NEW_LABEL="sdlc:implement" ;;
            pr) NEW_LABEL="sdlc:pr" ;;
            *) NEW_LABEL="" ;;
          esac

          # Remove old phase label
          if [[ -n "$OLD_LABEL" ]]; then
            encoded_label="${OLD_LABEL//:/%3A}"
            gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/${encoded_label}" \
              -X DELETE --silent 2>/dev/null || true
          fi

          # Add new phase label
          if [[ -n "$NEW_LABEL" ]]; then
            gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels" \
              -X POST -f "labels[]=${NEW_LABEL}" --silent || true
          fi

          # Remove sdlc:awaiting-approval label
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/sdlc%3Aawaiting-approval" \
            -X DELETE --silent 2>/dev/null || true

      # Minimize previous HITL status comments to reduce clutter
      - name: Minimize previous HITL comments
        if: steps.update.outputs.contract_updated == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          # Find previous bot comments that are HITL decision status updates
          # shellcheck disable=SC2016
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            | jq -r --arg bot "${{ env.BOT_USERNAME }}" \
            '.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.body | test("Decision .* resolved|Phase .* approved|Advancing to")) | .node_id' \
          | while read -r node_id; do
              # shellcheck disable=SC2016 # $id is a GraphQL variable, not bash
              if ! gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }
              ' -f id="$node_id"; then
                echo "Warning: Failed to minimize comment $node_id (may lack permissions)"
              fi
            done

      - name: Post status comment
        if: steps.update.outputs.contract_updated == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          DECISION_ID: ${{ steps.parse.outputs.decision_id }}
          SELECTED_OPTION: ${{ steps.parse.outputs.selected_option }}
          SHOULD_ADVANCE: ${{ steps.advance.outputs.should_advance }}
          NEXT_PHASE: ${{ steps.advance.outputs.next_phase }}
        run: |
          set -euo pipefail
          # Use printf to safely construct comment body (prevents command injection)
          if [[ "$SHOULD_ADVANCE" == "true" ]]; then
            BODY=$(printf 'Decision **%s** resolved: %s\n\nAll pending decisions resolved. Advancing to **%s** phase.\n\n--- Authored by egg' \
              "$DECISION_ID" "$SELECTED_OPTION" "$NEXT_PHASE")
          else
            BODY=$(printf 'Decision **%s** resolved: %s\n\n--- Authored by egg' \
              "$DECISION_ID" "$SELECTED_OPTION")
          fi

          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body "$BODY"

  # ============================================================
  # Handle phase approval comments
  # ============================================================
  handle-approval:
    name: Handle phase approval
    runs-on: ubuntu-latest
    # Trigger only on phase completion comments (with egg-phase-approval marker) where
    # the approval checkbox has been checked. Both conditions must be true to prevent
    # spurious approvals from editing unrelated comments.
    # Authorization: Only jwbron can trigger approvals, and bot cannot trigger itself
    if: >-
      contains(github.event.comment.body, '<!-- egg-phase-approval') &&
      contains(github.event.comment.body, '[x] Approve') &&
      github.event.sender.login == 'jwbron' &&
      github.event.sender.login != 'james-in-a-box' &&
      github.event.sender.login != 'james-in-a-box[bot]'

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Find and checkout issue branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail

          # Validate issue number is numeric (path traversal prevention)
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue number: ${ISSUE_NUMBER}"
            exit 1
          fi

          BRANCH_NAME="egg/issue-${ISSUE_NUMBER}"

          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
            git checkout "${BRANCH_NAME}"
            git pull origin "${BRANCH_NAME}"
          else
            echo "Branch ${BRANCH_NAME} not found"
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.branch.outputs.branch_exists == 'true'
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
        run: |
          git config user.name "james-in-a-box[bot]"
          git config user.email "${BOT_APP_ID}+james-in-a-box[bot]@users.noreply.github.com"

      # Determine next phase (read-only) BEFORE any state changes.
      # This ensures retries are idempotent: if dispatch fails, the contract
      # phase is unchanged, so retrying computes the same next_phase.
      - name: Determine next phase
        if: steps.branch.outputs.branch_exists == 'true'
        id: approve
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ ! -f "$CONTRACT_PATH" ]]; then
            echo "Contract not found"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_PHASE=$(jq -r '.current_phase' "$CONTRACT_PATH")

          # Determine next phase
          case "$CURRENT_PHASE" in
            refine)
              NEXT_PHASE="plan"
              ;;
            plan)
              NEXT_PHASE="implement"
              ;;
            *)
              echo "Cannot advance from ${CURRENT_PHASE} via approval"
              echo "approved=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "Advancing from ${CURRENT_PHASE} to ${NEXT_PHASE}"
          {
            echo "approved=true"
            echo "next_phase=${NEXT_PHASE}"
            echo "previous_phase=${CURRENT_PHASE}"
          } >> "$GITHUB_OUTPUT"

      # Dispatch pipeline BEFORE updating contract phase. If dispatch fails,
      # the contract is unchanged and retrying will compute the same next_phase.
      - name: Trigger pipeline continuation
        if: steps.approve.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PHASE: ${{ steps.approve.outputs.next_phase }}
        run: |
          set -euo pipefail
          if ! gh workflow run sdlc-pipeline.yml \
            --field issue_number="${ISSUE_NUMBER}" \
            --field starting_phase="${NEXT_PHASE}"; then
            echo "::error::Failed to trigger sdlc-pipeline.yml workflow"
            exit 1
          fi

      - name: Update contract phase
        if: steps.approve.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          NEXT_PHASE: ${{ steps.approve.outputs.next_phase }}
          PREVIOUS_PHASE: ${{ steps.approve.outputs.previous_phase }}
        run: |
          set -euo pipefail
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          # Store actor for reapply script
          SENDER_LOGIN="${{ github.event.sender.login }}"
          export SENDER_LOGIN NEXT_PHASE PREVIOUS_PHASE CONTRACT_PATH

          # Create reapply script for retry logic (includes audit log entry)
          cat > /tmp/reapply-approve-phase.sh << 'REAPPLY_EOF'
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg phase "$NEXT_PHASE" \
             --arg old_phase "$PREVIOUS_PHASE" \
             --arg timestamp "$TS" \
             --arg actor "$SENDER_LOGIN" \
            '.current_phase = $phase |
             .audit_log += [{
               timestamp: $timestamp,
               actor: $actor,
               role: "human",
               action: "transition",
               field_path: "current_phase",
               old_value: $old_phase,
               new_value: $phase,
               reason: "Phase approved by human"
             }]' \
            "$CONTRACT_PATH" > /tmp/contract.json
          mv /tmp/contract.json "$CONTRACT_PATH"
          REAPPLY_EOF

          # Apply transformation initially
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg phase "$NEXT_PHASE" \
             --arg old_phase "$PREVIOUS_PHASE" \
             --arg timestamp "$TIMESTAMP" \
             --arg actor "$SENDER_LOGIN" \
            '.current_phase = $phase |
             .audit_log += [{
               timestamp: $timestamp,
               actor: $actor,
               role: "human",
               action: "transition",
               field_path: "current_phase",
               old_value: $old_phase,
               new_value: $phase,
               reason: "Phase approved by human"
             }]' \
            "$CONTRACT_PATH" > /tmp/contract.json

          mv /tmp/contract.json "$CONTRACT_PATH"

          git add "$CONTRACT_PATH"
          git commit -m "Approve and advance to ${NEXT_PHASE} phase for issue #${ISSUE_NUMBER}"

          # Push with conflict-resistant retry logic
          export BRANCH_NAME
          export COMMIT_MESSAGE="Approve and advance to ${NEXT_PHASE} phase for issue #${ISSUE_NUMBER}"
          export JQ_SCRIPT_PATH="/tmp/reapply-approve-phase.sh"
          .github/scripts/push-contract-update.sh

      # Transition SDLC labels on phase approval
      - name: Transition SDLC labels
        if: steps.approve.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          NEXT_PHASE: ${{ steps.approve.outputs.next_phase }}
          PREVIOUS_PHASE: ${{ steps.approve.outputs.previous_phase }}
        run: |
          set -euo pipefail

          # Map phase to label
          case "$PREVIOUS_PHASE" in
            refine) OLD_LABEL="sdlc:refine" ;;
            plan) OLD_LABEL="sdlc:plan" ;;
            implement) OLD_LABEL="sdlc:implement" ;;
            *) OLD_LABEL="" ;;
          esac

          case "$NEXT_PHASE" in
            refine) NEW_LABEL="sdlc:refine" ;;
            plan) NEW_LABEL="sdlc:plan" ;;
            implement) NEW_LABEL="sdlc:implement" ;;
            pr) NEW_LABEL="sdlc:pr" ;;
            *) NEW_LABEL="" ;;
          esac

          # Remove old phase label
          if [[ -n "$OLD_LABEL" ]]; then
            encoded_label="${OLD_LABEL//:/%3A}"
            gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/${encoded_label}" \
              -X DELETE --silent 2>/dev/null || true
          fi

          # Add new phase label
          if [[ -n "$NEW_LABEL" ]]; then
            gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels" \
              -X POST -f "labels[]=${NEW_LABEL}" --silent || true
          fi

          # Remove sdlc:awaiting-approval label
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/sdlc%3Aawaiting-approval" \
            -X DELETE --silent 2>/dev/null || true

          echo "Transitioned labels: ${OLD_LABEL} -> ${NEW_LABEL}"

      # Minimize previous HITL status comments to reduce clutter
      - name: Minimize previous HITL comments
        if: steps.approve.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          # Find previous bot comments that are HITL decision/approval status updates
          # shellcheck disable=SC2016
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            | jq -r --arg bot "${{ env.BOT_USERNAME }}" \
            '.[] | select(.user.login == $bot or .user.login == ($bot + "[bot]")) | select(.body | test("Decision .* resolved|Phase .* approved|Advancing to")) | .node_id' \
          | while read -r node_id; do
              # shellcheck disable=SC2016 # $id is a GraphQL variable, not bash
              if ! gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }
              ' -f id="$node_id"; then
                echo "Warning: Failed to minimize comment $node_id (may lack permissions)"
              fi
            done

      - name: Post approval comment
        if: steps.approve.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          NEXT_PHASE: ${{ steps.approve.outputs.next_phase }}
          PREVIOUS_PHASE: ${{ steps.approve.outputs.previous_phase }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          # Use printf to safely construct comment body (prevents command injection)
          BODY=$(printf 'Phase **%s** approved by @%s.\n\nAdvancing to **%s** phase.\n\n--- Authored by egg' \
            "$PREVIOUS_PHASE" "$SENDER_LOGIN" "$NEXT_PHASE")

          gh issue comment "${ISSUE_NUMBER}" --repo "${{ github.repository }}" --body "$BODY"
