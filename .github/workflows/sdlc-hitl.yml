name: "egg: SDLC HITL Decision Handler"

# This workflow handles Human-In-The-Loop (HITL) decisions for the SDLC pipeline.
# It triggers when issue comments are edited (checkbox state changes) and
# updates the contract state accordingly.
#
# The workflow implements a 30-second debounce to prevent rapid-fire updates
# when humans check/uncheck multiple boxes in quick succession.

on:
  issue_comment:
    types: [edited]

permissions:
  contents: write
  issues: write

jobs:
  handle-decision:
    name: Handle HITL decision
    runs-on: ubuntu-latest
    # Only trigger on comments that contain HITL decision markers
    if: contains(github.event.comment.body, '<!-- egg-hitl-decision')

    env:
      BOT_USERNAME: james-in-a-box
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Parse decision changes
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PREVIOUS_BODY: ${{ github.event.changes.body.from }}
        run: |
          # Extract decision ID from marker
          # Format: <!-- egg-hitl-decision id=decision-N -->
          DECISION_ID=$(echo "$COMMENT_BODY" | grep -oP '<!-- egg-hitl-decision id=\K[a-z0-9-]+' | head -1)

          if [[ -z "$DECISION_ID" ]]; then
            echo "No decision ID found in comment"
            echo "has_decision=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "decision_id=${DECISION_ID}" >> "$GITHUB_OUTPUT"
          echo "has_decision=true" >> "$GITHUB_OUTPUT"

          # Parse checkbox states from current and previous body
          # Format: - [x] Option label or - [ ] Option label

          # Extract selected options from current body
          SELECTED_CURRENT=$(echo "$COMMENT_BODY" | grep -oP '^\s*-\s*\[x\]\s*\K.+' || true)
          SELECTED_PREVIOUS=$(echo "$PREVIOUS_BODY" | grep -oP '^\s*-\s*\[x\]\s*\K.+' || true)

          # Compare to detect changes
          if [[ "$SELECTED_CURRENT" != "$SELECTED_PREVIOUS" ]]; then
            echo "checkbox_changed=true" >> "$GITHUB_OUTPUT"
            echo "selected_option=${SELECTED_CURRENT}" >> "$GITHUB_OUTPUT"
          else
            echo "checkbox_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check debounce
        if: steps.parse.outputs.has_decision == 'true' && steps.parse.outputs.checkbox_changed == 'true'
        id: debounce
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          DECISION_ID: ${{ steps.parse.outputs.decision_id }}
        run: |
          # Implement 30-second debounce
          # Check if there's a recent workflow run for this decision

          DEBOUNCE_SECONDS=30

          # Look for recent runs of this workflow for the same issue
          JQ_FILTER='[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")'
          JQ_FILTER+=' | select(.head_branch == "main")] | length'
          RECENT_RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/sdlc-hitl.yml/runs" \
            --jq "$JQ_FILTER")

          if [[ "$RECENT_RUNS" -gt "1" ]]; then
            echo "Debounce: Another run is in progress, skipping"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_process=true" >> "$GITHUB_OUTPUT"
          fi

          # Wait for debounce period
          echo "Waiting ${DEBOUNCE_SECONDS}s for debounce..."
          sleep "$DEBOUNCE_SECONDS"

      - name: Checkout repository
        if: steps.debounce.outputs.should_process == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Find and checkout issue branch
        if: steps.debounce.outputs.should_process == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          BRANCH_NAME="egg/issue-${ISSUE_NUMBER}"

          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
            git checkout "${BRANCH_NAME}"
            git pull origin "${BRANCH_NAME}"
          else
            echo "Branch ${BRANCH_NAME} not found"
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update contract with decision
        if: steps.branch.outputs.branch_exists == 'true'
        id: update
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          DECISION_ID: ${{ steps.parse.outputs.decision_id }}
          SELECTED_OPTION: ${{ steps.parse.outputs.selected_option }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ ! -f "$CONTRACT_PATH" ]]; then
            echo "Contract not found at ${CONTRACT_PATH}"
            echo "contract_updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the decision by ID and update it
          DECISION_INDEX=$(jq --arg id "$DECISION_ID" \
            '.decisions | to_entries | .[] | select(.value.id == $id) | .key' \
            "$CONTRACT_PATH")

          if [[ -z "$DECISION_INDEX" ]]; then
            echo "Decision ${DECISION_ID} not found in contract"
            echo "contract_updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Update the decision
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg idx "$DECISION_INDEX" \
             --arg resolution "$SELECTED_OPTION" \
             --arg timestamp "$TIMESTAMP" \
             --arg actor "${{ github.event.sender.login }}" \
            '.decisions[$idx | tonumber].resolved = true |
             .decisions[$idx | tonumber].resolution = $resolution |
             .decisions[$idx | tonumber].resolved_by = $actor |
             .decisions[$idx | tonumber].resolved_at = $timestamp' \
            "$CONTRACT_PATH" > /tmp/contract.json

          mv /tmp/contract.json "$CONTRACT_PATH"

          # Add audit entry
          AUDIT_ENTRY=$(jq -n \
            --arg timestamp "$TIMESTAMP" \
            --arg actor "${{ github.event.sender.login }}" \
            --arg decision "$DECISION_ID" \
            --arg resolution "$SELECTED_OPTION" \
            '{
              timestamp: $timestamp,
              actor: $actor,
              role: "human",
              action: "update",
              field_path: ("decisions." + $decision),
              old_value: null,
              new_value: $resolution,
              reason: "HITL decision resolved"
            }')

          jq --argjson entry "$AUDIT_ENTRY" '.audit_log += [$entry]' \
            "$CONTRACT_PATH" > /tmp/contract.json
          mv /tmp/contract.json "$CONTRACT_PATH"

          # Commit the update
          git add "$CONTRACT_PATH"
          git commit -m "Resolve HITL decision ${DECISION_ID} for issue #${ISSUE_NUMBER}"
          git push origin "${BRANCH_NAME}"

          echo "contract_updated=true" >> "$GITHUB_OUTPUT"

      - name: Check for phase advancement
        if: steps.update.outputs.contract_updated == 'true'
        id: advance
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"
          CURRENT_PHASE=$(jq -r '.current_phase' "$CONTRACT_PATH")

          # Check if all decisions for current phase are resolved
          UNRESOLVED=$(jq '[.decisions[] | select(.resolved == false)] | length' "$CONTRACT_PATH")

          if [[ "$UNRESOLVED" -eq "0" ]]; then
            echo "All decisions resolved"

            # Determine next phase
            case "$CURRENT_PHASE" in
              refine)
                NEXT_PHASE="plan"
                ;;
              plan)
                NEXT_PHASE="implement"
                ;;
              implement)
                # Implement doesn't advance via HITL - uses review cycle
                NEXT_PHASE=""
                ;;
              *)
                NEXT_PHASE=""
                ;;
            esac

            if [[ -n "$NEXT_PHASE" ]]; then
              echo "Advancing to ${NEXT_PHASE} phase"
              echo "next_phase=${NEXT_PHASE}" >> "$GITHUB_OUTPUT"
              echo "should_advance=true" >> "$GITHUB_OUTPUT"

              # Update contract phase
              jq --arg phase "$NEXT_PHASE" '.current_phase = $phase' \
                "$CONTRACT_PATH" > /tmp/contract.json
              mv /tmp/contract.json "$CONTRACT_PATH"

              git add "$CONTRACT_PATH"
              git commit -m "Advance to ${NEXT_PHASE} phase for issue #${ISSUE_NUMBER}"
              git push origin "${BRANCH_NAME}"
            else
              echo "should_advance=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "${UNRESOLVED} decisions still pending"
            echo "should_advance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post status comment
        if: steps.update.outputs.contract_updated == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          DECISION_ID: ${{ steps.parse.outputs.decision_id }}
          SELECTED_OPTION: ${{ steps.parse.outputs.selected_option }}
          SHOULD_ADVANCE: ${{ steps.advance.outputs.should_advance }}
          NEXT_PHASE: ${{ steps.advance.outputs.next_phase }}
        run: |
          if [[ "$SHOULD_ADVANCE" == "true" ]]; then
            BODY="Decision **${DECISION_ID}** resolved: ${SELECTED_OPTION}

          All pending decisions resolved. Advancing to **${NEXT_PHASE}** phase.

          --- Authored by egg"
          else
            BODY="Decision **${DECISION_ID}** resolved: ${SELECTED_OPTION}

          --- Authored by egg"
          fi

          gh issue comment "${ISSUE_NUMBER}" --body "$BODY"

      - name: Trigger pipeline continuation
        if: steps.advance.outputs.should_advance == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          NEXT_PHASE: ${{ steps.advance.outputs.next_phase }}
        run: |
          # Trigger the SDLC pipeline workflow to continue with the next phase
          gh workflow run sdlc-pipeline.yml \
            --field issue_number="${ISSUE_NUMBER}" \
            --field starting_phase="${NEXT_PHASE}"

  # ============================================================
  # Handle phase approval comments
  # ============================================================
  handle-approval:
    name: Handle phase approval
    runs-on: ubuntu-latest
    # Trigger on comments that approve a phase (e.g., "LGTM", "approved", checkbox approval)
    if: >-
      !contains(github.event.comment.body, '<!-- egg-hitl-decision') &&
      (
        contains(github.event.comment.body, '<!-- egg-phase-approval') ||
        contains(github.event.comment.body, '[x] Approve')
      )

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Find and checkout issue branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          BRANCH_NAME="egg/issue-${ISSUE_NUMBER}"

          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
            git checkout "${BRANCH_NAME}"
            git pull origin "${BRANCH_NAME}"
          else
            echo "Branch ${BRANCH_NAME} not found"
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Process approval
        if: steps.branch.outputs.branch_exists == 'true'
        id: approve
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          CONTRACT_PATH=".egg-state/contracts/${ISSUE_NUMBER}.json"

          if [[ ! -f "$CONTRACT_PATH" ]]; then
            echo "Contract not found"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_PHASE=$(jq -r '.current_phase' "$CONTRACT_PATH")

          # Determine next phase
          case "$CURRENT_PHASE" in
            refine)
              NEXT_PHASE="plan"
              ;;
            plan)
              NEXT_PHASE="implement"
              ;;
            *)
              echo "Cannot advance from ${CURRENT_PHASE} via approval"
              echo "approved=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "Advancing from ${CURRENT_PHASE} to ${NEXT_PHASE}"

          # Update contract
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg phase "$NEXT_PHASE" \
             --arg timestamp "$TIMESTAMP" \
             --arg actor "${{ github.event.sender.login }}" \
            '.current_phase = $phase |
             .audit_log += [{
               timestamp: $timestamp,
               actor: $actor,
               role: "human",
               action: "transition",
               field_path: "current_phase",
               old_value: .current_phase,
               new_value: $phase,
               reason: "Phase approved by human"
             }]' \
            "$CONTRACT_PATH" > /tmp/contract.json

          mv /tmp/contract.json "$CONTRACT_PATH"

          git add "$CONTRACT_PATH"
          git commit -m "Approve and advance to ${NEXT_PHASE} phase for issue #${ISSUE_NUMBER}"
          git push origin "${BRANCH_NAME}"

          {
            echo "approved=true"
            echo "next_phase=${NEXT_PHASE}"
            echo "previous_phase=${CURRENT_PHASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Post approval comment
        if: steps.approve.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          NEXT_PHASE: ${{ steps.approve.outputs.next_phase }}
          PREVIOUS_PHASE: ${{ steps.approve.outputs.previous_phase }}
        run: |
          BODY="Phase **${PREVIOUS_PHASE}** approved by @${{ github.event.sender.login }}.

          Advancing to **${NEXT_PHASE}** phase.

          --- Authored by egg"

          gh issue comment "${ISSUE_NUMBER}" --body "$BODY"

      - name: Trigger pipeline continuation
        if: steps.approve.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          NEXT_PHASE: ${{ steps.approve.outputs.next_phase }}
        run: |
          gh workflow run sdlc-pipeline.yml \
            --field issue_number="${ISSUE_NUMBER}" \
            --field starting_phase="${NEXT_PHASE}"
