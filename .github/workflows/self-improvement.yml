name: "egg: Self-Improvement Analysis"

# This workflow follows agent-mode design principles:
# - Give egg a clear objective and let it analyze + take action
# - No rigid detection pipeline - egg reasons about problems intelligently
# - Pre-collect run data to provide orientation (not constraint)
# - egg can fetch additional details via gh CLI when needed

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily
  workflow_dispatch: # Manual trigger for testing
    inputs:
      since_hours:
        description: "Analyze runs from the last N hours"
        required: false
        default: "24"
        type: string
      dry_run:
        description: "Dry run mode (analyze only, don't create issues)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      since_hours:
        description: "Analyze runs from the last N hours"
        required: false
        type: string
        default: "24"
      dry_run:
        description: "Dry run mode (analyze only, don't create issues)"
        required: false
        type: boolean
        default: false
      action_ref:
        description: 'Reference to egg action (owner/repo/path@ref format). NOTE: GitHub Actions uses: field cannot be dynamic - consuming repos must hardcode their action reference in the uses step below.'
        required: false
        type: string
        default: "jwbron/egg/action@main"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
      BOT_APP_INSTALLATION_ID:
        required: true
      ANTHROPIC_OAUTH_TOKEN:
        required: true

jobs:
  # Job 1: Collect run data and determine partitions
  collect:
    name: Collect run data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      partition_count: ${{ steps.collect.outputs.partition_count }}
      partition_matrix: ${{ steps.collect.outputs.partition_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Collect and partition run data
        id: collect
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          SINCE_HOURS: ${{ inputs.since_hours || github.event.inputs.since_hours || '24' }}
          DRY_RUN: ${{ inputs.dry_run || github.event.inputs.dry_run || 'false' }}
        run: |
          # Pre-collect run data and partition for parallel egg instances
          # This follows agent-mode design: provide orientation, not constraint
          # Partitioning ensures each egg instance can process all runs in its context

          mkdir -p partitions prompts

          # Capture stderr (partition count) while still showing it in logs.
          # The collect script writes PARTITION_COUNT=N to stderr, but may also
          # write errors there — tee ensures both are visible in CI output.
          PYTHONPATH=sandbox python -m egg_lib.self_improvement.collect \
            --since-hours "${SINCE_HOURS}" \
            --format markdown \
            --partition \
            --output "partitions/partition_{partition}.md" \
            2> >(tee partition_info.txt >&2)

          # Extract partition count from stderr (use tail -1 to handle any extra output)
          # Use || echo "0" to ensure we get "0" if grep fails (empty file or no match)
          PARTITION_COUNT=$(grep "^PARTITION_COUNT=" partition_info.txt 2>/dev/null | tail -1 | cut -d= -f2 || echo "0")
          # Handle empty string case (grep succeeded but cut produced nothing)
          PARTITION_COUNT="${PARTITION_COUNT:-0}"
          echo "partition_count=${PARTITION_COUNT}" >> "$GITHUB_OUTPUT"

          # Generate matrix JSON array for dynamic job spawning
          # e.g., [0, 1, 2] for 3 partitions
          if [[ "${PARTITION_COUNT}" == "0" ]]; then
            echo 'partition_matrix=[]' >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(seq 0 $((PARTITION_COUNT - 1)) | jq -s -c '.')
            echo "partition_matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          fi

          # Build task prompts for each partition
          for i in $(seq 0 $((PARTITION_COUNT - 1))); do
            PROMPT_FILE="prompts/task_prompt_${i}.md"

            cat > "${PROMPT_FILE}" << 'PROMPT_EOF'
          # Self-Improvement Analysis Task

          Analyze the GitHub Actions runs assigned to this batch. This is part of
          a partitioned analysis - you are responsible for analyzing the runs in this batch
          and creating issues for any problems you identify.

          **Important:** Analyze ALL runs, not just failed ones. Even successful runs may
          contain issues like tool call errors, warnings, or patterns worth investigating.

          ## Pre-Collected Data

          Run data has been pre-collected and is included below. This provides an
          overview of what happened - use it to orient your analysis. You can still
          use `gh run view <run-id> --log` to get full logs for any run if the
          excerpts aren't sufficient.

          PROMPT_EOF

            # Append the partition data
            cat "partitions/partition_${i}.md" >> "${PROMPT_FILE}"

            cat >> "${PROMPT_FILE}" << 'PROMPT_EOF'

          ## Objective

          1. Review the pre-collected run data above to understand what happened
          2. For runs that need deeper analysis, use `gh run view <run-id> --log`
          3. Identify problems in ALL runs assigned to this batch (failed AND successful)
             - Failed runs: Look for root causes and patterns
             - Successful runs: Look for tool call errors, warnings, retries, or concerning patterns
          4. For issues that warrant tracking, create GitHub issues with:
             - Clear description of the problem
             - Evidence from the logs
             - Suggested actions if obvious
             - Label: `self-improvement`
          5. Before creating issues, search for existing open issues with the `self-improvement`
             label to avoid duplicates. You can update existing issues with new occurrences.

          ## Self-Reflection

          This workflow analyzes itself. If you see failures in `self-improvement.yml` runs,
          pay special attention - improving the self-improvement process is valuable.
          Consider whether issues could be:
          - Bugs in the data collection or analysis logic
          - Missing context that would help future analysis
          - Patterns that the workflow should detect automatically

          ## Guidance

          Pay particular attention to:
          - Gateway/sidecar connection failures
          - Authentication or credential issues
          - API rate limiting
          - Infrastructure problems (Docker, network, etc.)
          - Recurring tool failures (even in successful runs)
          - Tool call errors that were retried or worked around
          - Patterns that suggest code or configuration problems
          - Warnings or deprecation notices

          Use your judgment about what's worth creating an issue for. A single transient
          failure may not need an issue, but a pattern across multiple runs does.

          Note: A "successful" run may still have issues worth tracking. Look for tool
          errors that were retried, warnings, or suboptimal behavior even if the run
          ultimately succeeded.
          PROMPT_EOF

            # Add dry run instruction if applicable
            if [[ "${DRY_RUN}" == "true" ]]; then
              cat >> "${PROMPT_FILE}" << 'DRYRUN_EOF'

          ## Dry Run Mode

          This is a dry run. Analyze the failures and describe what issues you WOULD
          create, but do NOT actually create any GitHub issues. Just report your findings.
          DRYRUN_EOF
            fi
          done

          # Show what we collected
          {
            echo "## Pre-Collected Run Data"
            echo ""
            echo "**Partitions:** ${PARTITION_COUNT}"
            echo ""
            for f in partitions/partition_*.md; do
              if [[ -f "$f" ]]; then
                partition_num=$(basename "$f" .md | sed 's/partition_//')
                echo "<details><summary>Partition $((partition_num + 1))</summary>"
                echo ""
                cat "$f"
                echo ""
                echo "</details>"
                echo ""
              fi
            done
            if [[ "${PARTITION_COUNT}" != "0" ]]; then
              echo ""
              echo "## Self-Improvement Analysis Task"
              echo ""
              echo "Dispatching ${PARTITION_COUNT} egg instance(s) for intelligent analysis..."
              echo ""
              for i in $(seq 0 $((PARTITION_COUNT - 1))); do
                echo "<details><summary>Task prompt (Partition $((i + 1)))</summary>"
                echo ""
                echo '```markdown'
                cat "prompts/task_prompt_${i}.md"
                echo '```'
                echo "</details>"
                echo ""
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: fromJSON(steps.collect.outputs.partition_count) > 0
        uses: actions/upload-artifact@v4
        with:
          name: prompts-and-partitions
          path: |
            prompts/
            partitions/
          retention-days: 1

      - name: Report no runs
        if: fromJSON(steps.collect.outputs.partition_count) == 0
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo ""
            echo "## Result"
            echo ""
            echo "ℹ️ No runs to analyze in the specified time window. [View logs](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 2: Run egg instances dynamically based on partition count
  analyze:
    name: Analyze partition ${{ matrix.partition }}
    runs-on: ubuntu-latest
    needs: collect
    if: fromJSON(needs.collect.outputs.partition_count) > 0
    permissions:
      contents: read
      actions: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        partition: ${{ fromJSON(needs.collect.outputs.partition_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: prompts-and-partitions

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Run egg
        id: egg
        uses: jwbron/egg/action@main
        with:
          prompt-file: prompts/task_prompt_${{ matrix.partition }}.md
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          github-token: ${{ steps.bot-token.outputs.token }}
          timeout: "30"

      - name: Report result
        if: always()
        env:
          EXIT_CODE: ${{ steps.egg.outputs.exit-code }}
        run: |
          PARTITION=${{ matrix.partition }}
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${EXIT_CODE}" == "0" ]]; then
            {
              echo "## Partition $((PARTITION + 1)) Result"
              echo ""
              echo "✅ egg completed successfully. [View full logs](${RUN_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Partition $((PARTITION + 1)) Result"
              echo ""
              echo "❌ egg failed (exit code: ${EXIT_CODE}). [View full logs](${RUN_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
