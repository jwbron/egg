name: "egg: Self-Improvement Analysis"

# This workflow follows agent-mode design principles:
# - Give egg a clear objective and let it analyze + take action
# - No rigid detection pipeline - egg reasons about problems intelligently
# - Pre-collect run data to provide orientation (not constraint)
# - egg can fetch additional details via gh CLI when needed

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily
  workflow_dispatch: # Manual trigger for testing
    inputs:
      since_hours:
        description: "Analyze runs from the last N hours"
        required: false
        default: "24"
        type: string
      dry_run:
        description: "Dry run mode (analyze only, don't create issues)"
        required: false
        default: false
        type: boolean

jobs:
  analyze:
    name: Analyze with egg
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Collect and partition run data
        id: collect
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          SINCE_HOURS: ${{ github.event.inputs.since_hours || '24' }}
        run: |
          # Pre-collect run data and partition for parallel egg instances
          # This follows agent-mode design: provide orientation, not constraint
          # Partitioning ensures each egg instance can process all runs in its context

          mkdir -p partitions

          # Capture stderr (partition count) and write partitions
          PYTHONPATH=sandbox python -m egg_lib.self_improvement.collect \
            --since-hours "${SINCE_HOURS}" \
            --format markdown \
            --partition \
            --output "partitions/partition_{partition}.md" \
            2> partition_info.txt

          # Extract partition count from stderr (use tail -1 to handle any extra output)
          PARTITION_COUNT=$(grep "^PARTITION_COUNT=" partition_info.txt | tail -1 | cut -d= -f2)
          # Default to 0 if extraction failed (e.g., collection error)
          PARTITION_COUNT="${PARTITION_COUNT:-0}"
          echo "partition_count=${PARTITION_COUNT}" >> "$GITHUB_OUTPUT"

          # Show what we collected
          {
            echo "## Pre-Collected Run Data"
            echo ""
            echo "**Partitions:** ${PARTITION_COUNT}"
            echo ""
            for f in partitions/partition_*.md; do
              if [[ -f "$f" ]]; then
                partition_num=$(basename "$f" .md | sed 's/partition_//')
                echo "<details><summary>Partition $((partition_num + 1))</summary>"
                echo ""
                cat "$f"
                echo ""
                echo "</details>"
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build task prompts for each partition
        id: prompt
        env:
          SINCE_HOURS: ${{ github.event.inputs.since_hours || '24' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PARTITION_COUNT: ${{ steps.collect.outputs.partition_count }}
        run: |
          mkdir -p prompts

          # Handle case with no failed runs
          if [[ "${PARTITION_COUNT}" == "0" ]]; then
            echo "No failed runs to analyze"
            echo "skip_egg=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip_egg=false" >> "$GITHUB_OUTPUT"

          # Build a prompt file for each partition
          for i in $(seq 0 $((PARTITION_COUNT - 1))); do
            PROMPT_FILE="prompts/task_prompt_${i}.md"

            cat > "${PROMPT_FILE}" << 'PROMPT_EOF'
          # Self-Improvement Analysis Task

          Analyze the failed GitHub Actions runs assigned to this batch. This is part of
          a partitioned analysis - you are responsible for analyzing the runs in this batch
          and creating issues for any problems you identify.

          ## Pre-Collected Data

          Run data has been pre-collected and is included below. This provides an
          overview of what happened - use it to orient your analysis. You can still
          use `gh run view <run-id> --log` to get full logs for any run if the
          excerpts aren't sufficient.

          PROMPT_EOF

            # Append the partition data
            cat "partitions/partition_${i}.md" >> "${PROMPT_FILE}"

            cat >> "${PROMPT_FILE}" << 'PROMPT_EOF'

          ## Objective

          1. Review the pre-collected run data above to understand what happened
          2. For runs that need deeper analysis, use `gh run view <run-id> --log`
          3. Identify problems in the runs assigned to this batch
          4. For issues that warrant tracking, create GitHub issues with:
             - Clear description of the problem
             - Evidence from the logs
             - Suggested actions if obvious
             - Label: `self-improvement`
          5. Before creating issues, search for existing open issues with the `self-improvement`
             label to avoid duplicates. You can update existing issues with new occurrences.

          ## Self-Reflection

          This workflow analyzes itself. If you see failures in `self-improvement.yml` runs,
          pay special attention - improving the self-improvement process is valuable.
          Consider whether issues could be:
          - Bugs in the data collection or analysis logic
          - Missing context that would help future analysis
          - Patterns that the workflow should detect automatically

          ## Guidance

          Pay particular attention to:
          - Gateway/sidecar connection failures
          - Authentication or credential issues
          - API rate limiting
          - Infrastructure problems (Docker, network, etc.)
          - Recurring tool failures
          - Patterns that suggest code or configuration problems

          Use your judgment about what's worth creating an issue for. A single transient
          failure may not need an issue, but a pattern across multiple runs does.

          A run that *successfully debugged and fixed an error* contains "error" many times
          but isn't a failure - look at the run conclusion, not just log content.
          PROMPT_EOF

            # Substitute the environment variables
            sed -i "s/SINCE_HOURS_PLACEHOLDER/${SINCE_HOURS}/g" "${PROMPT_FILE}"

            # Add dry run instruction if applicable
            if [[ "${DRY_RUN}" == "true" ]]; then
              cat >> "${PROMPT_FILE}" << 'DRYRUN_EOF'

          ## Dry Run Mode

          This is a dry run. Analyze the failures and describe what issues you WOULD
          create, but do NOT actually create any GitHub issues. Just report your findings.
          DRYRUN_EOF
            fi
          done

          # Show what we're asking egg to do
          {
            echo "## Self-Improvement Analysis Task"
            echo ""
            echo "Dispatching ${PARTITION_COUNT} egg instance(s) for intelligent analysis..."
            echo ""
            for i in $(seq 0 $((PARTITION_COUNT - 1))); do
              echo "<details><summary>Task prompt (Partition $((i + 1)))</summary>"
              echo ""
              echo '```markdown'
              cat "prompts/task_prompt_${i}.md"
              echo '```'
              echo "</details>"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Run egg instances sequentially with 5-second delays
      # GitHub Actions doesn't support dynamic action calls in loops, so we use
      # conditional steps for up to 5 partitions (25 failed runs max with 5 per partition).
      # Rationale: 5 partitions balances coverage vs. cost/complexity. With 5 runs per
      # partition, this handles 25 failed runs - enough for daily analysis of a moderately
      # active repo. If more runs fail, the oldest are dropped (collect.py limits output).
      - name: Run egg (Partition 1)
        id: egg-0
        if: steps.prompt.outputs.skip_egg != 'true' && fromJSON(steps.collect.outputs.partition_count) >= 1
        uses: jwbron/egg/action@main
        with:
          prompt-file: prompts/task_prompt_0.md
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          github-token: ${{ steps.bot-token.outputs.token }}
          timeout: "30"

      - name: Delay before partition 2
        if: steps.prompt.outputs.skip_egg != 'true' && fromJSON(steps.collect.outputs.partition_count) >= 2
        run: sleep 5

      - name: Run egg (Partition 2)
        id: egg-1
        if: steps.prompt.outputs.skip_egg != 'true' && fromJSON(steps.collect.outputs.partition_count) >= 2
        uses: jwbron/egg/action@main
        with:
          prompt-file: prompts/task_prompt_1.md
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          github-token: ${{ steps.bot-token.outputs.token }}
          timeout: "30"

      - name: Delay before partition 3
        if: steps.prompt.outputs.skip_egg != 'true' && fromJSON(steps.collect.outputs.partition_count) >= 3
        run: sleep 5

      - name: Run egg (Partition 3)
        id: egg-2
        if: steps.prompt.outputs.skip_egg != 'true' && fromJSON(steps.collect.outputs.partition_count) >= 3
        uses: jwbron/egg/action@main
        with:
          prompt-file: prompts/task_prompt_2.md
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          github-token: ${{ steps.bot-token.outputs.token }}
          timeout: "30"

      - name: Delay before partition 4
        if: steps.prompt.outputs.skip_egg != 'true' && fromJSON(steps.collect.outputs.partition_count) >= 4
        run: sleep 5

      - name: Run egg (Partition 4)
        id: egg-3
        if: steps.prompt.outputs.skip_egg != 'true' && fromJSON(steps.collect.outputs.partition_count) >= 4
        uses: jwbron/egg/action@main
        with:
          prompt-file: prompts/task_prompt_3.md
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          github-token: ${{ steps.bot-token.outputs.token }}
          timeout: "30"

      - name: Delay before partition 5
        if: steps.prompt.outputs.skip_egg != 'true' && fromJSON(steps.collect.outputs.partition_count) >= 5
        run: sleep 5

      - name: Run egg (Partition 5)
        id: egg-4
        if: steps.prompt.outputs.skip_egg != 'true' && fromJSON(steps.collect.outputs.partition_count) >= 5
        uses: jwbron/egg/action@main
        with:
          prompt-file: prompts/task_prompt_4.md
          anthropic-oauth-token: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          bot-app-id: ${{ secrets.BOT_APP_ID }}
          bot-app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          bot-app-installation-id: ${{ secrets.BOT_APP_INSTALLATION_ID }}
          github-token: ${{ steps.bot-token.outputs.token }}
          timeout: "30"

      - name: Report result
        if: always()
        env:
          PARTITION_COUNT: ${{ steps.collect.outputs.partition_count }}
          SKIP_EGG: ${{ steps.prompt.outputs.skip_egg }}
          EGG_0_EXIT: ${{ steps.egg-0.outputs.exit-code }}
          EGG_1_EXIT: ${{ steps.egg-1.outputs.exit-code }}
          EGG_2_EXIT: ${{ steps.egg-2.outputs.exit-code }}
          EGG_3_EXIT: ${{ steps.egg-3.outputs.exit-code }}
          EGG_4_EXIT: ${{ steps.egg-4.outputs.exit-code }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${SKIP_EGG}" == "true" ]]; then
            {
              echo ""
              echo "## Result"
              echo ""
              echo "ℹ️ No failed runs to analyze. [View logs](${RUN_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Collect exit codes for all partitions
          ALL_SUCCESS=true
          RESULTS=""

          for i in $(seq 0 $((PARTITION_COUNT - 1))); do
            case $i in
              0) EXIT_CODE="${EGG_0_EXIT:-}" ;;
              1) EXIT_CODE="${EGG_1_EXIT:-}" ;;
              2) EXIT_CODE="${EGG_2_EXIT:-}" ;;
              3) EXIT_CODE="${EGG_3_EXIT:-}" ;;
              4) EXIT_CODE="${EGG_4_EXIT:-}" ;;
              *) EXIT_CODE="" ;;
            esac

            if [[ -z "${EXIT_CODE}" ]]; then
              RESULTS="${RESULTS}- Partition $((i + 1)): ⏭️ skipped\n"
            elif [[ "${EXIT_CODE}" == "0" ]]; then
              RESULTS="${RESULTS}- Partition $((i + 1)): ✅ success\n"
            else
              RESULTS="${RESULTS}- Partition $((i + 1)): ❌ failed (exit code: ${EXIT_CODE})\n"
              ALL_SUCCESS=false
            fi
          done

          if [[ "${ALL_SUCCESS}" == "true" ]]; then
            {
              echo ""
              echo "## Result"
              echo ""
              echo "✅ All ${PARTITION_COUNT} egg instance(s) completed successfully. [View full logs](${RUN_URL})"
              echo ""
              echo -e "${RESULTS}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "## Result"
              echo ""
              echo "⚠️ Some egg instances failed. [View full logs](${RUN_URL})"
              echo ""
              echo -e "${RESULTS}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
