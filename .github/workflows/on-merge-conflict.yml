name: "egg: Resolve Merge Conflicts"

# Trigger on push to main (when conflicts are actually introduced),
# with a schedule as a safety net, or via manual dispatch for a specific PR.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to resolve conflicts for'
        required: true
        type: number

jobs:
  # Validate required configuration for event-triggered runs
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Validate required repository variables
        run: |
          if [[ -z "${{ vars.EGG_BOT_USERNAME }}" ]]; then
            echo "::error::Required repository variable 'EGG_BOT_USERNAME' is not set"
            echo "::error::Set it in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "All required repository variables are configured"

  # Find all PRs with merge conflicts (runs on push to main and schedule)
  find-conflicts:
    name: Find Conflicting PRs
    needs: [validate-config]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    outputs:
      prs: ${{ steps.find.outputs.prs }}

    # When multiple pushes to main happen in quick succession (e.g. merging
    # several PRs), only the latest push matters for conflict detection.
    concurrency:
      group: egg-find-conflicts
      cancel-in-progress: true

    steps:
      # After a push to main, GitHub recomputes mergeable_state asynchronously.
      # Wait to give it time to settle before we check. In rare cases (large
      # repos or GitHub load), 60s may not be enough—those conflicts will be
      # caught by the 2-hour scheduled fallback.
      - name: Wait for mergeable state computation
        if: github.event_name == 'push'
        run: sleep 60

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Find PRs with merge conflicts
        id: find
        run: |
          set -euo pipefail

          # Get all open PRs and filter for those with mergeable_state = CONFLICTING
          # Note: mergeable_state is only available after GitHub computes it,
          # which happens asynchronously. PRs with "UNKNOWN" state are skipped.
          prs=$(gh api repos/${{ github.repository }}/pulls --paginate \
            -q '[.[] | select(.state == "open") | {number: .number, title: .title, head_repo: .head.repo.full_name}]')

          conflicting=()
          while IFS= read -r pr_json; do
            [[ -z "$pr_json" ]] && continue
            pr_num=$(echo "$pr_json" | jq -r '.number')
            pr_title=$(echo "$pr_json" | jq -r '.title')
            head_repo=$(echo "$pr_json" | jq -r '.head_repo')

            # Skip fork PRs — bot can't push to forks
            if [[ "$head_repo" != "${{ github.repository }}" ]]; then
              echo "PR #${pr_num} is from a fork ($head_repo), skipping — bot cannot push to forks"
              continue
            fi

            # Check mergeable state via the detailed PR endpoint
            mergeable_state=$(gh api "repos/${{ github.repository }}/pulls/${pr_num}" \
              -q '.mergeable_state')

            # Add small delay to reduce API rate limit pressure
            sleep 0.5

            if [[ "$mergeable_state" == "dirty" ]]; then
              # Check for skip marker
              if [[ "$pr_title" == *"[skip-conflict-fix]"* ]]; then
                echo "PR #${pr_num} has [skip-conflict-fix] marker, skipping"
                continue
              fi

              # Check if last commit is a failed merge attempt (revert of a merge)
              # This prevents repeatedly trying to fix the same conflict
              last_commit_msg=$(gh api "repos/${{ github.repository }}/pulls/${pr_num}/commits" \
                -q '.[-1].commit.message // ""' 2>/dev/null || echo "")
              if [[ "$last_commit_msg" == Revert\ \"Merge\ * ]]; then
                echo "PR #${pr_num} has a reverted merge commit, skipping — needs human review"
                continue
              fi

              # Check if there was a recent conflict resolution attempt that failed
              # (bot commented about resolution in last 2 hours)
              # Use fromdateiso8601 for robust epoch comparison instead of string comparison
              recent_resolution=$(gh api "repos/${{ github.repository }}/issues/${pr_num}/comments" \
                -q '[.[] | select(.user.login | test("\\[bot\\]$")) | select(.body | contains("conflict resolution")) | select((.created_at | fromdateiso8601) > (now - 7200))] | length' 2>/dev/null || echo "0")
              if [[ "$recent_resolution" -gt 2 ]]; then
                echo "PR #${pr_num} has had multiple recent resolution attempts, skipping — may need human review"
                continue
              fi

              conflicting+=("$pr_num")
            fi
          done < <(echo "$prs" | jq -c '.[]')

          if [[ ${#conflicting[@]} -eq 0 ]]; then
            echo "No conflicting PRs found"
            echo "prs=[]" >> "$GITHUB_OUTPUT"
          else
            echo "Found conflicting PRs: ${conflicting[*]}"
            # Convert to JSON array
            json_array=$(printf '%s\n' "${conflicting[@]}" | jq -R 'tonumber' | jq -sc .)
            echo "prs=${json_array}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

  # Trigger conflict resolution for each conflicting PR
  resolve-scheduled:
    name: Resolve Conflicts (PR #${{ matrix.pr }})
    needs: find-conflicts
    if: needs.find-conflicts.outputs.prs != '[]' && needs.find-conflicts.outputs.prs != ''
    strategy:
      matrix:
        pr: ${{ fromJson(needs.find-conflicts.outputs.prs) }}
      fail-fast: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/reusable-conflict-resolve.yml
    with:
      pr_number: ${{ matrix.pr }}
      bot_username: ${{ vars.EGG_BOT_USERNAME }}
      branch_prefix: ${{ vars.EGG_BRANCH_PREFIX }}
      # action_ref: jwbron/egg/action@main  # Cannot be passed dynamically; hardcoded in reusable workflow
      timeout: "30"
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      BOT_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}

  # Manual dispatch job: resolve conflicts for a specific PR
  resolve-manual:
    name: Resolve Conflicts (Manual)
    needs: [validate-config]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/reusable-conflict-resolve.yml
    with:
      pr_number: ${{ fromJson(github.event.inputs.pr_number) }}
      bot_username: ${{ vars.EGG_BOT_USERNAME }}
      branch_prefix: ${{ vars.EGG_BRANCH_PREFIX }}
      # action_ref: jwbron/egg/action@main  # Cannot be passed dynamically; hardcoded in reusable workflow
      timeout: "30"
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      BOT_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
