name: "egg: Agent-Mode Design Review"

# Trigger on workflow_run completion (not directly on pull_request).
# This ensures the reviewer only runs after CI workflows complete,
# reducing noise from reviews that happen while checks are still running.
#
# We trigger on Test only (not Lint) to avoid duplicate workflow runs per push.
# Both Lint and Test fire workflow_run events on completion; triggering on both
# would create two reviewer runs. Since Test typically finishes after Lint,
# and wait-for-checks polls for any remaining checks, one trigger suffices.
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

jobs:
  # Determine if this workflow_run is associated with a PR that modifies
  # agent-related files and should proceed
  get-pr:
    name: Get PR context
    runs-on: ubuntu-latest
    # Skip if the triggering workflow failed (let autofixer handle failures)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      pr_number: ${{ steps.pr-info.outputs.pr_number }}
      pr_title: ${{ steps.pr-info.outputs.pr_title }}
      should_run: ${{ steps.pr-info.outputs.should_run }}
    steps:
      - name: Get PR information and check path filters
        id: pr-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # For manual dispatch, use the provided PR number (bypass path filter)
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
            PR_TITLE=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.title')
            {
              echo "pr_number=${PR_NUMBER}"
              echo "pr_title=${PR_TITLE}"
              echo "should_run=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For workflow_run, get PR from the triggering workflow's context
          PULL_REQUESTS='${{ toJson(github.event.workflow_run.pull_requests) }}'
          PR_COUNT=$(echo "$PULL_REQUESTS" | jq 'length')

          if [[ "$PR_COUNT" -eq 0 ]]; then
            echo "No pull request associated with this workflow run"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use the first PR (typically there's only one)
          PR_NUMBER=$(echo "$PULL_REQUESTS" | jq -r '.[0].number')

          # Check if PR modifies agent-related files (replicate path filter logic)
          # Only run on changes to:
          # - action/**
          # - .github/workflows/**
          # - sandbox/**/*.md
          # - docs/guides/agent-mode-design.md
          # - docs/guides/sdlc-pipeline.md
          # - docs/architecture/**
          CHANGED_FILES=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' | head -500)

          MATCHES_FILTER=false
          while IFS= read -r file; do
            case "$file" in
              action/*) MATCHES_FILTER=true; break ;;
              .github/workflows/*) MATCHES_FILTER=true; break ;;
              sandbox/*.md) MATCHES_FILTER=true; break ;;
              docs/guides/agent-mode-design.md) MATCHES_FILTER=true; break ;;
              docs/guides/sdlc-pipeline.md) MATCHES_FILTER=true; break ;;
              docs/architecture/*) MATCHES_FILTER=true; break ;;
            esac
          done <<< "$CHANGED_FILES"

          if [[ "$MATCHES_FILTER" != "true" ]]; then
            echo "PR does not modify agent-related files, skipping design review"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch PR metadata for skip-review check and draft status
          PR_DATA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '{title: .title, draft: .draft}')
          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
          IS_DRAFT=$(echo "$PR_DATA" | jq -r '.draft')

          # Skip draft PRs (they're not ready for review)
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "PR #${PR_NUMBER} is a draft, skipping review"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "pr_number=${PR_NUMBER}"
            echo "pr_title=${PR_TITLE}"
            echo "should_run=true"
          } >> "$GITHUB_OUTPUT"
          echo "Found PR #${PR_NUMBER}: ${PR_TITLE} (matches agent-related path filter)"

  review:
    name: Agent-Mode Design Review
    needs: get-pr
    if: needs.get-pr.outputs.should_run == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-review.yml
    with:
      pr_number: ${{ fromJson(needs.get-pr.outputs.pr_number) }}
      bot_name: agent-mode-design
      prompt_script: action/build-agent-mode-design-review-prompt.sh
      timeout: "10"
      pr_title: ${{ needs.get-pr.outputs.pr_title }}
      event_name: ${{ github.event_name }}
      head_sha: ${{ github.event.workflow_run.head_sha || '' }}
      wait_for_checks: true
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      BOT_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
