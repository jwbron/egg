name: "egg: Agent-Mode Design Review"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      # Only run on changes to agent-related code
      - 'action/**'
      - '.github/workflows/**'
      - 'sandbox/**/*.md'
      - 'docs/guides/agent-mode-design.md'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

jobs:
  should-run:
    name: Check if review should run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check if PR is ready for review
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # For workflow_dispatch, always run
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip draft PRs
          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if [skip-review] in title
          if [[ "$PR_TITLE" == *"[skip-review]"* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

  review:
    name: Agent-Mode Design Review
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    uses: ./.github/workflows/reusable-review.yml
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      bot_name: agent-mode-design
      prompt_script: action/build-agent-mode-design-review-prompt.sh
      timeout: "10"
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      BOT_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
