name: "egg: Agent-Mode Design Review"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      # Only run on changes to agent-related code
      - 'action/**'
      - '.github/workflows/**'
      - 'sandbox/**/*.md'
      - 'docs/guides/agent-mode-design.md'
      - 'docs/guides/sdlc-pipeline.md'
      - 'docs/architecture/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

concurrency:
  group: egg-agent-mode-design-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # Validate required configuration
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Validate required repository variables
        run: |
          if [[ -z "${{ vars.EGG_BOT_USERNAME }}" ]]; then
            echo "::error::Required repository variable 'EGG_BOT_USERNAME' is not set"
            echo "::error::Set it in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "All required repository variables are configured"

  review:
    name: egg-review / Agent-Mode Design
    needs: [validate-config]
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-review.yml
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      bot_name: agent-mode-design
      bot_username: ${{ vars.EGG_BOT_USERNAME }}
      branch_prefix: ${{ vars.EGG_BRANCH_PREFIX }}
      # action_ref: jwbron/egg/action@main  # Cannot be passed dynamically; hardcoded in reusable workflow
      prompt_script: action/build-agent-mode-design-review-prompt.sh
      timeout: "10"
      pr_title: ${{ github.event.pull_request.title || '' }}
      event_name: ${{ github.event_name }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      BOT_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
      REVIEWER_APP_ID: ${{ secrets.REVIEWER_APP_ID }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      REVIEWER_APP_INSTALLATION_ID: ${{ secrets.REVIEWER_APP_INSTALLATION_ID }}
