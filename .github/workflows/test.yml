name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: |
          PYTHONPATH=shared .venv/bin/pytest tests/ -v \
            --cov=gateway --cov=shared --cov=sandbox \
            --cov-report=term-missing

      - name: Run gateway tests
        run: |
          PYTHONPATH=shared:gateway .venv/bin/pytest gateway/tests/ -v \
            --cov=gateway --cov=shared --cov=sandbox \
            --cov-append \
            --cov-report=term-missing \
            --cov-fail-under=65

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run bandit
        run: .venv/bin/bandit -r gateway shared sandbox -ll -c pyproject.toml
