name: Test

on:
  workflow_call:
    outputs:
      passed:
        description: 'Whether all tests passed'
        value: ${{ jobs.aggregate.outputs.passed }}

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: |
          PYTHONPATH=shared:gateway .venv/bin/pytest tests/ gateway/tests/ -v \
            --cov=gateway --cov=shared --cov=sandbox \
            --cov-report=term-missing \
            --cov-fail-under=80

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run bandit
        run: .venv/bin/bandit -r gateway shared sandbox -ll -c pyproject.toml

  aggregate:
    name: Aggregate Test Results
    runs-on: ubuntu-latest
    if: always()
    needs: [unit, security]
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Check all jobs passed
        id: check
        run: |
          if [[ "${{ needs.unit.result }}" == "success" && \
                "${{ needs.security.result }}" == "success" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "All tests passed"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "Some tests failed"
            echo "  unit: ${{ needs.unit.result }}"
            echo "  security: ${{ needs.security.result }}"
          fi
