name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: |
          PYTHONPATH=shared .venv/bin/pytest tests/ -v \
            --cov=gateway --cov=shared --cov=sandbox \
            --cov-report=term-missing \
            --cov-fail-under=20

      - name: Run gateway tests
        run: PYTHONPATH=shared:gateway .venv/bin/pytest gateway/tests/ -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build gateway container
        run: docker build -t egg-gateway -f gateway/Dockerfile .

      - name: Run integration and security tests
        run: |
          PYTHONPATH=shared .venv/bin/pytest tests/integration -v \
            -m "integration or security" \
            --timeout=300

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/integration/docker-compose.yml down -v --remove-orphans 2>/dev/null || true
          docker network prune -f 2>/dev/null || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run bandit
        run: .venv/bin/bandit -r gateway shared sandbox -ll -c pyproject.toml
