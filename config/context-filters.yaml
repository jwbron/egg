# Context filters for external integrations.
#
# This file is read by the gateway sidecar to enforce allowlists on external
# services (Jira, Confluence, etc.).  It lives in the same repo as the
# gateway — edit it and either hot-reload with `POST /api/v1/config/reload`
# or roll the gateway pod.
#
# SAFETY: every section fails closed.  Leaving a list empty (or this file
# missing entirely) blocks every call until an operator adds entries.

jira:
  # Atlassian Jira project keys agents are allowed to read through the
  # /api/v1/jira/* endpoints.  Project keys must match the Atlassian shape:
  # uppercase letter followed by letters / digits / underscore (e.g. ENG,
  # DEVOPS, MOBILE_V2).  Case-sensitive.
  #
  # Example:
  #   projects: ["ENG", "DEVOPS"]
  #
  # Any ticket whose project is not on this list returns HTTP 403 with
  # `jira_*_denied` in the gateway audit log.  JQL searches must be
  # statically provable as scoped to the listed projects — see
  # gateway/jira_search.py for the exact acceptance rules.
  projects: []

  # ---------------------------------------------------------------------
  # Write-verb knobs (issue #1924).  These only affect the new
  # POST /api/v1/jira/ticket/create | ticket/edit | ticket/comment/add |
  # issue-link/create routes — read verbs ignore them.

  # Allowed link-type names for `POST /api/v1/jira/issue-link/create`.
  # Atlassian recognises many other names ("Cloners", "Duplicate",
  # "Tests", ...), but the v1 default keeps the operator surface tight.
  # Case-sensitive.
  #
  # Example:
  #   link_types: ["Blocks", "Relates"]
  #
  # If unset / malformed, defaults to ["Blocks", "Relates"].
  # link_types: ["Blocks", "Relates"]

  # Atlassian field used by the `epicLink` shorthand on
  # POST /api/v1/jira/ticket/create.  Two valid values:
  #   - "parent"             — next-gen / company-managed projects (default).
  #   - "customfield_10014"  — classic / team-managed projects (legacy
  #                            "Epic Link" custom field).
  #
  # If unset / malformed, defaults to "parent".  Anything else falls
  # back to the default and emits a warning in the gateway log.
  # epic_link_field: parent

confluence:
  # Atlassian Confluence space keys agents are allowed to read through the
  # /api/v1/confluence/* endpoints.  Space keys typically match the shape:
  # leading letter followed by letters / digits / underscore (e.g. ENG,
  # DOCS, ONBOARDING).  Case-sensitive.
  #
  # Example:
  #   spaces: ["ENG", "DOCS"]
  #
  # Any page whose space is not on this list returns HTTP 403 with
  # `confluence_*_denied` in the gateway audit log.  CQL searches must be
  # statically provable as scoped to the listed spaces — see
  # gateway/confluence_search.py for the exact acceptance rules.
  #
  # Leaving this list empty blocks every Confluence call until an operator
  # populates it (fail-closed).
  spaces: []
