repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to v0.14.14: v0.15.0's ruff-format hook corrupts
    # `except (X, Y):` into invalid Py2 syntax `except X, Y:` for
    # orchestrator/kubernetes_spawner.py under our pre-commit invocation
    # (the standalone v0.15.0 binary does not reproduce). 0.14.14
    # matches the version pinned in the project's local venv.
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # K8s manifests concatenate multiple docs with `---`; without this
        # flag the hook rejects e.g. k8s/base/rbac.yaml (pre-existing).
        args: [--allow-multiple-documents]
      - id: check-added-large-files

  # shellcheck disabled - requires Docker or local installation
  # - repo: https://github.com/koalaman/shellcheck-precommit
  #   rev: v0.11.0
  #   hooks:
  #     - id: shellcheck
