repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # ShellCheck for shell script linting
  # Uses system shellcheck if available, skips gracefully if not
  # This allows commits to proceed in environments without shellcheck
  # while still catching issues when the tool is present
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: bash -c 'if command -v shellcheck >/dev/null 2>&1; then shellcheck "$@"; else echo "shellcheck not found, skipping"; fi' --
        language: system
        types: [shell]
