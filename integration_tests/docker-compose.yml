# Integration test stack for egg gateway.
#
# Starts the gateway sidecar on two isolated networks to mirror production:
#   - egg-test-isolated (172.40.0.0/24): private mode traffic, proxy-routed
#   - egg-test-external (172.41.0.0/24): public mode traffic, direct internet
#
# Sandbox containers are NOT managed by compose -- tests start them
# programmatically for fine-grained control over network, env, and lifecycle.
#
# Usage:
#   docker compose -f integration_tests/docker-compose.yml up -d --build
#   pytest integration_tests -v -m integration
#   docker compose -f integration_tests/docker-compose.yml down -v --remove-orphans

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-egg-test}-gateway
    networks:
      egg-test-isolated:
        ipv4_address: 172.40.0.2
      egg-test-external:
        ipv4_address: 172.41.0.2
    ports:
      - "${GATEWAY_PORT:-0}:9848"
      - "${PROXY_PORT:-0}:3129"
    environment:
      - EGG_REPO_CONFIG=/config/repositories.yaml
      - EGG_LAUNCHER_SECRET=${EGG_LAUNCHER_SECRET}
      - GITHUB_USER_TOKEN=${GITHUB_USER_TOKEN:-dummy-github-token}
      - BOT_GITHUB_TOKEN=${BOT_GITHUB_TOKEN:-}
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - EGG_USER_GIT_NAME=test-user
      - EGG_USER_GIT_EMAIL=test@example.com
    volumes:
      - ${EGG_CONFIG_DIR}/repositories.yaml:/config/repositories.yaml:ro
      - ${EGG_CONFIG_DIR}/secrets.env:/secrets/secrets.env:ro
      - ${EGG_CONFIG_DIR}/launcher-secret:/secrets/launcher-secret:ro
      - certs:/shared/certs
      - worktrees:/home/egg/.egg-worktrees
      - state:/home/egg/.egg-state
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9848/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  certs:
  worktrees:
  state:

networks:
  egg-test-isolated:
    name: ${COMPOSE_PROJECT_NAME:-egg-test}-isolated
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24
          gateway: 172.40.0.1
  egg-test-external:
    name: ${COMPOSE_PROJECT_NAME:-egg-test}-external
    driver: bridge
    ipam:
      config:
        - subnet: 172.41.0.0/24
          gateway: 172.41.0.1
