name: egg
description: Run egg (autonomous coding agent) directly in the GitHub Actions runner
branding:
  icon: terminal
  color: orange

inputs:
  prompt:
    description: Task prompt for the agent (mutually exclusive with prompt-file)
    required: false
  prompt-file:
    description: Path to file containing task prompt (for large prompts, mutually exclusive with prompt)
    required: false
  anthropic-oauth-token:
    description: Anthropic OAuth token for the Claude API (exported as CLAUDE_CODE_OAUTH_TOKEN)
    required: true
  github-token:
    description: >-
      GitHub token the agent uses for git/gh operations (exported as GH_TOKEN).
      Pass the bot/reviewer GitHub App installation token minted by the calling
      workflow. The App installation's permission scope is the capability
      boundary — there is no gateway in this path. Defaults to the workflow
      GITHUB_TOKEN for callers that don't run as an App.
    required: true
    default: ${{ github.token }}
  bot-username:
    description: >-
      GitHub username of the bot identity (without the [bot] suffix, e.g.
      from a repo variable). Used to set the git commit author for any commits
      the agent makes. Optional for read-only bots that never push.
    required: false
    default: ""
  mode:
    description: "Network mode: public, private, or auto (auto-detects from repo visibility). Controls whether web tools are disabled."
    required: false
    default: auto
  timeout:
    description: Timeout in minutes
    required: false
    default: "30"
  model:
    description: Claude model to use
    required: false
    default: opus

outputs:
  exit-code:
    description: Agent exit code (0 = success)
    value: ${{ steps.run.outputs.exit-code }}
  pr-url:
    description: URL of created PR, if any
    value: ${{ steps.run.outputs.pr-url }}
  log-file:
    description: Path to full agent output log
    value: ${{ steps.run.outputs.log-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install the Claude CLI
      shell: bash
      # Mirrors the sandbox image install (sandbox/Dockerfile): the official
      # installer ships its own runtime, so the runner needs no separate Node.
      run: |
        curl -fsSL https://claude.ai/install.sh | bash -s -- stable
        echo "$HOME/.local/bin" >>"$GITHUB_PATH"

    - name: Install Python dependencies
      shell: bash
      # egg_agent (from egg-shared) drives claude-agent-sdk. The SDK pin is kept
      # in lockstep with sandbox/Dockerfile. egg_agent_tools (the SDLC/BRC MCP
      # tools) is deliberately NOT installed — it is gateway-coupled and the
      # one-shot PR bots use built-in tools + gh/git only; egg_agent degrades
      # gracefully when it is absent.
      run: |
        python3 -m pip install --disable-pip-version-check \
          'claude-agent-sdk>=0.1.65,<0.2' pyyaml
        python3 -m pip install --disable-pip-version-check "${{ github.action_path }}/../shared"

    - name: Run egg
      id: run
      shell: bash
      env:
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_PROMPT_FILE: ${{ inputs.prompt-file }}
        INPUT_ANTHROPIC_OAUTH_TOKEN: ${{ inputs.anthropic-oauth-token }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_BOT_USERNAME: ${{ inputs.bot-username }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_MODEL: ${{ inputs.model }}
        GITHUB_EVENT_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      run: ${{ github.action_path }}/entrypoint.sh
